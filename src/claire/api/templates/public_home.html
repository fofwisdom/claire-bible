<!doctype html>
<html lang="$html_lang">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="text-scale" content="scale"/>
<title>$page_title — Claire Bible</title>
<script>
  (function(){ try{ var t=localStorage.getItem('claireTheme')||'light'; document.documentElement.setAttribute('data-theme', t); }catch(e){ document.documentElement.setAttribute('data-theme','light'); } })();
</script>
$i18n_bootstrap_html
<link rel="stylesheet" href="/static/css/theme.css"/>
<link rel="stylesheet" href="/static/css/appbar.css"/>
<link rel="stylesheet" href="/static/css/shared_ui.css"/>
<link rel="stylesheet" href="/static/css/pipeline_flow.css"/>
</head>
<body class="claire-public-body">
<!-- __COMMON_APPBAR__ -->
<main class="about-main" id="home-main">
  <section class="about-card p4-hero-neon" id="home-top">
    <div class="about-hero-top">
      <svg class="p4-emblem" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <defs><radialGradient id="p4-home-hero-flare" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="#58d5ff" stop-opacity="0.7"/><stop offset="100%" stop-color="#0080ff" stop-opacity="0"/></radialGradient></defs>
        <circle cx="32" cy="32" r="28" fill="rgba(0,245,184,0.08)" stroke="#00ffaa" stroke-width="1.4" stroke-opacity="0.72"/>
        <ellipse cx="32" cy="32" rx="28" ry="11" fill="none" stroke="#26ffaa" stroke-opacity="0.4" stroke-width="1.1"/>
        <ellipse cx="32" cy="32" rx="11" ry="28" fill="none" stroke="#38b6ff" stroke-opacity="0.4" stroke-width="1.1"/>
        <polygon points="32,12 49,42 15,42" fill="none" stroke="#26ffaa" stroke-width="1.35" stroke-opacity="0.88"/>
        <polygon points="32,52 49,22 15,22" fill="none" stroke="#a6ffe0" stroke-width="1.1" stroke-opacity="0.72"/>
        <circle cx="32" cy="32" r="11" fill="url(#p4-home-hero-flare)"/>
        <circle cx="32" cy="32" r="3.4" fill="#ffffff"/>
      </svg>
      <div class="about-hero-copy">
        <span class="about-badge">${t:home_root.hero.badge}</span>
        <h1 class="about-hero-title">${t:about.hero.title}</h1>
        <p class="about-hero-lead">$hero_lead</p>
        <div class="home-hero-actions">$hero_actions_html</div>
      </div>
    </div>
    <div class="about-kpi-grid">
      <div class="about-kpi"><b>$kpi_mode_value</b><span>$kpi_mode_sub</span></div>
      <div class="about-kpi"><b>$kpi_public_value</b><span>$kpi_public_sub</span></div>
      <div class="about-kpi"><b>$kpi_content_value</b><span>$kpi_content_sub</span></div>
      $kpi_build_html
    </div>
    $curator_strip_html
  </section>

  <div id="public-home-showcase" class="home-showcase-bar" data-public-view="home"></div>
  $content_html
</main>
<footer class="about-footer">
  <div><strong>Claire Bible</strong></div>
  <div class="about-footer-links">$footer_links_html</div>
</footer>
<!-- __COMMON_CMDPALETTE__ -->
<script src="/static/js/icons.js" defer></script>
<script src="/static/js/appbar.js" defer></script>
<script src="/static/js/command_palette.js" defer></script>
<script src="/static/js/shared_ui.js" defer></script>
<script src="/static/js/kb_dialogs.js" defer></script>
<script src="/static/js/public_kb.js" defer></script>
</body>
</html>
