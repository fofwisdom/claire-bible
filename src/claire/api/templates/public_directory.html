<!doctype html>
<html lang="$html_lang">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="text-scale" content="scale"/>
<meta name="color-scheme" content="light dark"/>
<title>$title — Claire Bible</title>
<script>
  (function(){ try{ var t=localStorage.getItem('claireTheme')||'light'; document.documentElement.setAttribute('data-theme', t); }catch(e){ document.documentElement.setAttribute('data-theme','light'); } })();
</script>
$i18n_bootstrap_html
<link rel="stylesheet" href="/static/css/theme.css"/>
<link rel="stylesheet" href="/static/css/appbar.css"/>
<link rel="stylesheet" href="/static/css/shared_ui.css"/>
<link rel="stylesheet" href="/static/css/public_observatory.css"/>
</head>
<body class="claire-public-body">
<!-- __COMMON_APPBAR__ -->
<main class="obs-main obs-directory-main" id="directory-main">
  <header class="obs-page-head">
    <div>
      <h1>$title</h1>
      <p class="obs-subtitle">$subtitle</p>
    </div>
    <div class="obs-page-head-actions">$page_actions_html</div>
  </header>
  $content_html
  $pagination_html
</main>
<footer class="about-footer">
  <div><strong>Claire Bible</strong></div>
  <div class="about-footer-links">$footer_links_html</div>
</footer>
<!-- __COMMON_CMDPALETTE__ -->
<script src="/static/js/icons.js" defer></script>
<script src="/static/js/appbar.js" defer></script>
<script src="/static/js/command_palette.js" defer></script>
</body>
</html>
