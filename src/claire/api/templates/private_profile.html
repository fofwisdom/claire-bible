<!doctype html>
<html lang="$html_lang">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="$robots_meta">
    <link rel="alternate" type="application/activity+json" href="$actor_url">
    <title>$title · Claire</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f7f5; --fg: #1d1d1b; --muted: #5d5d58; --card: #ffffff; --line: #d9d9d4; --accent: #2f5d8a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ececea; --muted: #a5a5a0; --card: #20201e; --line: #3a3a37; --accent: #8db6e0; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
      main { max-width: 44rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
      nav { display: flex; gap: 1rem; align-items: center; margin: 0 0 2rem; font-size: .95rem; border-bottom: 1px solid var(--line); padding-bottom: 1rem; }
      nav a { color: var(--accent); text-decoration: none; }
      nav a:hover { text-decoration: underline; }
      .nav-right { margin-left: auto; display: flex; gap: 1rem; align-items: center; }
      .nav-right form { margin: 0; }
      button.link { background: none; border: 0; color: var(--accent); padding: 0; font: inherit; cursor: pointer; text-decoration: underline; }
      .profile-card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.75rem 1.5rem; }
      .profile-card h1 { font-size: 1.6rem; margin: 0 0 .25rem; overflow-wrap: anywhere; }
      .profile-handle { color: var(--muted); font-size: 1rem; margin: 0 0 1rem; overflow-wrap: anywhere; }
      .profile-notice { margin: 0 0 1.25rem; }
      .btn { display: inline-block; padding: .5rem 1.25rem; background: var(--accent); color: #fff; text-decoration: none; border-radius: 6px; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="$nav_label">
        <a href="/"><strong>Claire</strong></a>
        <a href="/accounts">$directory_title</a>
        <div class="nav-right">
          $nav_auth
        </div>
      </nav>
      <article class="profile-card" data-profile-state="private">
        <h1>$display_name</h1>
        <p class="profile-handle">$handle</p>
        <p class="profile-notice">$notice</p>
        <p><a class="btn" href="/accounts">$back_directory</a></p>
      </article>
    </main>
  </body>
</html>
