<section id="panel-rules" class="pref-panel" data-settings-panel="rules">
  <section class="console-subcard pref-card">
    <h2><span data-icon="bolt"></span> ${t:console.synd.rules.title}</h2>
    <p class="pref-desc">${t:console.synd.rules.desc}</p>

    <div class="pref-row">
      <div class="pref-row-label">
        <label for="pref-auto-threshold"><strong>${t:console.synd.rules.threshold}</strong></label>
        <span>${th:console.synd.rules.threshold_desc}</span>
      </div>
      <input id="pref-auto-threshold" type="number" min="50" max="100" step="5" class="pref-input" style="width:90px"/>
    </div>

    <div id="pref-rules-list" style="display:flex;flex-direction:column;gap:8px;padding-top:8px"></div>
  </section>
</section>
