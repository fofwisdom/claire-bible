openapi: 3.1.0
info:
  title: Claire Knowledge Base API
  version: 1.0.0
  description: >-
    Authoritative OpenAPI 3.1.0 specification and shared wire contract between the
    Thesis Lineage (blackan/claire_bible) and the Augmentation Lineage (fofwisdom/claire-bible),
    including RFC 8693 OAuth 2.0 Token Exchange, hybrid graph search, and MCP integration.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /
    description: Current host root

paths:
  /health:
    get:
      summary: Service liveness and database connection status
      operationId: checkHealth
      x-claire-access: public
      security: []
      responses:
        '200':
          description: Service is healthy and database is connected.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        '503':
          description: Service degraded or database unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: false

  /whoami:
    get:
      summary: Check current authenticated scope
      description: >-
        Returns the request scope, the instance mode, the caller's relation to the
        resolved namespace, and whether the caller is the instance admin. The
        response never carries a USERNAME.
      operationId: checkWhoami
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Current authenticated scope.
          content:
            application/json:
              schema:
                type: object
                required: [scope, instance, relation, is_admin]
                properties:
                  scope:
                    type: string
                    enum: [owner, collaborator, readonly, anonymous]
                    example: owner
                  instance:
                    type: object
                    required: [mode]
                    properties:
                      mode:
                        type: string
                        enum: [single, network]
                        example: single
                  relation:
                    type: string
                    description: >-
                      owner when the credential's account owns the namespace with owner
                      scope, delegate for another scope on the same account, visitor
                      otherwise.
                    enum: [owner, delegate, visitor]
                    example: owner
                  is_admin:
                    type: boolean
                    description: >-
                      True only for an owner-scope credential of the instance admin
                      account (instance_role admin).
                    example: true
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /stats:
    get:
      summary: Knowledge graph counts and theme statistics
      operationId: getStats
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Statistics of documents, entities, relations, and theme metadata.
          content:
            application/json:
              schema:
                type: object
                required: [theme_id, theme_label]
                properties:
                  documents:
                    type: integer
                    example: 142
                  entities:
                    type: integer
                    example: 853
                  relations:
                    type: integer
                    example: 2194
                  theme_id:
                    type: integer
                    example: 0
                  theme_label:
                    type: string
                    example: 기본 테마

  /themes:
    get:
      summary: List themes or retrieve paginated theme collection
      description: >-
        Deterministic content negotiation endpoint. Returns HTML shell for browser navigation
        (when Accept header prefers text/html or Sec-Fetch-Dest is document); otherwise returns
        a JSON OrderedCollection or OrderedCollectionPage conforming to the Claire collection contract.
      operationId: listThemes
      x-claire-access: public
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
        - {}
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: boolean
          description: When true, requests an OrderedCollectionPage slice instead of the root OrderedCollection.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 80
            default: 20
          description: Number of items per collection page (bounded between 1 and 80).
        - name: max_id
          in: query
          required: false
          schema:
            type: string
          description: Cursor returning items older than the specified 64-bit theme number.
        - name: min_id
          in: query
          required: false
          schema:
            type: string
          description: Cursor returning the immediately newer slice above the specified theme number.
        - name: since_id
          in: query
          required: false
          schema:
            type: string
          description: Cursor for synchronization returning items newer than the specified theme number.
      responses:
        '200':
          description: Root collection, paginated page slice, or HTML application shell.
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag representing the collection state.
            Cache-Control:
              schema:
                type: string
              description: Cache control directives (public for anonymous, private for authenticated).
            Vary:
              schema:
                type: string
              example: Sec-Fetch-Dest, Accept
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ThemeCollectionRoot'
                  - $ref: '#/components/schemas/ThemeCollectionPage'
            text/html:
              schema:
                type: string
        '304':
          description: Not Modified when If-None-Match matches current ETag.
        '400':
          description: Conflicting cursor parameters or invalid pagination limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Namespace or theme not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

    post:
      summary: Define a new knowledge theme
      operationId: defineTheme
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  example: 인공지능 연구
                description:
                  type: string
                icon:
                  type: string
                  default: "📁"
                is_public:
                  type: boolean
                  default: true
                is_collaborator_accessible:
                  type: boolean
                  default: true
                default_focus:
                  type: string
                ga_measurement_id:
                  type: string
                sorcerer:
                  type: string
                presentation_enabled:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Theme successfully defined.
          content:
            application/json:
              schema:
                type: object
                required: [ok, theme]
                properties:
                  ok:
                    type: boolean
                    example: true
                  theme:
                    type: object
        '400':
          description: Validation error or deprecated fqdn provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          description: Owner permissions or CLAIRE_MULTI_THEME=1 required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

    patch:
      summary: Update existing knowledge theme
      operationId: updateTheme
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: Theme number or internal ID to update (may also be in request body).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                label:
                  type: string
                description:
                  type: string
                icon:
                  type: string
                is_public:
                  type: boolean
                is_collaborator_accessible:
                  type: boolean
                default_focus:
                  type: string
                ga_measurement_id:
                  type: string
                sorcerer:
                  type: string
                presentation_enabled:
                  type: boolean
      responses:
        '200':
          description: Theme updated successfully.
          content:
            application/json:
              schema:
                type: object
                required: [ok, theme]
                properties:
                  ok:
                    type: boolean
                    example: true
                  theme:
                    type: object
        '400':
          description: Validation error or deprecated fqdn provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          description: Owner permissions required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Theme not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

    delete:
      summary: Delete a knowledge theme
      operationId: deleteTheme
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Theme number or internal ID to delete.
        - name: purge
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Theme deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok, theme]
                properties:
                  ok:
                    type: boolean
                    example: true
                  theme:
                    type: object
        '400':
          description: Invalid theme ID or cannot delete default theme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          description: Owner permissions required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Theme not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /.well-known/oauth-protected-resource:
    get:
      summary: OAuth 2.0 Protected Resource Metadata (RFC 9728)
      description: Returns metadata describing the MCP protected resource and authorization servers.
      operationId: getProtectedResourceMetadata
      x-claire-access: public
      security: []
      responses:
        '200':
          description: Protected Resource Metadata document.
          content:
            application/json:
              schema:
                type: object
                required: [resource, authorization_servers, scopes_supported, bearer_methods_supported]
                properties:
                  resource:
                    type: string
                    example: https://cb.netspheres.org/mcp
                  authorization_servers:
                    type: array
                    items:
                      type: string
                    example: ["https://cb.netspheres.org"]
                  scopes_supported:
                    type: array
                    items:
                      type: string
                    example: ["readonly"]
                  bearer_methods_supported:
                    type: array
                    items:
                      type: string
                    example: ["header"]

  /.well-known/oauth-authorization-server:
    get:
      summary: OAuth 2.0 Authorization Server Metadata (RFC 8414)
      description: Returns metadata describing the authorization server endpoints and capabilities.
      operationId: getAuthorizationServerMetadata
      x-claire-access: public
      security: []
      responses:
        '200':
          description: Authorization Server Metadata document.
          content:
            application/json:
              schema:
                type: object
                required: [issuer, authorization_endpoint, token_endpoint, registration_endpoint, scopes_supported, response_types_supported, grant_types_supported]
                properties:
                  issuer:
                    type: string
                  authorization_endpoint:
                    type: string
                  token_endpoint:
                    type: string
                  registration_endpoint:
                    type: string
                  scopes_supported:
                    type: array
                    items:
                      type: string
                  response_types_supported:
                    type: array
                    items:
                      type: string
                  grant_types_supported:
                    type: array
                    items:
                      type: string

  /oauth/register:
    post:
      summary: Dynamic Client Registration (RFC 7591)
      description: Dynamically registers an OAuth client (e.g., Google Gemini Spark).
      operationId: registerClient
      x-claire-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                  example: Google Gemini Spark
                redirect_uris:
                  type: array
                  items:
                    type: string
                  example: ["https://gemini.google.com/oauth/callback"]
      responses:
        '201':
          description: Successfully registered client credentials.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, client_secret]
                properties:
                  client_id:
                    type: string
                  client_secret:
                    type: string
                  client_name:
                    type: string
                  redirect_uris:
                    type: array
                    items:
                      type: string

  /oauth/authorize:
    get:
      summary: OAuth 2.0 Authorization Endpoint (RFC 6749 & RFC 7636 PKCE)
      description: Presents consent screen or supports 1-click / telegram push approval.
      operationId: authorizeGet
      x-claire-access: public
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            default: S256
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: HTML consent and authorization page.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect back to client redirect_uri with authorization code.

  /oauth/token:
    post:
      summary: OAuth 2.0 Token Endpoint (RFC 6749, RFC 7636, RFC 8693)
      description: >-
        Exchanges a subject token (such as a Telegram bootstrap ticket, static inject token,
        or existing session token) for a scoped Bearer access token.
      operationId: exchangeToken
      x-claire-access: public
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          description: Successful token exchange.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Pragma:
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenExchangeResponse'
        '400':
          description: Invalid token exchange request or invalid grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        '401':
          description: Unauthorized client or unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'

  /search:
    post:
      summary: Hybrid semantic and full-text keyword search
      operationId: searchKnowledge
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  maxLength: 2000
                  example: "아키텍처 설계"
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 8
                mode:
                  type: string
                  enum: [hybrid, fts, semantic]
                  default: hybrid
                summarize:
                  type: boolean
                  default: true
                theme:
                  type: string
                  description: Optional theme reference ID or name.
      responses:
        '200':
          description: Search results with entity hits and optional synthesized answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid search parameters or query too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /documents:
    get:
      summary: List archived documents
      operationId: listDocuments
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: theme
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Document archive list with format status.
          content:
            application/json:
              schema:
                type: object
                required: [documents, theme_id, theme_label]
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      required: [id, title, created_at]
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        created_at:
                          type: string
                        format:
                          type: string
                  format_status:
                    type: string
                  theme_id:
                    type: integer
                  theme_label:
                    type: string

  /document/export:
    get:
      summary: Export one document as a Markdown file
      description: The AsciiDoc body becomes Markdown with a YAML front matter header (title, source, date, summary, claire_document_id). Read-only. Markdown is the only export format (RD24).
      operationId: exportDocument
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Document ID.
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [markdown]
            default: markdown
      responses:
        '200':
          description: Markdown file as an attachment.
          content:
            text/markdown:
              schema:
                type: string
        '400':
          description: The id is missing or the format is not markdown.
        '404':
          description: The document does not exist or is not visible.
  /document:
    get:
      summary: Retrieve document detail and raw content
      operationId: getDocumentDetail
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Document ID.
      responses:
        '200':
          description: Document detail including markdown/asciidoc text and ontology links.
          content:
            application/json:
              schema:
                type: object
                required: [id, title, content]
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  content:
                    type: string
                  format:
                    type: string
                  nodes:
                    type: array
                    items:
                      type: object
        '404':
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /graph:
    get:
      summary: Retrieve full ontology knowledge graph
      operationId: getGraphData
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Graph nodes and edges.
          content:
            application/json:
              schema:
                type: object
                required: [nodes, links]
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      required: [id, name, type]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        type:
                          type: string
                        created_at:
                          type: number
                          description: Creation time in epoch seconds (entities.created_at).
                  links:
                    type: array
                    items:
                      type: object
                      required: [source, target, label]
                      properties:
                        source:
                          type: string
                        target:
                          type: string
                        label:
                          type: string

  /node:
    get:
      summary: Retrieve entity node detail and neighbor links
      operationId: getNodeDetail
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity details and adjacent edges.
        '404':
          description: Entity not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /ingest:
    post:
      summary: Ingest URL or text payload and extract ontology
      operationId: ingestContent
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: Target URL or raw text content.
                  example: "https://example.com/article"
                focus:
                  type: string
                  description: Optional extraction focus.
                format:
                  type: string
                  enum: [adoc, md]
                effort:
                  type: string
                  enum: [low, medium, high]
                full_content:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Successful ingestion and extraction report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: Missing payload or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          description: Owner permission required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /support/bundle:
    post:
      summary: Generate diagnostic support bundle archive
      operationId: createSupportBundle
      x-claire-access: owner
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  default: 7
                  minimum: 1
                  maximum: 30
                target:
                  type: string
                  description: Optional document ID or share target for isolation.
      responses:
        '200':
          description: Support bundle created with single-use download token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportBundleResponse'
        '403':
          description: Owner permission required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    get:
      summary: Download zstd diagnostic support bundle archive
      operationId: downloadSupportBundle
      x-claire-access: public
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 16
          description: Ephemeral support bundle download token.
      responses:
        '200':
          description: Compressed zstandard tar archive file stream.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="claire-support-20260911.tar.zst"
            Cache-Control:
              schema:
                type: string
                example: no-store, private
          content:
            application/zstd:
              schema:
                type: string
                format: binary
        '404':
          description: Token not found or invalid.
        '410':
          description: Support bundle expired and was purged.

  /mcp:
    post:
      summary: Model Context Protocol JSON-RPC streamable communication
      operationId: mcpJsonRpc
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  oneOf:
                    - type: string
                    - type: integer
                  example: 1
                method:
                  type: string
                  example: "tools/call"
                params:
                  type: object
      responses:
        '200':
          description: MCP JSON-RPC response.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Authentication required per RFC 6750.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: 'Bearer error="invalid_token", error_description="Authentication required"'

  /tokens:
    get:
      summary: List persistent API and MCP tokens
      operationId: listTokens
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: List of active, expired, and revoked persistent tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiTokenInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Create a new persistent API and MCP token
      operationId: createToken
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "Claude Desktop"
                scope:
                  type: string
                  enum: [owner, collaborator, readonly]
                  default: readonly
                expires_in_days:
                  type: integer
                  nullable: true
                  example: 90
      responses:
        '201':
          description: Token created successfully. Raw token is returned only once.
          content:
            application/json:
              schema:
                type: object
                required: [ok, token, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  token:
                    $ref: '#/components/schemas/CreatedApiToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Revoke an API and MCP token immediately
      operationId: revokeTokenDelete
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  oneOf:
                    - type: integer
                    - type: string
      responses:
        '200':
          description: Token revoked successfully.
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /tokens/revoke:
    post:
      summary: Revoke an API and MCP token immediately
      operationId: revokeTokenPost
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  oneOf:
                    - type: integer
                    - type: string
      responses:
        '200':
          description: Token revoked successfully.
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /setup:
    get:
      summary: First admin setup page (P1 accounts)
      description: >-
        Opens only for the admin account (id 1) with owner scope over a cookie or
        X-Session channel while the account status is setup_required. Every other
        request gets 404 so the page's existence is hidden.
      operationId: getSetupPage
      x-claire-access: owner
      security:
        - SessionCookie: []
        - SessionHeader: []
      responses:
        '200':
          description: Setup form (HTML).
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Not the setup principal, or setup already completed.
    post:
      summary: Complete first admin setup
      operationId: completeSetup
      x-claire-access: owner
      security:
        - SessionCookie: []
        - SessionHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password, password_confirm, ack]
              properties:
                username:
                  type: string
                  description: Lowercased before the rule check; non-ASCII is rejected first.
                display_name:
                  type: string
                  maxLength: 64
                password:
                  type: string
                  minLength: 12
                  description: Printable ASCII 0x21-0x7E only; must not contain the username.
                password_confirm:
                  type: string
                ack:
                  type: string
                  enum: ['1']
                  description: Required confirmation checkbox (username is immutable and public in network mode).
      responses:
        '303':
          description: >-
            Setup completed. A new session cookie replaces the old one. Location is /,
            or /settings/account?notice=password_not_saved when only the password write failed.
        '400':
          description: Input rejected; the form is shown again with reason codes (HTML).
          content:
            text/html:
              schema:
                type: string
        '403':
          description: Cookie POST without a same-origin Origin header.
        '404':
          description: Not the setup principal, setup already completed, or lost a concurrent setup.

  /login:
    get:
      summary: Local login page
      operationId: getLoginPage
      x-claire-access: public
      security: []
      responses:
        '200':
          description: Login form (HTML).
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Log in with USERNAME and password
      description: >-
        Public route; the handler requires a same-origin request (Sec-Fetch-Site
        same-origin or a same-origin Origin header). Failure responses do not reveal
        whether the account exists or its status.
      operationId: login
      x-claire-access: public
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '303':
          description: Logged in. Location is /. Sets a new claire_session cookie.
        '400':
          description: Form fields missing or not strings (HTML).
        '401':
          description: Login failed (HTML, one message for every cause).
        '403':
          description: Not a same-origin request.
        '429':
          description: Throttled. Not counted as a failure.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next attempt is allowed.

  /logout:
    post:
      summary: Log out the current browser session
      operationId: logout
      x-claire-access: public
      security: []
      responses:
        '303':
          description: Session row deleted (if any) and cookie cleared. Location is /login.
        '403':
          description: Not a same-origin request.

  /api/auth/reauth:
    post:
      summary: Re-authenticate the current session (step-up)
      description: >-
        Confirms the session owner's password and refreshes the session's
        authenticated_at. Uses the same throttle as login.
      operationId: reauthenticate
      x-claire-access: owner
      security:
        - SessionCookie: []
        - SessionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Re-authenticated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, authenticated_at]
                properties:
                  ok:
                    type: boolean
                  authenticated_at:
                    type: number
                    description: Epoch seconds.
        '400':
          description: '`invalid_request`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          description: '`step_up_requires_session` (not a session channel) or `invalid_password`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Not an owner-scope credential.
        '409':
          description: '`password_not_set`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '429':
          description: '`too_many_attempts`'
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /admin:
    get:
      summary: Admin console entry redirect
      description: >-
        Redirects the instance admin to /admin/instance. Every non-admin request
        gets 404 before any redirect. An optional theme query that is not one of the
        admin's own themes also gets 404.
      operationId: getAdminConsoleIndex
      x-claire-access: admin
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ConsoleThemeQuery'
      responses:
        '302':
          description: Redirect to /admin/instance (Cache-Control no-store, Referrer-Policy same-origin).
          headers:
            Location:
              schema:
                type: string
                const: /admin/instance
        '404':
          description: Not the instance admin with owner scope, or invalid theme reference.

  /admin/{section}:
    get:
      summary: Admin console section page (unified console shell)
      description: >-
        Root-only admin console pages rendered in console_shell.html. Prefixed
        paths (/@{username}/admin/...) return 404. Non-admin callers always get 404,
        never 403. /admin/themes shows the admin account's own themes plus
        instance-wide aggregate counts only; member theme labels and content are
        never read.
      operationId: getAdminConsoleSection
      x-claire-access: admin
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: section
          in: path
          required: true
          schema:
            type: string
            enum: [instance, accounts, idp, providers, limits, themes, tokens, mcp]
        - $ref: '#/components/parameters/ConsoleThemeQuery'
      responses:
        '200':
          description: Admin console page (HTML, Cache-Control no-store, Referrer-Policy same-origin).
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Not the instance admin with owner scope, or invalid theme reference.

  /api/admin/mcp/telemetry:
    get:
      summary: Read MCP call telemetry (admin only)
      description: >-
        Bounded read of the mcp_telemetry table in data/telemetry.db, newest first.
        Returns an empty list when the telemetry database does not exist.
      operationId: listMcpTelemetry
      x-claire-access: admin
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: tool_name
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: ISO 8601 timestamp. A value that does not parse (including an empty value) gives 400 invalid_since.
          schema:
            type: string
      responses:
        '200':
          description: Telemetry records.
          content:
            application/json:
              schema:
                type: object
                required: [records, count]
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/McpTelemetryRecord'
                  count:
                    type: integer
        '400':
          description: limit is not an integer between 1 and 200 (error invalid_limit).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Not the instance admin with owner scope.

  /api/admin/accounts:
    get:
      summary: List accounts (admin only)
      operationId: listAccounts
      x-claire-access: admin
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Accounts ordered by internal id.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountSummary'
        '404':
          description: Not the instance admin with owner scope.

  /me:
    get:
      summary: Legacy account page redirect
      description: >-
        Compatibility redirect to /settings/account. The rule surface is any, so a
        prefixed /@{username}/me also redirects. The Location is always the root
        path and the query string (including notice) is not forwarded.
      operationId: getMePage
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '302':
          description: Redirect to /settings/account (Cache-Control no-store, Referrer-Policy same-origin).
          headers:
            Location:
              schema:
                type: string
                const: /settings/account
        '404':
          description: Not an owner-scope credential.

  /settings:
    get:
      summary: User settings console entry redirect
      description: >-
        Redirects to /settings/account, or to /settings/reader when from=syndication.
        A valid theme query is kept on the redirect target.
      operationId: getSettingsConsoleIndex
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            enum: [syndication]
        - $ref: '#/components/parameters/ConsoleThemeQuery'
      responses:
        '302':
          description: Redirect to /settings/account or /settings/reader (Cache-Control no-store, Referrer-Policy same-origin).
        '404':
          description: Not an owner-scope account credential, or invalid theme reference.

  /settings/{section}:
    get:
      summary: User settings console section page (unified console shell)
      description: >-
        Root-only owner pages rendered in console_shell.html in both instance modes.
        Prefixed paths (/@{username}/settings/..., /themes/{n}/settings/...) return
        404. For the instance admin, /settings/themes and /settings/tokens redirect
        (302) to /admin/themes and /admin/tokens. Responses to non-admin callers
        contain no /admin links or admin markup. Sections reader through webmcp are
        theme-scoped; the others are account-wide.
      operationId: getSettingsConsoleSection
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: section
          in: path
          required: true
          schema:
            type: string
            enum: [account, keys, themes, tokens, reader, connections, feeds, tags, rules, outbound, opml, mcp, webmcp]
        - $ref: '#/components/parameters/ConsoleThemeQuery'
        - name: notice
          in: query
          required: false
          description: Only read on /settings/account. Values outside the enum render no notice.
          schema:
            type: string
            enum: [password_not_saved, identity_linked, already_linked]
      responses:
        '200':
          description: Settings page (HTML, Cache-Control no-store, Referrer-Policy same-origin).
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Admin caller on /settings/themes or /settings/tokens; Location is /admin/themes or /admin/tokens with the validated theme query.
        '404':
          description: Not an owner-scope account credential, or invalid theme reference.

  /syndication/preferences:
    get:
      summary: Legacy syndication preferences redirect
      description: >-
        Compatibility redirect. The theme query is validated first (404 when it is
        missing or not accessible). The tab query maps reader (or omitted) to
        /settings/reader, accounts to /settings/connections, and feeds, tags, rules,
        outbound, opml, mcp, webmcp to /settings/ with the same name, keeping the
        validated theme as ?theme=. idp and userdb go to /admin/idp and
        /admin/accounts for the instance admin and to /settings/account for other
        owners, without ?theme=. An empty or unknown tab is 404. The Location is
        always a root path.
      operationId: getSyndicationPreferencesRedirect
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: tab
          in: query
          required: false
          schema:
            type: string
            enum: [reader, accounts, feeds, tags, rules, outbound, opml, mcp, webmcp, idp, userdb]
        - name: theme
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the mapped /settings/* or /admin/* page (Cache-Control no-store, Referrer-Policy same-origin).
        '404':
          description: Not an owner-scope credential, invalid theme reference, or empty or unknown tab.

  /api/me:
    get:
      summary: Read own account
      operationId: getMe
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSelf'
        '404':
          description: Not an owner-scope credential.
    patch:
      summary: Change own display name
      operationId: updateMe
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name:
                  type: string
                  maxLength: 64
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSelf'
        '400':
          description: '`invalid_request` (keys other than display_name) or `invalid_display_name`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Not an owner-scope credential.

  /api/me/password:
    post:
      summary: Set or change own password (step-up required)
      description: >-
        Requires a session re-authenticated within the last 15 minutes. When a
        password already exists, current_password must match. On success every
        other approved session of the account is deleted; API, MCP and OAuth
        tokens are kept.
      operationId: changeMyPassword
      x-claire-access: owner
      security:
        - SessionCookie: []
        - SessionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Password stored.
          content:
            application/json:
              schema:
                type: object
                required: [ok, other_sessions_revoked]
                properties:
                  ok:
                    type: boolean
                  other_sessions_revoked:
                    type: integer
        '400':
          description: >-
            `invalid_request`, or `password_rejected` with `reason`
            (invalid_characters, too_short, contains_username) and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '401':
          description: '`reauth_required`; body also has `reauth: /api/auth/reauth`.'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: 'Session realm="claire", error="reauth_required"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          description: '`step_up_requires_session` (bearer) or `invalid_password`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Not an owner-scope credential.
        '409':
          description: '`account_not_active`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '429':
          description: '`too_many_attempts`'
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /api/federation/status:
    get:
      summary: Read the federation state of the own account (network mode)
      operationId: getFederationStatus
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Federation state of the account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  federation: {type: string, enum: ['off', 'on']}
                  handle: {type: [string, 'null'], description: '`@username@host`, or null when the account has no USERNAME.'}
                  actor_id: {type: [string, 'null']}
                  is_actor: {type: boolean}
                  actor_state: {type: string}
                  followers:
                    type: object
                    properties:
                      total: {type: integer}
                  pending_tasks: {type: integer, description: Outbox tasks that the sidecar did not take or did not acknowledge.}
        '404':
          description: Single mode, or not an owner-scope credential.

  /api/federation/publish:
    post:
      summary: Publish one document through the native actor, or publish it again
      description: >-
        The document must be in a public theme of the caller, must not be hidden,
        and must have a body. The first call makes the object and a `create` task.
        A later call makes an `update` task for the same object. The sidecar sends
        the activity to the followers of the actor. Network mode only.
      operationId: publishFederationDocument
      x-claire-access: collaborator
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [theme, document_id]
              properties:
                theme: {type: string, description: Theme number as a decimal string.}
                document_id: {type: string}
      responses:
        '202':
          description: The object and the outbox task are stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: object
                    properties:
                      id: {type: string}
                      url: {type: string, description: '`{origin}/ap/objects/{id}`'}
                      published_at: {type: number}
                      updated_at: {type: number}
                  task:
                    type: object
                    properties:
                      id: {type: integer}
                      kind: {type: string, enum: [create, update]}
                  created: {type: boolean}
        '400':
          description: '`invalid_request`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: '`theme_not_found` or `document_not_found`. Also single mode.'
        '409':
          description: '`not_an_actor`, `theme_not_public`, `document_not_public`, or `document_has_no_body`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /api/federation/retract:
    post:
      summary: Delete one published object and request its removal on remote servers
      description: >-
        Writes a tombstone, deletes the object, and makes a `delete` task. The
        object ID returns 410 from then on. A remote server can ignore the
        `Delete` activity. Network mode only.
      operationId: retractFederationObject
      x-claire-access: collaborator
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [object_id]
              properties:
                object_id: {type: string, description: Object public ID as a decimal string.}
      responses:
        '202':
          description: The object is retracted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  retracted: {type: boolean}
                  object_id: {type: string}
                  task:
                    type: object
                    properties:
                      id: {type: integer}
                      kind: {type: string, enum: [delete]}
        '400':
          description: '`invalid_request`.'
        '404':
          description: '`object_not_found`. Also single mode.'

components:
  parameters:
    ConsoleThemeQuery:
      name: theme
      in: query
      required: false
      description: >-
        Public theme reference that must belong to the caller's account. An empty,
        unknown, or foreign reference returns 404; it never falls back to a default
        theme. When omitted, the caller's default theme is used.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    NotFound:
      description: Not found, or hidden from this credential (stealth 404).

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: >-
        Standard Bearer authorization header. Value must be an access token
        obtained via /oauth/token or configured inject/session tokens.
    SessionHeader:
      type: apiKey
      in: header
      name: X-Session
      description: Single-use or persistent session token header.
    SessionCookie:
      type: apiKey
      in: cookie
      name: claire_session
      description: Same-Origin HttpOnly session cookie.

  schemas:
    McpTelemetryRecord:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: number
          description: Unix epoch seconds.
        client_id:
          type: [string, 'null']
        call_type:
          type: string
        tool_name:
          type: [string, 'null']
        duration_ms:
          type: [integer, 'null']
        status:
          type: string
        error_code:
          type: [integer, 'null']
        error_message:
          type: [string, 'null']
        response_bytes:
          type: [integer, 'null']

    TokenExchangeRequest:
      type: object
      required:
        - grant_type
        - subject_token
        - subject_token_type
      properties:
        grant_type:
          type: string
          const: urn:ietf:params:oauth:grant-type:token-exchange
          description: Standard RFC 8693 grant type identifier.
        subject_token:
          type: string
          minLength: 32
          maxLength: 128
          description: Security token representing the identity context.
          example: "yG8hO2wX0123456789abcdefABCDEF01"
        subject_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
            - urn:ietf:params:oauth:token-type:jwt
            - urn:claire:params:oauth:token-type:telegram-bootstrap
            - urn:claire:params:oauth:token-type:session-token
          description: URI identifying the format and type of subject_token.
          example: urn:ietf:params:oauth:token-type:access_token
        requested_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
            - urn:ietf:params:oauth:token-type:refresh_token
          default: urn:ietf:params:oauth:token-type:access_token
          description: Desired token type. Defaults to access_token.
        resource:
          type: string
          format: uri
          description: Target resource URI (e.g., https://claire.example.com/mcp).
        audience:
          type: string
          description: Target audience identifier (e.g., claire-mcp or claire-web).
        scope:
          type: string
          enum: [owner, readonly]
          description: Requested scope.
          example: owner
        actor_token:
          type: string
          description: Token representing the acting party (delegation scenarios).
        actor_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
          description: URI identifying actor_token format. Required if actor_token is present.

    TokenExchangeResponse:
      type: object
      required:
        - access_token
        - issued_token_type
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: The newly issued or rotated access token.
          example: "s8dfA_77bN0Q81zKxabcdef0123456789"
        issued_token_type:
          type: string
          const: urn:ietf:params:oauth:token-type:access_token
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds (e.g., 604800 for 7 days).
          example: 604800
        scope:
          type: string
          enum: [owner, readonly]
          description: Effective scope granted.
          example: owner
        refresh_token:
          type: string
          description: Optional refresh token if token rotation is chained.

    OAuthErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - invalid_target
            - unsupported_token_type
          example: invalid_grant
        error_description:
          type: string
          example: "The subject_token is expired or has already been consumed."
        error_uri:
          type: string
          format: uri

    StandardError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "authentication required"

    SearchResponse:
      type: object
      required: [query, mode, hits, theme_id, theme_label]
      properties:
        query:
          type: string
        mode:
          type: string
        answer:
          type: string
        theme_id:
          type: integer
        theme_label:
          type: string
        hits:
          type: array
          items:
            type: object
            required: [id, type, name, score]
            properties:
              id:
                type: string
              type:
                type: string
              name:
                type: string
              via:
                type: string
              score:
                type: number

    IngestResponse:
      type: object
      required: [ok, document_id, title]
      properties:
        ok:
          type: boolean
          example: true
        document_id:
          type: string
        title:
          type: string
        entities_extracted:
          type: integer
        relations_extracted:
          type: integer
        theme_id:
          type: integer
        theme_label:
          type: string

    SupportBundleResponse:
      type: object
      required: [bundle_id, token, expires_at, download_url]
      properties:
        bundle_id:
          type: string
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        download_url:
          type: string
          format: uri

    ApiTokenInfo:
      type: object
      required: [id, name, scope, created_at, token_masked]
      properties:
        id:
          type: integer
        name:
          type: string
        scope:
          type: string
          enum: [owner, collaborator, readonly]
        created_at:
          type: number
        expires_at:
          type: number
          nullable: true
        last_used_at:
          type: number
          nullable: true
        revoked_at:
          type: number
          nullable: true
        token_masked:
          type: string
          example: "cb_a1b2...y9z0"

    CreatedApiToken:
      type: object
      required: [id, token, name, scope, created_at]
      properties:
        id:
          type: integer
        token:
          type: string
          example: "cb_pcVteDtLVYThveppxAd3WXwGMzgtrz2YpkE9euOPgOw"
        name:
          type: string
        scope:
          type: string
        created_at:
          type: number
        expires_at:
          type: number
          nullable: true
        last_used_at:
          type: number
          nullable: true
        revoked_at:
          type: number
          nullable: true

    AccountSelf:
      type: object
      required: [public_id, username, display_name, role, scope, status, has_password]
      properties:
        public_id:
          type: string
          description: Time-ordered 64-bit number as a decimal string.
          example: "117543901593604660"
        username:
          type: ['string', 'null']
          description: Null until first admin setup completes.
        display_name:
          type: string
        role:
          type: string
          enum: [admin, member]
        scope:
          type: string
          enum: [owner, collaborator, readonly]
        status:
          type: string
          enum: [setup_required, active, suspended, deleting, purged]
        has_password:
          type: boolean

    AccountSummary:
      type: object
      required: [public_id, username, status, role, created_at, activated_at, theme_count]
      properties:
        public_id:
          type: string
          description: Time-ordered 64-bit number as a decimal string.
        username:
          type: ['string', 'null']
        status:
          type: string
          enum: [setup_required, active, suspended, deleting, purged]
        role:
          type: string
          enum: [admin, member]
        created_at:
          type: number
        activated_at:
          type: ['number', 'null']
        theme_count:
          type: integer

    ThemeCollectionRoot:
      type: object
      required: [id, type, totalItems, first]
      properties:
        id:
          type: string
          example: "https://claire.example.com/themes"
        type:
          type: string
          const: OrderedCollection
        totalItems:
          type: integer
          example: 3
        first:
          type: string
          example: "https://claire.example.com/themes?page=true"
        themes:
          type: array
          description: Legacy theme array retained during migration period (P2-P3).
          items:
            type: object
        default_theme_id:
          type: integer
          example: 0
        default_theme_number:
          type: ['string', 'null']
          example: "117543901593604660"
        multi_theme:
          type: boolean
          example: true

    ThemeCollectionPage:
      type: object
      required: [id, type, partOf, orderedItems]
      properties:
        id:
          type: string
          example: "https://claire.example.com/themes?page=true"
        type:
          type: string
          const: OrderedCollectionPage
        partOf:
          type: string
          example: "https://claire.example.com/themes"
        orderedItems:
          type: array
          items:
            $ref: '#/components/schemas/ThemeCollectionItem'
        next:
          type: string
          nullable: true
          example: "https://claire.example.com/themes?page=true&max_id=117543901593604660"
        prev:
          type: string
          nullable: true

    ThemeCollectionItem:
      type: object
      required: [number, url, label, is_default, is_public, stats]
      properties:
        number:
          type: string
          description: 64-bit time-ordered theme number as decimal string.
          example: "117543901593604660"
        url:
          type: string
          example: "https://claire.example.com/themes/117543901593604660/"
        label:
          type: string
          example: "인공지능 연구"
        is_default:
          type: boolean
        is_public:
          type: boolean
        stats:
          type: object
          properties:
            documents:
              type: integer
            entities:
              type: integer
            relations:
              type: integer
        legacy_hosts:
          type: array
          description: Legacy custom domain hosts migrating to single FQDN.
          items:
            type: object
            required: [host, activated_at]
            properties:
              host:
                type: string
                example: "ai.example.com"
              activated_at:
                type: number
              sunset_at:
                type: ['number', 'null']

