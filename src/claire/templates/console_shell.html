<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="claire-storage-key" content="a$storage_key"/>
<title>$page_title — Claire Bible</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="stylesheet" href="/static/css/theme.css"/>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100vh;font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);font-size:13.5px}
  .console-shell{display:flex;flex-direction:column;min-height:100vh}
  .console-topbar{min-height:48px;background:var(--panel-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:8px 16px;gap:10px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
  .console-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;color:var(--fg);text-decoration:none}
  .console-sep{width:1px;height:20px;background:var(--border);margin:0 2px}
  .console-btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--sec-bg);color:var(--sec-fg);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
  .console-btn:hover{filter:brightness(0.96)}
  .console-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--muted)}
  .console-select{height:30px;padding:0 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:12.5px;font-family:inherit}
  .console-body{flex:1;display:grid;grid-template-columns:260px 1fr;min-height:0}
  @media (max-width:860px){.console-body{grid-template-columns:1fr}}
  .console-sidebar{background:var(--panel-bg);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
  .console-nav-group-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 10px 4px}
  .console-nav-link{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:6px;border:1px solid transparent;color:var(--fg);font-size:13px;font-weight:600;text-decoration:none}
  .console-nav-link:hover{background:var(--hover-bg)}
  .console-nav-link[aria-current="page"]{background:var(--active-bg);color:var(--active-fg);border-color:var(--active-border)}
  .console-main{padding:24px 28px;overflow-y:auto}
  .console-container{max-width:920px;display:flex;flex-direction:column;gap:18px}
  .console-card{background:var(--panel-bg);border:1px solid var(--border);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
  .console-card h1{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .console-desc{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
  .logout-form{margin:0;display:inline-flex}
  .card,.console-subcard{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin:0 0 14px;display:flex;flex-direction:column;gap:10px}
  .card h2,.console-subcard h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h3,.console-subcard h3{margin:0;font-size:13.5px;font-weight:700}
  .hint,.pref-desc{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
  dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:13px}
  dt{color:var(--muted);font-weight:600}
  dd{margin:0;overflow-wrap:anywhere}
  table,.pref-table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td,.pref-table th,.pref-table td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:middle}
  th,.pref-table th{background:var(--panel-bg);color:var(--muted);font-weight:700;font-size:11.5px}
  .pref-table-wrap{overflow-x:auto}
  .badge,.pref-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--panel-bg);color:var(--fg);border:1px solid var(--border)}
  .badge-enabled,.pref-pill-mcp{color:#1a7f37;background:rgba(46,160,67,0.14);border-color:rgba(46,160,67,0.35)}
  .badge-disabled,.pref-pill-warn{color:#cf222e;background:rgba(248,81,73,0.12);border-color:rgba(248,81,73,0.35)}
  .pref-pill-prop{color:var(--muted);background:transparent;border-style:dashed}
  /* 관리 콘솔 프로토타입 표식: 실제 서버 설정에 닿지 않는 요소(프로토타입·시뮬레이션·브라우저 저장·정적 안내). common.prototype_badge/prototype_note가 그린다. */
  .proto-badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;color:#9a6700;background:rgba(212,167,44,0.16);border:1px dashed rgba(212,167,44,0.7);white-space:nowrap;vertical-align:middle}
  .proto-badge::before{content:"⚠"}
  .proto-note{margin:0;padding:6px 10px;border-radius:6px;border:1px dashed rgba(212,167,44,0.7);background:rgba(212,167,44,0.08);color:var(--fg);font-size:12px;line-height:1.5}
  .proto-note-inline{font-size:12px;color:var(--muted);font-weight:500}
  [data-theme="dark"] .proto-badge{color:#e3b341}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .proto-badge{color:#e3b341}}
  .notice,.pref-notice{padding:10px 12px;border-radius:6px;border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--panel-bg);font-size:12.5px;line-height:1.5}
  .notice.danger,.pref-notice[data-tone="warn"]{border-left-color:#cf222e;background:rgba(248,81,73,0.07)}
  .pref-notice[data-tone="ok"]{border-left-color:#1a7f37;background:rgba(46,160,67,0.07)}
  .notice ul{margin:4px 0 0 18px;padding:0}
  .mode-form,.tier-form{display:grid;gap:10px;margin-top:8px}
  .mode-form label,.tier-form label{display:grid;gap:4px;font-size:12.5px;font-weight:600}
  .mode-form label.check,.tier-form label.check{display:inline-flex;gap:6px;align-items:center;margin-right:12px;font-weight:500}
  .mode-form input[type=password],.tier-form input[type=text],.tier-form input[type=number],.tier-form input[type=password],.tier-form select,.pref-input,.pref-select{font:inherit;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--panel-bg);color:var(--fg);font-size:12.5px;max-width:100%}
  .tier-form fieldset{border:1px solid var(--border);border-radius:6px;padding:8px 12px}
  .mode-form button,.tier-form button,.pref-btn{justify-self:start;display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--sec-bg);color:var(--sec-fg);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none}
  .mode-form button,.tier-form button,.pref-btn-accent{border-color:transparent;background:var(--accent);color:#fff}
  .mode-form button:disabled,.tier-form button:disabled,.pref-btn:disabled{opacity:0.5;cursor:not-allowed}
  .mode-form button.btn-danger,.pref-btn-danger{border-color:#cf222e;background:#cf222e;color:#fff}
  .feature-field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600}
  .feature-inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .feature-inline .result{flex-basis:100%}
  .result:empty{display:none}
  .result{margin:4px 0 0;font-size:12.5px;font-weight:600}
  .result[data-state=error]{color:#cf222e}
  .result[data-state=ok]{color:#1a7f37}
  .pref-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--border);flex-wrap:wrap}
  .pref-row:first-of-type{border-top:0;padding-top:2px}
  .pref-row-label{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
  .pref-row-label strong{font-size:13px;color:var(--fg)}
  .pref-row-label span{font-size:12px;color:var(--muted);line-height:1.45}
  .pref-stat-row{display:flex;gap:10px;flex-wrap:wrap}
  .pref-stat{flex:1 1 140px;border:1px solid var(--border);border-radius:6px;background:var(--panel-bg);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
  .pref-stat b{font-size:16px}
  .pref-stat span{font-size:11.5px;color:var(--muted)}
  .pref-quota-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .pref-quota-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700}
  .pref-quota-switch{flex-direction:row!important;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:6px;padding:6px 10px;background:var(--panel-bg)}
  .pref-sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  @media (max-width:780px){.pref-sim{grid-template-columns:1fr}}
  .pref-login{border:1px solid var(--border);border-radius:8px;background:var(--panel-bg);padding:14px;display:flex;flex-direction:column;gap:8px;align-self:start}
  .pref-login-btn{padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--sec-bg);color:var(--fg);font-size:12.5px;font-weight:700;text-align:left;cursor:pointer}
  .pref-login-sep{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
  .pref-flow{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12px}
  .pref-flow li{padding:5px 8px;border-left:3px solid #2ea043;background:var(--panel-bg);border-radius:0 6px 6px 0;overflow-wrap:anywhere}
  .pref-flow li[data-ok="false"]{border-left-color:#cf222e}
  .pref-idp-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;align-items:end;padding-top:10px;border-top:1px solid var(--border)}
  .pref-mono{font-family:'D2Coding',monospace;font-size:11.5px}
  .pref-code{margin:0;padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:var(--panel-bg);font-family:'D2Coding',monospace;font-size:11.5px;line-height:1.5;overflow-x:auto;white-space:pre}
  /* Groups 2–3 (/settings/{reader,…,webmcp}) panels ported from syndication_preferences.html (P3-b). */
  .pref-panel{display:flex;flex-direction:column;gap:14px}
  .pref-card{background:var(--card-bg,var(--bg));border:1px solid var(--border);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  .pref-card h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pref-card h3{margin:0;font-size:13.5px;font-weight:700}
  .pref-btn-pri{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
  .pref-pill-rss{color:#bc4c00;background:rgba(251,146,60,0.14);border-color:rgba(251,146,60,0.35)}
  .pref-pill-ap{color:#8250df;background:rgba(163,113,247,0.14);border-color:rgba(163,113,247,0.35)}
  .pref-pill-at{color:#0969da;background:rgba(56,139,253,0.14);border-color:rgba(56,139,253,0.35)}
  .pref-pill-web{color:#9a6700;background:rgba(212,167,44,0.16);border-color:rgba(212,167,44,0.4)}
  [data-theme="dark"] .pref-pill-rss{color:#ffa657}
  [data-theme="dark"] .pref-pill-ap{color:#d2a8ff}
  [data-theme="dark"] .pref-pill-at{color:#79c0ff}
  [data-theme="dark"] .pref-pill-web{color:#e3b341}
  [data-theme="dark"] .pref-pill-mcp{color:#56d364}
  [data-theme="dark"] .pref-pill-warn{color:#ff7b72}
  input[type="checkbox"][switch]{accent-color:var(--accent,#0969da);margin:0;cursor:pointer;width:18px;height:18px;flex-shrink:0}
  input[type="checkbox"][switch]:focus-visible{outline:3px solid var(--accent,#0969da);outline-offset:4px}
  details.pref-disclosure{border:1px solid var(--border);border-radius:6px;background:var(--panel-bg);padding:8px 12px}
  details.pref-disclosure summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--fg)}
  .pref-toast{position:fixed;right:18px;bottom:18px;padding:9px 14px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:700;box-shadow:0 8px 24px var(--shadow,rgba(0,0,0,0.2));opacity:0;pointer-events:none;transition:opacity 0.18s ease;z-index:50}
  .pref-toast.show{opacity:1}
  .pref-endpoint{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pref-endpoint code{padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--panel-bg)}
  .pref-table tr[data-off="true"] td:not(:first-child){opacity:0.5}
  #settings-syndication-root .pref-code{max-height:280px}
  .pref-sim textarea{width:100%;box-sizing:border-box;min-height:120px;resize:vertical;font-family:'D2Coding',monospace;font-size:11.5px;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--fg)}
  .pref-confirm{border:1px solid var(--accent);border-radius:8px;background:var(--active,var(--panel-bg));padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
  .pref-confirm-actions{display:flex;gap:6px;justify-content:flex-end}
  @media (max-width:780px){#pref-add-feed-form{grid-template-columns:1fr!important}#settings-syndication-root .pref-input{min-width:0!important;width:100%}}
  .console-modal{position:fixed;inset:0;background:rgba(0,0,0,0.48);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .console-modal[hidden]{display:none!important}
  .console-modal-box{background:var(--panel-bg);border:1px solid var(--border);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,0.25)}
</style>
</head>
<body data-active-area="$active_area" data-active-section="$active_section">
<div class="console-shell">
  <header class="console-topbar">
    <a href="$graph_href" class="console-btn" id="console-back-graph">← 지식 그래프</a>
    <a href="$syndication_href" class="console-btn" id="console-back-syndication">📡 신디케이션</a>
    <span class="console-sep"></span>
    <span class="console-brand">⚙️ 통합 설정 및 관리 콘솔</span>
    <span class="console-badge" id="console-scope-badge">$scope_badge</span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      $theme_selector_html
      <form method="post" action="/logout" class="logout-form">
        <button type="submit" class="console-btn">로그아웃</button>
      </form>
    </div>
  </header>
  <div class="console-body">
    <nav class="console-sidebar" aria-label="통합 콘솔 메뉴">
      $sidebar_nav_html
    </nav>
    <main class="console-main" id="console-main">
      <div class="console-container" id="console-container">
        <section class="console-card" id="console-section-$active_section" data-section="$active_section">
          <h1><span>$section_title</span> <span class="console-badge">$section_badge</span></h1>
          <p class="console-desc">$section_desc</p>
          <div id="console-section-body">$section_body_html</div>
        </section>
      </div>
    </main>
  </div>
</div>
<div id="console-reauth-modal" class="console-modal" role="dialog" aria-modal="true" aria-labelledby="console-reauth-title" hidden>
  <div class="console-modal-box">
    <h2 id="console-reauth-title" style="margin:0;font-size:15px">🔐 단계 인증 (본인 확인)</h2>
    <p class="console-desc">민감한 작업을 계속하려면 현재 계정 비밀번호를 입력해 주세요 (유효 시간 15분).</p>
    <form id="console-reauth-form" data-console-reauth-form style="display:flex;flex-direction:column;gap:10px">
      <label style="display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600">비밀번호
        <input type="password" name="password" id="console-reauth-password" class="pref-input" autocomplete="current-password" required/>
      </label>
      <p class="result" role="status" aria-live="polite" id="console-reauth-result" data-console-reauth-result></p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="pref-btn" id="console-reauth-cancel" data-console-reauth-cancel>취소</button>
        <button type="submit" class="pref-btn pref-btn-accent">본인 확인</button>
      </div>
    </form>
  </div>
</div>
<script id="console-bootstrap" type="application/json">$bootstrap_json</script>
<script src="/static/js/manage_panels.js" defer></script>
$admin_scripts_html
$extra_scripts_html
</body>
</html>
