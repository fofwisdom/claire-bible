<section id="panel-rules" class="pref-panel" data-settings-panel="rules">
  <div class="pref-card">
    <h2>⚡ 테마 DB 기반 오거나이즈 · 자동 적재 규칙</h2>
    <p class="pref-desc">정기 수집된 컨텐트를 테마 SQLite DB의 엔티티 연관도(Affinity Score)로 채점하고, 임계치 이상인 항목을 프로젝트 적재 파이프라인으로 자동 전달합니다.</p>

    <div class="pref-row">
      <div class="pref-row-label">
        <label for="pref-auto-threshold"><strong>자동 적재 전달 연관도 임계 점수 (0 ~ 100)</strong></label>
        <span>피드의 자동 적재 옵션이 켜져 있을 때, 엔티티·규칙 합산 점수가 이 기준 이상이면 즉시 <code>POST /ingest</code> 적재 큐로 전달합니다.</span>
      </div>
      <input id="pref-auto-threshold" type="number" min="50" max="100" step="5" class="pref-input" style="width:90px"/>
    </div>

    <div id="pref-rules-list" style="display:flex;flex-direction:column;gap:8px;padding-top:8px"></div>
  </div>
</section>
