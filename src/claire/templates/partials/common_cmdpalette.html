<dialog id="cmdpalette" class="cmd-palette" closedby="any" aria-labelledby="cmdpalette-title">
  <h2 id="cmdpalette-title" class="sr-only" data-i18n="nav.palette.title">${t:nav.palette.title}</h2>
  <div class="cmd-palette-head">
    <input id="cmdpalette-input" type="search" autofocus autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="cmdpalette-list" data-i18n-placeholder="nav.palette.placeholder" data-i18n-aria-label="nav.palette.input_aria" placeholder="${t:nav.palette.placeholder}" aria-label="${t:nav.palette.input_aria}"/>
  </div>
  <div id="cmdpalette-list" class="cmd-palette-list" role="listbox"></div>
  <div class="cmd-palette-foot"><span data-i18n="nav.palette.hint">${t:nav.palette.hint}</span></div>
</dialog>
