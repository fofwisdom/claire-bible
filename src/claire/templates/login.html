<!doctype html>
<html lang="$html_lang">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>${t:auth.login.page_title}</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f7f5; --fg: #1d1d1b; --muted: #5d5d58; --card: #ffffff; --line: #d9d9d4; --accent: #2f5d8a; --error: #a3261d; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ececea; --muted: #a5a5a0; --card: #20201e; --line: #3a3a37; --accent: #8db6e0; --error: #f08a80; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
      main { max-width: 34rem; margin: 0 auto; padding: 2rem 1rem 3rem; }
      h1 { font-size: 1.5rem; margin: 0 0 1rem; }
      h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.25rem; margin: 0 0 1rem; }
      label { display: block; font-weight: 600; margin: .75rem 0 .25rem; }
      .hint { color: var(--muted); font-size: .875rem; margin: .25rem 0 0; }
      input[type=text], input[type=password] { width: 100%; padding: .5rem .625rem; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
      .check { display: flex; gap: .5rem; align-items: flex-start; font-weight: 400; }
      button { margin-top: 1rem; padding: .5rem 1rem; font: inherit; color: #fff; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; }
      button.link { background: none; color: var(--accent); padding: 0; margin: 0; text-decoration: underline; }
      .errors { color: var(--error); margin: 0 0 1rem; padding-left: 1.25rem; }
      .notice { border-left: 3px solid var(--accent); padding: .5rem .75rem; background: var(--card); }
      .result { min-height: 1.5rem; margin: .5rem 0 0; }
      .result[data-state=error] { color: var(--error); }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; margin: 0; }
      dt { color: var(--muted); }
      dd { margin: 0; overflow-wrap: anywhere; }
      nav { display: flex; gap: 1rem; align-items: center; margin: 0 0 1.5rem; font-size: .9rem; }
      nav a { color: var(--accent); }
      nav form { margin: 0 0 0 auto; }
      .section-title { margin-top: 1.5rem; }
      .locale-switch { display: flex; gap: .75rem; align-items: center; justify-content: flex-end; margin: 0; font-size: .875rem; color: var(--muted); }
      .locale-switch button[aria-current=true] { color: var(--fg); font-weight: 600; text-decoration: none; cursor: default; }
    </style>
  </head>
  <body>
    <main>
      <h1>${t:auth.login.title}</h1>
      $errors
      <form class="card" method="post" action="/login" autocomplete="on">
        <label for="username">${t:auth.field.username}</label>
        <input id="username" name="username" type="text" value="$username" required maxlength="64"
               autocomplete="username" autocapitalize="none" spellcheck="false">

        <label for="password">${t:auth.field.password}</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">

        <button type="submit">${t:auth.login.submit}</button>
      </form>
      $locale_switch_html
    </main>
  </body>
</html>
