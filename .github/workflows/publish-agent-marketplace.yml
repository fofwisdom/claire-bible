name: Publish Agent Marketplace

on:
  push:
    branches:
      - main
    paths:
      - "agent_clients/**"
      - "scripts/build_agent_marketplace.py"
      - ".github/workflows/publish-agent-marketplace.yml"
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release when tag v<version> is absent
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-agent-marketplace
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.15.2
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.15.2"

      - name: Install development dependencies
        run: uv sync --frozen --extra dev

      - name: Validate and build marketplace outputs
        run: uv run --no-sync python scripts/build_agent_marketplace.py --check --out /tmp/claire-agents-dist

      - name: Run agent marketplace build and contract tests
        run: PYTHONPATH=. uv run --no-sync pytest tests/test_agent_marketplace_build.py

      - name: Read marketplace metadata
        id: meta
        run: |
          uv run --no-sync python -c '
          import os, pathlib, tomllib
          data = tomllib.loads(pathlib.Path("agent_clients/marketplace.toml").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("version=" + data["version"] + "\n")
              fh.write("repo=" + data["repo"] + "\n")
          '

      - name: Mint short-lived GitHub App token for target repository
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.MARKETPLACE_APP_PRIVATE_KEY }}
          owner: fofwisdom
          repositories: claire-agents

      - name: Checkout target marketplace repository
        uses: actions/checkout@v4
        with:
          repository: fofwisdom/claire-agents
          path: target-repo
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Sync generated tree and push changes if modified
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rsync -a --delete --exclude=".git" /tmp/claire-agents-dist/repo/ target-repo/
          cd target-repo
          if [ -n "$(git status --porcelain)" ]; then
            short_sha="$(printf '%.7s' "${SOURCE_SHA}")"
            git config user.name "claire-agents-bot[bot]"
            git config user.email "claire-agents-bot[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(sync): sync agent marketplace from fofwisdom/claire-bible@${short_sha}"
            git push origin main
          else
            echo "No changes to push to fofwisdom/claire-agents."
          fi

      - name: Create tag and GitHub Release if version tag is absent
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MARKETPLACE_VERSION: ${{ steps.meta.outputs.version }}
          MARKETPLACE_REPO: ${{ steps.meta.outputs.repo }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd target-repo
          tag="v${MARKETPLACE_VERSION}"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            git config user.name "claire-agents-bot[bot]"
            git config user.email "claire-agents-bot[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "Release ${tag} synced from fofwisdom/claire-bible@${SOURCE_SHA}"
            git push origin "${tag}"
            gh release create "${tag}" /tmp/claire-agents-dist/releases/* --repo "${MARKETPLACE_REPO}" --title "${tag}" --notes-file /tmp/claire-agents-dist/release_notes.md
          else
            echo "Tag ${tag} already exists in ${MARKETPLACE_REPO}; updating release notes."
            gh release edit "${tag}" --repo "${MARKETPLACE_REPO}" --notes-file /tmp/claire-agents-dist/release_notes.md || true
          fi
