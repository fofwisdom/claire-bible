id = "claire-antigravity"
plugin_name = "claire"
client_id = "antigravity"
target = "antigravity"
name = "Claire Bible"
display_name = "Claire Bible"
agent_name = "Antigravity"
version = "0.4.3"
license = "MIT"
required_scopes = ["readonly", "write"]
description = "Antigravity plugin for direct URL/document ingest, isolated source extraction, and knowledge graph queries over the global claire MCP server."
suggested_prompts = [
  "이 URL을 Claire Bible에 바로 저장·추출해 줘 (Save and extract a URL)",
  "로컬 문서 파일(PDF/DOCX/MD)을 Claire Bible에 저장·추출해 줘 (Stage and extract a local document file)",
  "내 Claire Bible 지식 그래프에서 관련 주제를 검색해 줘 (Search my Claire Bible knowledge graph)",
]

[adapter]
skill_naming = "hyphen_prefix"
agent_naming = "hyphen_prefix"
tool_prefix = ""
handoff_mode = "direct_subagent"
guard_mode = "rules"
supports_allowed_tools = false
extractor_mcp_mode = "inherit_mcp"
