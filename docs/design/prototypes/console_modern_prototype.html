<!doctype html>
<html lang="ko" data-theme="light"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="text-scale" content="scale"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Claire Bible — 설정 및 관리 콘솔 (모던 웹 개선 프로토타입 vs Claude 안)</title>
<style>
:root{
  --bg:#ffffff;--fg:#1f2328;--muted:#656d76;--bar-bg:#f6f8fa;--border:#d0d7de;--panel-bg:#f6f8fa;
  --accent:#0969da;--chip-bg:#eaeef2;--hover:#eef1f4;--active:#ddf4ff;--card-bg:#ffffff;
  --mark-bg:#fff8c5;--mark-fg:#633c01;--btn-bg:#1f883d;--btn-fg:#fff;--sec-bg:#eaeef2;--sec-fg:#24292f;
  --shadow:rgba(31,35,40,.22);--warn:#cf222e;--remote:#8250df;--kb:#1a7f37;--fic:#bf3989;--idea:#bc4c00;
  --top-h:3rem;
}
[data-theme=dark]{
  --bg:#0e1116;--fg:#d7dbe0;--muted:#8b949e;--bar-bg:#161b22;--border:#2a2f37;--panel-bg:#10151c;
  --accent:#58a6ff;--chip-bg:#1f2937;--hover:#161b22;--active:#1f2937;--card-bg:#161b22;
  --mark-bg:#4d3800;--mark-fg:#ffdf5d;--btn-bg:#238636;--btn-fg:#fff;--sec-bg:#30363d;--sec-fg:#d7dbe0;
  --shadow:rgba(1,4,9,.6);--warn:#ff7b72;--remote:#d2a8ff;--kb:#7ee787;--fic:#f778ba;--idea:#ffa657;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:0.84375rem/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:break-word}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-size:1.125rem;line-height:1.35;margin:0 0 0.25rem}
h3{font-size:0.9375rem;line-height:1.4;margin:1rem 0 0.375rem}
h4{font-size:0.84375rem;line-height:1.4;margin:0 0 0.375rem}
a{color:var(--accent);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--chip-bg);border-radius:4px;padding:0.0625rem 0.3125rem;font-size:0.8125rem;font-family:ui-monospace,Menlo,Consolas,monospace}

@media (prefers-reduced-motion: no-preference){
  @view-transition{navigation:auto}
}

.lineicon{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.375rem;background:var(--bar-bg);border:1px solid var(--border);border-radius:6px;padding:0.3125rem 0.625rem;min-block-size:1.875rem;cursor:pointer;white-space:nowrap;font-weight:500;text-decoration:none}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.pri{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent;font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.on{background:var(--active);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.danger{color:var(--warn)}
.btn.danger:hover{border-color:var(--warn);background:rgba(207,34,46,.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon-btn{padding:0.25rem 0.4375rem;min-inline-size:1.875rem}
.chip{display:inline-flex;align-items:center;gap:0.25rem;background:var(--chip-bg);border-radius:999px;padding:0.0625rem 0.5rem;font-size:0.75rem;color:var(--muted);white-space:nowrap;line-height:1.5}
.chip.remote{color:var(--remote)}.chip.kb{color:var(--kb)}.chip.fic{color:var(--fic)}.chip.warn{color:var(--warn)}.chip.acc{color:var(--accent)}
.lock-pill{border:1px solid var(--border);background:var(--panel-bg);color:var(--fg)}
.ref{display:inline-block;font-size:0.6875rem;font-weight:700;border:1px dashed var(--border);color:var(--muted);border-radius:4px;padding:0 0.25rem;margin-inline-start:0.25rem;vertical-align:middle;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:0.75rem}

/* Top Application Bar & Prototype Chrome */
#app{min-block-size:100dvh;display:flex;flex-direction:column}
body[data-layout="claude"] #app,body[data-layout="claude"].con-active #app{display:grid;grid-template-rows:auto auto auto minmax(0,1fr);height:100dvh;overflow:hidden}
header.top{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:0.5rem;padding:0.4375rem 0.875rem;min-block-size:var(--top-h);border-bottom:1px solid var(--border);background:var(--bar-bg);flex-wrap:wrap}
.grow{flex:1;min-width:0}
.logo{font-weight:700;display:inline-flex;gap:0.4375rem;align-items:center;white-space:nowrap}
.logo i{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#00ffaa,#0969da);display:inline-block}
select.sel,input.inp{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:0.25rem 0.5rem;min-block-size:1.875rem;max-inline-size:100%}
#tabs{display:flex;gap:0.125rem;padding:0.3125rem 0.875rem 0;border-bottom:1px solid var(--border);background:var(--bg);overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:0.375rem;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;background:none;padding:0.375rem 0.6875rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab:hover{background:var(--hover);color:var(--fg)}
.tab.on{background:var(--bg);border-color:var(--border);color:var(--fg);font-weight:700;margin-bottom:-1px}
#addr{display:flex;gap:0.5rem;align-items:center;padding:0.375rem 0.875rem;border-bottom:1px solid var(--border);font-size:0.75rem;background:var(--panel-bg);flex-wrap:wrap}
#addr code{background:var(--bg);border:1px solid var(--border);padding:0.125rem 0.5rem;border-radius:999px;max-inline-size:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layout-seg{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.layout-seg .seg-btn{border:1px solid transparent;border-radius:6px;background:transparent;padding:0.25rem 0.5625rem;cursor:pointer;font-size:0.75rem;color:var(--muted);white-space:nowrap;font-weight:600}
.layout-seg .seg-btn:hover{background:var(--hover);color:var(--fg)}
.layout-seg .seg-btn[aria-pressed="true"]{background:var(--active);border-color:var(--accent);color:var(--accent)}

#body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
body[data-layout="claude"] #body{min-height:0;overflow:hidden}
main{padding:1rem 1.25rem 3.75rem;min-width:0}
body[data-layout="claude"] main{overflow:auto;min-height:0}
.wrap{max-width:68rem;margin:0 auto}
#flow{width:300px;border-left:1px solid var(--border);background:var(--panel-bg);overflow:auto;display:none}
#flow.show{display:block}
#flow .hd{position:sticky;top:0;background:var(--bar-bg);border-bottom:1px solid var(--border);padding:0.5rem 0.625rem;font-weight:700;display:flex;gap:0.375rem;align-items:center;z-index:2}
.fl{padding:0.4375rem 0.625rem;border-bottom:1px solid var(--border);font-size:0.75rem}
.fl b{font-size:0.625rem;border-radius:4px;padding:0 0.25rem;margin-inline-end:0.25rem;color:#fff;background:var(--muted)}
.fl.ap b{background:var(--remote)}.fl.srv b{background:var(--kb)}.fl.auth b{background:var(--idea)}

.grid{display:grid;gap:0.625rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,18.75rem),1fr))}
.cols{display:grid;gap:0.875rem;grid-template-columns:minmax(0,1.6fr) minmax(16.25rem,1fr)}
@media(max-width:860px){.cols{grid-template-columns:1fr}#flow.show{position:fixed;right:0;top:0;bottom:0;z-index:40;box-shadow:0 0 24px var(--shadow)}}
.card{border:1px solid var(--border);border-radius:8px;padding:0.75rem 0.875rem;background:var(--card-bg)}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}
.card.note{background:var(--mark-bg);color:var(--mark-fg);border-color:transparent}
.card.err{border-color:var(--warn)}
.ttl{font-weight:700}
.row{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap}
.line{display:flex;gap:0.5rem;align-items:center;padding:0.5rem 0;border-top:1px dashed var(--border);flex-wrap:wrap}
.line:first-child{border-top:none}
.sub{display:flex;gap:0.125rem;margin:0.625rem 0}
table{border-collapse:collapse;width:100%;font-size:0.8125rem}
th,td{text-align:left;padding:0.4375rem 0.625rem;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600}
td.c,th.c{text-align:center}
.yes{color:var(--kb);font-weight:700}.no{color:var(--muted)}
.empty{padding:1.75rem 1rem;color:var(--muted);text-align:center}
label.f{display:block;margin:0.5rem 0 0.25rem;font-weight:600;font-size:0.78125rem}
input.w,textarea.w{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:0.375rem 0.5625rem}
.legend{font-size:0.75rem;color:var(--muted);margin:0.25rem 0 0.75rem}
pre.code{margin:0;padding:0.625rem 0.75rem;border:1px solid var(--border);border-radius:6px;background:var(--panel-bg);font-size:0.75rem;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace}

/* Native Dialogs */
dialog{border:1px solid var(--border);border-radius:10px;background:var(--card-bg);color:var(--fg);padding:0;width:min(38rem,94vw);box-shadow:0 12px 40px var(--shadow)}
dialog:modal{overscroll-behavior:contain}
dialog::backdrop{overflow:hidden;overscroll-behavior:contain;background:rgba(0,0,0,.38)}
dialog .hd{padding:0.6875rem 0.9375rem;border-bottom:1px solid var(--border);font-weight:700;background:var(--bar-bg);display:flex;align-items:center;gap:0.5rem}
dialog .bd{padding:0.875rem 0.9375rem;max-height:64dvh;overflow:auto}
dialog .ft{padding:0.6875rem 0.9375rem;border-top:1px solid var(--border);display:flex;gap:0.5rem;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:1.125rem;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:8px;padding:0.4375rem 0.875rem;font-size:0.78125rem;opacity:0;pointer-events:none;transition:opacity .15s;z-index:70}
#toast.show{opacity:1}

/* Shared console badges */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:1.125rem;height:1.125rem;background:var(--accent);color:#fff;border-radius:999px;font-size:0.6875rem;padding:0 0.375rem;font-weight:700}
.tg{display:inline-block;font-size:0.625rem;font-weight:700;border-radius:4px;padding:0 0.25rem;vertical-align:middle;white-space:nowrap;line-height:1.5}
.tg.n{background:var(--kb);color:var(--bg)}.tg.c{background:var(--accent);color:var(--bg)}.tg.p{border:1px dashed var(--idea);color:var(--idea)}

/* =========================================================
   MODE 1: MODERN CONSOLE ARCHITECTURE (Proposed)
   ========================================================= */
main.con-on.mod{padding:0;overflow:visible}
main.con-on.mod .wrap{max-width:none}
.con-mod{display:grid;grid-template-columns:15.75rem minmax(0,1fr);align-items:start;min-block-size:calc(100dvh - 8rem)}
.cnav-mod{position:sticky;top:var(--top-h);max-block-size:calc(100dvh - var(--top-h));display:flex;flex-direction:column;border-inline-end:1px solid var(--border);background:var(--panel-bg);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:0.75rem 0.625rem 1.5rem;gap:0.5rem}
.palette-trigger{display:flex;align-items:center;gap:0.5rem;inline-size:100%;min-block-size:2.125rem;padding:0.375rem 0.5625rem;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:0.8125rem;text-align:left;cursor:pointer;transition:border-color .15s ease}
.palette-trigger:hover{border-color:var(--accent);color:var(--fg)}
.palette-trigger-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palette-trigger kbd{padding:0 0.375rem;border:1px solid var(--border);border-radius:4px;background:var(--sec-bg);color:var(--muted);font-size:0.6875rem;line-height:1.4}
.nav-groups{display:flex;flex-direction:column;gap:0.25rem}
.grp-block{display:flex;flex-direction:column}
.grp-hd{display:flex;align-items:center;gap:0.375rem;inline-size:100%;padding:0.375rem 0.5rem;border:none;border-radius:6px;background:transparent;color:var(--muted);font-size:0.75rem;font-weight:700;cursor:pointer;text-align:left}
.grp-hd:hover{background:var(--hover);color:var(--fg)}
.grp-chev{margin-inline-start:auto;font-size:0.75rem;transition:transform .15s ease}
.grp-hd[aria-expanded="false"] .grp-chev{transform:rotate(-90deg)}
.grp-ul{list-style:none;margin:0.125rem 0 0.375rem;padding:0;display:flex;flex-direction:column;gap:1px}
.grp-ul[hidden]{display:none}
.ni-mod{display:flex;align-items:center;gap:0.5rem;inline-size:100%;min-block-size:2rem;padding:0.3125rem 0.5625rem;border:1px solid transparent;border-inline-start:3px solid transparent;border-radius:6px;background:transparent;color:var(--fg);font-size:0.8125rem;text-align:left;cursor:pointer}
.ni-mod:hover{background:var(--hover)}
.ni-mod[aria-current="page"]{background:var(--active);border-color:transparent;border-inline-start-color:var(--accent);color:var(--accent);font-weight:600}
.ni-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnav-foot{margin-top:auto;padding-top:0.5rem;border-top:1px solid var(--border);font-size:0.6875rem;color:var(--muted);line-height:1.7}

.ccont-mod{min-width:0;display:flex;flex-direction:column}
.mob-bar{display:none}
.shead-mod{padding:1.125rem 1.75rem 0.875rem;border-bottom:1px solid var(--border);background:var(--bg)}
.shead-mod h1{margin:0;font-size:1.1875rem;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
.shead-mod .sdesc{margin:0.25rem 0 0;color:var(--muted);font-size:0.8125rem}
.stabs-wrap{border-bottom:1px solid var(--border);background:var(--bg);padding:0 1.75rem}
.stabs-mod{display:flex;gap:0.25rem;overflow-x:auto;scrollbar-width:none;padding-block-start:0.375rem}
.stabs-mod::-webkit-scrollbar{display:none}
.tab-mod{position:relative;flex:none;border:none;background:none;padding:0.5rem 0.75rem 0.625rem;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;border-radius:6px 6px 0 0}
.tab-mod:hover{color:var(--fg);background:var(--hover)}
.tab-mod[aria-selected="true"]{color:var(--accent);font-weight:700}
.tab-mod[aria-selected="true"]::after{content:"";position:absolute;inset:auto 0 0;border-block-end:3px solid var(--accent)}

/* Scroll-driven tab strip edge fade masks */
@supports (animation-timeline: scroll()){
  @property --fade-start{syntax:"<length>";inherits:false;initial-value:0px}
  @property --fade-end{syntax:"<length>";inherits:false;initial-value:0px}
  .stabs-mod.scroller{
    --fade-size:2.25rem;
    mask:linear-gradient(black,black) no-clip subtract,linear-gradient(to right,black,transparent) 0 0 / var(--fade-start) 100% no-repeat no-clip,linear-gradient(to right,transparent,black) 100% 0 / var(--fade-end) 100% no-repeat no-clip;
    animation:reveal-fade-start linear both,hide-fade-end linear both;
    animation-timeline:scroll(self inline);
    animation-range:0 var(--fade-size),calc(100% - var(--fade-size)) 100%;
  }
  @keyframes reveal-fade-start{to{--fade-start:var(--fade-size)}}
  @keyframes hide-fade-end{from{--fade-end:var(--fade-size)}}
}

.sbody-mod{container:cmain / inline-size;min-width:0}
/* CRITICAL: Never style border/padding/display:grid directly on [hidden="until-found"] panel! */
.tabpanel-mod[hidden]{display:none}
.tabpanel-mod[hidden="until-found"]{display:block}
.tabpanel-inner{padding:1.25rem 1.75rem 3.5rem}
@container cmain (inline-size < 640px){
  .tabpanel-inner{padding:0.875rem 0.875rem 2.75rem}
}

/* Archetype 1: Split Setting Rows + Right In-Page TOC */
.settings-layout{max-width:74rem}
.settings-stack{display:flex;flex-direction:column}
.stoc{display:none}
@container cmain (inline-size > 1140px){
  .settings-layout.has-toc{display:grid;grid-template-columns:minmax(0,1fr) 13.5rem;gap:2rem;align-items:start}
  .stoc{display:block;position:sticky;top:4.25rem;border-inline-start:1px solid var(--border);padding-inline-start:0.875rem}
}
.stoc-title{font-size:0.75rem;font-weight:700;color:var(--muted);margin-bottom:0.5rem}
.stoc-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.25rem}
.stoc-link{display:block;font-size:0.78125rem;color:var(--muted);padding:0.1875rem 0;border:none;background:none;text-align:left;cursor:pointer}
.stoc-link:hover{color:var(--accent);text-decoration:underline}

.srow{padding:1.25rem 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:0.75rem}
.srow:first-child{padding-top:0.25rem}
.srow:last-child{border-bottom:none}
.srow.flash-hit{background:var(--active);border-radius:8px;padding-inline:0.75rem;transition:background .3s ease}
@container cmain (inline-size >= 680px){
  .srow:not(.wide-tbl){display:grid;grid-template-columns:minmax(13rem,20.5rem) minmax(0,1fr);gap:1rem 2rem;align-items:start}
}
.srow-meta{min-width:0;display:flex;flex-direction:column;gap:0.375rem}
.srow-meta h3{margin:0;font-size:0.9375rem;font-weight:700;display:flex;align-items:center;gap:0.375rem;flex-wrap:wrap}
.srow-sub{margin:0;font-size:0.78125rem;color:var(--muted);line-height:1.5}
.srow-ctrl{min-width:0}
.scard{border:1px solid var(--border);border-radius:8px;padding:0.875rem 1rem;background:var(--card-bg)}
.srow.err .scard{border-color:var(--warn)}
.srow.note .scard{background:var(--mark-bg);color:var(--mark-fg);border-color:transparent}
.note-banner{margin:0.875rem 0;padding:0.75rem 1rem;border-radius:8px;border:1px solid var(--border);border-inline-start:3px solid var(--accent);background:var(--panel-bg);font-size:0.78125rem;color:var(--muted)}
.note-banner.warn{border-inline-start-color:var(--warn);background:rgba(207,34,46,.06);color:var(--fg)}

/* Native Switch Controls (<input type="checkbox" switch role="switch">) */
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.5rem 0;border-top:1px dashed var(--border);cursor:pointer}
.sw-row:first-child{border-top:none;padding-top:0}
.sw-row:last-child{padding-bottom:0}
.sw-text{display:flex;flex-direction:column;gap:0.125rem;min-width:0;flex:1}
.sw-inp{appearance:none;-webkit-appearance:none;position:relative;flex:none;inline-size:2.375rem;block-size:1.375rem;border-radius:999px;border:1px solid var(--border);background:var(--sec-bg);cursor:pointer;margin:0;transition:background-color .15s ease,border-color .15s ease}
.sw-inp::before{content:"";position:absolute;inset-block-start:2px;inset-inline-start:2px;inline-size:1rem;block-size:1rem;border-radius:50%;background:var(--bg);border:1px solid var(--border);transition:transform .15s ease}
.sw-inp:checked{background:var(--btn-bg);border-color:var(--btn-bg)}
.sw-inp:checked::before{transform:translateX(1rem);border-color:transparent}
.sw-inp:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (forced-colors:active){
  .sw-inp:checked{background:Highlight}
}

/* Archetype 2: Subgrid KPI Strip, Triage Split, Responsive Tables, Popover Menus */
.kpi-grid{display:grid;gap:0.625rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr));margin-bottom:0.75rem}
.kpi-item{grid-row:span 2;display:grid;grid-template-rows:auto 1fr;grid-template-rows:subgrid;gap:0.25rem;border:1px solid var(--border);border-radius:8px;padding:0.625rem 0.75rem;background:var(--panel-bg)}
.kpi-item b{font-size:1.125rem;line-height:1.2}
.kpi-item span{font-size:0.75rem;color:var(--muted)}

.triage-split{display:grid;grid-template-columns:minmax(16rem,23rem) minmax(0,1fr);gap:1rem;align-items:start}
.triage-list{border:1px solid var(--border);border-radius:8px;background:var(--panel-bg);overflow:hidden}
.triage-item{display:flex;flex-direction:column;gap:0.25rem;width:100%;padding:0.75rem 0.875rem;border:none;border-bottom:1px solid var(--border);background:transparent;text-align:left;cursor:pointer}
.triage-item:last-child{border-bottom:none}
.triage-item:hover{background:var(--hover)}
.triage-item[aria-current="true"]{background:var(--active);box-shadow:inset 3px 0 0 var(--accent)}
.triage-item.urgent{border-inline-start:3px solid var(--warn)}
.triage-detail{border:1px solid var(--border);border-radius:8px;background:var(--card-bg);padding:1rem 1.125rem;position:sticky;top:4rem}
.score-bar{display:flex;align-items:center;gap:0.5rem;font-size:0.78125rem}
.score-track{flex:1;height:6px;border-radius:999px;background:var(--chip-bg);overflow:hidden}
.score-fill{height:100%;background:var(--accent);border-radius:999px}

.table-wrapper{overflow-x:auto;max-inline-size:100%;container-type:inline-size;border:1px solid var(--border);border-radius:8px;background:var(--card-bg)}

const visSecs=()=>SECS.filter(s=>(!s.admin||me().admin)&&(!s.show||s.show()));
const secPath=s=>s.path?s.path():"/"+s.id;
const secTabs=s=>typeof s.tabs==="function"?s.tabs():s.tabs;
function curTab(s){const ts=secTabs(s),k=s.tabKey?S[s.tabKey]:S.stab[s.id];return ts.find(t=>t[0]===k)||ts[0]}

/* ---------- 모던 콘솔 렌더링 ---------- */
function renderModernRows(cards,tabId){
  if(cards&&!Array.isArray(cards)&&cards.custom)return cards.custom;
  if(cards&&!Array.isArray(cards)&&cards.fill)return cards.fill;
  const rows=[],notes=[];
  cards.forEach((c,idx)=>{
    if(c.cls==="plain"){notes.push(`<div class="note-banner">${c.b}</div>`);return}
    const rid=`srow-${tabId}-${idx}`;
    const isWideTbl=Boolean(c.w&&/<table\b/i.test(c.b));
    const stepBadge=c.stepUp?`<span class="chip lock-pill">${ic("lock")} 최근 로그인 필요</span>`:"";
    const subHtml=c.sub?`<p class="srow-sub">${esc(c.sub)}</p>`:"";
    const headTitle=c.t?`<h3>${c.t}</h3>`:"";
    rows.push({id:rid,title:stripHtml(c.t||"항목"),html:`<section class="srow ${isWideTbl?"wide-tbl":""} ${c.cls||""}" id="${rid}"><div class="srow-meta">${headTitle}${subHtml}${stepBadge?`<div class="row">${stepBadge}</div>`:""}</div><div class="srow-ctrl"><div class="scard">${c.b}</div></div></section>`});
  });
  const hasToc=rows.length>=3;
  const tocHtml=hasToc?`<aside class="stoc" aria-label="이 화면 목차"><div class="stoc-title">이 화면 항목</div><ul class="stoc-list" role="list">${rows.map(r=>`<li><button type="button" class="stoc-link" data-a="jumpRow" data-target="${r.id}">${esc(r.title)}</button></li>`).join("")}</ul></aside>`:"";
  return `<div class="settings-layout ${hasToc?"has-toc":""}"><div class="settings-stack">${rows.map(r=>r.html).join("")}${notes.join("")}</div>${tocHtml}</div>`;
}

function buildModernNavHtml(){
  const vs=visSecs();
  const pal=`<button type="button" class="palette-trigger" data-a="openPalette" aria-label="설정 및 작업 검색 (/)">${ic("search")}<span class="palette-trigger-label">설정 · 작업 검색…</span><kbd>/</kbd></button>`;
  const groupsHtml=GROUPS.filter(g=>!g[3]||me().admin).map(g=>{
    const gId=g[0],items=vs.filter(s=>s.g===gId);
    if(!items.length)return "";
    const isOpen=S.grpOpen[gId]!==false;
    const ulId="grp-list-"+gId;
    const lis=items.map(s=>{
      const b=s.badge?s.badge():0;
      const cur=s.id===S.sec?`aria-current="page"`:"";
      return `<li><button type="button" class="ni-mod" data-a="goSec" data-s="${s.id}" ${cur}>${ic(s.icon)}<span class="ni-label">${esc(s.n)}</span>${s.mk||""}${b?`<span class="badge">${b}</span>`:""}</button></li>`;
    }).join("");
    return `<div class="grp-block"><button type="button" class="grp-hd" data-a="togGrp" data-g="${gId}" aria-expanded="${isOpen}" aria-controls="${ulId}">${ic(g[4])}<span>${g[2]}${g[3]?" (관리자)":""}</span><span class="grp-chev" aria-hidden="true">▾</span></button><ul id="${ulId}" class="grp-ul" role="list" ${isOpen?"":"hidden"}>${lis}</ul></div>`;
  }).join("");
  const foot=`<div class="cnav-foot"><span class="tg n">신규</span> 설계가 더한 화면 <span class="tg c">바뀜</span> 설계가 바꿈 <span class="tg p">제안</span> 결정 전</div>`;
  return pal+`<nav class="nav-groups" aria-label="콘솔 섹션">${groupsHtml}</nav>`+foot;
}

const cmdDlg=$("#cmdpalette"),cmdInput=$("#cmdpalette-input"),cmdList=$("#cmdpalette-list");
let cmdItems=[],cmdActive=0;
function buildCmdEntries(q){
  if(!acct())return [];
  const vs=visSecs(),needle=q.trim().toLowerCase();
  const entries=[];
  vs.forEach(s=>{
    const grp=GROUPS.find(g=>g[0]===s.g);
    const p=secPath(s);
    const secHit=!needle||(s.n+" "+p+" "+s.d+" "+(grp?grp[2]:"")).toLowerCase().includes(needle);
    if(secHit){
      entries.push({kind:"섹션",icon:s.icon,label:s.n,meta:p,secId:s.id});
    }
    secTabs(s).forEach(t=>{
      const tabHit=!needle||(t[1]+" "+s.n).toLowerCase().includes(needle);
      if(needle&&tabHit&&secTabs(s).length>1){
        entries.push({kind:"탭",icon:s.icon,label:`${s.n} › ${t[1]}`,meta:p+"#"+t[0],secId:s.id,tabId:t[0]});
      }
      if(needle){
        let cards=[];
        try{const r=t[2]();if(Array.isArray(r))cards=r}catch(e){}
        cards.forEach((c,idx)=>{
          const ct=stripHtml(c.t);
          if(!ct)return;
          if((ct+" "+(c.sub||"")).toLowerCase().includes(needle)){
            entries.push({kind:"설정 항목",icon:s.icon,label:ct,meta:`${s.n} › ${t[1]}`,secId:s.id,tabId:t[0],rowId:`srow-${t[0]}-${idx}`});
          }
        });
      }
    });
  });
  return entries.slice(0,40);
}
function renderCmdList(){
  cmdItems=buildCmdEntries(cmdInput.value);
  if(!cmdItems.length){
    cmdList.innerHTML=`<div class="empty">"${esc(cmdInput.value)}"에 맞는 설정이나 작업이 없습니다.</div>`;
    cmdActive=-1;
    return;
  }

  cmdItems.forEach((it,idx)=>{(grouped[it.kind]=grouped[it.kind]||[]).push({it,idx})});
  cmdList.innerHTML=Object.entries(grouped).map(([k,arr])=>`<div class="cmd-group-title">${k}</div>`+arr.map(({it,idx})=>`<button type="button" class="cmd-row ${idx===cmdActive?"is-active":""}" role="option" aria-selected="${idx===cmdActive}" data-cmd-idx="${idx}">${ic(it.icon)}<span class="cmd-row-label">${esc(it.label)}</span><span class="cmd-row-meta">${esc(it.meta)}</span></button>`).join("")).join("");
}
function setCmdActive(next){
  if(!cmdItems.length){cmdActive=-1;return}

/* ---------- 모바일 오프캔버스 <dialog> 드로어 (navigation-drawer) ---------- */
const drawer=$("#nav-drawer"),scroller=drawer.querySelector(".Drawer-scroller"),sheet=drawer.querySelector(".Drawer-sheet");
let drawerState="closed";
async function openDrawer(){
  if(drawer.open)return;
  drawerState="opening";
  drawer.showModal();
  if(!CSS.supports("scroll-initial-target","nearest")){
    scroller.scrollTo({left:scroller.offsetWidth,behavior:"instant"});
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  }
  scroller.scrollTo({left:0,behavior:"auto"});
  const btn=$("#drawer-open");if(btn)btn.setAttribute("aria-expanded","true");
  drawerState="open";
}
function closeDrawer(immediate){
  if(!drawer.open)return;
  const btn=$("#drawer-open");
  if(immediate||window.matchMedia("(prefers-reduced-motion: reduce)").matches||scroller.offsetWidth===0){
    drawerState="closed";
    drawer.close();
    if(btn)btn.setAttribute("aria-expanded","false");
    return;
  }
  drawerState="closing";
  scroller.scrollTo({left:scroller.offsetWidth,behavior:"auto"});
}
if(!CSS.supports("animation-timeline: scroll()")){
  scroller.addEventListener("scroll",()=>{
    const w=sheet.offsetWidth||1;
    drawer.style.setProperty("--drawer-backdrop",Math.max(0,Math.min(1,1-scroller.scrollLeft/w)));
  },{passive:true});
}
const drawerObs=new IntersectionObserver(entries=>{
  const entry=entries.at(-1);
  if(!entry)return;
  const visThr=1/Math.max(window.innerWidth,1);
  if(drawerState==="closing"&&entry.intersectionRatio<visThr){
    drawerState="closed";
    if(drawer.open)drawer.close();
    const btn=$("#drawer-open");if(btn)btn.setAttribute("aria-expanded","false");
  }else if(drawer.open&&entry.intersectionRatio>=0.99&&drawerState!=="closing"){
    drawerState="open";
    const btn=$("#drawer-open");if(btn)btn.setAttribute("aria-expanded","true");
  }
},{root:drawer,threshold:[0.01,1]});
drawerObs.observe(sheet);
drawer.addEventListener("click",e=>{if(!sheet.contains(e.target))closeDrawer()});
drawer.addEventListener("cancel",e=>{if(e.cancelable){e.preventDefault();closeDrawer()}});

  gRevoke:d=>stepUp(`${d.g}의 Grant 회수`,()=>{grants=grants.filter(g=>!(g.kb==S.rkb&&g.a===d.g));modlog.push([acct(),"revoke_collaborator",d.g]);log("ap",`Revoke(Grant) → ${d.g}: 다음 Offer부터 다시 승인 대기`)}),
  swFed:()=>stepUp(`federation ${S.fed?"끄기":"켜기"}`,()=>{S.fed=!S.fed;log("srv",`server_settings.federation = ${S.fed?"on":"off"} (admin_audit)`)}),

  block:d=>stepUp(`${d.d} 도메인 차단`,()=>{servers=servers.filter(s=>s.d!==d.d);blocks.push({d:d.d,when:"2026-11-16"});S.mdMobileDetail=false;log("srv",`${d.d} 차단: 읽기와 쓰기 중단, 그 서버의 서명된 GET은 404, 사본은 유지`)}),
  unblock:d=>stepUp(`${d.d} 차단 해제`,()=>{blocks=blocks.filter(b=>b.d!==d.d)}),
  addServer:()=>{const v=$("#addD").value.trim();if(!v)return;A.addSug({d:v})},
  addSug:d=>stepUp(`${d.d} 알려진 서버로 추가`,()=>{suggestions=suggestions.filter(s=>s.d!==d.d);servers.push({d:d.d,name:d.d,sw:"Claire Bible 0.27",how:"관리자가 도메인을 추가함",kbs:0,last:"방금",err:0});log("ap",`서명된 GET https://${d.d}/nodeinfo, 서버 액터, /kb 컬렉션 (첫 접촉: 전체 읽기)`)}),
  replay:d=>{const j=journal.find(x=>x.id===d.j);j.st="processed";log("srv",`저널 ${j.id} 다시 처리 (활동 IRI가 키, 멱등)`);render()},
  runJudge:()=>{S.lastRun="방금";log("srv","주제 판정: 시그니처 → 군집 → 테마 시그니처 → 문서 매치 → 평판 → 자동 기여. 조정은 유지");render()},
  lock:d=>{const t=th(d.t);t.locked=!t.locked;render()},
  pin:d=>{const k=kbs.find(x=>x.theme==d.t&&!x.pinned);if(k)k.pinned=true;log("srv","theme_knowledge_bases.pinned = 1: 나중 실행에서도 멤버 유지");render()},
  merge:d=>modal("테마 병합",`<p><b>${esc(th(d.t).label)}</b>를 다른 테마에 합칩니다. 이 테마의 멤버는 대상 테마에 고정되고, <code>/themes/${d.t}</code>는 308으로 대상에 갑니다.</p><p class="muted">지식 유형이 다른 테마는 합칠 수 없습니다.</p><select class="sel" aria-label="병합 대상 테마">${themes.filter(t=>t.n!=d.t&&t.type===th(d.t).type).map(t=>`<option>${esc(t.label)}</option>`).join("")||"<option>같은 유형의 다른 테마 없음</option>"}</select>`),
  setMod:d=>stepUp(`#${d.n} 모더레이터 지정`,()=>{log("srv",`PUT /api/admin/kb/${d.n}/moderators/{account} (kb_moderation_log + admin_audit)`)}),
  delKb:d=>modal(`삭제 미리 실행: ${esc(kb(d.n).label)}`,`<p>지워질 것: 문서 ${kb(d.n).docs}건, 기여 ${contribs.filter(c=>c.kb==d.n).length}건, 멤버십 ${(members[d.n]||[]).length}건, 그래프와 임베딩.</p><p class="muted">미리 실행 결과입니다. 실제 삭제는 관리자만, 최근 로그인 뒤에 합니다.</p>`)

/* ---------- 이벤트 바인딩 ---------- */
document.addEventListener("click",e=>{
  const cmdRow=e.target.closest("[data-cmd-idx]");
  if(cmdRow){e.preventDefault();runCmd(+cmdRow.dataset.cmdIdx);return}
  const el=e.target.closest("[data-a]");
  if(!el||el.disabled)return;
  const f=A[el.dataset.a];
  if(f){
    if(!(el.matches("input[type=checkbox]")&&el.dataset.a==="tog"))e.preventDefault();
    f(el.dataset,el);
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="persona"){S.persona=t.value;S.sel.q=null;render()}
  else if(t.id==="mode"){S.mode=t.value;log("srv",`서버 모드 = ${S.mode}`);render()}
  else if(t.id==="rkb"){S.rkb=+t.value;S.sel.q=null;render()}
  else if(t.dataset.c){const ru=ruleOf(),k=t.dataset.c;if(t.checked&&ru.on){t.checked=false;stepUp("규칙 범위 넓히기",()=>{ru[k]=true})}else{ru[k]=t.checked;render()}}
});
document.addEventListener("input",e=>{
  if(e.target.id==="navq"){S.navQ=e.target.value;$("#cnav-list").innerHTML=navListClaude(visSecs())}
  else if(e.target.id==="cmdpalette-input"){cmdActive=0;renderCmdList()}
});
document.addEventListener("keydown",e=>{
  if(cmdDlg.open){
    if(e.key==="ArrowDown"){e.preventDefault();setCmdActive(cmdActive+1)}
    else if(e.key==="ArrowUp"){e.preventDefault();setCmdActive(cmdActive-1)}
    else if(e.key==="Enter"&&cmdActive>=0){e.preventDefault();runCmd(cmdActive)}
    else if(e.key==="Escape"){e.preventDefault();cmdDlg.close()}
    return;
  }
  const tablist=e.target.closest('[role="tablist"]');
  if(tablist){
    const tabs=[...tablist.querySelectorAll('[role="tab"]')];
    const idx=tabs.indexOf(e.target);
    if(idx>=0&&["ArrowRight","ArrowLeft","Home","End"].includes(e.key)){
      e.preventDefault();
      let ni=idx;
      if(e.key==="ArrowRight")ni=(idx+1)%tabs.length;
      else if(e.key==="ArrowLeft")ni=(idx-1+tabs.length)%tabs.length;
      else if(e.key==="Home")ni=0;
      else if(e.key==="End")ni=tabs.length-1;
      const nt=tabs[ni];
      nt.focus();
      nt.scrollIntoView({block:"nearest",inline:"nearest"});
      A.stab(nt.dataset);
      requestAnimationFrame(()=>{const rf=document.getElementById(nt.id);if(rf)rf.focus()});
      return;
    }
  }
  const tag=(e.target&&e.target.tagName)||"";
  const inInput=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(e.target&&e.target.isContentEditable);
  if((e.key==="/"&&!inInput&&!document.querySelector("dialog[open]"))||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k")){
    e.preventDefault();
    openPalette();
  }
});

/* hidden="until-found" Ctrl+F 자동 탭 전환 */
document.addEventListener("beforematch",e=>{
  const panel=e.target.closest?e.target.closest('[role="tabpanel"]'):null;
  if(!panel||!panel.id.startsWith("panel-"))return;
  const tabId=panel.id.slice(6);
  const sec=SECS.find(s=>s.id===S.sec);
  if(!sec)return;
  if(sec.tabKey)S[sec.tabKey]=tabId;else S.stab[sec.id]=tabId;
  const container=panel.parentElement;
  if(container){
    container.querySelectorAll('[role="tabpanel"]').forEach(p=>{
      if(p===panel){p.removeAttribute("hidden");p.setAttribute("tabindex","0")}
      else{p.setAttribute("hidden","until-found");p.removeAttribute("tabindex")}
    });
  }
  document.querySelectorAll('[role="tab"]').forEach(tb=>{
    const on=tb.dataset.v===tabId;
    tb.setAttribute("aria-selected",on?"true":"false");
    tb.setAttribute("tabindex",on?"0":"-1");
  });
});

/* Popover action menu positioning fallback + safe light-dismiss fallback for <dialog closedby="any"> */
document.addEventListener("toggle",e=>{
  const pop=e.target;
  if(!pop||!pop.classList||!pop.classList.contains("pop-menu")||e.newState!=="open")return;
  const trg=document.querySelector(`[popovertarget="${pop.id}"]`);
  if(!trg)return;
  const r=trg.getBoundingClientRect();
  pop.style.position="fixed";
  pop.style.top=Math.min(window.innerHeight-110,r.bottom+4)+"px";
  pop.style.left=Math.max(8,Math.min(window.innerWidth-176,r.right-164))+"px";
},true);

if(!("closedBy" in HTMLDialogElement.prototype)){
  const outside=(e,d)=>{const r=d.getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom};
  let pressedOut=false;
  cmdDlg.addEventListener("pointerdown",e=>{pressedOut=outside(e,cmdDlg)});
  cmdDlg.addEventListener("pointerup",e=>{if(pressedOut&&outside(e,cmdDlg))cmdDlg.close()});
}

$("#persona").innerHTML=Object.entries(personas).map(([k,p])=>`<option value="${k}" ${k===S.persona?"selected":""}>${p.label}</option>`).join("");
if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark";
if(innerWidth>1500)$("#flow").classList.add("show");
render();drawFlow();
