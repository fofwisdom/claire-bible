const repChip=l=>`<span class="chip ${REP[l][1]}">평판 ${REP[l][0]}</span>`;
const typeChip=t=>t==="fictional"?`<span class="chip fic">fictional · 가상 세계</span>`:`<span class="chip kb">real · 실제 세계</span>`;
const srvChip=k=>k.server?`<span class="chip remote">🌐 ${k.server}</span>`:`<span class="chip">이 서버</span>`;
const ST={visible:["표시됨","kb"],pending:["검토 대기","acc"],hidden:["숨김",""],rejected:["거절됨","warn"],offered:["Offer 보냄 · 원격 검토 대기","remote"],skipped:["건너뜀",""],removed:["제거됨","warn"],merging:["병합 중","acc"]};
const stChip=s=>`<span class="chip ${ST[s][1]}">${ST[s][0]}</span>`;
const ORI={direct:"직접",bulk:"테마 기여",auto:"자동",curation:"큐레이션",fork:"포크",migration:"이전"};
function log(kind,text){const tag={ap:"ActivityPub",srv:"서버",auth:"인증",ui:"화면"}[kind];S.flow.unshift({kind,tag,text});drawFlow()}
function drawFlow(){$("#flowN").textContent=S.flow.length;$("#flowList").innerHTML=S.flow.map(f=>`<div class="fl ${f.kind}"><b>${f.tag}</b>${esc(f.text)}</div>`).join("")||`<div class="empty">동작을 실행하면 서버가 하는 일과 보내는 활동이 여기에 쌓입니다.</div>`}

function nav(view,arg){S.view=view;S.arg=arg===undefined?null:arg;render();$("main").scrollTop=0}
function path(){const v=S.view,u=S.persona;if(v==="root")return["/",S.mode==="single"?"싱글 모드: 302 → /@fow/":"네트워크 모드: 공개 디렉터리"];if(v==="themes")return[S.arg?`/themes/${S.arg}`:"/themes","컬렉션 (Mastodon Collections 원칙)"];if(v==="kbs"){if(!S.arg)return["/kb","공유 지식베이스 컬렉션"];const k=kb(S.arg);return k.server?[`https://${k.server}/kb/${k.rn}/`,"원격 지식베이스의 로컬 기록 · 문서는 없음"]:[`/kb/${k.n}/`,"공유 지식베이스 (소유자 없음, 항상 공개)"]}if(v==="personal")return[u==="anon"?"/@fow/":`/@${u}/`,"개인 지식베이스 · 계정마다 하나"];if(v==="settings")return["/settings/kb","계정 콘솔"];if(v==="review")return[`/settings/kb/${S.arg||""}`,"검토자 콘솔"];return[`/admin/${S.atab}`,"관리자 콘솔"]}
function render(){
 $("#tabs").innerHTML=TABS.map(([v,l])=>`<button class="tab ${S.view===v?"on":""}" data-a="nav" data-v="${v}">${l}</button>`).join("");
 const [p,note]=path();$("#path").textContent=SELF+p.replace(/^https:\/\/[^/]+/,m=>" → "+m.slice(8));$("#pathNote").textContent=note;
 $("#main").innerHTML=({root:vRoot,themes:vThemes,kbs:vKbs,personal:vPersonal,settings:vSettings,review:vReview,admin:vAdmin})[S.view]();
}
const gate=(code,msg)=>`<div class="card"><div class="empty"><b>${code}</b><br>${msg}</div></div>`;

function themeCard(t){const ks=kbs.filter(k=>k.theme===t.n),loc=ks.filter(k=>!k.server).length,rem=ks.length-loc,n=contribs.filter(c=>ks.some(k=>k.n===c.kb)&&c.st==="visible").length+ks.reduce((a,k)=>a+k.docs,0);
 return `<div class="card click" data-a="nav" data-v="themes" data-arg="${t.n}"><div class="row"><span class="ttl">${esc(t.label)}</span>${t.locked?`<span class="chip" title="관리자가 라벨을 잠금">🔒</span>`:""}<span class="grow"></span>${typeChip(t.type)}</div><div class="row small" style="margin:4px 0"><span class="chip">이 서버 ${loc}</span><span class="chip remote">다른 서버 ${rem}</span><span class="chip">표시된 기여 ${n}</span><span class="muted">최근 활동 ${t.act}</span></div><div class="row">${t.top.slice(0,5).map(e=>`<span class="chip">${esc(e)}</span>`).join("")}</div></div>`}

 if(S.mode==="single")return `<h2>싱글 모드에는 루트 페이지가 없습니다 ${ref("CT33")}${ref("연합 §15")}</h2><div class="card"><p><code>GET /</code> → <b>302</b> → <code>/@fow/</code> (관리자의 개인 지식베이스). 임시 리다이렉트인 이유: <code>/</code>의 뜻은 서버 모드에 따라 달라지고, 관리자가 모드를 바꿀 수 있습니다.</p><p>개인 지식베이스의 다른 루트 경로는 <b>308</b> → <code>/@fow/…</code></p><p class="muted">관리자 계정이 <code>setup_required</code> 상태이면 대상이 없으므로 "설정이 끝나지 않음" 페이지를 보입니다. 싱글 모드에서도 서버 액터와 공유 지식의 연합은 동작합니다 ${ref("KD2")}.</p><div class="row"><button class="btn pri" data-a="nav" data-v="personal">/@fow/ 로 이동</button></div></div><h3>개인 지식베이스 홈 개요의 테마 카드 ${ref("§8.4")}</h3><div class="card click" data-a="nav" data-v="themes"><span class="ttl">테마 ${themes.length}개</span> <span class="muted">같은 주제의 지식베이스 묶음 보기 → /themes</span></div>`;
 const ts=themes.filter(t=>S.tf==="all"||t.type===S.tf);
 return `<div class="row"><h2>테마</h2>${ref("CT11")}${ref("§8.4")}<span class="grow"></span>${[["all","전체"],["real","real"],["fictional","fictional"]].map(([v,l])=>`<button class="btn ${S.tf===v?"on":""}" data-a="tf" data-v="${v}">${l}</button>`).join("")}<button class="btn pri" data-a="newKb" ${acct()?"":"disabled"}>＋ 공유 지식베이스 만들기</button></div>
 <div class="legend">같은 주제의 지식베이스를 서버가 엔티티로 판정해 묶습니다. 다른 서버의 공유 지식베이스도 관리자 사이의 합의 없이 이 서버의 테마에 들어옵니다 ${ref("CT35")}. 최근 활동 순.</div>
 <div class="grid">${ts.map(themeCard).join("")}</div><div style="margin-top:6px"><a data-a="nav" data-v="themes">모든 테마 컬렉션 /themes →</a></div>

 const t=th(S.arg),ks=kbs.filter(k=>k.theme===t.n&&(!k.server||S.fed)),at=attached.filter(a=>a.theme===t.n&&S.pub[a.u.slice(1)]).sort((a,b)=>(a.rep==="good"?0:1)-(b.rep==="good"?0:1));

 <div class="row" style="margin:6px 0 12px"><span class="muted small">상위 엔티티</span>${t.top.map(e=>`<span class="chip">${esc(e)}</span>`).join("")}</div>
 <h3>공유 지식베이스 ${ref("CT13")}</h3><div class="card">${ks.map(k=>kbLine(k,k.server?`<a class="small" data-a="origin" data-n="${k.n}">원본에서 열기 ↗</a>`:`<button class="btn" data-a="fork" data-n="${k.n}" ${acct()?"":"disabled"}>포크</button>`)).join("")}</div>
 <div class="legend" style="margin-top:6px">"이 테마에 기여"는 한 번의 결정으로 이 테마의 모든 공유 지식베이스에 보냅니다. 멤버가 아니어도 됩니다. 각 지식베이스의 검토자가 따로 결정합니다.</div>
 <h3>붙은 공개 개인 지식베이스 ${ref("§8.2 규칙 5")}</h3><div class="card">${at.length?at.map(a=>`<div class="line"><span style="font-size:18px">👤</span><span class="grow"><b>${a.u}</b>의 개인 지식베이스 <span class="chip">문서 ${a.docs}</span>${a.rep!=="good"?` <span class="chip acc" title="평판 limited: 다른 것 뒤에 표시">◔ 뒤에 표시</span>`:""}<br><span class="muted small">큐레이션 원천이 될 수 있습니다. 포크할 수 없습니다 ${ref("CT15")}</span></span></div>`).join(""):`<div class="empty">없음</div>`}</div>`}

function vKbs(){

  return `<div class="row"><h2>공유 지식베이스</h2>${ref("CT2")}<span class="grow"></span><button class="btn pri" data-a="newKb" ${acct()?"":"disabled"}>＋ 공유 지식베이스 만들기</button></div><div class="legend">어느 계정도 소유하지 않는 협업 지식베이스. 문서는 기여, 큐레이션, 포크 사본으로만 들어옵니다 ${ref("CT4")}.</div>${f("이 서버 <code>/kb</code>",kbs.filter(k=>!k.server))}${S.fed?f(`다른 서버의 <code>/kb</code> 컬렉션에서 읽은 기록 ${ref("연합 §8.1")}`,kbs.filter(k=>k.server)):""}`}
 const k=kb(S.arg),t=th(k.theme);
 if(k.server){const g=grantsToUs.some(x=>x.kb===k.n&&x.a===acct());
  return `<div class="row"><a data-a="nav" data-v="kbs">← 공유 지식베이스</a></div><div class="row"><span style="font-size:22px">${k.icon}</span><h2>${esc(k.label)}</h2>${srvChip(k)}${typeChip(k.type)}</div><p class="muted">${esc(k.desc)}</p>

  <div><div class="card"><h4>할 수 있는 일</h4><div class="line"><span class="grow">문서 기여 <span class="muted small">계정 액터 → 지식베이스 액터로 <code>Offer</code></span>${g?`<br><span class="chip kb">원격 협력자 Grant 보유 · 승인 없음</span>`:""}</span><button class="btn pri" data-a="contribTheme" data-t="${t.n}" ${acct()?"":"disabled"}>기여</button></div><div class="line"><span class="grow">큐레이션 <span class="muted small">이 테마의 로컬 지식베이스 검토자만</span></span><button class="btn" data-a="goCurate" data-n="${k.n}">검토 콘솔</button></div><div class="line"><span class="grow">원본 페이지</span><a data-a="origin" data-n="${k.n}">열기 ↗</a></div></div>
  <div class="legend" style="margin-top:6px">원격 지식베이스에서는 검토, 큐레이션, 유지보수, 모더레이터 역할을 가질 수 없습니다. 그 서버의 세션이 필요하기 때문입니다 ${ref("KD6")}.</div></div></div>`}
 const r=roleIn(k),cs=contribs.filter(c=>c.kb===k.n&&(c.st==="visible"||(can(k,"review")&&c.st==="hidden"))),ms=(members[k.n]||[]).filter(m=>m.st==="active"||can(k,"people"));
 return `<div class="row"><a data-a="nav" data-v="kbs">← 공유 지식베이스</a></div><div class="row"><span style="font-size:22px">${k.icon}</span><h2>${esc(k.label)}</h2>${typeChip(k.type)}<span class="chip">가입: ${k.policy==="open"?"자유":"승인"}</span><span class="chip acc">내 역할: ${ROLE[r]}</span><span class="grow"></span>
 ${r==="none"?`<button class="btn" data-a="join" data-n="${k.n}">가입 요청</button>`:""}${["member","collaborator","moderator","pending"].includes(r)?`<button class="btn" data-a="leave" data-n="${k.n}">탈퇴</button>`:""}
 <button class="btn pri" data-a="direct" data-n="${k.n}" ${can(k,"contribute_direct")?"":"disabled"} title="멤버만 직접 기여">문서 직접 기여</button><button class="btn" data-a="fork" data-n="${k.n}" ${can(k,"fork")?"":"disabled"}>포크</button>${can(k,"review")?`<button class="btn" data-a="nav" data-v="review" data-arg="${k.n}">검토 콘솔</button>`:""}</div>
 <p class="muted">${esc(k.desc)} · 테마 <a data-a="nav" data-v="themes" data-arg="${t.n}">${esc(t.label)}</a>${k.forkOf?` · <b>${esc(kb(k.forkOf).label)}</b>의 포크`:""}</p>
 <div class="card note" style="margin-bottom:10px">URL이나 파일을 공유 지식베이스에 직접 적재할 수 없습니다. 적재는 개인 지식베이스로 가고, 여기에는 기여로 들어옵니다. <code>403 kb_ingest_by_contribution</code> ${ref("CT4")}</div>
 <div class="cols"><div><h3 style="margin-top:0">문서 (기여) ${ref("§9")}</h3><div class="card">${cs.length?cs.map(c=>`<div class="line"><span class="grow"><b>${esc(c.title)}</b>${c.rev?` <span class="chip acc">개정 ${c.rev}회</span>`:""}<br><span class="muted small">기여 ${c.by||"삭제된 계정"} · ${ORI[c.origin]}${c.src?` · 원본 🌐 ${c.src}`:""}${c.curator?` · 큐레이터 ${c.curator}`:""}</span></span>${stChip(c.st)}</div>`).join(""):`<div class="empty">아직 문서가 없습니다.</div>`}</div>

function submit(d,tn,by,ts,auto){

  if(ficLike(d)){log("srv",`알림 {"code":"fiction_like_document"}`);modal("가상 자료로 보이는 문서",`<p><b>${esc(d.title)}</b>의 문서 매치가 fictional 테마 <b>${esc(th(d.theme).label)}</b>입니다.</p><p class="muted">개인 지식베이스에 두면 평판의 가상 자료 비율에 계산됩니다. fictional 공유 지식베이스에 기여해 표시되면 계산에서 빠집니다. WebUI, 텔레그램 답장, MCP 결과, CLI가 같은 알림을 보입니다. ${ref("§8.7")}</p>`,"이 테마에 기여",()=>setTimeout(()=>openContrib(d,d.theme,"server"),0))}

 dryRun:()=>{const ru=ruleOf(),ds=myDocs().filter(x=>!S.never[x.id]&&x.src!=="붙여넣기"&&(ru.uploads||x.src!=="PDF 업로드")&&x.theme&&x.score>=S.thr.auto&&!subs.some(s=>s.doc===x.id));const out=ds.map(x=>{const ts=planTargets(x,x.theme).filter(g=>g.st!=="skipped"&&(ru.themes||(ru.memberships&&!kb(g.kb).server&&LV[roleIn(kb(g.kb))]>=2&&roleIn(kb(g.kb))!=="admin")));return ts.length?`<div class="line"><span class="grow"><b>${esc(x.title)}</b> <span class="muted small">점수 ${x.score.toFixed(2)}</span><br>${ts.map(g=>`<span class="chip">${kb(g.kb).icon} ${esc(kb(g.kb).label)}${kb(g.kb).server?" 🌐":""} → ${ST[g.st][0]}</span>`).join(" ")}</span></div>`:""}).join("");modal("자동 기여 미리 실행",`<p class="muted">규칙을 켜면 지금 나갈 문서입니다. 아무것도 보내지 않았습니다. 실행·대상마다 최대 50건. ${ref("§9.9 규칙 6")}</p>${out||`<div class="empty">지금 나갈 문서가 없습니다.</div>`}<p class="muted small">제외: 붙여넣은 텍스트, "절대 기여 안 함" 문서, 이미 기여한 문서${ru.uploads?"":", 업로드한 파일"}, 점수 ${S.thr.auto} 미만</p>`)},

 fork:d=>{const k=kb(d.n);modal(`포크: ${esc(k.label)}`,`<p>새 공유 지식베이스 <b>${esc(k.label)} (fork)</b>를 만듭니다. 지식 유형, 임베딩 모델, 시드 엔티티가 같고, 원본의 테마에 들어갑니다.</p><p class="muted">표시된 문서만 추출 결과, 엔티티, 관계, 임베딩과 함께 복사합니다. LLM 호출도 새 임베딩도 없습니다. 숨김·대기·거절·제거된 문서는 복사하지 않습니다. 개인 지식베이스는 포크할 수 없습니다 <code>403 kb_fork_shared_only</code> ${ref("CT15")}</p>`,"포크",()=>{const n=1100+(++S.seq);kbs.push({n,label:k.label+" (fork)",icon:"🍴",type:k.type,theme:k.theme,policy:"approval",docs:0,desc:k.label+"의 포크",forkOf:k.n});members[n]=[{a:acct(),role:"moderator",st:"active"}];contribs.filter(c=>c.kb===k.n&&c.st==="visible").forEach(c=>contribs.push({...c,id:"c"+(++S.seq),kb:n,origin:"fork",curator:acct()}));log("srv",`POST /kb/${k.n}/forks → #${n}, 만든 계정이 모더레이터`);setTimeout(()=>nav("kbs",n),0)})},
 newKb:d=>{const tn=d.t?+d.t:null,sim=kbs.filter(k=>!tn||k.theme===tn).slice(0,4);dlg.open&&dlg.close();modal("공유 지식베이스 만들기",`<div class="card note"><b>먼저 비슷한 지식베이스를 확인하세요</b> <span class="small">(이 서버와 다른 서버)</span>${sim.map(k=>`<div class="line"><span class="grow">${k.icon} ${esc(k.label)} ${k.server?"🌐 "+k.server:""}</span><button class="btn" data-a="nav" data-v="kbs" data-arg="${k.n}">열기</button></div>`).join("")}</div><label class="f">이름</label><input class="w" id="nk-l" value="새 공유 지식베이스"><label class="f">지식 유형 (필수) ${ref("CT12")}</label><div class="row"><label><input type="radio" name="nk-t" value="real" checked> real · 실제 세계의 지식</label><label><input type="radio" name="nk-t" value="fictional"> fictional · 만든 세계의 지식</label></div><label class="f">시드 엔티티 (최대 20개, 쉼표로 구분)</label><input class="w" id="nk-s" placeholder="예: ActivityPub, WebFinger"><label class="f">임베딩 모델 (서버 제공자가 제공하는 모델, 나중에 바꿀 수 없음)</label><select class="sel"><option>server-embed-v3</option><option>server-embed-small</option></select><p class="muted small">만든 계정이 첫 모더레이터가 됩니다. 가입 정책은 "승인"으로 시작합니다. 상호 협업 상대는 바로 협력자가 됩니다. 개수 제한은 없습니다. ${ref("CT3")}${ref("CT8")}</p>`,"만들기",()=>{const n=1100+(++S.seq),type=document.querySelector("input[name=nk-t]:checked").value,t=tn||(themes.find(x=>x.type===type)||themes[0]).n;kbs.push({n,label:$("#nk-l").value||"새 공유 지식베이스",icon:"📚",type,theme:t,policy:"approval",docs:0,desc:"새로 만든 공유 지식베이스 (시그니처 없음)"});members[n]=[{a:acct(),role:"moderator",st:"active"}];mutual.filter(m=>m.st==="active"&&(m.a===S.persona||m.b===S.persona)).forEach(m=>{const o=m.a===S.persona?m.b:m.a;members[n].push({a:"@"+o,role:"collaborator",st:"active"});log("srv",`상호 협업: @${o} → 협력자 (grant_collaborator)`)});log("srv",`POST /kb → #${n} (${type})`);if(S.fed)log("ap","/kb 컬렉션에 새 항목 → 알려진 서버가 다음 읽기에서 가져감");setTimeout(()=>nav("kbs",n),0)})},
 rtab:d=>{S.rtab=d.v;render()},atab:d=>{S.atab=d.v;render()},csrc:d=>{S.csrc=isNaN(+d.v)?d.v:+d.v;render()},
 approve:d=>{const q=queue.find(x=>x.id===d.q),k=kb(q.kb);queue=queue.filter(x=>x!==q);contribs.unshift({id:"c"+(++S.seq),kb:k.n,title:q.title,by:q.by,origin:q.origin,st:"visible",src:q.remote?q.by.split("@")[2]:undefined});setTarget(q,"visible",`${acct()}가 승인`);modlog.push([acct(),"approve_contribution",q.title]);log("srv",`승인 → 병합 작업 (LLM 호출 없음, 서버 임베딩) → 표시됨`);if(q.remote)log("ap",`Accept(Offer) result=https://${SELF}/kb/${k.n}/c/${S.seq} → ${q.by}`);render()},

 remove:d=>{const c=contribs.find(x=>x.id===d.c);modal("기여 제거",`<p><b>${esc(c.title)}</b></p><label class="f">사유 코드</label><select class="sel"><option>off_subject</option><option>wrong_knowledge_type</option><option>duplicate</option><option>low_quality</option><option>spam</option><option>other</option></select><p class="muted small">문서, 그래프 원천, 임베딩, 전문 검색 행을 지우고 <code>canonical_url</code>의 묘비를 남깁니다. 되돌릴 수 없습니다.</p>`,"제거",()=>{c.st="removed";modlog.push([acct(),"remove_contribution",c.title]);log("srv","제거 → 문서 퍼지 + 묘비")})},

 curate:d=>{const k=kb(d.n),src=S.csrc,sk=kb(src),ids=[...document.querySelectorAll(".cq:checked")].map(x=>+x.value);if(!ids.length)return;if(sk&&sk.server){log("ap",`서명된 GET https://${sk.server}/kb/${sk.rn}/… (문서 + 추출 결과)`);if(!sk.followed){sk.followed=true;log("ap",`Follow 서버 액터 → ${sk.label} 액터 · ${sk.server}`)}}ids.forEach(i=>{const t=sources[src][i];contribs.unshift({id:"c"+(++S.seq),kb:k.n,title:t,by:sk?(sk.server?"@sora@"+sk.server:"@hana"):src,origin:"curation",st:"visible",src:sk&&sk.server?sk.server:undefined,curator:acct()});modlog.push([acct(),"curate",t])});log("srv",`POST /kb/${k.n}/curations → 사본 ${ids.length}건, 큐레이터 승인으로 표시`);S.rtab="content";render()},

 gGrant:d=>{const a=$("#gAcct").value.trim();if(!a)return;stepUp(`${a}에게 원격 협력자 Grant`,()=>{grants.push({kb:+d.n,a,until:"2027-05-16"});modlog.push([acct(),"grant_collaborator",a]);log("ap",`Grant(context=지식베이스, target=${a}, object=collaborator, 종료 6개월) 지식베이스 액터 → ${a}`)})},

 unblock:d=>stepUp(`${d.d} 차단 해제`,()=>{blocks=blocks.filter(b=>b.d!==d.d)}),
 addServer:()=>{const v=$("#addD").value.trim();if(!v)return;A.addSug({d:v})},
 addSug:d=>stepUp(`${d.d} 알려진 서버로 추가`,()=>{suggestions=suggestions.filter(s=>s.d!==d.d);servers.push({d:d.d,name:d.d,sw:"Claire Bible 0.27",how:"관리자가 도메인을 추가함",kbs:0,last:"방금",err:0});log("ap",`서명된 GET https://${d.d}/nodeinfo, 서버 액터, /kb 컬렉션 (첫 접촉: 전체 읽기)`)}),
 replay:d=>{const j=journal.find(x=>x.id===d.j);j.st="processed";log("srv",`저널 ${j.id} 다시 처리 (활동 IRI가 키, 멱등)`);render()},
 runJudge:()=>{S.lastRun="방금";log("srv","주제 판정: 시그니처 → 군집 → 테마 시그니처 → 문서 매치 → 평판 → 자동 기여. 조정은 유지");render()},
 lock:d=>{const t=th(d.t);t.locked=!t.locked;render()},
 pin:d=>{const k=kbs.find(x=>x.theme==d.t&&!x.pinned);if(k)k.pinned=true;log("srv","theme_knowledge_bases.pinned = 1: 나중 실행에서도 멤버 유지");render()},
 merge:d=>modal("테마 병합",`<p><b>${esc(th(d.t).label)}</b>를 다른 테마에 합칩니다. 이 테마의 멤버는 대상 테마에 고정되고, <code>/themes/${d.t}</code>는 308으로 대상에 갑니다.</p><p class="muted">지식 유형이 다른 테마는 합칠 수 없습니다.</p><select class="sel">${themes.filter(t=>t.n!=d.t&&t.type===th(d.t).type).map(t=>`<option>${esc(t.label)}</option>`).join("")||"<option>같은 유형의 다른 테마 없음</option>"}</select>`),
 setMod:d=>stepUp(`#${d.n} 모더레이터 지정`,()=>{log("srv",`PUT /api/admin/kb/${d.n}/moderators/{account} (kb_moderation_log + admin_audit)`)}),
 delKb:d=>modal(`삭제 미리 실행: ${esc(kb(d.n).label)}`,`<p>지워질 것: 문서 ${kb(d.n).docs}건, 기여 ${contribs.filter(c=>c.kb==d.n).length}건, 멤버십 ${(members[d.n]||[]).length}건, 그래프와 임베딩.</p><p class="muted">미리 실행 결과입니다. 실제 삭제는 관리자만, 최근 로그인 뒤에 합니다.</p>`)
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="persona"){S.persona=t.value;if(S.view==="review")S.arg=null;render()}else if(t.id==="mode"){S.mode=t.value;log("srv",`서버 모드 = ${S.mode}`);render()}else if(t.id==="rkb"){S.arg=+t.value;render()}else if(t.dataset.c){const ru=ruleOf(),k=t.dataset.c;if(t.checked&&ru.on){t.checked=false;stepUp("규칙 범위 넓히기",()=>{ru[k]=true})}else{ru[k]=t.checked;render()}}});
$("#persona").innerHTML=Object.entries(personas).map(([k,p])=>`<option value="${k}" ${k===S.persona?"selected":""}>${p.label}</option>`).join("");
if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark";
if(innerWidth>1180)$("#flow").classList.add("show");
drawFlow();render();
</script></body></html>
