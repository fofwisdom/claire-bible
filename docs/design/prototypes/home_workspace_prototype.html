<!doctype html>
<html lang="ko" data-theme="light"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Claire Bible — 이용자 홈 시각 프로토타입 (읽기 중심 홈 · 문맥 패널 · 지도)</title>
<meta name="robots" content="noindex, nofollow"/>
<style>
/* Tokens: the same values as src/claire/static/css/theme.css. The stage colors (--client, --kb, --pub) are the same as federation_client_prototype.html. */
:root{--bg:#ffffff;--fg:#1f2328;--muted:#656d76;--bar-bg:#f6f8fa;--border:#d0d7de;--panel-bg:#f6f8fa;--accent:#0969da;--accent2:#1a7f37;--chip-bg:#eaeef2;--hover:#eef1f4;--active:#ddf4ff;--card-bg:#ffffff;--mark-bg:#fff8c5;--mark-fg:#633c01;--btn-bg:#1f883d;--btn-fg:#fff;--sec-bg:#eaeef2;--sec-fg:#24292f;--rel:#9a6700;--shadow:rgba(31,35,40,.28);--danger:#cf222e;--client:#8250df;--kb:#1a7f37;--pub:#bc4c00;--side-w:280px;--insp-w:348px}
[data-theme=dark]{--bg:#0e1116;--fg:#d7dbe0;--muted:#8b949e;--bar-bg:#161b22;--border:#2a2f37;--panel-bg:#10151c;--accent:#58a6ff;--accent2:#7ee787;--chip-bg:#1f2937;--hover:#1b222c;--active:#1f2937;--card-bg:#161b22;--mark-bg:#4d3800;--mark-fg:#ffdf5d;--btn-bg:#238636;--sec-bg:#30363d;--sec-fg:#d7dbe0;--rel:#d29922;--shadow:rgba(1,4,9,.6);--danger:#ff7b72;--client:#d2a8ff;--kb:#7ee787;--pub:#ffa657}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.5 'Noto Sans KR','Noto Sans Korean',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;word-break:keep-all;overflow-wrap:break-word}
body{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
code,.mono{font-family:'D2Coding','SFMono-Regular',Menlo,Consolas,monospace;font-size:11.5px}
code{background:var(--chip-bg);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;background:var(--sec-bg);color:var(--sec-fg);border:1px solid var(--border);border-radius:4px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent;font-weight:700}
.btn.ghost{background:transparent}
.btn.on{background:var(--active);border-color:var(--accent);color:var(--accent)}
.btn.sm{height:24px;padding:0 7px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;background:var(--chip-bg);border:1px solid var(--border);font-size:11.5px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.tag{font-size:11px;color:var(--muted);flex:none}
/* Visual grammar of the proposal: a solid line is a fact (source text, deterministic result). A dashed line is an inference (model output, provisional). */
.prov{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:4px;font-size:11px;line-height:17px;white-space:nowrap}
.prov.raw{border:1px solid var(--accent2);color:var(--accent2)}
.prov.det{border:1px solid var(--border);color:var(--fg)}
.prov.model{border:1px dashed var(--client);color:var(--client)}

/* Header bar */
#bar{position:relative;z-index:30;display:flex;align-items:center;gap:8px;padding:7px 12px;min-height:48px;background:var(--bar-bg);border-bottom:1px solid var(--border);white-space:nowrap}
.brand{display:inline-flex;align-items:center;gap:6px;font-weight:700;letter-spacing:-.01em;text-decoration:none;color:inherit;font-size:13.5px}
.brand i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7ee787,#1a7f37);box-shadow:0 0 5px rgba(0,255,170,.5)}
.themepick{height:28px;padding:0 6px;background:var(--sec-bg);border:1px solid var(--border);border-radius:6px;font-size:12px;font-weight:500;max-width:150px}
.tabs{display:inline-flex;gap:2px;padding:2px;background:var(--sec-bg);border:1px solid var(--border);border-radius:6px}
.tabs button{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:var(--muted);font-weight:500}
.tabs button:hover{background:var(--hover);color:var(--fg)}
.tabs button.on{background:var(--accent);color:#fff;font-weight:700}
[data-theme=dark] .tabs button.on{color:#0e1116}
@media (forced-colors:active){.tabs button.on{outline:2px solid}}
.search{flex:1;min-width:120px;max-width:420px;display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--muted);text-align:left}
.search:hover{border-color:var(--accent)}
.search kbd{margin-left:auto;font:11px 'D2Coding',monospace;border:1px solid var(--border);border-radius:4px;padding:0 5px;background:var(--bar-bg)}
.spacer{flex:1}
.flowchip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border:1px solid var(--border);border-radius:14px;background:var(--bg);text-decoration:none;color:inherit;font-size:12px}
.flowchip b{color:var(--client)}
.menuwrap{position:relative}
.menu{position:fixed;inset:auto;margin:0;min-width:190px;background:var(--card-bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px var(--shadow);padding:4px;z-index:40}
.menu:not([popover]){display:none}
.menu.open{display:block}
.menu button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;padding:6px 9px;border-radius:4px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.menu .danger{color:var(--danger)}
.menu small{display:block;padding:4px 9px 2px;color:var(--muted);font-size:11px}

/* Main grid: left list, center, context panel. The context panel has a width only when a context exists. */
#main{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--insp-w);min-height:0;transition:grid-template-columns .2s ease}
body.no-side{--side-w:0px}
body.no-insp{--insp-w:0px}
#side,#insp{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--panel-bg)}
#side{border-right:1px solid var(--border)}
#insp{border-left:1px solid var(--border);background:var(--bg)}
body.no-side #side,body.no-insp #insp{border:0}
.phead{display:flex;align-items:center;gap:6px;height:44px;min-height:44px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--bar-bg)}
.phead strong{font-size:13.5px}
.seg{display:flex;flex:1;gap:4px}
.seg button{flex:1;height:26px;border:1px solid var(--border);border-radius:4px;background:var(--sec-bg);font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card-bg);color:var(--fg);border-color:var(--accent2);border-bottom-width:3px}
.pfilter{padding:8px 10px;border-bottom:1px solid var(--border)}
.pfilter input{width:100%;height:28px;padding:0 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg)}
.plist{flex:1;overflow:auto;min-height:0}
.lhead{padding:6px 10px 3px;font-size:11px;font-weight:700;color:var(--muted)}
.docitem{display:block;width:100%;border:0;border-bottom:1px solid var(--border);border-left:3px solid transparent;background:none;padding:8px 10px 8px 7px;text-align:left}
.docitem:hover{background:var(--hover)}
.docitem.on{background:var(--active);border-left-color:var(--accent2)}
.docitem .t{display:flex;gap:5px;align-items:flex-start}
.docitem b{flex:1;font-size:13.5px;line-height:1.35}
.docitem.unread b::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-right:5px}
.docitem p{margin:3px 0 0;font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entrow{display:flex;width:100%;align-items:center;gap:7px;min-height:34px;border:0;border-bottom:1px solid var(--border);background:none;padding:5px 10px;text-align:left}
.entrow:hover{background:var(--hover)}
.entrow.on{background:var(--active)}
.entrow span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entrow .num{font-size:11px;color:var(--muted);background:var(--chip-bg);border-radius:8px;padding:0 6px;min-width:22px;text-align:center}

/* Center */
#center{min-width:0;min-height:0;overflow:auto;background:var(--bar-bg);container-type:inline-size;container-name:center;position:relative}
.home{max-width:1080px;margin:0 auto;padding:18px 22px 110px}
.home h1{margin:0;font-size:20px;letter-spacing:-.01em}
.home .facts{margin:2px 0 14px;color:var(--muted);font-size:12.5px}
.cards{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.cards>*{grid-column:span 12}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:6px;min-width:0}
.card>header{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border)}
.card>header h2{margin:0;font-size:12.5px;font-weight:700;color:var(--accent2);flex:1}
.card>header a,.linkbtn{font-size:12px;color:var(--accent);text-decoration:none;background:none;border:0;padding:0}
.card>header a:hover,.linkbtn:hover{text-decoration:underline}
.row{display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;border:0;border-bottom:1px solid var(--border);background:none;text-align:left;min-height:36px}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--hover)}
.row .grow{flex:1;min-width:0}
.row .ttl{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:3px;border-radius:2px;background:var(--chip-bg);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
/* Stage strip: the same three stages as the /syndication pipeline (RD14). The home only links to them. */
.flow{display:grid;grid-template-columns:1fr;margin-bottom:14px;background:var(--card-bg);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.flow a{position:relative;display:block;padding:9px 14px 9px 18px;text-decoration:none;color:inherit;border-left:3px solid var(--c)}
.flow a:hover{background:var(--hover)}
.flow a b{color:var(--c)}
.flow a span{display:block;font-size:12px;color:var(--muted)}
.flow a+a::before{display:none;content:'›';position:absolute;left:-9px;top:50%;transform:translateY(-50%);width:16px;height:16px;line-height:14px;text-align:center;border-radius:50%;background:var(--card-bg);border:1px solid var(--border);color:var(--muted);font-size:12px;z-index:1}
.mapcard{display:grid;grid-template-columns:minmax(0,1fr)}
.mapcard .mini{border-bottom:1px solid var(--border);padding:6px;min-width:0}
.mapcard .mini svg{width:100%;height:236px;cursor:pointer}
.cols3{display:grid;grid-template-columns:minmax(0,1fr)}
.cols3>div+div{border-top:1px solid var(--border)}
.cols3 h3{margin:0;padding:8px 10px 4px;font-size:11.5px;color:var(--muted)}
.cols3 .row{padding:5px 10px;min-height:30px;border-bottom:0}
.cmd{display:flex;align-items:center;gap:6px;margin-top:3px}
.cmd code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* Container queries: the stacked layout above is the default. These rules are the wide layout, and they come after the default rules. */
@container center (min-width:820px){.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.flow{grid-template-columns:repeat(3,1fr)}.flow a+a::before{display:block}.mapcard{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}.mapcard .mini{border-right:1px solid var(--border);border-bottom:0}}
@container center (min-width:560px){.cols3:not(.cols1){grid-template-columns:repeat(3,minmax(0,1fr))}.cols3:not(.cols1)>div+div{border-top:0;border-left:1px solid var(--border)}}

/* Reader */
.readerwrap{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%;background:var(--bg)}
.readerwrap.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sheet{max-width:780px;width:100%;margin:0 auto;padding:0 28px 110px}
.sheet .head{position:sticky;top:0;display:flex;align-items:flex-start;gap:8px;padding:14px 0 10px;background:var(--bg);border-bottom:1px solid var(--border);z-index:2}
.sheet h1{flex:1;margin:0;font-size:21px;line-height:1.35;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 14px;font-size:12px;color:var(--muted)}
.meta a{color:var(--accent);text-decoration:none}
.sec{font-size:12.5px;font-weight:700;color:var(--accent2);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.summary{border:1px dashed var(--client);border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.75;background:var(--card-bg)}
.body{font-size:15px;line-height:1.85}
.body p{margin:0 0 14px}
.body h2{font-size:17px;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
::highlight(ent-mark){text-decoration:underline dotted;text-decoration-color:var(--muted);text-decoration-thickness:1.5px;text-underline-offset:4px}
::highlight(ent-hot){background-color:var(--mark-bg);color:var(--mark-fg)}
.splitpane{border-left:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;position:sticky;top:0;height:calc(100dvh - 49px)}
.splitpane svg{flex:1;min-height:0;width:100%}
.empty{padding:60px 24px;text-align:center;color:var(--muted)}
.stub{max-width:560px;margin:70px auto;padding:22px;text-align:center;color:var(--muted);background:var(--card-bg);border:1px dashed var(--border);border-radius:6px}

/* Graph view */
.gview{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .rel i{display:inline-block;width:16px;height:0;border-top:2px solid var(--c)}
.legend .rel.weak i{border-top-style:dashed}
.gstage{position:relative;flex:1;min-height:0}
.gstage svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.gctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.gctl button{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--sec-bg);color:var(--sec-fg);font-size:17px;line-height:1}
.gnote{position:absolute;left:12px;top:10px;font-size:11.5px;color:var(--muted);background:var(--card-bg);border:1px solid var(--border);border-radius:6px;padding:4px 9px;max-width:60%}
svg text{font-family:inherit;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.ge{stroke:var(--c,var(--border));stroke-width:1.3;opacity:.55}
.ge.weak{stroke-dasharray:4 4;opacity:.4}
.ge.mention{stroke:var(--border);opacity:.9}
.gn{cursor:pointer}
.gn circle,.gn rect{stroke:var(--bg);stroke-width:1.5}
.gn text{opacity:0;transition:opacity .12s}
.gn.lbl text,.gn:hover text,.gn.sel text,.gn.nb text,.gn.hl text{opacity:1}
.gn.lbl text,.gn.sel text,.gn.nb text{pointer-events:auto}
.gn.sel circle{stroke:var(--fg);stroke-width:2.5}
.gn.hl circle{stroke:var(--mark-fg);stroke-width:3}
.dimmed .gn:not(.sel):not(.nb){opacity:.18}
.dimmed .ge:not(.act){opacity:.08}
.ge.act{opacity:1;stroke-width:2}
.elbl{font-size:10px;fill:var(--muted)}

/* Context panel */
.ptabs{display:flex;border-bottom:1px solid var(--border);background:var(--bar-bg)}
.ptabs button{flex:1;height:34px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:600}
.ptabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{flex:1;overflow:auto;min-height:0}
.pbody h3{margin:0;padding:12px 12px 4px;font-size:12.5px;color:var(--accent2)}
.pbody .hint{padding:12px;color:var(--muted);line-height:1.7}
.localg{display:block;width:100%;aspect-ratio:524/364;border-bottom:1px solid var(--border)}
.kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:5px 8px;padding:6px 12px 10px;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.nd{padding:12px}
.nd h2{margin:0 0 4px;font-size:17px}
.obs{margin:8px 0 0;padding:0 0 0 16px;line-height:1.7}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border)}

/* Dialogs */
dialog{border:1px solid var(--border);border-radius:8px;padding:0;background:var(--card-bg);color:var(--fg);box-shadow:0 16px 48px var(--shadow);width:min(560px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4);overflow:hidden;overscroll-behavior:contain}
dialog:modal{overscroll-behavior:contain}
#pal{margin-top:12vh}
#pal input{width:100%;height:44px;border:0;border-bottom:1px solid var(--border);padding:0 14px;background:transparent;font-size:15px;outline:none}
#palres{max-height:46vh;overflow:auto;padding:4px}
#palres button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;padding:7px 10px;border-radius:4px;text-align:left}
#palres button.cur,#palres button:hover{background:var(--active)}
#palres small{margin-left:auto;color:var(--muted)}
.dlg{padding:16px}
.dlg h2{margin:0 0 10px;font-size:15px}
.dlg textarea,.dlg select{width:100%;border:1px solid var(--border);border-radius:4px;background:var(--bg);padding:8px}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

/* Prototype controls: the same dashed box as federation_client_prototype.html */
#proto{position:fixed;left:12px;bottom:12px;z-index:60;max-width:min(430px,calc(100vw - 24px));background:var(--card-bg);border:1px dashed var(--pub);border-radius:8px;box-shadow:0 6px 20px var(--shadow);font-size:12px}
#proto summary{padding:7px 10px;color:var(--pub);font-weight:700;cursor:pointer}
#proto .opts{padding:2px 10px 10px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
#proto .opts>span{color:var(--muted)}
#proto .opts>div{display:flex;flex-wrap:wrap;gap:4px}
#proto p{margin:0;padding:0 10px 9px;color:var(--muted)}
#botnav,#scrim{display:none}
@media (prefers-reduced-motion:reduce){#main,#side,#insp,.gn text{transition:none!important}}

/* Narrow screens: the list is a drawer, the context panel is a bottom sheet, and the view tabs go to the bottom. */
@media (max-width:1180px){.tabs .lb2{display:none}.flowchip .lb{display:none}}
@media (max-width:900px){
  #main{grid-template-columns:minmax(0,1fr)!important}
  #side{position:fixed;left:0;top:49px;bottom:52px;width:min(320px,86vw);z-index:45;box-shadow:8px 0 24px var(--shadow);transform:translateX(-105%);transition:transform .2s ease}
  body:not(.no-side) #side{transform:none}
  #insp{position:fixed;left:0;right:0;bottom:52px;height:62dvh;z-index:44;border-top:1px solid var(--border);border-left:0;border-radius:12px 12px 0 0;box-shadow:0 -8px 24px var(--shadow);transform:translateY(110%);transition:transform .2s ease}
  body:not(.no-insp) #insp{transform:none}
  body.overlay #scrim{display:block;position:fixed;inset:49px 0 52px;z-index:43;background:rgba(0,0,0,.4)}
  #bar .tabs,#bar .themepick,#bar .auth,#bar .spacer~.btn.ghost[data-act=toggle-insp],#bar>.btn.ghost[data-act=toggle-side],.search span,.search kbd{display:none}
  #bar [data-act=theme]{display:none}
  .sheet .head{flex-wrap:wrap}.sheet h1{flex:1 0 100%;font-size:19px}
  .search{flex:none;min-width:0;width:34px;justify-content:center;padding:0}
  #bar{gap:6px}
  #botnav{position:fixed;left:0;right:0;bottom:0;height:52px;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bar-bg);border-top:1px solid var(--border)}
  #botnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;color:var(--muted)}
  #botnav button.on{color:var(--accent);font-weight:700}
  .home{padding:14px 12px 150px}.sheet{padding:0 16px 150px}
  .readerwrap.split{grid-template-columns:minmax(0,1fr)}.splitpane{display:none}
  #proto{bottom:60px}
}

function graphSVG(o){const mini=o.mini,sel=!mini&&S.ent&&byId[S.ent]&&!byId[S.ent].off?S.ent:null,nbs=new Set(sel?byId[sel].nb.map(n=>n.id):[]);const vb=mini?BOUNDS:VB;let h='<svg viewBox="'+[vb.x,vb.y,vb.w,vb.h].join(' ')+'" class="'+(sel?'dimmed':'')+'" '+(mini?'':'id="gsvg"')+' role="img" aria-label="지식 그래프">';
 GR.forEach(r=>{const a=byId[r.from],b=byId[r.to],act=sel&&(r.from===sel||r.to===sel);h+='<line class="ge'+(r.type==='related_to'||r.prov?' weak':'')+(act?' act':'')+'" style="--c:'+REL_COLORS[r.type]+'" x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)+'"/>';if(act){const s0=r.from===sel?a:b,s1=r.from===sel?b:a;h+='<text class="elbl" text-anchor="middle" x="'+(s0.x+(s1.x-s0.x)*.6).toFixed(1)+'" y="'+(s0.y+(s1.y-s0.y)*.6-3).toFixed(1)+'">'+r.type+'</text>';}});
 const top=[...GN].sort((a,b)=>b.deg-a.deg).slice(0,mini?5:9).map(n=>n.id);
 GN.forEach(n=>{const cls='gn'+(top.includes(n.id)?' lbl':'')+(n.id===sel?' sel':'')+(nbs.has(n.id)?' nb':'');const rr=radius(n)*(mini?1.5:1);h+='<g class="'+cls+'" data-act="'+(mini?'nav':'ent')+'" data-id="'+(mini?'graph':n.id)+'" data-ent="'+n.id+'"><circle cx="'+n.x.toFixed(1)+'" cy="'+n.y.toFixed(1)+'" r="'+rr.toFixed(1)+'" fill="'+TYPE_COLORS[n.type]+'"/><text x="'+(n.x+rr+4).toFixed(1)+'" y="'+(n.y+4).toFixed(1)+'" font-size="'+(mini?19:11+Math.min(n.deg,6)*.5)+'">'+esc(n.name)+'</text></g>';});
 return h+'</svg>';}
/* Local graph of one document: ring 1 = the entities of the document, ring 2 = their neighbors in other documents. The position shows the distance from the document. */
function localSVG(d,big){const r1=d.ents.map(id=>byId[id]).sort((a,b)=>a.type.localeCompare(b.type)),in1=new Set(d.ents),ang={},pos={};r1.forEach((e,i)=>{ang[e.id]=-Math.PI/2+i*2*Math.PI/r1.length;pos[e.id]=[Math.cos(ang[e.id])*78,Math.sin(ang[e.id])*78];});
 const outer={};r1.forEach(e=>e.nb.forEach(n=>{if(!in1.has(n.id)){(outer[n.id]=outer[n.id]||[]).push(ang[e.id]);}}));
 let r2=Object.keys(outer).map(id=>({e:byId[id],a:Math.atan2(outer[id].reduce((s,a)=>s+Math.sin(a),0),outer[id].reduce((s,a)=>s+Math.cos(a),0))})).sort((a,b)=>b.e.deg-a.e.deg);const more=Math.max(0,r2.length-9);r2=r2.slice(0,9).sort((a,b)=>a.a-b.a);
 r2.forEach((o,i)=>{const a=r2.length>6?(-Math.PI/2+Math.PI/r2.length+i*2*Math.PI/r2.length):o.a;pos[o.e.id]=[Math.cos(a)*148,Math.sin(a)*148];o.ang=a;});
 const sel=S.ent&&pos[S.ent]?S.ent:null;let h='<svg class="'+(big?'':'localg')+(sel?' dimmed':'')+'" viewBox="-262 -182 524 364" role="img" aria-label="이 문서의 연결"><circle cx="0" cy="0" r="78" fill="none" stroke="var(--border)" stroke-dasharray="2 5"/><circle cx="0" cy="0" r="148" fill="none" stroke="var(--border)" stroke-dasharray="2 5"/>';
 r1.forEach(e=>{h+='<line class="ge mention" x1="0" y1="0" x2="'+pos[e.id][0].toFixed(1)+'" y2="'+pos[e.id][1].toFixed(1)+'"/>';});
 R.forEach(r=>{if(pos[r.from]&&pos[r.to]&&(in1.has(r.from)||in1.has(r.to))){const a=pos[r.from],b=pos[r.to],act=sel&&(r.from===sel||r.to===sel);h+='<line class="ge'+(r.type==='related_to'||r.prov?' weak':'')+(act?' act':'')+'" style="--c:'+REL_COLORS[r.type]+'" x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'"/>';}});
 const node=(e,ring)=>{const p=pos[e.id],a=Math.atan2(p[1],p[0]),right=Math.cos(a)>=-.01,rr=ring===1?8:5.5,nbsel=sel&&byId[sel].nb.some(n=>n.id===e.id);return '<g class="gn lbl'+(e.id===sel?' sel':'')+(nbsel?' nb':'')+'" data-act="ent" data-id="'+e.id+'" data-ent="'+e.id+'"><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+rr+'" fill="'+TYPE_COLORS[e.type]+'"'+(ring===2?' opacity=".75"':'')+'/><text x="'+(p[0]+(right?rr+4:-rr-4)).toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="'+(right?'start':'end')+'" font-size="'+(ring===1?15:12.5)+'"'+(ring===2?' style="fill:var(--muted)"':'')+'>'+esc(e.name)+'</text></g>';};
 r2.forEach(o=>{h+=node(o.e,2);});r1.forEach(e=>{h+=node(e,1);});
 h+='<rect x="-10" y="-10" width="20" height="20" rx="3" fill="var(--accent2)" stroke="var(--bg)" stroke-width="2"/>';
 if(more)h+='<text x="254" y="174" text-anchor="end" font-size="12" style="fill:var(--muted)">이웃 +'+more+'</text>';
 return h+'</svg>';}

function docContext(d){const rel=D.filter(x=>x.id!==d.id).map(x=>({x,n:x.ents.filter(e=>d.ents.includes(e)).length})).filter(o=>o.n).sort((a,b)=>b.n-a.n).slice(0,5);let b='';
 if(S.tab==='links')b=(S.o.gpos==='panel'?localSVG(d)+'<p class="hint" style="padding:6px 12px 0;font-size:11.5px">안쪽 고리 = 이 문서의 엔티티 · 바깥 고리 = 다른 문서에서 이어진 이웃</p>':'')+'<h3>엔티티를 공유하는 문서</h3>'+(rel.length?rel.map(o=>'<button class="row" data-act="doc" data-id="'+o.x.id+'"><span class="grow"><span class="ttl" style="font-weight:500">'+esc(o.x.title)+'</span></span><span class="tag" title="공유 엔티티 수 (결정론적 집계)">공유 '+o.n+'</span></button>').join(''):'<p class="hint">공유 엔티티가 있는 문서 없음</p>');
 else if(S.tab==='ents')b=d.ents.map(id=>byId[id]).sort((a,b2)=>b2.deg-a.deg).map(e=>'<button class="row" data-act="ent" data-id="'+e.id+'" data-ent="'+e.id+'">'+tdot(e.type)+'<span class="grow"><span class="ttl" style="font-weight:500">'+esc(e.name)+'</span><span class="sub">'+esc(e.obs)+'</span></span><span class="tag">'+e.deg+'</span></button>').join('');
 else{const n=d.ents.length,rule=Math.max(1,n-2-d.add[0]);b='<h3>원문 <span class="prov raw" style="margin-left:4px">'+ic('check')+'보존됨</span></h3><dl class="kv"><dt>출처</dt><dd>https://example.org/'+d.id+'</dd><dt>수집 시각</dt><dd>'+d.date+'</dd><dt>출처 유형</dt><dd>'+KIND[d.kind]+'</dd><dt>문자 수</dt><dd>적재 18,204자 (전체 18,204자)</dd></dl><div class="acts" style="border-top:1px solid var(--border)"><button class="btn sm">원문 보기</button></div><h3>산출물 <span class="prov model" style="margin-left:4px">모델 산출</span></h3><dl class="kv"><dt>요약 · 상세</dt><dd>있음</dd><dt>엔티티</dt><dd>'+n+'개</dd></dl><h3>해소 판단</h3><dl class="kv"><dt>규칙 일치</dt><dd>'+rule+'건 <span class="prov det">이름 · 별칭 · 약어</span></dd><dt>유사도 · 판정</dt><dd>'+Math.max(0,n-rule-d.add[0])+'건 <span class="prov model">임베딩 · 모델</span></dd><dt>신규</dt><dd>'+d.add[0]+'건</dd></dl><div class="acts" style="border-top:1px solid var(--border)"><button class="btn sm" data-act="nav" data-id="stream">판단 기록 보기</button></div>';}
 return '<div class="phead"><strong style="flex:1">문서 문맥</strong>'+(S.o.side==='ctx'?'<button class="btn ghost sm" data-act="close-insp" aria-label="문맥 패널 닫기">'+ic('x')+'</button>':'')+'</div><div class="ptabs" role="tablist" aria-label="문서 문맥">'+[['links','연결'],['ents','엔티티 '+d.ents.length],['src','출처']].map(t=>'<button type="button" role="tab" id="ctab-'+t[0]+'" aria-selected="'+(S.tab===t[0])+'" tabindex="'+(S.tab===t[0]?0:-1)+'" class="'+(S.tab===t[0]?'on':'')+'" data-act="tab" data-id="'+t[0]+'">'+t[1]+'</button>').join('')+'</div><div class="pbody" role="tabpanel" aria-labelledby="ctab-'+S.tab+'" tabindex="0">'+b+'</div>';}
function renderInsp(){const legacy=S.o.side==='both',tools=legacy?'<div class="acts"><button class="btn sm">적재</button><button class="btn sm">재적재</button><button class="btn sm">재생성</button><button class="btn sm">소각</button><button class="btn sm">중복정리</button></div>':'';let h;
 if(S.ent)h=nodeDetail(byId[S.ent]);
 else if(S.view==='reader'&&S.doc)h=docContext(docById[S.doc]);
 else if(S.view==='graph'&&!legacy)h='<div class="phead"><strong style="flex:1">지도 읽기</strong><button class="btn ghost sm" data-act="close-insp" aria-label="닫기">'+ic('x')+'</button></div><div class="pbody"><p class="hint">노드를 고르기 전에는 지도가 답하는 목록을 보인다. 행을 누르면 그 엔티티와 이웃만 강조된다.</p>'+insights().replace('cols3','cols1')+'</div>';
 else h='<div class="phead"><strong>상세 메뉴</strong></div>'+tools+'<div class="pbody"><p class="hint">노드를 클릭하면 관찰·출처 문서·연결이 표시됩니다.<br/><br/>(현행: 선택이 없을 때도 이 칸이 항상 열려 있다.)</p></div>';
 if(legacy&&(S.ent||(S.view==='reader'&&S.doc)))h=h.replace('<div class="pbody">',tools+'<div class="pbody">');
 $('insp').innerHTML=h;}
function renderOpts(){$('opts').innerHTML=OPTS.map(o=>'<span>'+o[1]+'</span><div>'+o[2].map(v=>'<button class="btn sm'+(S.o[o[0]]===v[0]?' on':'')+'" data-act="opt" data-k="'+o[0]+'" data-id="'+v[0]+'">'+v[1]+'</button>').join('')+'</div>').join('');$('optnote').textContent=OPTS.map(o=>NOTES[o[0]][S.o[o[0]]]).join(' ');}
function render(){document.body.classList.toggle('no-side',!S.sidebar);document.body.classList.toggle('no-insp',!inspOpen());renderBar();renderSide();const c=$('center'),keep=c.dataset.view===S.view+':'+S.doc?c.scrollTop:0;c.dataset.view=S.view+':'+S.doc;
 c.innerHTML=S.view==='home'?renderHome():S.view==='reader'?renderReader():S.view==='graph'?renderGraph():'<div class="stub"><b>'+(S.view==='stream'?'의사결정 스트림':'프레젠테이션')+'</b><br/>현행 화면을 그대로 둔다. 이 프로토타입은 홈 · 본문 · 그래프의 배치만 다룬다.</div>';c.scrollTop=keep;renderInsp();renderOpts();markEntities();const ov=narrow()&&(S.sidebar||inspOpen());document.body.classList.toggle('overlay',ov);c.inert=ov;}

/* Entity marks (CSS Custom Highlight API): Range objects on the text nodes. The DOM of the text does not change, thus textContent, copy, and selection give the same text with and without the marks. A browser without the API shows no marks.
   Match rules: only the names of the entities of this document; longest name first; no overlap; letters without case; an ASCII letter or digit next to an ASCII name end is not a match; headings have no marks. */
let MARKS=[];
function markEntities(){if(!HILITE)return;CSS.highlights.delete('ent-mark');CSS.highlights.delete('ent-hot');MARKS=[];const d=S.view==='reader'&&docById[S.doc];if(!d)return;const cands=d.ents.map(id=>({id,k:byId[id].name.toLowerCase()})).filter(c=>c.k.length>=2).sort((a,b)=>b.k.length-a.k.length),isAN=ch=>/[a-z0-9]/i.test(ch||'');
 ['rsum','rbody'].forEach(rid=>{const root=$(rid);if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('h1,h2,h3,code,pre,a')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});for(let n=w.nextNode();n;n=w.nextNode()){const t=n.data.toLowerCase(),used=[];cands.forEach(c=>{for(let i=t.indexOf(c.k);i!==-1;i=t.indexOf(c.k,i+c.k.length)){const e=i+c.k.length;if(isAN(c.k[0])&&isAN(t[i-1]))continue;if(isAN(c.k[c.k.length-1])&&isAN(t[e]))continue;if(used.some(u=>i<u[1]&&e>u[0]))continue;used.push([i,e]);const r=new Range();r.setStart(n,i);r.setEnd(n,e);MARKS.push({r,id:c.id,n,s:i,e});}});}});
 if(MARKS.length)CSS.highlights.set('ent-mark',new Highlight(...MARKS.map(m=>m.r)));}
function menuOpen(){const m=$('menu');return m.classList.contains('open')||(POPOVER&&m.matches(':popover-open'));}
function hot(id){if(!HILITE)return;const rs=MARKS.filter(m=>m.id===id).map(m=>m.r);if(rs.length){const h=new Highlight(...rs);h.priority=1;CSS.highlights.set('ent-hot',h);}else CSS.highlights.delete('ent-hot');}
function markAt(x,y){if(!MARKS.length)return null;let n,o;if(document.caretPositionFromPoint){const p=document.caretPositionFromPoint(x,y);if(!p)return null;n=p.offsetNode;o=p.offset;}else if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);if(!r)return null;n=r.startContainer;o=r.startOffset;}else return null;const m=MARKS.find(m=>m.n===n&&o>=m.s&&o<=m.e);if(!m)return null;const b=m.r.getBoundingClientRect();return x>=b.left-1&&x<=b.right+1&&y>=b.top-1&&y<=b.bottom+1?m:null;}

/* ---------- Actions ---------- */
const narrow=()=>matchMedia('(max-width:900px)').matches;
function go(view){S.view=view;if(view==='graph')S.list='ents';else if(view==='reader'||view==='home')S.list='docs';if(view!=='graph'&&view!=='reader')S.ent=null;if(narrow()){S.sidebar=false;S.insp=false;}}
function act(a,id,el){switch(a){
 case'nav':go(id);break;
 case'doc':S.doc=id;S.ent=null;S.tab='links';go('reader');docById[id].unread=0;if(!narrow())S.insp=true;break;
 case'ent':S.ent=id;S.insp=true;if(narrow())S.sidebar=false;break;
 case'unent':S.ent=null;break;
 case'list':S.list=id;S.q='';break;
 case'esort':S.entSort=id;break;
 case'tab':S.tab=id;break;
 case'toggle-side':S.sidebar=!S.sidebar;if(narrow()&&S.sidebar)S.insp=false;break;
 case'toggle-insp':if(!hasCtx())return;S.insp=!inspOpen();if(narrow()&&S.insp)S.sidebar=false;break;
 case'close-insp':S.insp=false;S.ent=null;break;
 case'close-doc':S.doc=null;S.ent=null;go(S.o.home==='overview'?'home':'graph');break;
 case'theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';return;
 case'pal':openPal();return;
 case'ing':$('ing').showModal();return;
 case'close-dlg':el.closest('dialog').close();return;
 case'close-overlay':S.sidebar=false;S.insp=false;break;
 case'menu':$('menu').classList.toggle('open');return;
 case'zoom':{if(id==='fit')VB={...BOUNDS};else{const f=id==='in'?.8:1.25,cx=VB.x+VB.w/2,cy=VB.y+VB.h/2;VB={x:cx-VB.w*f/2,y:cy-VB.h*f/2,w:VB.w*f,h:VB.h*f};}break;}
 case'opt':S.o[el.dataset.k]=id;if(el.dataset.k==='home'){S.ent=null;go(id==='overview'?'home':'graph');}if(el.dataset.k==='side')S.insp=true;break;
 default:return;}
 render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!POPOVER&&!e.target.closest('.menuwrap'))$('menu')&&$('menu').classList.remove('open');if(!el){const m=e.target.closest('#rbody,#rsum')&&String(getSelection())===''&&markAt(e.clientX,e.clientY);if(m)act('ent',m.id,e.target);return;}if(el.tagName==='A')e.preventDefault();act(el.dataset.act,el.dataset.id,el);if(el.dataset.act==='tab'){const t=$('ctab-'+S.tab);t&&t.focus();}});
/* The menu is a popover: the browser gives the light dismiss and the Escape key. The script gives the position and the arrow keys. */
document.addEventListener('beforetoggle',e=>{if(e.target.id!=='menu'||e.newState!=='open')return;const b=$('menubtn').getBoundingClientRect();e.target.style.top=(b.bottom+6)+'px';e.target.style.right=Math.max(8,innerWidth-b.right)+'px';},true);
document.addEventListener('toggle',e=>{if(e.target.id!=='menu'||e.newState!=='open')return;const f=e.target.querySelector('[role=menuitem]');f&&f.focus();},true);
document.addEventListener('keydown',e=>{const it=e.target.closest&&e.target.closest('#menu [role=menuitem]');if(it&&(e.key==='ArrowDown'||e.key==='ArrowUp')){const all=[...$('menu').querySelectorAll('[role=menuitem]')],i=all.indexOf(it);all[(i+(e.key==='ArrowDown'?1:all.length-1))%all.length].focus();e.preventDefault();}
 const tab=e.target.closest&&e.target.closest('.ptabs [role=tab]');if(tab&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const ids=['links','ents','src'],i=ids.indexOf(S.tab);S.tab=ids[(i+(e.key==='ArrowRight'?1:2))%3];render();$('ctab-'+S.tab).focus();e.preventDefault();}});
document.addEventListener('input',e=>{if(e.target.id==='sq'){S.q=e.target.value;const p=e.target.selectionStart;renderSide();const n=$('sq');n.focus();n.setSelectionRange(p,p);}if(e.target.id==='palq')renderPal();});
/* A hover on an entity in the text or in a list marks the same entity in the graph, and the reverse. */
let hotId=null;
function setHot(id){if(id===hotId)return;hotId=id;document.querySelectorAll('.hl').forEach(n=>n.classList.remove('hl'));if(id)document.querySelectorAll('[data-ent="'+id+'"]').forEach(n=>n.classList.add('hl'));hot(id);const rb=$('rbody');if(rb)rb.style.cursor='';}
document.addEventListener('mousemove',e=>{const el=e.target.closest('[data-ent]');if(el){setHot(el.dataset.ent);return;}const m=e.target.closest('#rbody,#rsum')?markAt(e.clientX,e.clientY):null;setHot(m?m.id:null);if(m)$('rbody').style.cursor='pointer';});
/* Pan and wheel zoom of the map */
let drag=null;
document.addEventListener('pointerdown',e=>{const svg=e.target.closest('#gsvg');if(svg&&!e.target.closest('.gn'))drag={x:e.clientX,y:e.clientY,vb:{...VB},k:VB.w/svg.clientWidth};});
document.addEventListener('pointermove',e=>{if(!drag)return;const k=Math.max(drag.k,VB.h/$('gsvg').clientHeight);VB.x=drag.vb.x-(e.clientX-drag.x)*k;VB.y=drag.vb.y-(e.clientY-drag.y)*k;$('gsvg').setAttribute('viewBox',[VB.x,VB.y,VB.w,VB.h].join(' '));});
document.addEventListener('pointerup',()=>{drag=null;});
document.addEventListener('wheel',e=>{const svg=e.target.closest&&e.target.closest('#gsvg');if(!svg)return;e.preventDefault();const f=e.deltaY>0?1.12:.89,r=svg.getBoundingClientRect(),px=VB.x+VB.w*(e.clientX-r.left)/r.width,py=VB.y+VB.h*(e.clientY-r.top)/r.height;VB={x:px-(px-VB.x)*f,y:py-(py-VB.y)*f,w:VB.w*f,h:VB.h*f};svg.setAttribute('viewBox',[VB.x,VB.y,VB.w,VB.h].join(' '));},{passive:false});
/* Command palette: one entry for search, movement, and commands */
let palCur=0,palItems=[];
function openPal(){$('palq').value='';palCur=0;renderPal();$('pal').showModal();$('palq').focus();}
function renderPal(){const q=$('palq').value.trim().toLowerCase(),cmds=[['홈으로','nav','home','명령'],['그래프 열기','nav','graph','명령'],['적재…','ing','','명령'],['라이트/다크 전환','theme','','명령']];palItems=cmds.filter(c=>!q||c[0].toLowerCase().includes(q)).map(c=>({h:esc(c[0]),a:c[1],id:c[2],k:c[3]})).concat(D.filter(d=>q&&d.title.toLowerCase().includes(q)||!q&&d.pin).map(d=>({h:esc(d.title),a:'doc',id:d.id,k:'문서'})),E.filter(e=>q&&e.name.toLowerCase().includes(q)).slice(0,8).map(e=>({h:tdot(e.type)+esc(e.name),a:'ent',id:e.id,k:'엔티티'})));palCur=Math.min(palCur,Math.max(0,palItems.length-1));$('palres').innerHTML=palItems.map((it,i)=>'<button class="'+(i===palCur?'cur':'')+'" data-pal="'+i+'">'+it.h+'<small>'+it.k+'</small></button>').join('')||'<p class="muted" style="padding:10px">일치 항목 없음</p>';}
function runPal(i){const it=palItems[i];if(!it)return;$('pal').close();act(it.a,it.id,document.body);}
$('pal').addEventListener('click',e=>{const b=e.target.closest('[data-pal]');if(b)runPal(+b.dataset.pal);});
if(!('closedBy' in HTMLDialogElement.prototype))['pal','ing'].forEach(id=>$(id).addEventListener('click',e=>{const dlg=$(id);if(e.target!==dlg)return;const r=dlg.getBoundingClientRect();if(r.top<=e.clientY&&e.clientY<=r.bottom&&r.left<=e.clientX&&e.clientX<=r.right)return;dlg.close();}));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();return;}if($('pal').open){if(e.key==='ArrowDown'){palCur=Math.min(palCur+1,palItems.length-1);renderPal();e.preventDefault();}else if(e.key==='ArrowUp'){palCur=Math.max(palCur-1,0);renderPal();e.preventDefault();}else if(e.key==='Enter'){runPal(palCur);e.preventDefault();}return;}if(e.key!=='Escape'||$('ing').open||menuOpen())return;if(document.body.classList.contains('overlay')){S.sidebar=false;S.insp=false;render();}else if(S.ent){S.ent=null;render();}});
if(narrow()){S.sidebar=false;S.insp=false;$('proto').open=false;}
/* Query parameters for screenshots and links: ?view=reader&doc=d2&home=graph&side=both&gpos=split&theme=dark */
(function(){const p=new URLSearchParams(location.search);['home','side','gpos'].forEach(k=>{if(p.get(k))S.o[k]=p.get(k);});if(p.get('theme'))document.documentElement.dataset.theme=p.get('theme');if(S.o.home==='graph')go('graph');if(p.get('doc')&&docById[p.get('doc')]){S.doc=p.get('doc');go('reader');}if(p.get('view'))go(p.get('view'));if(p.get('ent')&&byId[p.get('ent')])S.ent=p.get('ent');if(p.get('tab'))S.tab=p.get('tab');if(p.get('panel')==='0')$('proto').open=false;})();
render();
