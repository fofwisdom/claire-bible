<title>Claire Bible — 미구현 화면 시각 프로토타입 (공유 지식베이스 · 지식 연합)</title>
<style>
/* ===== Tokens: the colors of src/claire/static/css/theme.css, as light-dark() pairs ===== */
:root{
  color-scheme:light dark;
  --bg-l:#ffffff;--bg-d:#0e1116; --fg-l:#1f2328;--fg-d:#d7dbe0; --muted-l:#656d76;--muted-d:#8b949e;
  --bar-l:#f6f8fa;--bar-d:#161b22; --border-l:#d0d7de;--border-d:#2a2f37; --panel-l:#f6f8fa;--panel-d:#10151c;
  --accent-l:#0969da;--accent-d:#58a6ff; --ok-l:#1a7f37;--ok-d:#7ee787; --chip-l:#eaeef2;--chip-d:#1f2937;
  --hover-l:#eef1f4;--hover-d:#161b22; --active-l:#ddf4ff;--active-d:#1f2937; --card-l:#ffffff;--card-d:#161b22;
  --mark-bg-l:#fff8c5;--mark-bg-d:#4d3800; --mark-fg-l:#633c01;--mark-fg-d:#ffdf5d; --btn-l:#1f883d;--btn-d:#238636;
  --sec-l:#eaeef2;--sec-d:#30363d; --warn-l:#cf222e;--warn-d:#ff7b72; --remote-l:#8250df;--remote-d:#d2a8ff;
  --fic-l:#bf3989;--fic-d:#f778ba; --proto-l:#9a6700;--proto-d:#e3b341; --shadow-l:rgb(31 35 40 / .22);--shadow-d:rgb(1 4 9 / .6);
  --bg:light-dark(var(--bg-l),var(--bg-d)); --fg:light-dark(var(--fg-l),var(--fg-d)); --muted:light-dark(var(--muted-l),var(--muted-d));
  --bar:light-dark(var(--bar-l),var(--bar-d)); --border:light-dark(var(--border-l),var(--border-d)); --panel:light-dark(var(--panel-l),var(--panel-d));
  --accent:light-dark(var(--accent-l),var(--accent-d)); --ok:light-dark(var(--ok-l),var(--ok-d)); --chip:light-dark(var(--chip-l),var(--chip-d));
  --hover:light-dark(var(--hover-l),var(--hover-d)); --active:light-dark(var(--active-l),var(--active-d)); --card:light-dark(var(--card-l),var(--card-d));
  --mark-bg:light-dark(var(--mark-bg-l),var(--mark-bg-d)); --mark-fg:light-dark(var(--mark-fg-l),var(--mark-fg-d)); --btn:light-dark(var(--btn-l),var(--btn-d));
  --sec:light-dark(var(--sec-l),var(--sec-d)); --warn:light-dark(var(--warn-l),var(--warn-d)); --remote:light-dark(var(--remote-l),var(--remote-d));
  --fic:light-dark(var(--fic-l),var(--fic-d)); --proto:light-dark(var(--proto-l),var(--proto-d)); --shadow:light-dark(var(--shadow-l),var(--shadow-d));
  --appbar-h:3rem;
}
/* The light and dark switch of the app bar overrides the system preference (localStorage claireTheme in the product). */
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
/* Fallback for browsers without light-dark(): raw pairs selected by the media query and the switch. */
@supports not (color:light-dark(#fff,#000)){
  :root{--bg:var(--bg-l);--fg:var(--fg-l);--muted:var(--muted-l);--bar:var(--bar-l);--border:var(--border-l);--panel:var(--panel-l);--accent:var(--accent-l);--ok:var(--ok-l);--chip:var(--chip-l);--hover:var(--hover-l);--active:var(--active-l);--card:var(--card-l);--mark-bg:var(--mark-bg-l);--mark-fg:var(--mark-fg-l);--btn:var(--btn-l);--sec:var(--sec-l);--warn:var(--warn-l);--remote:var(--remote-l);--fic:var(--fic-l);--proto:var(--proto-l);--shadow:var(--shadow-l)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:var(--bg-d);--fg:var(--fg-d);--muted:var(--muted-d);--bar:var(--bar-d);--border:var(--border-d);--panel:var(--panel-d);--accent:var(--accent-d);--ok:var(--ok-d);--chip:var(--chip-d);--hover:var(--hover-d);--active:var(--active-d);--card:var(--card-d);--mark-bg:var(--mark-bg-d);--mark-fg:var(--mark-fg-d);--btn:var(--btn-d);--sec:var(--sec-d);--warn:var(--warn-d);--remote:var(--remote-d);--fic:var(--fic-d);--proto:var(--proto-d);--shadow:var(--shadow-d)}}
  :root[data-theme="dark"]{--bg:var(--bg-d);--fg:var(--fg-d);--muted:var(--muted-d);--bar:var(--bar-d);--border:var(--border-d);--panel:var(--panel-d);--accent:var(--accent-d);--ok:var(--ok-d);--chip:var(--chip-d);--hover:var(--hover-d);--active:var(--active-d);--card:var(--card-d);--mark-bg:var(--mark-bg-d);--mark-fg:var(--mark-fg-d);--btn:var(--btn-d);--sec:var(--sec-d);--warn:var(--warn-d);--remote:var(--remote-d);--fic:var(--fic-d);--proto:var(--proto-d);--shadow:var(--shadow-d)}
}

/* ===== Base ===== */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);color:var(--fg);font:0.84375rem/1.55 'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;word-break:keep-all;overflow-wrap:break-word}
body{margin:0;min-block-size:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
code{font-family:'D2Coding',ui-monospace,monospace;font-size:0.92em;background:var(--chip);border-radius:4px;padding:0 0.25rem}
h1,h2,h3,h4{margin:0;line-height:1.3}
.sr-only{position:absolute!important;inline-size:1px!important;block-size:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important}
.ic{inline-size:1rem;block-size:1rem;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.18em}
.muted{color:var(--muted)}.small{font-size:0.78rem}
.row{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center}
.grow{flex:1;min-inline-size:0}
.stack{display:flex;flex-direction:column;gap:0.75rem}

/* Buttons and chips */
.btn{display:inline-flex;align-items:center;gap:0.375rem;min-block-size:2rem;padding:0 0.75rem;border-radius:0.375rem;border:1px solid var(--border);background:var(--sec);color:var(--fg);font-size:0.8rem;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(0.97)}
.btn.pri{background:var(--btn);border-color:transparent;color:#fff}
.btn.accent{background:var(--accent);border-color:transparent;color:#fff}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--border))}
.btn.ghost{background:transparent}
.btn.icon{padding:0;inline-size:2rem;justify-content:center}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:0.25rem;padding:0 0.5rem;border-radius:999px;background:var(--chip);color:var(--muted);font-size:0.72rem;font-weight:600;white-space:nowrap;line-height:1.6}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.acc{color:var(--accent)}.chip.remote{color:var(--remote)}.chip.fic{color:var(--fic)}
.badge{display:inline-grid;place-items:center;min-inline-size:1.15rem;padding:0 0.3rem;border-radius:999px;background:var(--accent);color:#fff;font-size:0.68rem;font-weight:700;line-height:1.15rem}
.ref{display:inline-block;font-size:0.66rem;font-weight:700;border:1px dashed var(--border);color:var(--muted);border-radius:4px;padding:0 0.25rem;vertical-align:middle;white-space:nowrap}
.state{display:inline-flex;align-items:center;gap:0.25rem;font-size:0.68rem;font-weight:700;border-radius:4px;padding:0 0.35rem;white-space:nowrap;line-height:1.6;vertical-align:middle}
.state.new{background:var(--ok);color:var(--bg)}.state.chg{background:var(--accent);color:var(--bg)}.state.branch{border:1px dashed var(--remote);color:var(--remote)}.state.prop{border:1px dashed var(--proto);color:var(--proto)}.state.done{background:var(--chip);color:var(--muted)}
.note{border:1px solid var(--border);border-inline-start:3px solid var(--accent);border-radius:0.375rem;background:var(--panel);padding:0.625rem 0.75rem;font-size:0.8rem}
.note.warn{border-inline-start-color:var(--warn)}.note.mark{background:var(--mark-bg);color:var(--mark-fg);border-color:transparent}
.note.proto{border-style:dashed;border-color:var(--proto);border-inline-start:3px solid var(--proto)}
.empty{padding:1.5rem 1rem;text-align:center;color:var(--muted)}

/* ===== Prototype chrome (not a part of the design) ===== */
.proto-strip{display:flex;flex-wrap:wrap;gap:0.5rem 0.75rem;align-items:center;padding:0.375rem 0.75rem;background:color-mix(in srgb,var(--proto) 10%,var(--bg));border-block-end:1px dashed var(--proto);font-size:0.75rem}
.proto-strip b{color:var(--proto)}
.proto-strip select{min-block-size:1.75rem;border:1px solid var(--border);border-radius:0.375rem;background:var(--bg);padding:0 0.375rem}
#flow{position:fixed;inset-inline-end:0.75rem;inset-block-end:0.75rem;inline-size:min(22rem,calc(100vw - 1.5rem));max-block-size:40dvh;overflow:auto;overscroll-behavior:contain;margin:0;border:1px dashed var(--proto);border-radius:0.5rem;background:var(--card);color:var(--fg);padding:0;box-shadow:0 8px 24px var(--shadow);inset-block-start:auto;inset-inline-start:auto}
#flow .hd{position:sticky;top:0;display:flex;gap:0.5rem;align-items:center;padding:0.375rem 0.625rem;background:var(--bar);border-block-end:1px solid var(--border);font-weight:700;font-size:0.78rem}
.fl{padding:0.375rem 0.625rem;border-block-end:1px solid var(--border);font-size:0.75rem}
.fl b{font-size:0.62rem;border-radius:3px;padding:0 0.25rem;margin-inline-end:0.375rem;color:#fff;background:var(--muted)}
.fl.ap b{background:var(--remote)}.fl.srv b{background:var(--ok)}.fl.auth b{background:var(--proto)}

/* ===== Shared app bar (implemented: partials/common_appbar.html) ===== */
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:0.625rem;min-block-size:var(--appbar-h);padding:0.4375rem 0.75rem;background:var(--bar);border-block-end:1px solid var(--border);white-space:nowrap}
.brand{display:inline-flex;align-items:center;gap:0.375rem;font-weight:700;color:var(--fg);text-decoration:none}
.brand i{inline-size:1.1rem;block-size:1.1rem;border-radius:50%;background:linear-gradient(135deg,#00ffaa,#0969da)}
.appbar-center{flex:1;display:flex;justify-content:center;min-inline-size:0}
.palette-trigger{display:flex;align-items:center;gap:0.5rem;inline-size:min(100%,23.75rem);min-block-size:2.125rem;padding:0 0.5rem 0 0.625rem;border:1px solid var(--border);border-radius:0.375rem;background:var(--panel);color:var(--muted);cursor:pointer;text-align:start}
.palette-trigger span{flex:1;overflow:hidden;text-overflow:ellipsis}
kbd{border:1px solid var(--border);border-radius:4px;background:var(--sec);padding:0 0.3rem;font:inherit;font-size:0.7rem}
.appbar-end{display:flex;gap:0.375rem;align-items:center}
.bar-icon{display:inline-grid;place-items:center;inline-size:1.875rem;block-size:1.75rem;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--fg);cursor:pointer;text-decoration:none}
.bar-icon[aria-current="page"]{background:var(--active);border-color:var(--accent)}
@media (max-width:53.75rem){.appbar{flex-wrap:wrap}.appbar-center{order:3;flex-basis:100%}}

/* ===== Popover menus (menu guide: focusgroup="menu", invoker commands, anchor positioning) ===== */
.menu-pop{margin:0;padding:0.3125rem;border:1px solid var(--border);border-radius:0.5rem;background:var(--card);color:var(--fg);box-shadow:0 8px 24px var(--shadow);min-inline-size:11rem}
@supports (position-area:block-end){
  .menu-pop{inset:auto;position-area:block-end span-inline-start;position-try-fallbacks:flip-block,flip-inline,flip-block flip-inline;margin-block-start:0.25rem}
}
@supports not (position-area:block-end){
  /* Positioned from script in the toggle event (fallback of the menu guide). */
  .menu-pop{position:fixed;inset:auto;margin:0}
}
.menu-pop [focusgroup~="menu"],.menu-pop .menu-items{display:flex;flex-direction:column;gap:1px}
.menu-pop [focusgroup~="menu"] > button,.menu-pop [focusgroup~="menu"] > a{display:flex;align-items:center;gap:0.5rem;inline-size:100%;padding:0.375rem 0.625rem;border:0;border-radius:0.3125rem;background:transparent;color:var(--fg);font-size:0.8rem;text-align:start;text-decoration:none;cursor:pointer}
.menu-pop [focusgroup~="menu"] > button:hover,.menu-pop [focusgroup~="menu"] > a:hover{background:var(--hover)}
.menu-pop [focusgroup~="menu"] > button:focus-visible{outline-offset:-2px}
.menu-pop [focusgroup~="menu"] > .danger{color:var(--warn)}
.menu-pop hr{border:0;border-block-start:1px solid var(--border);margin:0.25rem 0;inline-size:100%}
.menu-pop .lock::after{content:"";margin-inline-start:auto}
[aria-haspopup="menu"][aria-expanded="true"]{background:var(--active);border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .menu-pop{opacity:0;translate:0 -0.25rem;transition:opacity,translate,display,overlay;transition-duration:.15s;transition-behavior:allow-discrete}
  .menu-pop:is(:popover-open,.\:popover-open){opacity:1;translate:0 0;transition-duration:.1s;@starting-style{opacity:0;translate:0 -0.25rem}}
}
</style>
<style>
/* ===== Console shell (implemented: templates/console_shell.html) ===== */
/* #route takes the focus after a navigation (for screen readers); it is not a control, so it shows no focus ring. */
#route:focus{outline:none}
.console-body{display:grid;grid-template-columns:16rem minmax(0,1fr);align-items:start;min-block-size:calc(100dvh - var(--appbar-h) - 2.25rem)}
.console-sidebar{position:sticky;top:var(--appbar-h);max-block-size:calc(100dvh - var(--appbar-h));overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;background:var(--panel);border-inline-end:1px solid var(--border);padding:0.75rem 0.625rem 1.5rem;align-self:stretch}
.nav-group{display:flex;flex-direction:column;gap:0.125rem;margin-block-end:0.375rem}
.nav-group-btn{display:flex;align-items:center;justify-content:space-between;gap:0.375rem;inline-size:100%;padding:0.5rem 0.625rem 0.25rem;border:0;background:transparent;color:var(--muted);cursor:pointer;text-align:start;border-radius:0.375rem;font-size:0.6875rem;font-weight:700;letter-spacing:0.04em}
.nav-group-btn:hover{color:var(--fg);background:var(--hover)}
.nav-group-btn .ic{transition:rotate .15s}
.nav-group-btn[aria-expanded="false"] .ic{rotate:-90deg}
.nav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0.125rem}
.nav-link{display:flex;align-items:center;gap:0.5rem;padding:0.4rem 0.6875rem;border-radius:0.375rem;border:1px solid transparent;color:var(--fg);font-size:0.8125rem;font-weight:600;text-decoration:none}
.nav-link:hover{background:var(--hover)}
.nav-link[aria-current="page"]{background:var(--active);color:var(--accent);border-color:var(--accent)}
.nav-link .lbl{flex:1;min-inline-size:0}
.nav-link.done{color:var(--muted);font-weight:500}
.console-main{padding:clamp(1.125rem,2.5vw,1.875rem) clamp(1rem,3vw,2.25rem);min-inline-size:0;container:cmain / inline-size}
.console-wrap{max-inline-size:66rem;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.shead h1{font-size:1.1875rem;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
.shead p{margin:0.25rem 0 0;color:var(--muted);font-size:0.8rem}
.mob-bar{display:none}
@media (max-width:53.75rem){
  .console-body{grid-template-columns:1fr}
  .console-sidebar{display:none}
  .mob-bar{display:flex;align-items:center;gap:0.5rem;position:sticky;top:var(--appbar-h);z-index:15;padding:0.5rem 0.875rem;background:var(--panel);border-block-end:1px solid var(--border)}
}
/* Off-canvas drawer: the implemented <dialog closedby="any"> drawer, simplified to a sliding modal here. */
dialog.drawer{margin:0;inset-block:0;inset-inline-start:0;inset-inline-end:auto;block-size:100dvh;max-block-size:100dvh;inline-size:min(20rem,85vw);border:0;border-inline-end:1px solid var(--border);border-radius:0;padding:0.75rem 0.625rem;background:var(--panel);color:var(--fg)}
@media (prefers-reduced-motion:no-preference){
  dialog.drawer{translate:-100% 0;transition:translate .2s,display .2s,overlay .2s;transition-behavior:allow-discrete}
  dialog.drawer[open]{translate:0 0;@starting-style{translate:-100% 0}}
}

/* Split setting rows (implemented pattern, used by the new sections) */
.srow{display:grid;grid-template-columns:minmax(0,1fr);gap:0.75rem 1.75rem;align-items:start;padding:1rem 0;border-block-start:1px solid var(--border)}
.srow:first-child{border-block-start:0;padding-block-start:0.25rem}
.srow-meta h3{font-size:0.9rem;display:flex;gap:0.375rem;align-items:center;flex-wrap:wrap}
.srow-meta p{margin:0.25rem 0 0;color:var(--muted);font-size:0.78rem}
.srow-ctrl{display:flex;flex-direction:column;gap:0.5rem;min-inline-size:0}
.srow.wide .srow-ctrl{grid-column:1/-1}
@container cmain (min-width:43.75rem){.srow{grid-template-columns:minmax(13rem,0.9fr) minmax(0,1.35fr)}}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:0.375rem 1rem;margin:0;font-size:0.8rem}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:0.625rem}
.kpi{display:grid;grid-template-rows:auto auto;gap:0.125rem;border:1px solid var(--border);border-radius:0.5rem;background:var(--panel);padding:0.625rem 0.75rem}
@supports (grid-template-rows:subgrid){.kpis{grid-auto-rows:auto}.kpi{grid-row:span 2;grid-template-rows:subgrid}}
.kpi b{font-size:1.05rem}.kpi span{font-size:0.72rem;color:var(--muted)}
.line{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;padding:0.5rem 0;border-block-start:1px dashed var(--border)}
.line:first-child{border-block-start:0}

/* ===== Tabs (tabs guide: focusgroup="tablist", hidden="until-found", scroll on overflow) ===== */
.tabs{display:flex;flex-direction:column;gap:0.875rem}
.tablist{display:flex;gap:0.125rem;overflow-x:auto;scrollbar-width:none;scroll-snap-type:inline proximity;border-block-end:1px solid var(--border);
  --fade:2rem;mask-image:linear-gradient(to right,transparent,#000 var(--fade-start,0),#000 calc(100% - var(--fade-end,0)),transparent)}
.tablist::-webkit-scrollbar{display:none}
@property --fade-start{syntax:"<length>";inherits:false;initial-value:0px}
@property --fade-end{syntax:"<length>";inherits:false;initial-value:0px}
@supports (animation-timeline:scroll()){
  .tablist{animation:tabfade linear both;animation-timeline:scroll(self inline)}
  @keyframes tabfade{from{--fade-start:0px;--fade-end:var(--fade)}10%,90%{--fade-start:var(--fade);--fade-end:var(--fade)}to{--fade-start:var(--fade);--fade-end:0px}}
}
.tablist > button{position:relative;flex:none;scroll-snap-align:start;padding:0.5rem 0.75rem;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:0.8125rem;cursor:pointer;border-radius:0.375rem 0.375rem 0 0}
.tablist > button:hover{color:var(--fg);background:var(--hover)}
.tablist > button[aria-selected="true"]{color:var(--accent)}
.tablist > button[aria-selected="true"]::after{content:"";position:absolute;inset:auto 0 0;border-block-end:3px solid var(--accent)}
.tabpanels{display:grid}
/* All panels share one grid cell. align-self:start stops a hidden panel from stretching to the height of the shown one:
   a stretched hidden="until-found" panel is still a box on top of the shown panel and takes its clicks. */
.tabpanels > [role="tabpanel"]{grid-area:1/1;min-inline-size:0;align-self:start}
.tabpanels > [role="tabpanel"][hidden]{pointer-events:none}
/* Padding and borders on the wrapper, never on the panel with hidden="until-found". */
.panel-inner{display:flex;flex-direction:column;gap:0.25rem}

/* ===== Filter chips: a native radio group styled with :has() ===== */
.chips{display:flex;flex-wrap:wrap;gap:0.375rem;border:0;margin:0;padding:0}
.chips label{display:inline-flex;align-items:center;gap:0.375rem;min-block-size:1.875rem;padding:0 0.75rem;border:1px solid var(--border);border-radius:999px;background:var(--bg);font-size:0.78rem;font-weight:600;cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:var(--active);border-color:var(--accent);color:var(--accent)}
.chips label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}

/* ===== Responsive table (responsive-table guide: container query, data-label) ===== */
.tw{overflow:auto;max-inline-size:100%;container-type:inline-size;border:1px solid var(--border);border-radius:0.5rem}
table{inline-size:100%;border-collapse:separate;border-spacing:0;font-size:0.8rem}
caption{text-align:start;font-weight:700;padding:0.5rem 0.625rem;font-size:0.8rem}
th,td{padding:0.5rem 0.625rem;text-align:start;vertical-align:middle;border-block-start:1px solid var(--border)}
thead th{position:sticky;top:0;z-index:1;background:var(--panel);color:var(--muted);font-size:0.72rem;font-weight:700;border-block-start:0}
tbody th{font-weight:600}
td.act{text-align:end;white-space:nowrap}
@container (width < 36rem){
  table,thead,tbody,tr,th,td{display:block}
  thead{display:none}
  tbody tr{border-block-start:1px solid var(--border);padding:0.375rem 0}
  tbody tr:first-child{border-block-start:0}
  th,td{border:0;padding:0.25rem 0.625rem}
  td[data-label]::before{content:attr(data-label) ": ";color:var(--muted);font-weight:600}
  td.act{text-align:start}
}

/* ===== Triage split (review queue) and master-detail ===== */
.split{display:grid;grid-template-columns:minmax(15rem,21rem) minmax(0,1fr);gap:1rem;align-items:start;container-type:inline-size}
.split-list{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:0.5rem;background:var(--panel);overflow:hidden;position:sticky;top:calc(var(--appbar-h) + 0.75rem);max-block-size:calc(100dvh - var(--appbar-h) - 1.5rem);overflow-y:auto;overscroll-behavior:contain}
.split-list li + li{border-block-start:1px solid var(--border)}
.split-list button{display:flex;flex-direction:column;gap:0.25rem;inline-size:100%;padding:0.625rem 0.75rem;border:0;background:transparent;text-align:start;cursor:pointer}
.split-list button:hover{background:var(--hover)}
.split-list button[aria-current="true"]{background:var(--active);box-shadow:inset 3px 0 0 var(--accent)}
.split-list .t{font-weight:700;font-size:0.8125rem}
.split-detail{min-inline-size:0;border:1px solid var(--border);border-radius:0.5rem;background:var(--card);padding:1rem 1.125rem;display:flex;flex-direction:column;gap:0.75rem}
@container cmain (max-width:46rem){.split{grid-template-columns:1fr}.split-list{position:static;max-block-size:16rem}}

/* ===== Dialogs (dialog guide: native modal, closedby, scroll containment, top-layer animation) ===== */
dialog.dlg{border:1px solid var(--border);border-radius:0.625rem;background:var(--card);color:var(--fg);padding:0;inline-size:min(36rem,calc(100vw - 2rem));max-block-size:calc(100dvh - 2rem);box-shadow:0 12px 40px var(--shadow)}
dialog.dlg[open]{display:flex;flex-direction:column}
dialog.dlg form{display:flex;flex-direction:column;min-block-size:0;margin:0}
dialog.dlg .dh{display:flex;align-items:center;gap:0.5rem;padding:0.75rem 1rem;border-block-end:1px solid var(--border);background:var(--bar)}
dialog.dlg .dh h2{font-size:0.95rem;flex:1}
dialog.dlg .db{padding:0.875rem 1rem;overflow:auto;display:flex;flex-direction:column;gap:0.75rem}
dialog.dlg .df{display:flex;gap:0.5rem;justify-content:flex-end;padding:0.75rem 1rem;border-block-start:1px solid var(--border)}
dialog:modal{overscroll-behavior:contain}
dialog::backdrop{background:rgb(0 0 0 / .45);overflow:hidden;overscroll-behavior:contain}
@media (prefers-reduced-motion:no-preference){
  dialog.dlg,dialog.dlg::backdrop{transition:opacity .15s,translate .15s,display .15s,overlay .15s;transition-behavior:allow-discrete;opacity:0}
  dialog.dlg{translate:0 0.5rem}
  dialog.dlg[open],dialog.dlg[open]::backdrop{opacity:1;translate:0 0}
  @starting-style{dialog.dlg[open],dialog.dlg[open]::backdrop{opacity:0}dialog.dlg[open]{translate:0 0.5rem}}
}
@media (prefers-reduced-motion:reduce){dialog.dlg,dialog.dlg::backdrop{transition:opacity .05s,display .05s,overlay .05s;transition-behavior:allow-discrete}}

/* Command palette */
dialog#cmdpalette{inline-size:min(38rem,calc(100vw - 2rem));margin-block-start:12vh}
#cmd-list{list-style:none;margin:0;padding:0.25rem;max-block-size:50dvh;overflow:auto}
#cmd-list [role="option"]{display:flex;gap:0.5rem;align-items:center;padding:0.5rem 0.625rem;border-radius:0.375rem;cursor:pointer}
#cmd-list [role="option"][aria-selected="true"]{background:var(--active)}
#cmd-list small{color:var(--muted);font-family:ui-monospace,monospace;font-size:0.7rem;margin-inline-start:auto}

/* ===== Forms (validate-input-after-interaction guide) ===== */
.field{display:flex;flex-direction:column;gap:0.25rem}
.field > label,.field > .lbl{font-weight:700;font-size:0.78rem}
.field .hint{color:var(--muted);font-size:0.72rem}
.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{inline-size:100%;min-block-size:2.125rem;padding:0.25rem 0.625rem;border:1px solid var(--border);border-radius:0.375rem;background:var(--bg)}
.field input:user-invalid,.field select:user-invalid,.field textarea:user-invalid{border-color:var(--warn);outline-color:var(--warn)}
.field input:user-valid:not([type=password]){border-color:var(--ok)}
.err{display:none;color:var(--warn);font-size:0.75rem;font-weight:600}
.field:has(:user-invalid) .err{display:block}
fieldset.radios{border:1px solid var(--border);border-radius:0.375rem;padding:0.5rem 0.75rem;margin:0;display:flex;gap:1rem;flex-wrap:wrap}
fieldset.radios legend{font-weight:700;font-size:0.78rem;padding:0 0.25rem}
fieldset.radios:has(:user-invalid){border-color:var(--warn)}
input[type="checkbox"][switch]{appearance:none;inline-size:2.25rem;block-size:1.25rem;border-radius:999px;background:var(--border);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
input[type="checkbox"][switch]::before{content:"";position:absolute;inset-block-start:0.125rem;inset-inline-start:0.125rem;inline-size:1rem;block-size:1rem;border-radius:50%;background:#fff;transition:translate .15s}
input[type="checkbox"][switch]:checked{background:var(--ok)}
input[type="checkbox"][switch]:checked::before{translate:1rem 0}
@media (prefers-reduced-motion:reduce){input[type="checkbox"][switch],input[type="checkbox"][switch]::before{transition:none}}

/* ===== Public pages and the workspace frame ===== */
.page{max-inline-size:72rem;margin:0 auto;padding:1.25rem clamp(0.75rem,3vw,2rem) 4rem;display:flex;flex-direction:column;gap:1.25rem;container:page / inline-size}
.cards{display:grid;gap:0.75rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr))}
.card{border:1px solid var(--border);border-radius:0.5rem;background:var(--card);padding:0.875rem 1rem;display:flex;flex-direction:column;gap:0.5rem;min-inline-size:0}
.card h3{font-size:0.95rem}
.card h3 a{color:inherit;text-decoration:none}
.card:has(h3 a:hover){border-color:var(--accent)}
.cols{display:grid;gap:1rem;grid-template-columns:minmax(0,1.6fr) minmax(16rem,1fr)}
@container page (max-width:50rem){.cols{grid-template-columns:1fr}}
.ws{display:grid;grid-template-columns:15rem minmax(0,1fr) 18rem;min-block-size:calc(100dvh - 9rem);border-block-start:1px solid var(--border);container:ws / inline-size}
.ws > *{min-inline-size:0}
.ws-list{border-inline-end:1px solid var(--border);background:var(--panel);padding:0.625rem;overflow:auto}
.ws-center{padding:1rem 1.25rem;display:flex;flex-direction:column;gap:1rem}
.ws-ctx{border-inline-start:1px solid var(--border);background:var(--panel);padding:0.75rem;display:flex;flex-direction:column;gap:0.75rem}
.ws-frame{opacity:0.55}
.ws-frame:hover{opacity:0.8}
.ws-add{outline:2px dashed var(--ok);outline-offset:3px;border-radius:0.375rem}
@media (max-width:62rem){.ws{grid-template-columns:1fr}.ws-list,.ws-ctx{border:0;border-block-end:1px solid var(--border)}}
.doc{display:flex;flex-direction:column;gap:0.25rem;padding:0.5rem 0.5rem;border-radius:0.375rem}
.doc + .doc{border-block-start:1px solid var(--border)}
.inventory td:first-child{white-space:nowrap}
#toast{position:fixed;left:50%;bottom:1.25rem;translate:-50% 0;padding:0.5rem 0.875rem;border-radius:0.5rem;background:var(--fg);color:var(--bg);font-size:0.78rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s;z-index:60}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (prefers-reduced-motion:no-preference){::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>

    <section class="card"><h2 style="font-size:0.9rem">할 수 있는 일</h2><div class="line"><span class="grow">문서 기여 <span class="muted small">계정 액터 → 지식베이스 액터로 <code>Offer</code></span>${g?`<br><span class="chip ok">원격 협력자 Grant 보유 · 승인 없음</span>`:""}</span><button type="button" class="btn pri" data-a="contribTheme" data-t="${t.n}" ${acct()?"":"disabled"}>기여</button></div>
    <div class="line"><span class="grow">원본 페이지</span><a class="btn ghost" href="https://${k.server}/kb/${k.rn}/" target="_blank" rel="noopener noreferrer">${ic("link")} 열기</a></div>
    <p class="muted small" style="margin:0">원격 지식베이스에서는 검토, 큐레이션, 유지보수, 모더레이터 역할을 가질 수 없습니다 ${ref("KD6")}.</p></section></div></div>`}
  const r=roleIn(k),cs=CONTRIBS.filter(c=>c.kb===k.n&&(c.st==="visible"||(can(k,"review")&&c.st==="hidden")));

    <div class="row">${r==="none"?`<button type="button" class="btn" data-a="join" data-n="${k.n}">가입 요청</button>`:""}${["member","collaborator","moderator","pending"].includes(r)?`<button type="button" class="btn" data-a="leave" data-n="${k.n}">탈퇴</button>`:""}
    <button type="button" class="btn pri" data-a="direct" data-n="${k.n}" ${can(k,"contribute_direct")?"":"disabled"} title="멤버만 직접 기여">직접 기여</button><button type="button" class="btn" data-a="fork" data-n="${k.n}" ${can(k,"fork")?"":"disabled"}>${ic("fork")} 포크</button>${can(k,"review")?`<a class="btn" href="#/settings/kb/${k.n}">${ic("wrench")} 검토 · 운영</a>`:""}<span class="grow"></span><span class="muted small">테마 <a href="#/themes/${t.n}">${esc(t.label)}</a></span></div>

  const list=`<div class="small muted" style="margin-block-end:0.375rem">문서 ${cs.length}</div>${cs.map(c=>`<div class="doc ws-add"><b class="small">${esc(c.title)}</b><span class="row small">${c.st==="hidden"?stChip("hidden"):""}<span class="muted">${c.by||"삭제된 계정"} · ${ORI[c.origin]}</span>${c.src?`<span class="chip remote">${ic("globe")} ${c.src}</span>`:""}</span></div>`).join("")}`;
  const ms=(MEMBERS[k.n]||[]).filter(m=>m.st==="active");
  const ctx=`<section class="ws-add card"><h2 style="font-size:0.85rem">멤버와 역할 ${ref("§6.2")}</h2>${ms.map(m=>`<div class="line small"><span class="grow">${m.a}</span><span class="chip">${ROLE[m.role]}</span></div>`).join("")}${GRANTS.filter(g=>g.kb===k.n).map(g=>`<div class="line small"><span class="grow">${g.a}</span><span class="chip remote">원격 협력자</span></div>`).join("")}</section>
   <details class="ws-add card"><summary><b class="small">내 권한 (${ROLE[r]})</b></summary>${tbl("권한",["권한","가능"],CAPS.map(c=>[`${c[2]} <code>${c[0]}</code>`,can(k,c[0])?`<span class="chip ok">${ic("check")} 가능</span>`:`<span class="chip">${r==="anon"&&c[0]!=="read"?"404":"403"}</span>`]))}</details>`;
  return `<div class="page" style="max-inline-size:none;padding-inline:0;gap:0"><div style="padding:0 1rem 1rem">${head}</div>${frameNote}${wsFrame(list,`<div class="ws-frame card"><b>${esc(k.label)}</b> 홈 · 그래프 · 리더 (구현된 작업 공간을 이 지식베이스에 고정해서 씀)</div><p class="muted small">기여는 기증입니다. 기여자가 떠나거나 계정을 지워도 남고, 기여 표시는 "삭제된 계정"이 됩니다 ${ref("CT7")}.</p>`,ctx)}</div>`;
}

    ${owner?`<span class="grow"></span>`+rowMenu("doc-"+d.id,d.title,[{a:"contribDoc",l:ficLike(d)?"이 테마에 기여":"이 문서 기여",icon:"inbox",d:{d:d.id},disabled:!!S.never[d.id]},{a:"never",l:S.never[d.id]?"기여 허용":"절대 기여 안 함",icon:"shield",d:{d:d.id}}]):""}</span></div>`}).join("")}`;

  return `<div class="page" style="max-inline-size:none;padding-inline:0;gap:0"><div style="padding:0 1rem 1rem" class="row"><h1 class="grow" style="font-size:1.1rem">@${u}의 개인 지식베이스 · 추가분</h1>${owner?`<button type="button" class="btn pri" data-a="ingest">${ic("plus")} 적재</button><span class="muted small">구현된 적재 단추(#addbtn)의 적재 창에 안내가 더해집니다</span>`:""}</div>${frameNote}${wsFrame(list,center,ctx)}</div>`;

<script>
"use strict";
/* ===================== Console: /settings/kb ===================== */
function tPersonal(){const u=S.persona,made=KBS.filter(k=>!k.server&&(MEMBERS[k.n]||[]).some(m=>m.a===acct()&&m.role==="moderator"&&m.st==="active"));
  return srow("개인 지식베이스 "+ref("CT1"),"계정마다 하나. 모든 적재가 여기로 옵니다.",kv([["경로",`<code>/@${u}/</code>`],["공개 범위",`${S.pub[u]?"공개":"비공개"} <button type="button" class="btn" data-a="togglePub">${S.pub[u]?"비공개로":"공개로"}</button>`],["지식 유형",`없음. 판정에서는 real로 다룹니다 ${ref("CT18")}`],["문서",myDocs().length+"건"]]))
   +srow("내가 운영하는 공유 지식베이스","모더레이터 역할이 있는 곳",(made.map(k=>`<div class="line">${k.icon}<a class="grow" href="#/kb/${k.n}">${esc(k.label)}</a>${typeChip(k.type)}<a class="btn" href="#/settings/kb/${k.n}">검토 · 운영</a></div>`).join("")||`<span class="muted">없음</span>`)+`<div><button type="button" class="btn pri" data-a="newKb">${ic("plus")} 공유 지식베이스 만들기</button> <span class="muted small">개수 제한 없음 ${ref("CT3")}</span></div>`)
   +srow("예전 「지식 테마 관리」","",`<p style="margin:0" class="small">기본이 아니던 테마는 공유 지식베이스가 되고, 옛 소유자가 첫 모더레이터가 됩니다 ${ref("CT6")}. <code>/settings/themes</code>의 기능은 이 섹션이 이어받습니다.</p>`,{m:"prop"});}
function tSubs(){const my=SUBS.filter(s=>s.o===S.persona);

      tbl("대상별 상태",["대상","상태",""],s.targets.map((g,i)=>{const k=kb(g.kb);return [`${k.icon} ${esc(k.label)} ${k.server?srvChip(k):""}${g.note?`<br><span class="muted small">${esc(g.note)}</span>`:""}`,stChip(g.st),
        (g.st==="pending"||g.st==="offered")?rowMenu(`sub-${s.id}-${i}`,k.label,[{a:"withdraw",l:"철회",icon:"close",d:{s:s.id,i}},...(g.st==="offered"?[{sep:1},{a:"simRemote",l:"목업: 원격 검토자 승인",icon:"play",d:{s:s.id,i}}]:[])]):""]}),{act:true}),{wide:true})}).join("")
   +`<p class="muted small">승인 뒤에는 철회할 수 없습니다 <code>409 contribution_approved</code> ${ref("CT7")}. 원격 대상은 그 서버의 검토자가 결정합니다 ${ref("연합 §12.1")}.</p>`;}
function tRule(){const r=rep(),ru=ruleOf(),state=!ru.on?"꺼짐":!S.auto?"서버 스위치로 멈춤":r.lv==="low"?"평판 low로 멈춤":"동작 중";
  return (S.auto?"":`<div class="note warn small">서버 스위치 <code>kb_auto_contribution</code>이 꺼져 있습니다. 규칙은 설정을 유지한 채 멈춥니다 ${ref("CT31")}</div>`)
   +srow("상태 "+ref("§9.9"),"계정마다 규칙 하나. 켜거나 범위를 넓히려면 최근 로그인이 필요합니다.",`<div class="row"><span class="chip ${state==="동작 중"?"ok":""}">${state}</span><span class="grow"></span><button type="button" class="btn" data-a="dryRun">미리 실행</button>${ru.on?`<button type="button" class="btn" data-a="ruleOff">즉시 멈춤</button>`:`<button type="button" class="btn accent" data-a="ruleOn" ${S.auto?"":"disabled"}>${ic("lock")} 규칙 켜기</button>`}</div>`)
   +srow("대상","",["memberships:내가 멤버 · 협력자 · 모더레이터인 공유 지식베이스","mutual:상호 협업 상대가 만든 공유 지식베이스","themes:이 규칙으로 따르는 테마의 공유 지식베이스 (다른 서버 포함, 양쪽 서버 스위치 필요)"].map(x=>{const[k,l]=x.split(":");return `<label class="row"><input type="checkbox" switch data-rule="${k}"${ru[k]?" checked":""}> ${l}</label>`}).join(""))
   +srow("문서 범위 "+ref("CS14"),"붙여넣은 텍스트와 \"절대 기여 안 함\" 문서는 절대 가지 않습니다. 실행 · 대상마다 최대 50건.",`<label class="row"><input type="checkbox" switch data-rule="uploads"${ru.uploads?" checked":""}> 업로드한 파일 문서 포함</label>`);}
function tRep(){const r=rep(),cd=myDocs().filter(counted);
  return srow("내 평판 "+ref("§8.6"),"본인, 검토자, 관리자만 봅니다. 읽기, 적재, 게시, 가입은 막지 않습니다.",`${repChip(r.lv)}${kpis([[r.share.toFixed(2),`가상 자료 비율 (${r.n}/${r.total}) · 0.2 limited · 0.5 low`],[r.rate.toFixed(2),`승인율 180일 · 결정 ${r.dec}건 · 0.5 미만 limited`],[{good:100,limited:20,low:5}[r.lv],"지식베이스당 대기 한도"]])}`)
   +srow("계산된 가상 자료 문서","fictional 공유 지식베이스에 기여해 표시되면 계산에서 빠집니다.",cd.map(d=>`<div class="line"><span class="grow">${esc(d.title)} <span class="muted small">→ ${esc(th(d.theme).label)}</span></span><button type="button" class="btn pri" data-a="contribDoc" data-d="${d.id}">이 테마에 기여</button></div>`).join("")||`<span class="muted">없음</span>`)
   +srow("수준별 효과","",tbl("수준별 효과",["효과","good","limited","low"],[["테마에 붙기","됨","됨, 뒤에 표시","안 됨"],["대기 기여 한도","100","20","5"],["검토 대기열 순서","먼저","good 뒤","마지막"],["협력자 · 상호 협업 기여","승인 없음","승인 없음","승인 대기"],["자동 기여","됨","10건","멈춤"]]),{wide:true});}
function tMem(){const u=S.persona,mem=KBS.filter(k=>!k.server&&membership(k)),mu=MUTUAL.filter(m=>m.a===u||m.b===u);

   +srow("상호 협업 "+ref("§9.10"),"두 계정의 합의. 한쪽이 공유 지식베이스를 만들면 다른 쪽이 바로 협력자가 됩니다. 서버 안의 교환이고, 다른 서버 계정과는 Grant로 동작합니다.",
     (mu.map(m=>{const o=m.a===u?m.b:m.a;return `<div class="line"><span class="grow">@${o}</span>${m.st==="active"?`<span class="chip ok">활성</span><button type="button" class="btn" data-a="muEnd" data-o="${o}">끝내기</button>`:m.req===u?`<span class="chip">요청함</span>`:`<span class="chip acc">요청 받음</span><button type="button" class="btn accent" data-a="muAccept" data-o="${o}">${ic("lock")} 수락</button>`}</div>`}).join("")||`<span class="muted">없음</span>`)+`<div><button type="button" class="btn" data-a="muReq">${ic("lock")} 상호 협업 요청</button></div>`);}

/* ===================== Console: /settings/kb/{number} ===================== */
const rvK=()=>kb(S.rkb);

  simDel:d=>{const c=CONTRIBS.find(x=>x.kb==d.n&&x.src&&x.st!=="removed"&&!x.gone);if(!c)return toast("원격에서 온 사본이 없습니다");c.st="hidden";c.gone="spam";log("ap",`Delete(Article) ← ${c.src}`);log("srv",`「${c.title}」: 즉시 숨김 + 검토 대기열`);S.tab[tabKey(SECS[2])]="queue";S.sel.queue=c.id;render()},
  curate:(d,el)=>{const k=rvK(),f=el.closest("form"),src=S.sel.csrc,sk=kb(+src),ids=$$("input[name=doc]:checked",f).map(x=>+x.value);if(!ids.length)return toast("문서를 고르세요");
    if(sk&&sk.server){log("ap",`서명된 GET https://${sk.server}/kb/${sk.rn}/… (문서 + 추출 결과)`);if(!sk.followed){sk.followed=true;log("ap",`Follow → ${sk.label} 액터 · ${sk.server}`)}}
    ids.forEach(i=>{const t=SOURCES[sk?sk.n:src][i];CONTRIBS.unshift({id:nid("c"),kb:k.n,title:t,by:sk?(sk.server?"@sora@"+sk.server:"@hana"):src,origin:"curation",st:"visible",src:sk&&sk.server?sk.server:undefined,curator:acct()});MODLOG.push([acct(),"curate",t])});
    log("srv",`POST /kb/${k.n}/curations → 사본 ${ids.length}건`);toast(`${ids.length}건을 큐레이션했습니다`);render()},
  mApprove:d=>{MEMBERS[S.rkb].find(m=>m.a===d.m).st="active";MODLOG.push([acct(),"approve_member",d.m]);render()},
  mBan:d=>{const m=MEMBERS[S.rkb].find(m=>m.a===d.m);m.st="banned";m.role="member";MODLOG.push([acct(),"ban_member",d.m]);log("srv",`${d.m} 차단: 읽기와 포크만`);render()},
  mUnban:d=>{MEMBERS[S.rkb]=MEMBERS[S.rkb].filter(m=>m.a!==d.m);MODLOG.push([acct(),"remove_member",d.m]);render()},
  mGrant:d=>stepUp(`${d.m}에게 협력자 역할 주기`,()=>{MEMBERS[S.rkb].find(m=>m.a===d.m).role="collaborator";MODLOG.push([acct(),"grant_collaborator",d.m])}),
  mRevoke:d=>stepUp(`${d.m}의 협력자 역할 빼기`,()=>{MEMBERS[S.rkb].find(m=>m.a===d.m).role="member";MODLOG.push([acct(),"revoke_collaborator",d.m])}),
  gGrant:(d,el)=>{const inp=$("#g-acct");if(!inp.reportValidity())return;const a=inp.value.trim();stepUp(`${a}에게 원격 협력자 Grant`,()=>{GRANTS.push({kb:S.rkb,a,until:"2027-05-17"});MODLOG.push([acct(),"grant_collaborator",a]);log("ap",`Grant(context=지식베이스, target=${a}, object=collaborator, 6개월) → ${a}`)})},
  gRevoke:d=>stepUp(`${d.g}의 Grant 회수`,()=>{GRANTS=GRANTS.filter(g=>!(g.kb==S.rkb&&g.a===d.g));MODLOG.push([acct(),"revoke_collaborator",d.g]);log("ap",`Revoke(Grant) → ${d.g}`)}),
  saveKb:(d,el)=>{const f=el.closest("form");if(!f.reportValidity())return;const k=rvK();k.label=f.querySelector("#ks-label").value.trim();k.desc=f.querySelector("#ks-desc").value;k.type=f.querySelector("input[name=ks-type]:checked").value;k.policy=f.querySelector("#ks-policy").value;MODLOG.push([acct(),"update_settings",k.label]);toast("저장했습니다");render()},
  archive:()=>toast("목업: 보관하면 읽기 전용이 됩니다"),
  setMod:d=>stepUp(`#${d.n} 모더레이터 지정`,()=>log("srv",`PUT /api/admin/kb/${d.n}/moderators/{account} (admin_audit)`)),
  retry:d=>{kb(d.n).fail=0;log("srv","실패한 병합 다시 시도 → 완료");render()},
  delKb:d=>{const k=kb(d.n);openDialog({title:`${ic("trash")} 삭제 미리 실행: ${esc(k.label)}`,body:`${kpis([[k.docs,"문서"],[CONTRIBS.filter(c=>c.kb===k.n).length,"기여"],[(MEMBERS[k.n]||[]).length,"멤버십"]])}<p class="muted small" style="margin:0">미리 실행 결과입니다. 실제 삭제는 관리자만, 최근 로그인 뒤에 하고 되돌릴 수 없습니다.</p>`,foot:[{v:"",l:"닫기",autofocus:true},{v:"ok",l:"삭제…",cls:"danger"}],onClose:v=>{if(v==="ok")stepUp(`#${k.n} 삭제`,()=>{
      KBS=KBS.filter(x=>x!==k);delete MEMBERS[k.n];CONTRIBS=CONTRIBS.filter(c=>c.kb!==k.n);QUEUE=QUEUE.filter(q=>q.kb!==k.n);GRANTS=GRANTS.filter(g=>g.kb!==k.n);
      SUBS.forEach(s=>s.targets=s.targets.filter(t=>t.kb!==k.n));if(S.rkb===k.n)S.rkb=reviewable()[0]?.n||null;
      log("srv",`DELETE /kb/${k.n}/?apply=true (purge: 문서, 기여, 멤버십, 대기 기여)`)})}})},
  runJudge:()=>{S.lastRun="방금";log("srv","주제 판정: 시그니처 → 군집 → 테마 시그니처 → 문서 매치 → 평판 → 자동 기여. 조정은 유지");render()},
  saveThr:(d,el)=>{const f=el.closest("form");if(!f.reportValidity())return;["theme","doc","seed","auto"].forEach(k=>S.thr[k]=+f.querySelector("#thr-"+k).value);toast("임계값을 저장했습니다");render()},
  lock:d=>{const t=th(d.t);t.locked=!t.locked;render()},
  pin:d=>{const k=kb(d.n);k.pinned=!k.pinned;log("srv",`theme_knowledge_bases.pinned = ${k.pinned?1:0}`);render()},
  exclude:d=>{const k=kb(d.n);log("srv",`theme_knowledge_bases.excluded = 1 (#${d.t})`);toast(`${k.label}: 다음 실행부터 이 테마에서 빠집니다`)},
  merge:d=>{const t=th(d.t),others=THEMES.filter(x=>x.n!=t.n&&x.type===t.type);openDialog({title:`${ic("merge")} 테마 병합`,body:`<p style="margin:0"><b>${esc(t.label)}</b>를 다른 테마에 합칩니다. 멤버는 대상에 고정되고 <code>/themes/${t.n}</code>는 308으로 대상에 갑니다. 지식 유형이 다른 테마는 고를 수 없습니다.</p>${field({id:"mg-to",label:"대상 테마",err:"대상을 고르세요.",input:`<select required><option value="">고르세요</option>${others.map(x=>`<option value="${x.n}">${esc(x.label)}</option>`).join("")}</select>`})}`,foot:[{v:"",l:"취소"},{v:"ok",l:"병합",cls:"pri"}],onClose:(v,f)=>{if(v==="ok")log("srv",`POST /api/admin/themes/${t.n}/merge → #${f.querySelector("#mg-to").value}`)}})},
  swAuto:(d,el,e)=>{e.preventDefault();stepUp(`kb_auto_contribution ${S.auto?"끄기":"켜기"}`,()=>{S.auto=!S.auto;log("srv",`server_settings.kb_auto_contribution = ${S.auto?"on":"off"} (admin_audit)`)})},
  block:d=>stepUp(`${d.d} 도메인 차단`,()=>{SERVERS=SERVERS.filter(s=>s.d!==d.d);BLOCKS.push({d:d.d,when:"2026-11-17"});S.sel.srv=null;log("srv",`${d.d} 차단: 읽기와 쓰기 중단, 사본은 유지`)}),
  unblock:d=>stepUp(`${d.d} 차단 해제`,()=>{BLOCKS=BLOCKS.filter(b=>b.d!==d.d)}),
  addServer:()=>{const inp=$("#add-d");if(!inp.reportValidity())return;A.addSug({d:inp.value.trim().toLowerCase()})},
  addSug:d=>stepUp(`${d.d} 알려진 서버로 추가`,()=>{SUGGESTIONS=SUGGESTIONS.filter(s=>s.d!==d.d);SERVERS.push({d:d.d,name:d.d,sw:"Claire Bible 0.27",how:"관리자가 도메인을 추가함",kbs:0,last:"방금",err:0});S.sel.srv=d.d;log("ap",`서명된 GET https://${d.d}/nodeinfo, 서버 액터, /kb 컬렉션 (첫 접촉: 전체 읽기)`)}),
  replay:d=>{const j=JOURNAL.find(x=>x.id===d.j);j.st="processed";log("srv",`저널 ${j.id} 다시 처리 (활동 IRI가 키, 멱등)`);render()}
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el||el.disabled)return;const f=A[el.dataset.a];if(!f)return;
  if(el.tagName!=="INPUT")e.preventDefault();
  // A command in a menu closes the menu and returns the focus to its trigger before it runs (menu guide).
  if(el.closest(".menu-pop"))closeMenuOf(el);
  f(el.dataset,el,e);
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="persona"){S.persona=t.value;S.rkb=reviewable()[0]?.n||null;render()}
  else if(t.id==="mode"){S.mode=t.value;log("srv",`서버 모드 = ${S.mode}`);render()}
  else if(t.id==="rkb"){location.hash="#/settings/kb/"+t.value}
  else if(t.dataset.filter){S.filter[t.dataset.filter]=t.value;render()}
  else if(t.dataset.rule){const ru=ruleOf(),k=t.dataset.rule;if(t.checked&&ru.on){t.checked=false;stepUp("자동 기여 규칙 범위 넓히기",()=>{ru[k]=true})}else ru[k]=t.checked}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.maxItems){const n=t.value.split(",").map(x=>x.trim()).filter(Boolean).length;t.setCustomValidity(n>+t.dataset.maxItems?"too many":"")}});
$("#nav-drawer").addEventListener("click",e=>{if(e.target.closest("a"))$("#nav-drawer").close()});
$("#themebtn").addEventListener("click",()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark"});

/* ===================== Command palette (indexes only what the viewer can see, CL11) ===================== */
const cmd=$("#cmdpalette"),cmdIn=$("#cmd-input"),cmdList=$("#cmd-list");let cmdItems=[],cmdAt=0;
function cmdIndex(){const out=[["/_index","미구현 목록","프로토타입"],["/","루트 페이지","공개 화면"],["/themes","테마 컬렉션","공개 화면"],["/kb","공유 지식베이스","공개 화면"]];
  THEMES.forEach(t=>out.push([`/themes/${t.n}`,t.label,"테마"]));KBS.forEach(k=>out.push([`/kb/${k.n}`,k.label,k.server?k.server:"공유 지식베이스"]));
  if(acct()){out.push(["/@me","내 개인 지식베이스","작업 공간"]);visSecs().forEach(s=>{const p=secPath(s);out.push([p,s.n,"콘솔"]);s.tabs().forEach(t=>out.push([`${p}?tab=${t[0]}`,`${s.n} › ${t[1].replace(/<[^>]+>/g,"").replace(/\s\d+$/,"")}`,"탭"]))})}
  return out}
function cmdRender(){const q=cmdIn.value.trim().toLowerCase();cmdItems=cmdIndex().filter(([p,l,g])=>!q||(p+" "+l+" "+g).toLowerCase().includes(q)).slice(0,40);cmdAt=Math.min(cmdAt,Math.max(0,cmdItems.length-1));
  cmdList.innerHTML=cmdItems.map(([p,l,g],i)=>`<li role="option" id="cmd-${i}" aria-selected="${i===cmdAt}" data-i="${i}">${esc(l)} <span class="chip">${esc(g)}</span><small>${esc(p)}</small></li>`).join("")||`<li class="empty">맞는 항목이 없습니다</li>`;
  if(cmdItems.length){cmdIn.setAttribute("aria-activedescendant","cmd-"+cmdAt);$("#cmd-"+cmdAt).scrollIntoView({block:"nearest"})}else cmdIn.removeAttribute("aria-activedescendant")}
function cmdGo(i){const it=cmdItems[i];if(!it)return;cmd.close();location.hash="#"+it[0]}
function openPalette(){cmdIn.value="";cmdAt=0;cmdRender();cmd.showModal();cmdIn.focus()}
$("#palettetrigger").addEventListener("click",openPalette);
cmdIn.addEventListener("input",()=>{cmdAt=0;cmdRender()});
cmdIn.addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();cmdAt=(cmdAt+(e.key==="ArrowDown"?1:-1)+cmdItems.length)%Math.max(1,cmdItems.length);cmdRender()}else if(e.key==="Enter"){e.preventDefault();cmdGo(cmdAt)}});
cmdList.addEventListener("click",e=>{const li=e.target.closest("[data-i]");if(li)cmdGo(+li.dataset.i)});
document.addEventListener("keydown",e=>{if(e.key!=="/"||e.ctrlKey||e.metaKey||e.altKey)return;const a=document.activeElement;if(a&&(a.matches("input,textarea,select,[contenteditable]")))return;if($$("dialog[open]").length)return;e.preventDefault();openPalette()});

/* ===================== Start ===================== */
$("#persona").innerHTML=Object.entries(PERSONAS).map(([k,p])=>`<option value="${k}"${k===S.persona?" selected":""}>${p.label}</option>`).join("");
S.rkb=reviewable()[0]?.n||null;
enhance(document.querySelector(".appbar"));
if(!HAS_INVOKER){$("#flowbtn").addEventListener("click",e=>{e.preventDefault();$("#flow").togglePopover()})}
render();
