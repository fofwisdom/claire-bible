openapi: "3.1.0"
info:
  title: "Claire Bible Public API"
  version: "1.0.0"
  description: "Versioned public REST API (`/api/v1/*`) for Claire Bible knowledge bases, documents, personal KB ingestion, and canonical graph exploration.\n\n## Authentication\n- **OAuth 2.1 (`OAuth2`)**: Authorization Code flow with PKCE (`S256`) via `/oauth/authorize` and `/oauth/token` using scopes `readonly` and `write`.\n- **Bearer Token (`BearerAuth`)**: OAuth 2.1 access token in `Authorization: Bearer <token>`.\n- **Same-Origin Browser Session (`SessionCookie`)**: `__Host-claire_session` cookie.\n\n## Model Context Protocol (`/mcp`)\nConnect MCP clients to `POST /mcp` using OAuth 2.1 Bearer authentication. Available read (`readonly`) and write (`write`) tools include `kb_list`, `kb_overview`, `entity_search`, `entity_get`, `graph_neighbors`, `graph_path`, `graph_context`, `doc_list`, `doc_get`, `contrib_candidates`, `contrib_submit`, and client-extraction tools (`extract_spec`, `extract_stage`, `extract_sources`, `extract_claim`, `extract_renew`, `extract_get_source`, `extract_submit`)."
  license:
    name: MIT
    url: "https://opensource.org/licenses/MIT"
servers:
  - url: "/"
    description: "Current host root"
tags:
  - name: "System & Identity"
    description: "Health checks and caller authentication metadata."
  - name: "Knowledge Bases"
    description: "Knowledge base discovery, metadata, lifecycle, and themes."
  - name: "Documents & Ingest"
    description: "Document listing, details, raw/Markdown export, curation, and personal KB ingestion."
  - name: "Graph & Search"
    description: "Canonical entity/relation graph queries, neighborhood expansion, shortest path, and search."
  - name: "Shared KB Collaboration"
    description: "Direct contributions, review actions, and membership management for shared knowledge bases."
  - name: "Client Extraction"
    description: "Zero-LLM personal KB staging, lease claims, and verified extraction submission."
  - name: "Federation & Feeds"
    description: "ActivityPub publishing/retraction and personal feed subscriptions and ingestion."
  - name: "Account & Support"
    description: "Account OAuth 2.1 grant management and diagnostic support bundles."
  - name: "OAuth 2.1"
    description: "OAuth 2.1 metadata, dynamic client registration, PKCE authorization, token exchange, revocation, and device flow."
paths:
  "/api/v1/health":
    get:
      tags:
        - "System & Identity"
      summary: "Service liveness and database readiness"
      description: "Return service liveness, database readiness status, and API version."
      operationId: v1CheckHealth
      x-claire-access: public
      x-claire-surface: system
      x-claire-capability: "none"
      security: []
      responses:
        "200":
          description: "Service liveness and database readiness"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthResponse"
        "503":
          description: "Service unavailable."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/me":
    get:
      tags:
        - "System & Identity"
      summary: "Current authenticated scope and role"
      description: "Return the credential scope, server mode, caller relation, and admin flag without exposing usernames."
      operationId: v1GetMe
      x-claire-access: read
      x-claire-surface: system
      x-claire-capability: "none"
      security:
        - OAuth2:
            - readonly
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "Current authenticated scope and role"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MeResponse"
        "401":
          description: "Authentication required or invalid credential."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/kbs":
    get:
      tags:
        - "Knowledge Bases"
      summary: "List knowledge bases"
      description: "List visible shared knowledge bases with keyset pagination, plus the caller's personal KB when applicable."
      operationId: v1ListKbs
      x-claire-access: read
      x-claire-surface: system
      x-claire-capability: "none"
      security:
        - OAuth2:
            - readonly
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "List knowledge bases"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KnowledgeBaseListResponse"
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      parameters:
        - name: knowledge_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - real
              - fictional
          description: "Filter by knowledge type."
        - name: joined
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
          description: "Filter to joined shared knowledge bases."
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: "Opaque keyset pagination cursor."
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: "Maximum items per page (1-100)."
    post:
      tags:
        - "Knowledge Bases"
      summary: "Create a shared knowledge base"
      description: "Create a new shared knowledge base owned by the server community with the caller as founding moderator."
      operationId: v1CreateKb
      x-claire-access: owner
      x-claire-surface: system
      x-claire-capability: "none"
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "201":
          description: "Create a shared knowledge base"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KnowledgeBaseDetailResponse"
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Authentication required or invalid credential."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Insufficient scope or knowledge base capability."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "422":
          description: "Request payload failed schema validation."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateKnowledgeBaseRequest"
  "/api/v1/themes":
    get:
      tags:
        - "Knowledge Bases"
      summary: "List themes"
      description: "List themes with keyset pagination and optional knowledge_type filter."
      operationId: v1ListThemes
      x-claire-access: read
      x-claire-surface: system
      x-claire-capability: "none"
      security:
        - OAuth2:
            - readonly
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "List themes"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ThemeListResponse"
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      parameters:
        - name: knowledge_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - real
              - fictional
          description: "Filter by knowledge type."
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: "Opaque keyset pagination cursor."
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: "Maximum items per page (1-100)."
  "/api/v1/kbs/personal/ingest":
    post:
      tags:
        - "Documents & Ingest"
      summary: "Ingest a source into the caller's personal KB"
      description: "Ingest a URL or text into the caller's personal KB using explicit extraction_mode ('provider' or 'client')."
      operationId: v1IngestPersonal
      x-claire-access: write
      x-claire-surface: system
      x-claire-capability: write
      security:
        - OAuth2:
            - write
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "Ingest a source into the caller's personal KB"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IngestResponse"
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Authentication required or invalid credential."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Insufficient scope or knowledge base capability."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "422":
          description: "Request payload failed schema validation."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "429":
          description: "Rate or concurrency limit exceeded."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/IngestRequest"
  "/api/v1/kbs/personal/ingest/stream":
    post:
      tags:
        - "Documents & Ingest"
      summary: "Ingest a source into the personal KB with NDJSON progress stream"
      description: "Stream ingestion progress events and the final report as newline-delimited JSON."
      operationId: v1IngestPersonalStream
      x-claire-access: write
      x-claire-surface: system
      x-claire-capability: write
      security:
        - OAuth2:
            - write
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "Ingest a source into the personal KB with NDJSON progress stream"
          content:
            application/x-ndjson:
              schema:
                type: string
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Authentication required or invalid credential."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Insufficient scope or knowledge base capability."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "422":
          description: "Request payload failed schema validation."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "429":
          description: "Rate or concurrency limit exceeded."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/IngestRequest"
  "/api/v1/kbs/{kb}":
    get:
      tags:
        - "Knowledge Bases"
      summary: "Get knowledge base metadata and counts"
      description: "Return knowledge base metadata, document/entity/relation counts, and available ingest modes for writers."
      operationId: v1GetKb
      x-claire-access: read
      x-claire-surface: system
      x-claire-capability: read
      security:
        - OAuth2:
            - readonly
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "Get knowledge base metadata and counts"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KnowledgeBaseDetailResponse"
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Resource not found or inaccessible."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      parameters:
        - name: kb
          in: path
          required: true
          schema:
            type: string
          description: "Knowledge base selector: 'personal' for the authenticated caller's personal KB, or an 18-digit external KB number."
    patch:
      tags:
        - "Knowledge Bases"
      summary: "Update knowledge base settings"
      description: "Partially update settings on the selected knowledge base."
      operationId: v1UpdateKb
      x-claire-access: owner
      x-claire-surface: system
      x-claire-capability: settings
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "Update knowledge base settings"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KnowledgeBaseDetailResponse"
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Insufficient scope or knowledge base capability."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Resource not found or inaccessible."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "422":
          description: "Request payload failed schema validation."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      parameters:
        - name: kb
          in: path
          required: true
          schema:
            type: string
          description: "Knowledge base selector: 'personal' for the authenticated caller's personal KB, or an 18-digit external KB number."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateKnowledgeBaseRequest"
    delete:
      tags:
        - "Knowledge Bases"
      summary: "Delete a shared knowledge base (dry-run by default)"
      description: "Preview or execute deletion of a shared knowledge base. Requires step-up session auth and ?apply=true to commit."
      operationId: v1DeleteKb
      x-claire-access: admin
      x-claire-surface: system
      x-claire-capability: delete
      security:
        - SessionCookie: []
      responses:
        "200":
          description: "Delete a shared knowledge base (dry-run by default)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeleteKnowledgeBaseResponse"
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "401":
          description: "Authentication required or invalid credential."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Insufficient scope or knowledge base capability."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Resource not found or inaccessible."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      x-claire-step-up: true
      parameters:
        - name: kb
          in: path
          required: true
          schema:
            type: string
          description: "Knowledge base selector: 'personal' for the authenticated caller's personal KB, or an 18-digit external KB number."
        - name: apply
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
          description: "Set 'true' to execute deletion; otherwise returns dry-run plan."
  "/api/v1/kbs/{kb}/documents":
    get:
      tags:
        - "Documents & Ingest"
      summary: "List documents in a knowledge base"
      description: "List documents using opaque keyset cursor pagination and filters."
      operationId: v1ListDocuments
      x-claire-access: read
      x-claire-surface: system
      x-claire-capability: read
      security:
        - OAuth2:
            - readonly
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "List documents in a knowledge base"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DocumentListResponse"
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Resource not found or inaccessible."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      parameters:
        - name: kb
          in: path
          required: true
          schema:
            type: string
          description: "Knowledge base selector: 'personal' for the authenticated caller's personal KB, or an 18-digit external KB number."
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: "Opaque keyset pagination cursor."
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: "Maximum items per page (1-300)."
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: "Filter by title or summary substring (max 200 chars)."
        - name: pinned
          in: query
          required: false
          schema:
            type: boolean
          description: "Filter by pinned status."
        - name: hidden
          in: query
          required: false
          schema:
            type: boolean
          description: "Filter by hidden status."
        - name: detail
          in: query
          required: false
          schema:
            type: string
            enum:
              - missing
              - mismatched
          description: "Filter by detail completeness."
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: "Filter to specific document IDs (repeatable, max 100)."
  "/api/v1/kbs/{kb}/documents/{doc_id}":
    get:
      tags:
        - "Documents & Ingest"
      summary: "Get document detail, entities, and permalink"
      description: "Return document metadata, summary, AsciiDoc detail, canonical entities, and permalink."
      operationId: v1GetDocument
      x-claire-access: read
      x-claire-surface: system
      x-claire-capability: read
      security:
        - OAuth2:
            - readonly
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "Get document detail, entities, and permalink"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DocumentDetailResponse"
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Resource not found or inaccessible."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      parameters:
        - name: kb
          in: path
          required: true
          schema:
            type: string
          description: "Knowledge base selector: 'personal' for the authenticated caller's personal KB, or an 18-digit external KB number."
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
          description: "Document identifier (e.g. doc_0123456789ab)."
    patch:
      tags:
        - "Documents & Ingest"
      summary: "Update document metadata flags"
      description: "Partially update title, pinned, hidden, or seen flags on a document."
      operationId: v1UpdateDocument
      x-claire-access: owner
      x-claire-surface: system
      x-claire-capability: curate
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "Update document metadata flags"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UpdateDocumentResponse"
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Insufficient scope or knowledge base capability."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Resource not found or inaccessible."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "422":
          description: "Request payload failed schema validation."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      parameters:
        - name: kb
          in: path
          required: true
          schema:
            type: string
          description: "Knowledge base selector: 'personal' for the authenticated caller's personal KB, or an 18-digit external KB number."
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
          description: "Document identifier (e.g. doc_0123456789ab)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateDocumentRequest"
    delete:
      tags:
        - "Documents & Ingest"
      summary: "Delete a document from a personal KB"
      description: "Cascade-delete a document from a personal KB (shared KB documents must be removed via contribution removal)."
      operationId: v1DeleteDocument
      x-claire-access: owner
      x-claire-surface: system
      x-claire-capability: remove
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "Delete a document from a personal KB"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeleteDocumentResponse"
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "403":
          description: "Insufficient scope or knowledge base capability."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Resource not found or inaccessible."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      parameters:
        - name: kb
          in: path
          required: true
          schema:
            type: string
          description: "Knowledge base selector: 'personal' for the authenticated caller's personal KB, or an 18-digit external KB number."
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
          description: "Document identifier (e.g. doc_0123456789ab)."
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "Preview cascade impact without deleting."
        - name: tombstone
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: "Record tombstone to prevent re-ingestion."
        - name: reason
          in: query
          required: false
          schema:
            type: string
          description: "Audit reason for deletion."
  "/api/v1/kbs/{kb}/documents/{doc_id}/raw":
    get:
      tags:
        - "Documents & Ingest"
      summary: "Download or view raw document source file"
      description: "Serve the archived original uploaded file for a document with strict sandbox headers."
      operationId: v1GetDocumentRaw
      x-claire-access: read
      x-claire-surface: system
      x-claire-capability: read
      security:
        - OAuth2:
            - readonly
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "Download or view raw document source file"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Resource not found or inaccessible."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "409":
          description: "Resource state conflict."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      parameters:
        - name: kb
          in: path
          required: true
          schema:
            type: string
          description: "Knowledge base selector: 'personal' for the authenticated caller's personal KB, or an 18-digit external KB number."
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
          description: "Document identifier (e.g. doc_0123456789ab)."
  "/api/v1/kbs/{kb}/documents/{doc_id}/export":
    get:
      tags:
        - "Documents & Ingest"
      summary: "Export document as Markdown"
      description: "Export a document as a Markdown file with YAML front matter."
      operationId: v1ExportDocument
      x-claire-access: read
      x-claire-surface: system
      x-claire-capability: read
      security:
        - OAuth2:
            - readonly
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: "Export document as Markdown"
          content:
            text/markdown:
              schema:
                type: string
        "400":
          description: "Invalid request parameters or JSON body."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        "404":
          description: "Resource not found or inaccessible."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      parameters:
        - name: kb
          in: path
          required: true
