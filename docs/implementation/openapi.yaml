  "/oauth/register":
    post:
      tags:
        - "OAuth 2.1"
      summary: "Register OAuth 2.1 dynamic client"
      description: "Register a public or confidential OAuth 2.1 client under RFC 7591."
      operationId: oauth_register_client
      x-claire-access: public
      x-claire-surface: system
      x-claire-capability: "none"
      security: []
      responses:
        "201":
          description: "Register OAuth 2.1 dynamic client"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Invalid OAuth 2.1 request parameters."
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: true
        description: "Dynamic client registration metadata including client_name and redirect_uris."
        content:
          application/json:
            schema:
              type: object
  "/oauth/authorize":
    get:
      tags:
        - "OAuth 2.1"
      summary: "Start OAuth 2.1 PKCE authorization"
      description: "Validate PKCE S256 authorization code parameters and present user consent or redirect with code."
      operationId: oauth_authorize_start
      x-claire-access: public
      x-claire-surface: system
      x-claire-capability: "none"
      security: []
      responses:
        "200":
          description: "Start OAuth 2.1 PKCE authorization"
          content:
            text/html:
              schema:
                type: string
        "400":
          description: "Invalid OAuth 2.1 request parameters."
          content:
            application/json:
              schema:
                type: object
      parameters:
        - name: response_type
          in: query
          required: true
          description: "Must be 'code'."
          schema:
            type: string
        - name: client_id
          in: query
          required: true
          description: "Registered OAuth 2.1 client identifier."
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          description: "Registered callback URI."
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          description: "Base64url SHA-256 PKCE code challenge."
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          description: "Must be 'S256'."
          schema:
            type: string
        - name: scope
          in: query
          required: false
          description: "Space-separated scopes: readonly or write."
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: "Opaque CSRF protection state value."
          schema:
            type: string
  "/oauth/token":
    post:
      tags:
        - "OAuth 2.1"
      summary: "Exchange authorization code or refresh token"
      description: "Issue Bearer access and refresh tokens via authorization_code (PKCE S256), refresh_token, device_code, or token-exchange."
      operationId: oauth_exchange_token
      x-claire-access: public
      x-claire-surface: system
      x-claire-capability: "none"
      security: []
      responses:
        "200":
          description: "Exchange authorization code or refresh token"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Invalid OAuth 2.1 request parameters."
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: true
        description: "OAuth 2.1 token grant parameters."
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
  "/oauth/revoke":
    post:
      tags:
        - "OAuth 2.1"
      summary: "Revoke OAuth 2.1 access or refresh token"
      description: "Revoke an issued access or refresh token under RFC 7009."
      operationId: oauth_revoke_token
      x-claire-access: public
      x-claire-surface: system
      x-claire-capability: "none"
      security: []
      responses:
        "200":
          description: "Revoke OAuth 2.1 access or refresh token"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Invalid OAuth 2.1 request parameters."
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: true
        description: "Token revocation payload containing token and optional token_type_hint."
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
  "/oauth/device_authorization":
    post:
      tags:
        - "OAuth 2.1"
      summary: "Start OAuth 2.1 device authorization grant"
      description: "Issue device_code and user_code under RFC 8628 for headless CLI or device clients."
      operationId: oauth_device_authorization
      x-claire-access: public
      x-claire-surface: system
      x-claire-capability: "none"
      security: []
      responses:
        "200":
          description: "Start OAuth 2.1 device authorization grant"
          content:
            application/json:
              schema:
                type: object
        "400":
          description: "Invalid OAuth 2.1 request parameters."
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: true
        description: "Device authorization parameters including client_id and optional scope."
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
components:
  schemas:
    AccountRefSummary:
      additionalProperties: false
      description: "Public account reference without private internals."
      properties:
        account:
          title: Account
          type: string
        display_name:
          title: "Display Name"
          type: string
      required:
        - account
        - display_name
      title: AccountRefSummary
      type: object
    ContributionDetailResponse:
      additionalProperties: false
      description: "Response for contribution mutations."
      properties:
        contribution:
          anyOf:
            - "$ref": "#/components/schemas/ContributionSummary"
            - type: "null"
          default: null
      title: ContributionDetailResponse
      type: object
    ContributionListResponse:
      additionalProperties: false
      description: "Paginated response for `GET /api/v1/kbs/{kb}/contributions`."
      properties:
        items:
          items:
            "$ref": "#/components/schemas/ContributionSummary"
          title: Items
          type: array
        next_cursor:
          anyOf:
            - type: string
            - type: "null"
          title: "Next Cursor"
        total:
          title: Total
          type: integer
      required:
        - items
        - next_cursor
        - total
      title: ContributionListResponse
      type: object
    ContributionOfferSummary:
      additionalProperties: false
      description: "Federation offer details for a remote contribution."
      properties:
        actor:
          anyOf:
            - type: string
            - type: "null"
          default: null
          title: Actor
        server:
          title: Server
          type: string
        with_grant:
          title: "With Grant"
          type: boolean
        grant_valid:
          title: "Grant Valid"
          type: boolean
      required:
        - server
        - with_grant
        - grant_valid
      title: ContributionOfferSummary
      type: object
    ContributionOriginRemovedInfo:
      additionalProperties: false
      description: "Origin removal notice attached to a contribution."
      properties:
        at:
          title: At
          type: number
        reason:
          anyOf:
            - type: string
            - type: "null"
          default: null
          title: Reason
        waiting:
          title: Waiting
          type: boolean
      required:
        - at
        - waiting
      title: ContributionOriginRemovedInfo
      type: object
    ContributionRemoteInfo:
      additionalProperties: false
      description: "Remote origin metadata for a federated contribution."
      properties:
        document:
          title: Document
          type: string
        knowledge_base:
          anyOf:
            - type: string
            - type: "null"
          default: null
          title: "Knowledge Base"
        credit:
          anyOf:
            - type: string
            - type: "null"
          default: null
          title: Credit
      required:
        - document
      title: ContributionRemoteInfo
      type: object
    ContributionReputationSummary:
      additionalProperties: false
      description: "Contributor reputation level and approval rate."
      properties:
        level:
          title: Level
          type: string
        approval_rate:
          anyOf:
            - type: number
            - type: "null"
          default: null
          title: "Approval Rate"
      required:
        - level
      title: ContributionReputationSummary
      type: object
    ContributionRevisionSummary:
      additionalProperties: false
      description: "Revision history entry of a contribution."
      properties:
        document_id:
          title: "Document Id"
          type: string
        state:
          title: State
          type: string
        created_at:
          title: "Created At"
          type: number
      required:
        - document_id
        - state
        - created_at
      title: ContributionRevisionSummary
      type: object
    ContributionSummary:
      additionalProperties: false
      description: "Canonical representation of one contribution to a shared KB."
      properties:
        number:
          title: Number
          type: string
        document_id:
          anyOf:
            - type: string
            - type: "null"
          default: null
          title: "Document Id"
        title:
          anyOf:
            - type: string
            - type: "null"
          default: null
          title: Title
        origin:
          title: Origin
          type: string
        state:
          title: State
          type: string
        contributor:
          anyOf:
            - "$ref": "#/components/schemas/AccountRefSummary"
            - type: "null"
          default: null
        approved:
          title: Approved
          type: boolean
        approved_at:
          anyOf:
            - type: number
            - type: "null"
          default: null
          title: "Approved At"
        updates_stopped:
          title: "Updates Stopped"
          type: boolean
        contributed_at:
          title: "Contributed At"
          type: number
        revised_at:
          anyOf:
            - type: number
            - type: "null"
          default: null
          title: "Revised At"
        remote:
          anyOf:
            - "$ref": "#/components/schemas/ContributionRemoteInfo"
            - type: "null"
          default: null
        origin_removed:
          anyOf:
            - "$ref": "#/components/schemas/ContributionOriginRemovedInfo"
            - type: "null"
          default: null
        reason:
          anyOf:
            - type: string
            - type: "null"
          default: null
          title: Reason
        revisions:
          anyOf:
            - items:
                "$ref": "#/components/schemas/ContributionRevisionSummary"
              type: array
            - type: "null"
          default: null
          title: Revisions
        offer:
          anyOf:
            - "$ref": "#/components/schemas/ContributionOfferSummary"
            - type: "null"
          default: null
        contributor_reputation:
          anyOf:
            - "$ref": "#/components/schemas/ContributionReputationSummary"
            - type: "null"
          default: null
        review_help:
          anyOf:
            - additionalProperties: true
              type: object
            - type: "null"
          default: null
          title: "Review Help"
      required:
        - number
        - origin
        - state
        - approved
        - updates_stopped
        - contributed_at
      title: ContributionSummary
      type: object
    CreateContributionRequest:
      additionalProperties: false
      description: "Request body for `POST /api/v1/kbs/{kb}/contributions`."
      properties:
        document_id:
          maxLength: 128
          minLength: 1
          title: "Document Id"
          type: string
      required:
        - document_id
      title: CreateContributionRequest
      type: object
    CreateFeedRequest:
      additionalProperties: false
      description: "Request body for `POST /api/v1/feeds`."
      properties:
        url:
          minLength: 1
          title: Url
          type: string
        title:
          default: ""
          title: Title
          type: string
        folder:
          default: ""
          title: Folder
          type: string
      required:
        - url
      title: CreateFeedRequest
      type: object
    CreateKnowledgeBaseRequest:
      additionalProperties: false
      description: "Request body for `POST /api/v1/kbs`."
      properties:
        label:
          maxLength: 200
          minLength: 1
          title: Label
          type: string
        knowledge_type:
          enum:
            - real
            - fictional
          title: "Knowledge Type"
          type: string
        description:
          default: ""
          title: Description
          type: string
        icon:
          default: "📁"
          title: Icon
          type: string
        is_public:
          default: true
          title: "Is Public"
          type: boolean
        ga_measurement_id:
          default: ""
          title: "Ga Measurement Id"
          type: string
        sorcerer:
          default: ""
          title: Sorcerer
          type: string
        presentation_enabled:
          default: false
          title: "Presentation Enabled"
          type: boolean
        seed_entities:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          default: null
          title: "Seed Entities"
      required:
        - label
        - knowledge_type
      title: CreateKnowledgeBaseRequest
      type: object
    CreateSupportBundleRequest:
      additionalProperties: false
      description: "Request body for `POST /api/v1/support/bundles`."
      properties:
        scope:
          enum:
            - account
            - server
          title: Scope
          type: string
        days:
          default: 1
          title: Days
          type: integer
        target:
          anyOf:
            - type: string
            - type: "null"
          default: null
          title: Target
      required:
        - scope
      title: CreateSupportBundleRequest
      type: object
    DeleteDocumentResponse:
      additionalProperties: false
      description: "Response for `DELETE /api/v1/kbs/{kb}/documents/{doc_id}`."
      properties:
        id:
          title: Id
          type: string
        kb_number:
          anyOf:
            - type: string
            - type: "null"
          title: "Kb Number"
        deleted:
          title: Deleted
          type: boolean
        dry_run:
          title: "Dry Run"
          type: boolean
        tombstone:
          title: Tombstone
          type: boolean
        report:
          additionalProperties: true
          title: Report
          type: object
      required:
        - id
        - kb_number
        - deleted
        - dry_run
        - tombstone
        - report
      title: DeleteDocumentResponse
      type: object
    DeleteFeedRequest:
      additionalProperties: false
      description: "Request body for `DELETE /api/v1/feeds`."
      properties:
        feed_id:
          exclusiveMinimum: 0
          title: "Feed Id"
          type: integer
      required:
        - feed_id
      title: DeleteFeedRequest
      type: object
    DeleteFeedResponse:
      additionalProperties: false
      description: "Response for `DELETE /api/v1/feeds`."
      properties:
        removed:
          title: Removed
          type: boolean
        feed_id:
          title: "Feed Id"
          type: integer
        items_removed:
          title: "Items Removed"
          type: integer
      required:
        - removed
        - feed_id
        - items_removed
      title: DeleteFeedResponse
      type: object
    DeleteKnowledgeBasePlan:
      additionalProperties: false
      description: "Count summary of objects deleted with a shared knowledge base."
      properties:
        documents:
          title: Documents
          type: integer
        entities:
          title: Entities
          type: integer
        relations:
          title: Relations
          type: integer
        members:
          title: Members
          type: integer
        contributions:
          title: Contributions
          type: integer
      required:
        - documents
        - entities
        - relations
        - members
        - contributions
      title: DeleteKnowledgeBasePlan
      type: object
    DeleteKnowledgeBaseResponse:
      additionalProperties: false
      description: "Response for `DELETE /api/v1/kbs/{kb}`."
      properties:
        applied:
          title: Applied
          type: boolean
        knowledge_base:
          "$ref": "#/components/schemas/KnowledgeBaseSummary"
        would_delete:
          "$ref": "#/components/schemas/DeleteKnowledgeBasePlan"
      required:
        - applied
        - knowledge_base
        - would_delete
      title: DeleteKnowledgeBaseResponse
      type: object
    DeleteSupportBundleResponse:
      additionalProperties: false
      description: "Response for `DELETE /api/v1/support/bundles/{bundle_id}`."
      properties:
        bundle_id:
          title: "Bundle Id"
          type: string
        deleted:
          title: Deleted
          type: boolean
      required:
        - bundle_id
        - deleted
      title: DeleteSupportBundleResponse
      type: object
    DocumentDetailResponse:
      additionalProperties: false
      description: "Response for `GET /api/v1/kbs/{kb}/documents/{doc_id}`."
      properties:
        id:
          title: Id
          type: string
        kb_number:
          anyOf:
            - type: string
            - type: "null"
          title: "Kb Number"
        title:
          title: Title
          type: string
        url:
          anyOf:
            - type: string
            - type: "null"
          default: null
          title: Url
        permalink:
          anyOf:
            - type: string
            - type: "null"
          default: null
          title: Permalink
        source_type:
          anyOf:
            - type: string
            - type: "null"
          default: null
          title: "Source Type"
        summary:
          title: Summary
          type: string
        detail:
          title: Detail
          type: string
        detail_format:
          title: "Detail Format"
          type: string
        detail_html:
          title: "Detail Html"
          type: string
        hidden:
          title: Hidden
          type: boolean
