openapi: 3.1.0
info:
  title: Claire Knowledge Base API
  version: 1.0.0
  description: >-
    Authoritative OpenAPI 3.1.0 specification and shared wire contract between the
    Thesis Lineage (blackan/claire_bible) and the Augmentation Lineage (fofwisdom/claire-bible),
    including RFC 8693 OAuth 2.0 Token Exchange, hybrid graph search, and MCP integration.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /
    description: Current host root

paths:
  /health:
    get:
      summary: Service liveness and database connection status
      operationId: checkHealth
      x-claire-access: public
      security: []
      responses:
        '200':
          description: Service is healthy and database is connected.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: true
        '503':
          description: Service degraded or database unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    example: false

  /whoami:
    get:
      summary: Check current authenticated scope
      description: >-
        Returns the request scope, the server mode, the caller's relation to the
        resolved namespace, and whether the caller is the server admin. The
        response never carries a USERNAME.
      operationId: checkWhoami
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Current authenticated scope.
          content:
            application/json:
              schema:
                type: object
                required: [scope, server, relation, is_admin]
                properties:
                  scope:
                    type: string
                    enum: [owner, write, readonly, anonymous]
                    example: owner
                  server:
                    type: object
                    required: [mode]
                    properties:
                      mode:
                        type: string
                        enum: [single, network]
                        example: single
                  relation:
                    type: string
                    description: >-
                      owner when the credential's account owns the namespace with owner
                      scope, delegate for another scope on the same account, visitor
                      otherwise.
                    enum: [owner, delegate, visitor]
                    example: owner
                  is_admin:
                    type: boolean
                    description: >-
                      True only for an owner-scope credential of the server admin
                      account (server_role admin).
                    example: true
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /stats:
    get:
      summary: Knowledge graph counts and theme statistics
      operationId: getStats
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Statistics of documents, entities, relations, and theme metadata.
          content:
            application/json:
              schema:
                type: object
                required: [kb_id, theme_label]
                properties:
                  documents:
                    type: integer
                    example: 142
                  entities:
                    type: integer
                    example: 853
                  relations:
                    type: integer
                    example: 2194
                  kb_id:
                    type: integer
                    example: 0
                  theme_label:
                    type: string
                    example: 기본 테마

  /kb:
    get:
      summary: Collection of shared knowledge bases
      description: >-
        At the root: the shared knowledge bases of the server, newest first. Under `/@{username}/kb`:
        the shared knowledge bases where that account is an active member (an HTML request gets the
        workspace page of that account). The root response is a JSON OrderedCollection with
        `knowledge_bases` (the items), `personal_kb` (the personal knowledge base of the requester at
        the root, of the account under `/@{username}/`, or null), and `multi_theme`. With `page=true`
        the response is an OrderedCollectionPage. An item has `role` when the account is an active
        member, and `legacy_hosts` and `reembed_required` only for a requester with the capability
        `settings`.
      operationId: listKnowledgeBases
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
        - {}
      parameters:
        - name: joined
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
          description: With `true`, only the shared knowledge bases where the requester is an active member.
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [real, fictional]
          description: Selects one knowledge type.
        - name: page
          in: query
          required: false
          schema:
            type: boolean
          description: When true, requests an OrderedCollectionPage slice instead of the root OrderedCollection.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 80
            default: 20
        - name: max_id
          in: query
          required: false
          schema:
            type: string
        - name: min_id
          in: query
          required: false
          schema:
            type: string
        - name: since_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Root collection, page, or (under `/@{username}/`) the HTML workspace page.
          content:
            application/json:
              schema:
                type: object
            text/html:
              schema:
                type: string
        '304':
          description: Not Modified when If-None-Match matches the current ETag.
        '400':
          description: Unknown value of `joined` or `type` (`invalid_joined`, `invalid_type`), or invalid cursor parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: The namespace is not there, or the path pins a knowledge base.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

    post:
      summary: Make a shared knowledge base
      description: >-
        Each active account makes shared knowledge bases, without a limit. The founder selects the
        knowledge type (required) and becomes the first moderator. The new knowledge base is public,
        `active`, and has the join policy `approval`. `CLAIRE_MULTI_THEME=0` gives 403.
      operationId: createKnowledgeBase
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, knowledge_type]
              properties:
                label:
                  type: string
                knowledge_type:
                  type: string
                  enum: [real, fictional]
                description:
                  type: string
                icon:
                  type: string
                seed_entities:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                presentation_enabled:
                  type: boolean
                sorcerer:
                  type: string
                ga_measurement_id:
                  type: string
      responses:
        '201':
          description: '`{"ok": true, "knowledge_base": {...}}`'
        '400':
          description: '`knowledge_type_required`, `seed_entities_too_many`, `seed_entities_invalid`, `<field>_invalid`, or `<field>_not_at_create`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /themes:
    get:
      summary: Collection of themes
      description: >-
        At the root: the collection of themes (groups of knowledge bases on one subject), as a JSON
        OrderedCollection with `themes` (the items: `number`, `url`, `label`, `description`,
        `knowledge_type`, `state`, `knowledge_bases`), or an OrderedCollectionPage with `page=true`.
        The parameter `type` (`real` or `fictional`) selects one knowledge type. The old link
        `/@{username}/themes` gets 308 to `/@{username}/kb`. The collection of knowledge bases is `/kb`.
      operationId: listThemes
      x-claire-access: public
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
        - {}
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: boolean
          description: When true, requests an OrderedCollectionPage slice instead of the root OrderedCollection.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 80
            default: 20
          description: Number of items per collection page (bounded between 1 and 80).
        - name: max_id
          in: query
          required: false
          schema:
            type: string
          description: Cursor returning items older than the specified 64-bit theme number.
        - name: min_id
          in: query
          required: false
          schema:
            type: string
          description: Cursor returning the immediately newer slice above the specified theme number.
        - name: since_id
          in: query
          required: false
          schema:
            type: string
          description: Cursor for synchronization returning items newer than the specified theme number.
      responses:
        '200':
          description: Root collection, paginated page slice, or HTML application shell.
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag representing the collection state.
            Cache-Control:
              schema:
                type: string
              description: Cache control directives (public for anonymous, private for authenticated).
            Vary:
              schema:
                type: string
              example: Sec-Fetch-Dest, Accept
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ThemeCollectionRoot'
                  - $ref: '#/components/schemas/ThemeCollectionPage'
            text/html:
              schema:
                type: string
        '304':
          description: Not Modified when If-None-Match matches current ETag.
        '400':
          description: Conflicting cursor parameters or invalid pagination limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Namespace or theme not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /kb/{number}/:
    parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
        description: The number of the shared knowledge base. The same operations at `/@{username}/` act on the personal knowledge base of that account.
    patch:
      summary: Change the settings of a knowledge base
      description: >-
        The path selects the knowledge base; no body field does. A shared knowledge base needs the
        capability `settings` (moderator or admin). `join_policy`, `knowledge_type`, `seed_entities`,
        and `state` are for a shared knowledge base only (400 `kb_shared_only`). An archived shared
        knowledge base is read-only.
      operationId: updateKnowledgeBase
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                description:
                  type: string
                icon:
                  type: string
                is_public:
                  type: boolean
                presentation_enabled:
                  type: boolean
                sorcerer:
                  type: string
                ga_measurement_id:
                  type: string
                join_policy:
                  type: string
                  enum: [open, approval]
                knowledge_type:
                  type: string
                  enum: [real, fictional]
                seed_entities:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                state:
                  type: string
                  enum: [active, archived]
      responses:
        '200':
          description: '`{"ok": true, "knowledge_base": {...}}`'
        '400':
          description: A field with a wrong type or value (`<field>_invalid`), or `kb_shared_only`.
        '403':
          description: '`kb_capability_required` or `scope_insufficient`.'
    delete:
      summary: Delete a shared knowledge base
      description: >-
        The admin only, with a session that has a recent sign-in (step-up). Without `apply=true` the
        answer is the plan only (`applied: false` and `would_delete`). With `apply=true` the knowledge
        base, its documents, and its graph are deleted.
      operationId: deleteKnowledgeBase
      x-claire-access: owner
      security:
        - SessionCookie: []
      parameters:
        - name: apply
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: The plan, or the result of the delete.
        '400':
          description: '`kb_personal_cannot_delete` or `invalid_apply`.'
        '401':
          description: '`reauth_required`: the session has no recent sign-in.'
        '403':
          description: '`step_up_requires_session` (a bearer credential) or `kb_capability_required`.'

  /kb/{number}/membership:
    parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Join a shared knowledge base
      description: The join policy `open` gives an active membership (201), `approval` a pending one. A second request gives 200.
      operationId: joinKnowledgeBase
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '201':
          description: '`{"ok": true, "membership": {...}}`'
        '403':
          description: '`kb_archived`, or `kb_capability_required` for a banned account.'
    delete:
      summary: Leave a shared knowledge base
      description: Leave, or withdraw a join request.
      operationId: leaveKnowledgeBase
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: '`{"ok": true}`'
        '404':
          description: '`membership_not_found`.'
        '409':
          description: '`last_moderator`: the last active moderator cannot leave.'

  /kb/{number}/members:
    get:
      summary: Members of a shared knowledge base
      description: >-
        A collection with `members`. Each reader gets the active members with their roles. An account
        with the capability `people` also gets the pending and the banned entries.
      operationId: listKnowledgeBaseMembers
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
        - {}
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OrderedCollection or OrderedCollectionPage of members.

  /kb/{number}/members/{account}:
    patch:
      summary: Decide about a member, or change the role `collaborator`
      description: >-
        Capability `people`. The body has `action` (`approve`, `ban`, `remove`) or `role`
        (`collaborator`, `member`), and an optional `reason`. A role change needs a session with a
        recent sign-in. A change of an active moderator gets 403 `moderator_protected`.
      operationId: changeKnowledgeBaseMember
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
        - name: account
          in: path
          required: true
          schema:
            type: string
          description: The public number of the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [approve, ban, remove]
                role:
                  type: string
                  enum: [collaborator, member]
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: '`{"ok": true, "member": {...} | null}`'
        '400':
          description: '`action_or_role_required`, `action_invalid`, `role_invalid`, `reason_invalid`, or `self_not_allowed`.'
        '403':
          description: '`kb_capability_required`, `moderator_protected`, or `step_up_requires_session`.'
        '404':
          description: '`account_not_found` or `membership_not_found`.'
        '409':
          description: '`not_pending` or `not_active_member`.'

  /kb/{number}/contributions:
    parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Contribute a document to a shared knowledge base
      description: >-
        A direct contribution of a document of the personal knowledge base of the requester (an active
        member of the knowledge base). The server copies the document and builds the graph of the
        shared knowledge base from the stored extraction, without an LLM call. The merge job runs in
        the request: the state in the answer is `visible`, or `failed` with a code in `reason`.
      operationId: contributeDocument
      x-claire-access: write
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: string
                  description: The ID of a document of the personal knowledge base of the requester.
      responses:
        '201':
          description: '`{"ok": true, "contribution": {...}}`'
        '403':
          description: '`kb_capability_required`, `kb_archived`, or `scope_insufficient`.'
        '404':
          description: '`document_not_found`.'
        '409':
          description: '`document_not_extracted`, `contribution_duplicate` (with `url`), or `contribution_tombstoned`.'
    get:
      summary: Contributions of a shared knowledge base
      description: >-
        A collection with `contributions`. Each reader gets the visible ones; a reviewer gets each
        state; the requester gets its own contributions in each state.
      operationId: listContributions
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
        - {}
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [pending, merging, visible, hidden, failed, rejected, removed]
      responses:
        '200':
          description: OrderedCollection or OrderedCollectionPage of contributions.

  /kb/{number}/contributions/{contribution}:
    parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      - name: contribution
        in: path
        required: true
        schema:
          type: string
        description: The public number of the contribution.
    delete:
      summary: Withdraw a contribution
      description: The contributor withdraws its contribution while it is not approved. The copy and the row are deleted.
      operationId: withdrawContribution
      x-claire-access: write
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: '`{"ok": true}`'
        '404':
          description: '`contribution_not_found` (also a contribution of another account).'
        '409':
          description: '`contribution_approved` or `contribution_closed`.'
    patch:
      summary: Review a contribution
      description: >-
        Capability `review`. `approve` is final and starts the merge job of a pending contribution.
        `reject` is for a pending contribution and needs a reason code. `hide` and `unhide` are
        reversible. `stop_updates` and `restart_updates` control the automatic revisions.
      operationId: reviewContribution
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approve, reject, hide, unhide, stop_updates, restart_updates]
                reason:
                  type: string
                  enum: [off_subject, wrong_knowledge_type, duplicate, low_quality, spam, other]
      responses:
        '200':
          description: '`{"ok": true, "contribution": {...}}`'
        '400':
          description: '`action_invalid` or `reason_invalid`.'
        '409':
          description: '`contribution_approved`, `contribution_not_pending`, `contribution_not_visible`, `contribution_not_hidden`, or `contribution_closed`.'

  /kb/{number}/contributions/{contribution}/remove:
    post:
      summary: Remove a contribution
      description: Capability `remove`. The copy is purged in the knowledge base and a tombstone keeps the same source out.
      operationId: removeContribution
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
        - name: contribution
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [off_subject, wrong_knowledge_type, duplicate, low_quality, spam, other]
      responses:
        '200':
          description: '`{"ok": true}`'
        '409':
          description: '`contribution_closed`.'

  /kb/{number}/contributions/{contribution}/retry:
    post:
      summary: Start the merge job of a failed contribution again
      description: For the contributor or a reviewer.
      operationId: retryContribution
      x-claire-access: write
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: number
          in: path
          required: true
          schema:
            type: string
        - name: contribution
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '`{"ok": true, "contribution": {...}}`'
        '409':
          description: '`contribution_not_failed`.'

  /api/admin/kb/{number}/moderators/{account}:
    parameters:
      - name: number
        in: path
        required: true
        schema:
          type: string
      - name: account
        in: path
        required: true
        schema:
          type: string
        description: The public number of the account.
    put:
      summary: Give the role `moderator`
      description: The admin only, with a session that has a recent sign-in. A membership is made when there is none.
      operationId: giveKnowledgeBaseModerator
      x-claire-access: admin
      security:
        - SessionCookie: []
      responses:
        '200':
          description: '`{"ok": true, "member": {...}}`'
        '404':
          description: The knowledge base or the account is not there.
    delete:
      summary: Remove the role `moderator`
      description: The admin only, with a session that has a recent sign-in. The account is a member again.
      operationId: removeKnowledgeBaseModerator
      x-claire-access: admin
      security:
        - SessionCookie: []
      responses:
        '200':
          description: '`{"ok": true, "member": {...}}`'
        '404':
          description: '`not_a_moderator`, or the knowledge base or the account is not there.'

  /.well-known/oauth-protected-resource:
    get:
      summary: OAuth 2.0 Protected Resource Metadata (RFC 9728)
      description: Returns metadata describing the MCP protected resource and authorization servers.
      operationId: getProtectedResourceMetadata
      x-claire-access: public
      security: []
      responses:
        '200':
          description: Protected Resource Metadata document.
          content:
            application/json:
              schema:
                type: object
                required: [resource, authorization_servers, scopes_supported, bearer_methods_supported]
                properties:
                  resource:
                    type: string
                    example: https://cb.netspheres.org/mcp
                  authorization_servers:
                    type: array
                    items:
                      type: string
                    example: ["https://cb.netspheres.org"]
                  scopes_supported:
                    type: array
                    items:
                      type: string
                    example: ["readonly"]
                  bearer_methods_supported:
                    type: array
                    items:
                      type: string
                    example: ["header"]

  /.well-known/oauth-authorization-server:
    get:
      summary: OAuth 2.0 Authorization Server Metadata (RFC 8414)
      description: Returns metadata describing the authorization server endpoints and capabilities.
      operationId: getAuthorizationServerMetadata
      x-claire-access: public
      security: []
      responses:
        '200':
          description: Authorization Server Metadata document.
          content:
            application/json:
              schema:
                type: object
                required: [issuer, authorization_endpoint, token_endpoint, registration_endpoint, scopes_supported, response_types_supported, grant_types_supported]
                properties:
                  issuer:
                    type: string
                  authorization_endpoint:
                    type: string
                  token_endpoint:
                    type: string
                  registration_endpoint:
                    type: string
                  scopes_supported:
                    type: array
                    items:
                      type: string
                  response_types_supported:
                    type: array
                    items:
                      type: string
                  grant_types_supported:
                    type: array
                    items:
                      type: string

  /oauth/register:
    post:
      summary: Dynamic Client Registration (RFC 7591)
      description: Dynamically registers an OAuth client (e.g., Google Gemini Spark).
      operationId: registerClient
      x-claire-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                  example: Google Gemini Spark
                redirect_uris:
                  type: array
                  items:
                    type: string
                  example: ["https://gemini.google.com/oauth/callback"]
      responses:
        '201':
          description: Successfully registered client credentials.
          content:
            application/json:
              schema:
                type: object
                required: [client_id, client_secret]
                properties:
                  client_id:
                    type: string
                  client_secret:
                    type: string
                  client_name:
                    type: string
                  redirect_uris:
                    type: array
                    items:
                      type: string

  /oauth/authorize:
    get:
      summary: OAuth 2.0 Authorization Endpoint (RFC 6749 & RFC 7636 PKCE)
      description: Presents consent screen or supports 1-click / telegram push approval.
      operationId: authorizeGet
      x-claire-access: public
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            default: S256
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: HTML consent and authorization page.
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect back to client redirect_uri with authorization code.

  /oauth/token:
    post:
      summary: OAuth 2.0 Token Endpoint (RFC 6749, RFC 7636, RFC 8693)
      description: >-
        Issues tokens for the authorization_code and refresh_token grants, and exchanges a
        subject token (RFC 8693). The token exchange accepts only an approved session token
        that is bound to an account. It issues a readonly Bearer access token bound to the
        same account. All other subject tokens get invalid_grant. There is no default account.
      operationId: exchangeToken
      x-claire-access: public
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          description: Successful token exchange.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Pragma:
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenExchangeResponse'
        '400':
          description: Invalid token exchange request or invalid grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        '401':
          description: Unauthorized client or unauthenticated request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'

  /search:
    post:
      summary: Hybrid semantic and full-text keyword search
      operationId: searchKnowledge
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  maxLength: 2000
                  example: "아키텍처 설계"
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 8
                mode:
                  type: string
                  enum: [hybrid, fts, semantic]
                  default: hybrid
                summarize:
                  type: boolean
                  default: true
                theme:
                  type: string
                  description: Optional theme reference ID or name.
      responses:
        '200':
          description: Search results with entity hits and optional synthesized answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid search parameters or query too long.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /documents:
    get:
      summary: List archived documents
      operationId: listDocuments
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: theme
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of documents in the response. The order is `fetched_at` descending, then `id` descending.
          schema:
            type: integer
            minimum: 1
            maximum: 300
            default: 300
        - name: before
          in: query
          required: false
          description: Keyset cursor `<fetched_at>:<id>`. Use the `next_before` value of the response before. The response has only the documents after this cursor in the list order.
          schema:
            type: string
        - name: pinned
          in: query
          required: false
          description: Only the documents with this pinned flag.
          schema:
            type: string
            enum: ['0', '1']
        - name: hidden
          in: query
          required: false
          description: Only the documents with this hidden flag. The anonymous scope never gets hidden documents.
          schema:
            type: string
            enum: ['0', '1']
        - name: q
          in: query
          required: false
          description: Only the documents whose title or latest extraction summary contains this text.
          schema:
            type: string
            maxLength: 200
        - name: detail
          in: query
          required: false
          description: "`missing`: documents with no detail text. `mismatched`: documents with a detail text in a format that is not the configured render format."
          schema:
            type: string
            enum: [missing, mismatched]
        - name: id
          in: query
          required: false
          description: Only the documents with these identifiers. The parameter can be given a maximum of 100 times.
          schema:
            type: array
            maxItems: 100
            items:
              type: string
      responses:
        '200':
          description: Document archive list with format status.
          content:
            application/json:
              schema:
                type: object
                required: [documents, kb_id, theme_label]
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      required: [id, title, created_at]
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        created_at:
                          type: string
                        format:
                          type: string
                  format_status:
                    type: string
                  kb_id:
                    type: integer
                  theme_label:
                    type: string
                  next_before:
                    type: string
                    nullable: true
                    description: Cursor for the `before` parameter of the next page. `null` when this page is the last one.
                  total:
                    type: integer
                    description: Number of documents that match the filters, without the cursor.
        '400':
          description: A parameter value is not valid. The `error` field has a fixed text, for example `limit must be an integer 1..300` or `before must be <fetched_at>:<id>`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /document/export:
    get:
      summary: Export one document as a Markdown file
      description: The AsciiDoc body becomes Markdown with a YAML front matter header (title, source, date, summary, claire_document_id). Read-only. Markdown is the only export format (RD24).
      operationId: exportDocument
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Document ID.
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [markdown]
            default: markdown
      responses:
        '200':
          description: Markdown file as an attachment.
          content:
            text/markdown:
              schema:
                type: string
        '400':
          description: The id is missing or the format is not markdown.
        '404':
          description: The document does not exist or is not visible.
  /document:
    get:
      summary: Retrieve document detail and raw content
      operationId: getDocumentDetail
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Document ID.
      responses:
        '200':
          description: Document detail including markdown/asciidoc text and ontology links.
          content:
            application/json:
              schema:
                type: object
                required: [id, title, content]
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  content:
                    type: string
                  format:
                    type: string
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        group:
                          type: string
                        observations:
                          type: array
                          items:
                            type: string
                        aliases:
                          type: array
                          items:
                            type: string
                  extraction_provider:
                    type: string
                    nullable: true
                    description: The provider of the latest extraction of the document. Null when the document has no extraction row.
                  extraction_model:
                    type: string
                    nullable: true
                    description: The model of the latest extraction of the document. Null when the document has no extraction row.
        '404':
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /graph:
    get:
      summary: Retrieve full ontology knowledge graph
      operationId: getGraphData
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Graph nodes and edges.
          content:
            application/json:
              schema:
                type: object
                required: [nodes, links]
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      required: [id, name, type]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        type:
                          type: string
                        created_at:
                          type: number
                          description: Creation time in epoch seconds (entities.created_at).
                  links:
                    type: array
                    items:
                      type: object
                      required: [source, target, label]
                      properties:
                        source:
                          type: string
                        target:
                          type: string
                        label:
                          type: string

  /node:
    get:
      summary: Retrieve entity node detail and neighbor links
      operationId: getNodeDetail
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: docs
          in: query
          required: false
          description: With the value `brief`, each item of `documents` has only `id`, `title`, `url`, `summary`, `fetched_at`, `has_detail`, `source_type`, and `has_raw_file`. Without this parameter, each item has `id`, `title`, `url`, `summary`, `detail`, `detail_format`, `detail_html`, and `fetched_at`.
          schema:
            type: string
            enum: [brief]
      responses:
        '200':
          description: Entity details and adjacent edges.
        '404':
          description: Entity not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /ingest:
    post:
      summary: Ingest URL or text payload and extract ontology
      operationId: ingestContent
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: Target URL or raw text content.
                  example: "https://example.com/article"
                format:
                  type: string
                  enum: [adoc, md]
                effort:
                  type: string
                  enum: [low, medium, high]
                full_content:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Successful ingestion and extraction report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: Missing payload or invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          description: Owner permission required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /support/bundle:
    post:
      summary: Generate diagnostic support bundle archive
      operationId: createSupportBundle
      x-claire-access: owner
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  default: 7
                  minimum: 1
                  maximum: 30
                target:
                  type: string
                  description: Optional document ID or share target for isolation.
      responses:
        '200':
          description: Support bundle created with single-use download token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportBundleResponse'
        '403':
          description: Owner permission required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    get:
      summary: Download zstd diagnostic support bundle archive
      operationId: downloadSupportBundle
      x-claire-access: public
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 16
          description: Ephemeral support bundle download token.
      responses:
        '200':
          description: Compressed zstandard tar archive file stream.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="claire-support-20260911.tar.zst"
            Cache-Control:
              schema:
                type: string
                example: no-store, private
          content:
            application/zstd:
              schema:
                type: string
                format: binary
        '404':
          description: Token not found or invalid.
        '410':
          description: Support bundle expired and was purged.

  /mcp:
    post:
      summary: Model Context Protocol JSON-RPC streamable communication
      operationId: mcpJsonRpc
      x-claire-access: read
      security:
        - BearerAuth: []
        - SessionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  oneOf:
                    - type: string
                    - type: integer
                  example: 1
                method:
                  type: string
                  example: "tools/call"
                params:
                  type: object
      responses:
        '200':
          description: MCP JSON-RPC response.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Authentication required per RFC 6750.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: 'Bearer error="invalid_token", error_description="Authentication required"'

  /tokens:
    get:
      summary: List persistent API and MCP tokens
      operationId: listTokens
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: List of active, expired, and revoked persistent tokens.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiTokenInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Create a new persistent API and MCP token
      operationId: createToken
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "Claude Desktop"
                scope:
                  type: string
                  enum: [owner, write, readonly]
                  default: readonly
                expires_in_days:
                  type: integer
                  nullable: true
                  example: 90
      responses:
        '201':
          description: Token created successfully. Raw token is returned only once.
          content:
            application/json:
              schema:
                type: object
                required: [ok, token, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  token:
                    $ref: '#/components/schemas/CreatedApiToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Revoke an API and MCP token immediately
      operationId: revokeTokenDelete
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  oneOf:
                    - type: integer
                    - type: string
      responses:
        '200':
          description: Token revoked successfully.
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /tokens/revoke:
    post:
      summary: Revoke an API and MCP token immediately
      operationId: revokeTokenPost
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  oneOf:
                    - type: integer
                    - type: string
      responses:
        '200':
          description: Token revoked successfully.
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /setup:
    get:
      summary: First admin setup page (P1 accounts)
      description: >-
        Opens only for the admin account (id 1) with owner scope over a cookie or
        X-Session channel while the account status is setup_required. Every other
        request gets 404 so the page's existence is hidden.
      operationId: getSetupPage
      x-claire-access: owner
      security:
        - SessionCookie: []
        - SessionHeader: []
      responses:
        '200':
          description: Setup form (HTML).
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Not the setup principal, or setup already completed.
    post:
      summary: Complete first admin setup
      operationId: completeSetup
      x-claire-access: owner
      security:
        - SessionCookie: []
        - SessionHeader: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password, password_confirm, ack]
              properties:
                username:
                  type: string
                  description: Lowercased before the rule check; non-ASCII is rejected first.
                display_name:
                  type: string
                  maxLength: 64
                password:
                  type: string
                  minLength: 12
                  description: Printable ASCII 0x21-0x7E only; must not contain the username.
                password_confirm:
                  type: string
                ack:
                  type: string
                  enum: ['1']
                  description: Required confirmation checkbox (username is immutable and public in network mode).
      responses:
        '303':
          description: >-
            Setup completed. A new session cookie replaces the old one. Location is /,
            or /settings/account?notice=password_not_saved when only the password write failed.
        '400':
          description: Input rejected; the form is shown again with reason codes (HTML).
          content:
            text/html:
              schema:
                type: string
        '403':
          description: Cookie POST without a same-origin Origin header.
        '404':
          description: Not the setup principal, setup already completed, or lost a concurrent setup.

  /login:
    get:
      summary: Local login page
      operationId: getLoginPage
      x-claire-access: public
      security: []
      responses:
        '200':
          description: Login form (HTML).
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Log in with USERNAME and password
      description: >-
        Public route; the handler requires a same-origin request (Sec-Fetch-Site
        same-origin or a same-origin Origin header). Failure responses do not reveal
        whether the account exists or its status.
      operationId: login
      x-claire-access: public
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '303':
          description: Logged in. Location is /. Sets a new claire_session cookie.
        '400':
          description: Form fields missing or not strings (HTML).
        '401':
          description: Login failed (HTML, one message for every cause).
        '403':
          description: Not a same-origin request.
        '429':
          description: Throttled. Not counted as a failure.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the next attempt is allowed.

  /logout:
    post:
      summary: Log out the current browser session
      operationId: logout
      x-claire-access: public
      security: []
      responses:
        '303':
          description: Session row deleted (if any) and cookie cleared. Location is /login.
        '403':
          description: Not a same-origin request.

  /api/auth/reauth:
    post:
      summary: Re-authenticate the current session (step-up)
      description: >-
        Confirms the session owner's password and refreshes the session's
        authenticated_at. Uses the same throttle as login.
      operationId: reauthenticate
      x-claire-access: owner
      security:
        - SessionCookie: []
        - SessionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Re-authenticated.
          content:
            application/json:
              schema:
                type: object
                required: [ok, authenticated_at]
                properties:
                  ok:
                    type: boolean
                  authenticated_at:
                    type: number
                    description: Epoch seconds.
        '400':
          description: '`invalid_request`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          description: '`step_up_requires_session` (not a session channel) or `invalid_password`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Not an owner-scope credential.
        '409':
          description: '`password_not_set`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '429':
          description: '`too_many_attempts`'
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /admin:
    get:
      summary: Admin console entry redirect
      description: >-
        Redirects the server admin to /admin/server. Every non-admin request
        gets 404 before any redirect. An optional theme query that is not one of the
        admin's own themes also gets 404.
      operationId: getAdminConsoleIndex
      x-claire-access: admin
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ConsoleThemeQuery'
      responses:
        '302':
          description: Redirect to /admin/server (Cache-Control no-store, Referrer-Policy same-origin).
          headers:
            Location:
              schema:
                type: string
                const: /admin/server
        '404':
          description: Not the server admin with owner scope, or invalid theme reference.

  /admin/{section}:
    get:
      summary: Admin console section page (unified console shell)
      description: >-
        Root-only admin console pages rendered in console_shell.html. Prefixed
        paths (/@{username}/admin/...) return 404. Non-admin callers always get 404,
        never 403. /admin/themes shows the admin account's own themes plus
        server-wide aggregate counts only; member theme labels and content are
        never read.
      operationId: getAdminConsoleSection
      x-claire-access: admin
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: section
          in: path
          required: true
          schema:
            type: string
            enum: [server, accounts, idp, providers, limits, themes, tokens, mcp]
        - $ref: '#/components/parameters/ConsoleThemeQuery'
      responses:
        '200':
          description: Admin console page (HTML, Cache-Control no-store, Referrer-Policy same-origin).
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Not the server admin with owner scope, or invalid theme reference.

  /api/admin/mcp/telemetry:
    get:
      summary: Read MCP call telemetry (admin only)
      description: >-
        Bounded read of the mcp_telemetry table in data/telemetry.db, newest first.
        Returns an empty list when the telemetry database does not exist.
      operationId: listMcpTelemetry
      x-claire-access: admin
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: tool_name
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: ISO 8601 timestamp. A value that does not parse (including an empty value) gives 400 invalid_since.
          schema:
            type: string
      responses:
        '200':
          description: Telemetry records.
          content:
            application/json:
              schema:
                type: object
                required: [records, count]
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/McpTelemetryRecord'
                  count:
                    type: integer
        '400':
          description: limit is not an integer between 1 and 200 (error invalid_limit).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Not the server admin with owner scope.

  /api/admin/accounts:
    get:
      summary: List accounts (admin only)
      operationId: listAccounts
      x-claire-access: admin
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Accounts ordered by internal id.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountSummary'
        '404':
          description: Not the server admin with owner scope.

  /me:
    get:
      summary: Legacy account page redirect
      description: >-
        Compatibility redirect to /settings/account. The rule surface is any, so a
        prefixed /@{username}/me also redirects. The Location is always the root
        path and the query string (including notice) is not forwarded.
      operationId: getMePage
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '302':
          description: Redirect to /settings/account (Cache-Control no-store, Referrer-Policy same-origin).
          headers:
            Location:
              schema:
                type: string
                const: /settings/account
        '404':
          description: Not an owner-scope credential.

  /settings:
    get:
      summary: User settings console entry redirect
      description: >-
        Redirects to /settings/account, or to /settings/reader when from=syndication.
        A valid theme query is kept on the redirect target.
      operationId: getSettingsConsoleIndex
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            enum: [syndication]
        - $ref: '#/components/parameters/ConsoleThemeQuery'
      responses:
        '302':
          description: Redirect to /settings/account or /settings/reader (Cache-Control no-store, Referrer-Policy same-origin).
        '404':
          description: Not an owner-scope account credential, or invalid theme reference.

  /settings/{section}:
    get:
      summary: User settings console section page (unified console shell)
      description: >-
        Root-only owner pages rendered in console_shell.html in both server modes.
        Prefixed paths (/@{username}/settings/..., /themes/{n}/settings/...) return
        404. For the server admin, /settings/themes and /settings/tokens redirect
        (302) to /admin/themes and /admin/tokens. Responses to non-admin callers
        contain no /admin links or admin markup. Sections reader through webmcp are
        theme-scoped; the others are account-wide.
      operationId: getSettingsConsoleSection
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: section
          in: path
          required: true
          schema:
            type: string
            enum: [account, keys, themes, tokens, reader, connections, feeds, tags, rules, outbound, opml, mcp, webmcp]
        - $ref: '#/components/parameters/ConsoleThemeQuery'
        - name: notice
          in: query
          required: false
          description: Only read on /settings/account. Values outside the enum render no notice.
          schema:
            type: string
            enum: [password_not_saved, identity_linked, already_linked]
      responses:
        '200':
          description: Settings page (HTML, Cache-Control no-store, Referrer-Policy same-origin).
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Admin caller on /settings/themes or /settings/tokens; Location is /admin/themes or /admin/tokens with the validated theme query.
        '404':
          description: Not an owner-scope account credential, or invalid theme reference.

  /syndication/preferences:
    get:
      summary: Legacy syndication preferences redirect
      description: >-
        Compatibility redirect. The theme query is validated first (404 when it is
        missing or not accessible). The tab query maps reader (or omitted) to
        /settings/reader, accounts to /settings/connections, and feeds, tags, rules,
        outbound, opml, mcp, webmcp to /settings/ with the same name, keeping the
        validated knowledge base as ?kb=. idp and userdb go to /admin/idp and
        /admin/accounts for the server admin and to /settings/account for other
        owners, without ?kb=. An empty or unknown tab is 404. The Location is
        always a root path.
      operationId: getSyndicationPreferencesRedirect
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - name: tab
          in: query
          required: false
          schema:
            type: string
            enum: [reader, accounts, feeds, tags, rules, outbound, opml, mcp, webmcp, idp, userdb]
        - name: theme
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the mapped /settings/* or /admin/* page (Cache-Control no-store, Referrer-Policy same-origin).
        '404':
          description: Not an owner-scope credential, invalid theme reference, or empty or unknown tab.

  /api/me:
    get:
      summary: Read own account
      operationId: getMe
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSelf'
        '404':
          description: Not an owner-scope credential.
    patch:
      summary: Change own display name, profile visibility, or interface language
      operationId: updateMe
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                display_name:
                  type: string
                  maxLength: 64
                profile_public:
                  description: Public profile switch. The values true and false are also accepted.
                  oneOf:
                    - type: integer
                      enum: [0, 1]
                    - type: boolean
                locale:
                  description: Interface language of the account. Null or an empty string is automatic negotiation. The response also sets or clears the `claire_locale` cookie.
                  type: ['string', 'null']
                  enum: [en, ko, '', null]
                entity_language:
                  description: Language of the entity names that the account sees (decided from the script of a name). Null or an empty string shows the stored main labels. The stored data does not change.
                  type: ['string', 'null']
                  enum: [en, ko, ja, zh, '', null]
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSelf'
        '400':
          description: '`invalid_request` (empty body, or keys other than display_name, profile_public, locale, and entity_language), `invalid_display_name`, `invalid_profile_public`, `invalid_locale`, or `invalid_entity_language`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Not an owner-scope credential.

  /api/locale:
    post:
      summary: Select the interface language
      description: >-
        Public route; the request must come from the same origin. Sets the `claire_locale` cookie, or clears it for automatic negotiation.
        For an owner session, the server also stores the choice on the account (`accounts.locale`).
        A form body (`locale`, `next`) is for the pages without JavaScript (`/login`, `/setup`): the response is 303 to `next`.
      operationId: setLocale
      x-claire-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [locale]
              properties:
                locale:
                  type: ['string', 'null']
                  enum: [en, ko, '', null]
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [locale, next]
              properties:
                locale:
                  type: string
                  enum: [en, ko, '']
                next:
                  type: string
                  enum: [/login, /setup]
      responses:
        '200':
          description: The stored choice (`locale`, null for automatic) and the language of the next request (`effective_locale`).
          content:
            application/json:
              schema:
                type: object
                required: [locale, effective_locale]
                properties:
                  locale:
                    type: ['string', 'null']
                    enum: [en, ko, null]
                  effective_locale:
                    type: string
                    enum: [en, ko]
        '303':
          description: Form body. The browser goes back to `next`.
        '400':
          description: '`invalid_request` (other keys, or a `next` that is not permitted) or `invalid_locale`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          description: The request does not come from the same origin.

  /api/me/password:
    post:
      summary: Set or change own password (step-up required)
      description: >-
        Requires a session re-authenticated within the last 15 minutes. When a
        password already exists, current_password must match. On success every
        other approved session of the account is deleted; API, MCP and OAuth
        tokens are kept.
      operationId: changeMyPassword
      x-claire-access: owner
      security:
        - SessionCookie: []
        - SessionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Password stored.
          content:
            application/json:
              schema:
                type: object
                required: [ok, other_sessions_revoked]
                properties:
                  ok:
                    type: boolean
                  other_sessions_revoked:
                    type: integer
        '400':
          description: >-
            `invalid_request`, or `password_rejected` with `reason`
            (invalid_characters, too_short, contains_username) and `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '401':
          description: '`reauth_required`; body also has `reauth: /api/auth/reauth`.'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: 'Session realm="claire", error="reauth_required"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          description: '`step_up_requires_session` (bearer) or `invalid_password`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: Not an owner-scope credential.
        '409':
          description: '`account_not_active`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '429':
          description: '`too_many_attempts`'
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /api/federation/status:
    get:
      summary: Read the federation state of the own account (network mode)
      operationId: getFederationStatus
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Federation state of the account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  federation: {type: string, enum: ['off', 'on']}
                  handle: {type: [string, 'null'], description: '`@username@host`, or null when the account has no USERNAME.'}
                  actor_id: {type: [string, 'null']}
                  is_actor: {type: boolean}
                  actor_state: {type: string}
                  followers:
                    type: object
                    properties:
                      total: {type: integer}
                  pending_tasks: {type: integer, description: Outbox tasks that the sidecar did not take or did not acknowledge.}
        '404':
          description: Single mode, or not an owner-scope credential.

  /api/federation/publish:
    post:
      summary: Publish one document through the native actor, or publish it again
      description: >-
        The document must be in a public theme of the caller, must not be hidden,
        and must have a body. The first call makes the object and a `create` task.
        A later call makes an `update` task for the same object. The sidecar sends
        the activity to the followers of the actor. Network mode only.
      operationId: publishFederationDocument
      x-claire-access: write
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [theme, document_id]
              properties:
                theme: {type: string, description: Theme number as a decimal string.}
                document_id: {type: string}
      responses:
        '202':
          description: The object and the outbox task are stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: object
                    properties:
                      id: {type: string}
                      url: {type: string, description: '`{origin}/ap/objects/{id}`'}
                      published_at: {type: number}
                      updated_at: {type: number}
                  task:
                    type: object
                    properties:
                      id: {type: integer}
                      kind: {type: string, enum: [create, update]}
                  created: {type: boolean}
        '400':
          description: '`invalid_request`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: '`theme_not_found` or `document_not_found`. Also single mode.'
        '409':
          description: '`not_an_actor`, `theme_not_public`, `document_not_public`, or `document_has_no_body`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /api/federation/retract:
    post:
      summary: Delete one published object and request its removal on remote servers
      description: >-
        Writes a tombstone, deletes the object, and makes a `delete` task. The
        object ID returns 410 from then on. A remote server can ignore the
        `Delete` activity. Network mode only.
      operationId: retractFederationObject
      x-claire-access: write
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [object_id]
              properties:
                object_id: {type: string, description: Object public ID as a decimal string.}
      responses:
        '202':
          description: The object is retracted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  retracted: {type: boolean}
                  object_id: {type: string}
                  task:
                    type: object
                    properties:
                      id: {type: integer}
                      kind: {type: string, enum: [delete]}
        '400':
          description: '`invalid_request`.'
        '404':
          description: '`object_not_found`. Also single mode.'

  /api/federation/notes:
    post:
      summary: Publish a public note, or a reply to an item of the timeline (network mode)
      description: >-
        The owner gives plain text. The server makes the HTML (paragraphs, links,
        mentions `@name@host`, hashtags `#tag`) and sanitizes it. The note, its
        item of the timeline, and its `note` task are stored in one transaction.
        The sidecar sends `Create(Note)` to the followers and to the mentioned
        actors. The account must be a federation actor.
      operationId: createFederationNote
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: {type: string, description: Plain text. The limit is the reading setting `note_max_chars`.}
                in_reply_to: {type: [string, 'null'], description: ID of an item of the own timeline.}
                summary: {type: [string, 'null'], description: Content warning, 500 characters at most.}
                sensitive: {type: boolean}
                language: {type: [string, 'null'], description: 'Language tag, for example `en`. Default: the locale of the account.'}
                quote_of: {type: [string, 'null'], description: 'ID of an item of the own timeline that the note quotes (FEP-044f). The quote is `pending` until the author of the quoted object approves it.'}
                quote_policy: {type: string, enum: [public, followers, manual, nobody], description: 'Who can quote this note. Default: `public`.'}
      responses:
        '201':
          description: The note is stored and its task waits for the sidecar.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: {$ref: '#/components/schemas/FederationNote'}
                  item_id: {type: string, description: ID of the item of the own timeline for this note.}
        '400':
          description: '`invalid_request`, `empty_content`, `content_too_long`, `summary_too_long`, `too_many_mentions`, `too_many_tags`, `invalid_language`, `invalid_mention`, `invalid_quote_policy`, or `blocked_domain`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '404':
          description: '`item_not_found`. Also single mode, or not an owner-scope credential.'
        '409':
          description: '`not_actor`, or `own_item` for a quote of an own note.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /api/federation/notes/{note_id}:
    parameters:
      - {name: note_id, in: path, required: true, schema: {type: string}, description: Note number as a decimal string.}
    patch:
      summary: Edit an own note (network mode)
      description: Changes the text, the content warning, the language, or the quote policy. The sidecar sends `Update(Note)`; a change of the quote policy alone does not set `updated`.
      operationId: updateFederationNote
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                content: {type: string}
                summary: {type: [string, 'null']}
                sensitive: {type: boolean}
                language: {type: [string, 'null']}
                quote_policy: {type: string, enum: [public, followers, manual, nobody]}
      responses:
        '200':
          description: The changed note.
          content:
            application/json:
              schema:
                type: object
                properties:
                  note: {$ref: '#/components/schemas/FederationNote'}
        '400':
          description: The 400 codes of `POST /api/federation/notes`.
        '404':
          description: '`note_not_found`. Also single mode.'
        '409':
          description: '`not_actor`.'
    delete:
      summary: Delete an own note (network mode)
      description: The object ID returns 410 from then on. The sidecar sends `Delete` with a `Tombstone`. A remote server can ignore it.
      operationId: deleteFederationNote
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: The note is deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: {type: boolean}
                  id: {type: string}
        '404':
          description: '`note_not_found`. Also single mode.'

  /api/federation/timeline/{item_id}/favourite:
    parameters:
      - {name: item_id, in: path, required: true, schema: {type: string}}
    post:
      summary: Favourite the object of an item of the timeline (network mode)
      description: Records the state on the item and makes a `like` task. A repeated request changes nothing.
      operationId: favouriteFederationItem
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: The state of the item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FederationItemInteraction'}
        '400':
          description: '`blocked_domain`.'
        '404':
          description: '`item_not_found`. Also single mode.'
        '409':
          description: '`not_actor` or `own_item`.'
    delete:
      summary: Remove the favourite of an item (network mode)
      description: Makes an `undo_like` task with the ID of the `Like`.
      operationId: unfavouriteFederationItem
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: The state of the item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FederationItemInteraction'}
        '404':
          description: '`item_not_found`. Also single mode.'
        '409':
          description: '`not_actor` or `own_item`.'

  /api/federation/timeline/{item_id}/boost:
    parameters:
      - {name: item_id, in: path, required: true, schema: {type: string}}
    post:
      summary: Boost the object of an item of the timeline (network mode)
      description: Records the state on the item and makes an `announce` task. A repeated request changes nothing.
      operationId: boostFederationItem
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: The state of the item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FederationItemInteraction'}
        '400':
          description: '`blocked_domain`.'
        '404':
          description: '`item_not_found`. Also single mode.'
        '409':
          description: '`not_actor` or `own_item`.'
    delete:
      summary: Remove the boost of an item (network mode)
      description: Makes an `undo_announce` task with the ID of the `Announce`.
      operationId: unboostFederationItem
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: The state of the item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FederationItemInteraction'}
        '404':
          description: '`item_not_found`. Also single mode.'
        '409':
          description: '`not_actor` or `own_item`.'

  /api/federation/quotes:
    get:
      summary: List the quote requests for own objects (network mode)
      description: >-
        Requests of remote actors to quote an own note or a published document
        (FEP-044f): those that wait for the owner, and the approved ones. The
        view has addresses of the remote server only; the server does not fetch
        the quoting object.
      operationId: listFederationQuotes
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: The requests, newest first, 100 of each group at most.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: {type: array, items: {$ref: '#/components/schemas/FederationQuoteRequest'}}
                  authorizations: {type: array, items: {$ref: '#/components/schemas/FederationQuoteRequest'}}
                  counts:
                    type: object
                    properties:
                      pending: {type: integer}
                      approved: {type: integer}
        '404':
          description: Single mode, or not an owner-scope credential.

  /api/federation/quotes/{quote_id}:
    parameters:
      - {name: quote_id, in: path, required: true, schema: {type: string}}
    patch:
      summary: Approve, refuse, or revoke a quote request (network mode)
      description: >-
        `approved` or `refused` for a request that waits (a refused request can
        be approved later), `revoked` for an approved request. The sidecar sends
        `Accept` with a `QuoteAuthorization`, `Reject`, or `Delete` of the
        authorization. The public path of a revoked authorization returns 410.
      operationId: decideFederationQuote
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: {type: string, enum: [approved, refused, revoked]}
      responses:
        '200':
          description: The request with its new state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote: {$ref: '#/components/schemas/FederationQuoteRequest'}
        '400':
          description: '`invalid_request`.'
        '404':
          description: '`quote_not_found`. Also single mode.'
        '409':
          description: '`invalid_state` (with the `state` of the request), or `not_actor`.'

  /api/federation/objects/{object_id}:
    parameters:
      - {name: object_id, in: path, required: true, schema: {type: string}, description: Object number of a published document as a decimal string.}
    patch:
      summary: Set the quote policy of a published document (network mode)
      description: A change makes an `update` task; the sidecar sends `Update` of the object with the new `canQuote`. The default of a published document is `manual`.
      operationId: updateFederationObject
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quote_policy]
              properties:
                quote_policy: {type: string, enum: [public, followers, manual, nobody]}
      responses:
        '200':
          description: The object with its quote policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: object
                    properties:
                      id: {type: string}
                      kb_id: {type: integer}
                      document_id: {type: string}
                      quote_policy: {type: string}
        '400':
          description: '`invalid_request` or `invalid_quote_policy`.'
        '404':
          description: '`object_not_found`. Also single mode.'

  /api/feeds:
    get:
      summary: List the feeds of the own account
      description: Feeds of the account (single mode and network mode), with folder, cache and poll state, and item counts.
      operationId: listFeeds
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: Feeds and folders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  feeds: {type: array, items: {$ref: '#/components/schemas/Feed'}}
                  folders: {type: array, items: {type: string}}
                  limit: {type: integer}
        '404':
          description: Not an owner-scope credential.
    post:
      summary: Subscribe to a feed
      operationId: subscribeFeed
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url: {type: string, description: An http or https feed URL.}
                title: {type: string}
                folder: {type: string}
      responses:
        '201':
          description: The feed is added (`created` is true).
          content:
            application/json:
              schema:
                type: object
                properties:
                  feed: {$ref: '#/components/schemas/Feed'}
                  created: {type: boolean}
        '200':
          description: The account has a feed with this URL. Nothing is added (`created` is false).
        '400':
          description: '`invalid_request` or `invalid_url`.'
        '409':
          description: '`feed_limit`.'
    delete:
      summary: Unsubscribe from a feed
      description: Deletes the feed and its items. A linked document stays.
      operationId: unsubscribeFeed
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [feed_id]
              properties:
                feed_id: {type: integer}
      responses:
        '200':
          description: The feed is deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: {type: boolean}
                  feed_id: {type: integer}
                  items: {type: integer}
        '400':
          description: '`invalid_request`.'
        '404':
          description: '`feed_not_found`.'

  /api/feeds/poll:
    post:
      summary: Poll the feeds of the own account now
      description: >-
        Conditional GET with the stored ETag and Last-Modified. Without
        `feed_id`, at most 50 feeds (oldest poll first). A feed in backoff is
        not fetched.
      operationId: pollFeeds
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                feed_id: {type: integer}
      responses:
        '200':
          description: Poll results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  polled: {type: integer}
                  not_polled: {type: integer}
                  outcomes:
                    type: array
                    items:
                      type: object
                      properties:
                        feed_id: {type: integer}
                        result: {type: string, enum: [updated, not_modified, error, backoff]}
                        http_status: {type: [integer, 'null']}
                        added: {type: integer}
                        updated: {type: integer}
                        error: {type: [string, 'null']}
                        next_poll_at: {type: [number, 'null']}
        '400':
          description: '`invalid_request`.'
        '404':
          description: '`feed_not_found`.'

  /api/feeds/opml:
    get:
      summary: Export the feeds of the own account as OPML 2.0
      operationId: exportFeedsOpml
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      responses:
        '200':
          description: OPML document. A feed with a folder is in a category outline.
          content:
            text/x-opml:
              schema: {type: string}
    post:
      summary: Import feeds from an OPML document
      description: >-
        Each outline with xmlUrl is a feed. Nested categories give one folder
        level (names joined with " › "). Outlines without a feed are skipped
        and listed. A known URL is a duplicate. The import does not poll.
      operationId: importFeedsOpml
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [opml]
              properties:
                opml: {type: string, description: The OPML document as text.}
      responses:
        '200':
          description: Import report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    properties:
                      added: {type: integer}
                      skipped: {type: integer}
                      duplicate: {type: integer}
                      failed: {type: integer}
                  added: {type: array, items: {type: object}}
                  skipped: {type: array, items: {type: object}}
                  duplicate: {type: array, items: {type: object}}
                  failed: {type: array, items: {type: object}}
        '400':
          description: '`invalid_request` or `invalid_opml` (with `reason`).'

  /api/feeds/items:
    get:
      summary: List feed items of the own account
      operationId: listFeedItems
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - {name: feed_id, in: query, schema: {type: integer}}
        - {name: folder, in: query, schema: {type: string}}
        - {name: unread, in: query, schema: {type: string, enum: ['0', '1']}}
        - {name: starred, in: query, schema: {type: string, enum: ['0', '1']}}
        - {name: before_id, in: query, schema: {type: integer}, description: Cursor from next_before_id.}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: content, in: query, schema: {type: string, enum: ['0', '1']}, description: '1 adds the HTML body.'}
      responses:
        '200':
          description: One page, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/FeedItem'}}
                  next_before_id: {type: [integer, 'null']}
        '400':
          description: '`invalid_request`.'
    patch:
      summary: Mark feed items read, unread, starred, or not starred
      operationId: markFeedItems
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Either item_ids (1 to 500) with unread and/or starred, or feed_id with unread.
              properties:
                item_ids: {type: array, items: {type: integer}, maxItems: 500}
                feed_id: {type: integer}
                unread: {type: boolean}
                starred: {type: boolean}
      responses:
        '200':
          description: Number of matched items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: {type: integer}
        '400':
          description: '`invalid_request`.'
        '404':
          description: '`feed_not_found`.'
  /api/feeds/items/{item_id}:
    get:
      summary: Get one feed item of the own account with the render URL of its body
      operationId: getFeedItem
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - {name: item_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: The item. render_url is the address of the body for a sandbox iframe.
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    allOf:
                      - {$ref: '#/components/schemas/FeedItem'}
                      - type: object
                        properties:
                          has_body: {type: boolean}
                          render_url: {type: string}
        '404':
          description: '`item_not_found`.'
  /api/feeds/items/{item_id}/ingest:
    post:
      summary: Ingest one feed item into a theme of the own account
      operationId: ingestFeedItem
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      parameters:
        - {name: item_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theme]
              properties:
                theme: {type: string, description: Public theme reference of the caller.}
      responses:
        '200':
          description: The ingest report with linked (kb_id and document_id, or null).
        '400':
          description: '`invalid_request`.'
        '404':
          description: '`item_not_found`, or the theme is not a theme of the caller.'
        '409':
          description: '`item_without_url`.'
  /api/feeds/discover:
    post:
      summary: Find the feeds of an address
      operationId: discoverFeeds
      x-claire-access: owner
      security:
        - BearerAuth: []
        - SessionHeader: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url: {type: string}
      responses:
        '200':
          description: The feed at the address, or the feeds that the page declares with link rel="alternate".
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
                  error: {type: [string, 'null']}
                  feeds:
                    type: array
                    items:
                      type: object
                      properties:
                        url: {type: string}
                        title: {type: string}
                        format: {type: string, enum: [rss, atom, json]}
                        subscribed: {type: boolean}
        '400':
          description: '`invalid_request` or `invalid_url`.'

components:
  parameters:
    ConsoleThemeQuery:
      name: theme
      in: query
      required: false
      description: >-
        Public theme reference that must belong to the caller's account. An empty,
        unknown, or foreign reference returns 404; it never falls back to a default
        theme. When omitted, the caller's default theme is used.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    NotFound:
      description: Not found, or hidden from this credential (stealth 404).

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: >-
        Standard Bearer authorization header. Value must be an access token
        obtained via /oauth/token or configured inject/session tokens.
    SessionHeader:
      type: apiKey
      in: header
      name: X-Session
      description: Single-use or persistent session token header.
    SessionCookie:
      type: apiKey
      in: cookie
      name: claire_session
      description: Same-Origin HttpOnly session cookie.

  schemas:
    Feed:
      type: object
      properties:
        id: {type: integer}
        url: {type: string}
        site_url: {type: [string, 'null']}
        title: {type: string}
        folder: {type: string, description: Empty for no folder.}
        format: {type: [string, 'null'], enum: [rss, atom, json, null]}
        websub_hub: {type: [string, 'null']}
        last_polled_at: {type: [number, 'null']}
        last_success_at: {type: [number, 'null']}
        next_poll_at: {type: [number, 'null']}
        last_status: {type: [integer, 'null']}
        last_error: {type: [string, 'null']}
        failure_count: {type: integer}
        created_at: {type: number}
        items: {type: integer}
        unread: {type: integer}
    FeedItem:
      type: object
      properties:
        id: {type: integer}
        feed_id: {type: integer}
        feed_title: {type: string}
        feed_folder: {type: string}
        url: {type: [string, 'null']}
        title: {type: string}
        author: {type: [string, 'null']}
        summary: {type: [string, 'null']}
        content: {type: [string, 'null'], description: Only with content=1. Render it on the usercontent origin only.}
        categories: {type: array, items: {type: string}, description: Raw tags of the feed.}
        published_at: {type: [number, 'null']}
        modified_at: {type: [number, 'null']}
        fetched_at: {type: number}
        unread: {type: boolean}
        starred: {type: boolean}
        linked_kb_id: {type: [integer, 'null']}
        linked_doc_id: {type: [string, 'null']}
        text: {type: string, description: Plain text of the summary or of the content.}
        linked: {type: [object, 'null'], description: kb_id and document_id of the ingested document.}
        timeline_item_id: {type: [string, 'null'], description: The timeline item of the account with the same address.}
    McpTelemetryRecord:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: number
          description: Unix epoch seconds.
        client_id:
          type: [string, 'null']
        call_type:
          type: string
        tool_name:
          type: [string, 'null']
        duration_ms:
          type: [integer, 'null']
        status:
          type: string
        error_code:
          type: [integer, 'null']
        error_message:
          type: [string, 'null']
        response_bytes:
          type: [integer, 'null']

    TokenExchangeRequest:
      type: object
      required:
        - grant_type
        - subject_token
        - subject_token_type
      properties:
        grant_type:
          type: string
          const: urn:ietf:params:oauth:grant-type:token-exchange
          description: Standard RFC 8693 grant type identifier.
        subject_token:
          type: string
          minLength: 32
          maxLength: 128
          description: Security token representing the identity context.
          example: "yG8hO2wX0123456789abcdefABCDEF01"
        subject_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
            - urn:ietf:params:oauth:token-type:jwt
            - urn:claire:params:oauth:token-type:telegram-bootstrap
            - urn:claire:params:oauth:token-type:session-token
          description: URI identifying the format and type of subject_token.
          example: urn:ietf:params:oauth:token-type:access_token
        requested_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
            - urn:ietf:params:oauth:token-type:refresh_token
          default: urn:ietf:params:oauth:token-type:access_token
          description: Desired token type. Defaults to access_token.
        resource:
          type: string
          format: uri
          description: Target resource URI (e.g., https://claire.example.com/mcp).
        audience:
          type: string
          description: Target audience identifier (e.g., claire-mcp or claire-web).
        scope:
          type: string
          enum: [owner, readonly]
          description: Requested scope.
          example: owner
        actor_token:
          type: string
          description: Token representing the acting party (delegation scenarios).
        actor_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:access_token
          description: URI identifying actor_token format. Required if actor_token is present.

    TokenExchangeResponse:
      type: object
      required:
        - access_token
        - issued_token_type
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: The newly issued or rotated access token.
          example: "s8dfA_77bN0Q81zKxabcdef0123456789"
        issued_token_type:
          type: string
          const: urn:ietf:params:oauth:token-type:access_token
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds (e.g., 604800 for 7 days).
          example: 604800
        scope:
          type: string
          enum: [owner, readonly]
          description: Effective scope granted.
          example: owner
        refresh_token:
          type: string
          description: Optional refresh token if token rotation is chained.

    OAuthErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - invalid_target
            - unsupported_token_type
          example: invalid_grant
        error_description:
          type: string
          example: "The subject_token is expired or has already been consumed."
        error_uri:
          type: string
          format: uri

    FederationNote:
      type: object
      description: An own note of the federation client (FEDERATION.md Section 25).
      properties:
        id: {type: string}
        url: {type: string, description: '`{origin}/ap/objects/{id}`'}
        in_reply_to: {type: [string, 'null']}
        content: {type: string, description: The plain text that the owner gave.}
        summary: {type: [string, 'null']}
        sensitive: {type: boolean}
        language: {type: [string, 'null']}
        tags: {type: array, items: {type: string}}
        mentions: {type: array, items: {type: string}}
        published_at: {type: number}
        updated_at: {type: number}
        edited_at: {type: [number, 'null']}
        likes: {type: integer}
        announces: {type: integer}
        quotes: {type: integer, description: Number of approved quotes of the note.}
        quote_policy: {type: string, enum: [public, followers, manual, nobody]}
        quote:
          type: [object, 'null']
          description: The object that the note quotes (FEDERATION.md Section 26).
          properties:
            iri: {type: string}
            state: {type: string, enum: [pending, approved, refused, revoked]}
    FederationQuoteRequest:
      type: object
      description: A request of a remote actor to quote an own object (FEDERATION.md Section 26).
      properties:
        id: {type: string}
        state: {type: string, enum: [pending, approved, refused, revoked]}
        object:
          type: object
          properties:
            id: {type: string}
            url: {type: string}
            kind: {type: string, enum: [note, document, gone]}
            text: {type: string}
        quoting_object: {type: string, description: Address of the quoting object on its server.}
        quoting_actor: {type: string}
        authorization: {type: [string, 'null'], description: 'Public address of the authorization of an approved request: `{origin}/ap/quote-authorizations/{id}`.'}
        created_at: {type: number}
        updated_at: {type: number}
    FederationItemInteraction:
      type: object
      properties:
        item_id: {type: string}
        favourited: {type: boolean}
        boosted: {type: boolean}
    StandardError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "authentication required"

    SearchResponse:
      type: object
      required: [query, mode, hits, kb_id, theme_label]
      properties:
        query:
          type: string
        mode:
          type: string
        answer:
          type: string
        kb_id:
          type: integer
        theme_label:
          type: string
        hits:
          type: array
          items:
            type: object
            required: [id, type, name, score]
            properties:
              id:
                type: string
              type:
                type: string
              name:
                type: string
              via:
                type: string
              score:
                type: number

    IngestResponse:
      type: object
      required: [ok, document_id, title]
      properties:
        ok:
          type: boolean
          example: true
        document_id:
          type: string
        title:
          type: string
        entities_extracted:
          type: integer
        relations_extracted:
          type: integer
        kb_id:
          type: integer
        theme_label:
          type: string

    SupportBundleResponse:
      type: object
      required: [bundle_id, token, expires_at, download_url]
      properties:
        bundle_id:
          type: string
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        download_url:
          type: string
          format: uri

    ApiTokenInfo:
      type: object
      required: [id, name, scope, created_at, token_masked]
      properties:
        id:
          type: integer
        name:
          type: string
        scope:
          type: string
          enum: [owner, write, readonly]
        created_at:
          type: number
        expires_at:
          type: number
          nullable: true
        last_used_at:
          type: number
          nullable: true
        revoked_at:
          type: number
          nullable: true
        token_masked:
          type: string
          example: "cb_a1b2...y9z0"

    CreatedApiToken:
      type: object
      required: [id, token, name, scope, created_at]
      properties:
        id:
          type: integer
        token:
          type: string
          example: "cb_pcVteDtLVYThveppxAd3WXwGMzgtrz2YpkE9euOPgOw"
        name:
          type: string
        scope:
          type: string
        created_at:
          type: number
        expires_at:
          type: number
          nullable: true
        last_used_at:
          type: number
          nullable: true
        revoked_at:
          type: number
          nullable: true

    AccountSelf:
      type: object
      required: [public_id, username, display_name, role, scope, status, has_password, profile_public]
      properties:
        public_id:
          type: string
          description: Time-ordered 64-bit number as a decimal string.
          example: "117543901593604660"
        username:
          type: ['string', 'null']
          description: Null until first admin setup completes.
        display_name:
          type: string
        role:
          type: string
          enum: [admin, member]
        scope:
          type: string
          enum: [owner, write, readonly]
        status:
          type: string
          enum: [setup_required, active, suspended, deleting, purged]
        has_password:
          type: boolean
        profile_public:
          type: integer
          enum: [0, 1]
          description: 1 when the profile is public. The default is 0.
        locale:
          type: ['string', 'null']
          enum: [en, ko, null]
          description: Stored interface language of the account. Null is automatic negotiation.
        effective_locale:
          type: string
          enum: [en, ko]
          description: Interface language of this request (account, cookie, Accept-Language, CLAIRE_LANG, then en).
        entity_language:
          type: ['string', 'null']
          enum: [en, ko, ja, zh, null]
          description: Language of the entity names that the account sees in graph, node, document, and search responses. Null shows the stored main labels.

    AccountSummary:
      type: object
      required: [public_id, username, status, role, created_at, activated_at, theme_count]
      properties:
        public_id:
          type: string
          description: Time-ordered 64-bit number as a decimal string.
        username:
          type: ['string', 'null']
        status:
          type: string
          enum: [setup_required, active, suspended, deleting, purged]
        role:
          type: string
          enum: [admin, member]
        created_at:
          type: number
        activated_at:
          type: ['number', 'null']
        theme_count:
          type: integer

    ThemeCollectionRoot:
      type: object
      required: [id, type, totalItems, first]
      properties:
        id:
          type: string
          example: "https://claire.example.com/themes"
        type:
          type: string
          const: OrderedCollection
        totalItems:
          type: integer
          example: 3
        first:
          type: string
          example: "https://claire.example.com/themes?page=true"
        themes:
          type: array
          description: Legacy theme array retained during migration period (P2-P3).
          items:
            type: object
        default_kb_id:
          type: integer
          example: 0
        default_theme_number:
          type: ['string', 'null']
          example: "117543901593604660"
        multi_theme:
          type: boolean
          example: true

    ThemeCollectionPage:
      type: object
      required: [id, type, partOf, orderedItems]
      properties:
        id:
          type: string
          example: "https://claire.example.com/themes?page=true"
        type:
          type: string
          const: OrderedCollectionPage
        partOf:
          type: string
          example: "https://claire.example.com/themes"
        orderedItems:
          type: array
          items:
            $ref: '#/components/schemas/ThemeCollectionItem'
        next:
          type: string
          nullable: true
          example: "https://claire.example.com/themes?page=true&max_id=117543901593604660"
        prev:
          type: string
          nullable: true

    ThemeCollectionItem:
      type: object
      required: [number, url, label, is_personal, is_public, stats]
      properties:
        number:
          type: string
          description: 64-bit time-ordered theme number as decimal string.
          example: "117543901593604660"
        url:
          type: string
          example: "https://claire.example.com/themes/117543901593604660/"
        label:
          type: string
          example: "인공지능 연구"
        is_personal:
          type: boolean
        is_public:
          type: boolean
        stats:
          type: object
          properties:
            documents:
              type: integer
            entities:
              type: integer
            relations:
              type: integer
        legacy_hosts:
          type: array
          description: Legacy custom domain hosts migrating to single FQDN.
          items:
            type: object
            required: [host, activated_at]
            properties:
              host:
                type: string
                example: "ai.example.com"
              activated_at:
                type: number
              sunset_at:
                type: ['number', 'null']

