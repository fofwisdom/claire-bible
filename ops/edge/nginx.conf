# Edge service of Claire (docs/implementation/FEDERATION.md Section 10.1): one upstream for the external reverse proxy.
# The process has no root rights: each file that it writes is in /tmp.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Claire writes the access log (without the query string and without credentials). The edge writes none.
    access_log off;
    server_tokens off;
    # The edge sends the answer of the upstream without a change of its headers.
    include /tmp/edge.conf;
}
