# One federation path. The request goes to the upstream with its path, its query, its Host, its body, and its signature headers without a change: an HTTP signature covers them.
proxy_pass http://$claire_federation_upstream;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Connection "";
# The sidecar reads no forwarded header.
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Forwarded-Port "";
# Claire gets this path for a host that is not the app host. Its edge listener needs the address that the edge saw.
proxy_set_header X-Claire-Edge-Peer $remote_addr;
# The largest inbox body that the sidecar reads (INBOX_BODY_LIMIT_BYTES).
client_max_body_size 1m;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
