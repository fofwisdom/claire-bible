# The reverse proxy rules of a Claire server (docs/implementation/FEDERATION.md Section 10).
# This file is the one reference of the rules: the edge service includes it, and a gateway of a test network can include it.
#
# The server block that includes this file sets two variables. A value is the name of an upstream group, or a host and a port.
#   $claire_api_upstream         Claire.
#   $claire_federation_upstream  The sidecar for the app host. Claire for each other host: the federation paths are paths of the app host only.
#
# Do not send the prefix /.well-known/ to the sidecar: /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource are paths of Claire.

location = /.well-known/webfinger {
    include claire/federation_location.conf;
}

location = /.well-known/nodeinfo {
    include claire/federation_location.conf;
}

location ^~ /nodeinfo/ {
    include claire/federation_location.conf;
}

location ^~ /ap/ {
    include claire/federation_location.conf;
}

location / {
    include claire/api_location.conf;
}
