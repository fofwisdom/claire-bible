# All paths of Claire. Claire has its own limits for the request body, so the edge has none. An answer is not buffered: Claire sends NDJSON and event streams.
proxy_pass http://$claire_api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Connection "";
# The address of the peer of the edge: the external reverse proxy. Claire uses it as the peer address of the request. The edge sets the value itself, so a client cannot give it. The forwarded headers of the external reverse proxy go to Claire without a change.
proxy_set_header X-Claire-Edge-Peer $remote_addr;
client_max_body_size 0;
proxy_buffering off;
proxy_request_buffering off;
proxy_connect_timeout 5s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
