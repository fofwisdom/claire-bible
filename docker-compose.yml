name: "${CB_PROJECT_NAME:-claire-bible}"

x-claire-environment: &claire-environment
  CLAIRE_ENVIRONMENT: "${CLAIRE_ENVIRONMENT:?CLAIRE_ENVIRONMENT is required}"
  TZ: "${TZ:-}"

x-claire-service: &claire-service
  image: "${CB_IMAGE:-claire-bible}:${CB_IMAGE_TAG:-local}"
  build:
    context: .
  restart: unless-stopped
  environment: *claire-environment
  env_file:
    - "${CB_ENV_FILE:-.env}"
  volumes:
    - "${CB_DATA_DIR:-./data}:/app/data"
    - "${CB_VAULT_DIR:-./vault}:/app/vault"
    - /etc/localtime:/etc/localtime:ro

services:
  bot:
    <<: *claire-service
    profiles:
      - bot
    command: ["claire", "bot"]

  api:
    <<: *claire-service
    environment:
      <<: *claire-environment
      CLAIRE_INJECT_HOST: "0.0.0.0"
      CLAIRE_INJECT_PORT: "${CB_API_PORT:?CB_API_PORT is required}"
    ports:
      - "${CB_API_BIND:?CB_API_BIND is required}:${CB_API_PORT:?CB_API_PORT is required}:${CB_API_PORT:?CB_API_PORT is required}"
    command: ["claire", "serve-api"]
    healthcheck:
      test: ["CMD", "claire", "liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  refresh:
    <<: *claire-service
    command:
      - claire
      - refresh-loop
      - --interval
      - "${CB_REFRESH_INTERVAL:-3600}"
      - --batch
      - "${CB_REFRESH_BATCH:-5}"

  recover:
    <<: *claire-service
    command:
      - claire
      - recover-loop
      - --interval
      - "${CB_RECOVER_INTERVAL:-600}"
      - --batch
      - "${CB_RECOVER_BATCH:-5}"
      - --max-attempts
      - "${CB_RECOVER_MAX_ATTEMPTS:-5}"
      - --base-delay
      - "${CB_RECOVER_BASE_DELAY:-300}"

  expand:
    <<: *claire-service
    command:
      - claire
      - expand-loop
      - --interval
      - "${CB_EXPAND_INTERVAL:-900}"
      - --batch
      - "${CB_EXPAND_BATCH:-3}"
