name: "${CB_PROJECT_NAME:-claire-bible}"

x-claire-environment: &claire-environment
  CLAIRE_APP_ROOT: "/app"
  CLAIRE_ENVIRONMENT: "${CLAIRE_ENVIRONMENT:?CLAIRE_ENVIRONMENT is required}"
  CLAIRE_BUILD_COMMIT: "${CLAIRE_BUILD_COMMIT:-unknown}"
  CLAIRE_IMAGE_TAG: "${CB_IMAGE_TAG:-local}"
  TZ: "${TZ:-}"
  CB_UID: "${CB_UID:-1000}"
  CB_GID: "${CB_GID:-1000}"
  SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
  SSL_CERT_DIR: "/etc/ssl/certs"
  REQUESTS_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"
  CURL_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"

x-claire-service: &claire-service
  image: "${CB_IMAGE:-claire-bible}:${CB_IMAGE_TAG:-local}"
  build:
    context: .
    args:
      CLAIRE_BUILD_COMMIT: "${CLAIRE_BUILD_COMMIT:-unknown}"
      CLAIRE_IMAGE_TAG: "${CB_IMAGE_TAG:-local}"
  shm_size: "1gb"
  restart: unless-stopped
  environment: *claire-environment
  env_file:
    - "${CB_ENV_FILE:-.env}"
  volumes:
    - "${CB_DATA_DIR:-./data}:/app/data"
    - "${CB_VAULT_DIR:-./vault}:/app/vault"
    - "${CB_GEMINI_DIR:-~/.gemini}:/root/.gemini"
    - "${CB_CODEX_DIR:-~/.codex}:/root/.codex"
    - "${CB_BIN_DIR:-~/.local/bin}:/host-bin:ro"
    - "${CB_CERTS_DIR:-./certs}:/extra-certs:ro"

services:
  bot:
    <<: *claire-service
    # 계정별 텔레그램 봇은 WebUI에서 등록하므로 봇 러너는 항상 실행한다. 등록된 봇이 없으면 대기만 한다.
    environment:
      <<: *claire-environment
      CLAIRE_SUPPORT_BUNDLE_API_URL: "http://api:${CB_API_PORT:?CB_API_PORT is required}"
    command: ["claire", "bot"]
    stop_grace_period: 20s

  api:
    <<: *claire-service
    environment:
      <<: *claire-environment
      CLAIRE_INJECT_HOST: "0.0.0.0"
      CLAIRE_INJECT_PORT: "${CB_API_PORT:?CB_API_PORT is required}"
    ports:
      - "${CB_API_BIND:?CB_API_BIND is required}:${CB_API_PORT:?CB_API_PORT is required}:${CB_API_PORT:?CB_API_PORT is required}"
    command: ["claire", "serve-api"]
    healthcheck:
      test: ["CMD", "claire", "liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  refresh:
    <<: *claire-service
    command:
      - claire
      - refresh-loop
      - --interval
      - "${CB_REFRESH_INTERVAL:-3600}"
      - --batch
      - "${CB_REFRESH_BATCH:-5}"

  recover:
    <<: *claire-service
    command:
      - claire
      - recover-loop
      - --interval
      - "${CB_RECOVER_INTERVAL:-600}"
      - --batch
      - "${CB_RECOVER_BATCH:-5}"
      - --max-attempts
      - "${CB_RECOVER_MAX_ATTEMPTS:-5}"
      - --base-delay
      - "${CB_RECOVER_BASE_DELAY:-300}"

  expand:
    <<: *claire-service
    command:
      - claire
      - expand-loop
      - --interval
      - "${CB_EXPAND_INTERVAL:-900}"
      - --batch
      - "${CB_EXPAND_BATCH:-3}"

  # Fedify sidecar (design docs/design/ACCOUNT_IDP_AND_FEDIFY_SIDECAR_INTEGRATION_DESIGN.md, Sections 4.2 and 6.1).
  # The service starts only when the Compose profile `federation` is active. cb-manuscript activates the profile when CB_FEDERATION=1.
  # The service has no env_file: the secrets of Claire in .env do not go into this container.
  # The process uses the uid and gid of the Claire services (CB_UID, CB_GID). Thus it can read the service key (mode 0600), connect to the socket (mode 0660), and write data/fedify/.
  # The mounts are the socket directory, data/fedify/, and the service key file only. Do not add data/auth/ as a directory. Do not add the Claire database.
  # `create_host_path: false` stops the start when a source path does not exist. Docker must not make these paths as root.
  # The reverse proxy sends these public paths to this service: exact /.well-known/webfinger, exact /.well-known/nodeinfo, prefix /nodeinfo/, prefix /ap/.
  fedify:
    profiles: ["federation"]
    image: "${CB_FEDIFY_IMAGE:-claire-bible-fedify}:${CB_IMAGE_TAG:-local}"
    build:
      context: sidecar/fedify
    restart: unless-stopped
    user: "${CB_UID:-1000}:${CB_GID:-1000}"
    environment:
      TZ: "${TZ:-}"
      CLAIRE_FEDIFY_SOCKET: "/data/run/federation.sock"
      CLAIRE_FEDIFY_SERVICE_KEY_FILE: "/data/auth/fedify_service.key"
      CLAIRE_FEDIFY_DB: "/data/fedify/fedify.db"
      CLAIRE_FEDIFY_HOST: "0.0.0.0"
      CLAIRE_FEDIFY_PORT: "8790"
    ports:
      - "${CB_API_BIND:?CB_API_BIND is required}:${CB_FEDIFY_PORT:-8790}:8790"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - type: bind
        source: "${CB_DATA_DIR:-./data}/run"
        target: /data/run
        bind:
          create_host_path: false
      - type: bind
        source: "${CB_DATA_DIR:-./data}/fedify"
        target: /data/fedify
        bind:
          create_host_path: false
      - type: bind
        source: "${CB_DATA_DIR:-./data}/auth/fedify_service.key"
        target: /data/auth/fedify_service.key
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 20s
