[project]
name = "claire"
version = "0.1.0"
description = "Telegram-fed personal knowledge base: scrape -> Gemini structure -> Palantir-style ontology graph (hybrid SQLite + Obsidian vault)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-telegram-bot>=21.0",
    "google-genai>=2.3.0",
    "lxml>=5.0",
    "youtube-transcript-api>=0.6",
    "python-slugify>=8.0",
    "pypdf>=4.0",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.51,<1",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.3"]
# 반봇/JS 페이지 스텔스 스크래핑(에스컬레이션 경로).
# scrapling[fetchers] = curl-cffi/browserforge 등 — Fetcher(헤더위장, 브라우저 불필요)로
# openai.com 같은 봇차단 403 우회.
# nodriver = CDP(Chrome DevTools Protocol) 직접 제어 — JS SPA(해시라우팅 등) 렌더링용
# 최후수단. Playwright/patchright 의존 없이 시스템 Chromium 바이너리만 필요(이미지 경량).
stealth = ["scrapling[fetchers]>=0.4", "nodriver>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx2>=2.7,<3"]

[project.scripts]
claire = "claire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/claire"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "src"]
