[project]
name = "claire-bible"
version = "0.1.0"
description = "Claire Bible: Telegram-fed personal knowledge base: scrape -> Gemini structure -> Palantir-style ontology graph (hybrid SQLite + Obsidian vault)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.27",
    "python-telegram-bot>=22.8",
    "google-genai>=3.3",
    "lxml>=6.1",
    "youtube-transcript-api>=1.2",
    "python-slugify>=9.0",
    "pypdf>=7.1",
    "pypdfium2>=5.15",
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
    "mcp>=2.3",
    "zstandard>=0.25",
    "beautifulsoup4>=4.15",
    "cryptography>=50.0",
    "nh3>=0.3.7",
    "publicsuffixlist>=1.0",
]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.9"]
# 반봇/JS 페이지 스텔스 스크래핑(에스컬레이션 경로).
# scrapling[fetchers] = 정적 Fetcher의 curl-cffi/browserforge 헤더 위장과
# DynamicFetcher의 시스템 Chromium 제어를 한 경계에서 제공한다.
stealth = ["scrapling[fetchers]>=0.5.1"]
audio = ["yt-dlp[curl-cffi]>=2024.8.0"]
# 한국어 형태소 분석 검색 (Apache 2.0 라이선스 보장 버전 고정)
ko = ["kiwipiepy>=0.24.1"]
dev = ["pytest>=9.2", "pytest-asyncio>=1.5", "httpx2>=2.16,<3", "pytest-xdist>=3.8", "pytest-timeout>=2.4"]

[project.scripts]
claire = "claire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/claire"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "src"]
