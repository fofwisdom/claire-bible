[project]
name = "claire-bible"
version = "0.1.0"
description = "Claire Bible: Multi-source personal and shared knowledge base and ontology knowledge graph engine (SQLite, AsciiDoc AOT, MCP, ActivityPub)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.27",
    "python-telegram-bot>=22.8",
    "google-genai>=3.6",
    "lxml>=6.1",
    "youtube-transcript-api>=1.2",
    "python-slugify>=9.2",
    "pypdf>=7.1",
    "pypdfium2>=5.15",
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
    "mcp>=2.3",
    "beautifulsoup4>=4.15",
    "cryptography>=50.0",
    "nh3>=0.3.8",
    "publicsuffixlist>=1.0",
]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.9"]
# 반봇/JS 페이지 스텔스 스크래핑(에스컬레이션 경로).
# scrapling[fetchers] = 정적 Fetcher의 curl-cffi/browserforge 헤더 위장과
# DynamicFetcher의 시스템 Chromium 제어를 한 경계에서 제공한다.
stealth = ["scrapling[fetchers]>=0.5.1"]
audio = ["yt-dlp[curl-cffi]>=2024.8.0"]
# 한국어 형태소 분석 검색 (Apache 2.0 라이선스 보장 버전 고정)
ko = ["kiwipiepy>=0.25.1"]
dev = ["pytest>=9.2", "pytest-asyncio>=1.5", "httpx2>=2.16,<3", "pytest-xdist>=3.8", "pytest-timeout>=2.4", "ty>=0.0.107"]

[project.scripts]
claire = "claire_bible.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/claire", "src/bible", "src/claire_bible"]
sources = ["src"]

# Type check: `ty check` (scripts/ci.sh, step 4). ty-baseline.json records the diagnostics that existed when the check started (2026-11-22). A diagnostic that is not in the file fails the check. After a fix, or after a ty upgrade that changes the result, write the file again with `ty check --update-baseline` in the environment of scripts/ci.sh.
[tool.ty]
baseline = "ty-baseline.json"

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
asyncio_mode = "auto"
pythonpath = [".", "src"]
