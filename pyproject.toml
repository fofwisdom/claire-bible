[project]
name = "claire"
version = "0.1.0"
description = "Telegram-fed personal knowledge base: scrape -> Gemini structure -> Palantir-style ontology graph (hybrid SQLite + Obsidian vault)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-telegram-bot>=21.0",
    "google-genai>=0.3",
    "lxml>=5.0",
    "youtube-transcript-api>=0.6",
    "python-slugify>=8.0",
    "pypdf>=4.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.3"]
# 반봇/JS 페이지 스텔스 스크래핑(에스컬레이션 경로). 브라우저는 `scrapling install` 필요.
stealth = ["scrapling>=0.2", "curl-cffi>=0.7", "playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
claire = "claire.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/claire"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
