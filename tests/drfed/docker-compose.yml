# Development test only. Do not use this file for a deployment.
# DrFed 0.1.0 (a test server for ActivityPub implementations) behind a TLS gateway, as a model of a remote ActivityPub server:
# - The network `backend` is internal. Only DrFed and the gateway are on it. DrFed listens on its address of `backend` only and has no published port.
# - The network `edge` is the side that a client sees. Only port 443 of the gateway (TLS, a wildcard certificate of a private certificate authority) is the way in.
#   Port 8080 of the gateway (no TLS) is the public origin of the Claire server under test, when the profile `claire` runs.
# - The service `dns` answers the root name and each name below it with the address of the gateway (each DrFed server has a subdomain of the root origin). A container on `edge` uses it with `dns:`.
# - DrFed is on `edge` only for its requests to other servers (it reads the actor of a sender to verify an HTTP signature).
# tests/drfed_stack.py writes the certificates to CB_DRFED_RUN_DIR and starts this stack.
name: "${CB_DRFED_PROJECT:-claire-drfed-test}"

services:
  drfed:
    build:
      context: .
      dockerfile: Dockerfile
    image: claire-drfed-test:0.1.0
    # The account must exist before the server starts: PGlite gives the data directory to one process only.
    command:
      - sh
      - -c
      - >-
        drfed-account create --data-path /data/pg --migrate --email "$$DRFED_EMAIL" --name "Claire Test" &&
        exec drfed-server --root-origin "https://$$DRFED_ROOT_NAME" --listen "${CB_DRFED_BACKEND_PREFIX:?}.4:8888" --data-path /data/pg --mail-log-content --log-level info
    environment:
      DRFED_EMAIL: "${CB_DRFED_EMAIL:?CB_DRFED_EMAIL is required}"
      DRFED_ROOT_NAME: "${CB_DRFED_ROOT_NAME:-drfed.test}"
      # The certificate authority of the test stack, for the requests of DrFed to other test servers behind the gateway.
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
    volumes:
      - "${CB_DRFED_RUN_DIR:?CB_DRFED_RUN_DIR is required}/tls/ca.crt:/tls/ca.crt:ro"
    tmpfs:
      - /data
    dns:
      - "${CB_DRFED_EDGE_PREFIX:?}.3"
    networks:
      backend:
        ipv4_address: "${CB_DRFED_BACKEND_PREFIX:?}.4"
        # The gateway uses this name: it resolves only to the address of `backend`, where DrFed listens.
        aliases:
          - drfed-backend
      edge:
        ipv4_address: "${CB_DRFED_EDGE_PREFIX:?}.4"

  gateway:
    image: "${CB_DRFED_GATEWAY_IMAGE:-nginx:1.27-alpine}"
    depends_on:
      - drfed
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - "${CB_DRFED_RUN_DIR:?CB_DRFED_RUN_DIR is required}/tls:/tls:ro"
    networks:
      backend:
        ipv4_address: "${CB_DRFED_BACKEND_PREFIX:?}.2"
      edge:
        ipv4_address: "${CB_DRFED_EDGE_PREFIX:?}.2"
    # The loopback port is for manual work on the host. The automatic tests use the address of the gateway on the network `edge`.
    ports:
      - "127.0.0.1:${CB_DRFED_HOST_PORT:-0}:443"

  dns:
    build:
      context: .
      dockerfile: dns.Dockerfile
    image: claire-drfed-test-dns:1
    # `--address=/name/ip` answers the name and each name below it. `--local=/name/` gives an empty answer for the other record types (IPv6), so that a resolver does not fail. No request goes to an other DNS server.
    command: ["dnsmasq", "--keep-in-foreground", "--no-resolv", "--no-hosts", "--log-facility=-", "--local=/${CB_DRFED_ROOT_NAME:-drfed.test}/", "--address=/${CB_DRFED_ROOT_NAME:-drfed.test}/${CB_DRFED_EDGE_PREFIX:?}.2"]
    networks:
      edge:
        ipv4_address: "${CB_DRFED_EDGE_PREFIX:?}.3"

  # The Fedify sidecar of the Claire server under test (profile `claire`). The Claire process runs on the host; the sidecar reaches it through the Unix socket in the data directory of that process, as in a deployment.
  # The sidecar is a container because it must resolve the names below the root origin (the service `dns`); a process on the host uses the DNS of the host.
  sidecar:
    profiles:
      - claire
    build:
      context: ../../sidecar/fedify
    image: claire-fedify-drfed-test:1
    user: "${CB_DRFED_UID:-1000}:${CB_DRFED_GID:-1000}"
    environment:
      CLAIRE_FEDIFY_SOCKET: /data/run/federation.sock
      CLAIRE_FEDIFY_SERVICE_KEY_FILE: /data/auth/fedify_service.key
      CLAIRE_FEDIFY_DB: /data/fedify/fedify.db
      CLAIRE_FEDIFY_HOST: 0.0.0.0
      CLAIRE_FEDIFY_PORT: "8790"
      # The certificate authority of the test stack. Deno reads this variable at its start.
      DENO_CERT: /tls/ca.crt
    volumes:
      - "${CB_DRFED_CLAIRE_DATA:-/nonexistent}/run:/data/run"
      - "${CB_DRFED_CLAIRE_DATA:-/nonexistent}/fedify:/data/fedify"
      - "${CB_DRFED_CLAIRE_DATA:-/nonexistent}/auth/fedify_service.key:/data/auth/fedify_service.key:ro"
      - "${CB_DRFED_RUN_DIR:?CB_DRFED_RUN_DIR is required}/tls/ca.crt:/tls/ca.crt:ro"
    dns:
      - "${CB_DRFED_EDGE_PREFIX:?}.3"
    networks:
      backend:
        aliases:
          - claire-sidecar
      edge:

  # A client on the network `edge` only. The tests use it to show which ports a remote server can reach.
  probe:
    image: "${CB_DRFED_GATEWAY_IMAGE:-nginx:1.27-alpine}"
    profiles:
      - probe
    entrypoint: ["sh", "-c"]
    dns:
      - "${CB_DRFED_EDGE_PREFIX:?}.3"
    networks:
      - edge

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: "${CB_DRFED_BACKEND_PREFIX:?}.0/24"
  edge:
    ipam:
      config:
        - subnet: "${CB_DRFED_EDGE_PREFIX:?}.0/24"
