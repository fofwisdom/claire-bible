# Development test only. TLS gateway in front of DrFed (tests/drfed/docker-compose.yml).
events {}

http {
    server_tokens off;
    access_log off;

    # The root origin and each instance (a subdomain of the root origin) use one wildcard certificate.
    server {
        listen 443 ssl default_server;
        ssl_certificate /tls/server.crt;
        ssl_certificate_key /tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 2m;

        location / {
            proxy_pass http://drfed-backend:8888;
            proxy_http_version 1.1;
            # DrFed selects the instance from the Host header. It ignores the forwarded headers, thus the gateway sends the Host header as it came.
            proxy_set_header Host $http_host;
        }
    }

    # The public origin of the Claire instance under test. Claire in the development environment has a public address with http and an IPv4 address (the rule of `WebRuntimeConfig`), thus this server has no TLS: `http://{address of the gateway on edge}:8080`. The federation paths go to the Fedify sidecar of Claire (the service `sidecar`, profile `claire`). DrFed reads the actor and the keys of Claire here.
    server {
        listen 8080;
        client_max_body_size 2m;
        # The sidecar starts after the gateway, thus the name is resolved for each request.
        resolver 127.0.0.11 valid=5s;

        location / {
            set $claire_sidecar http://claire-sidecar:8790;
            proxy_pass $claire_sidecar;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }
    }
}
