# Development test only. TLS gateway in front of the S3 API of Garage (tests/garage/docker-compose.yml).
events {}

http {
    server_tokens off;
    access_log off;

    server {
        listen 3900 ssl;
        ssl_certificate /tls/server.crt;
        ssl_certificate_key /tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Garage controls the object size. The gateway does not keep the body.
        client_max_body_size 0;
        proxy_request_buffering off;

        location / {
            proxy_pass http://garage:3900;
            proxy_http_version 1.1;
            # The SigV4 signature includes the host and the port that the client used.
            proxy_set_header Host $http_host;
        }
    }
}
