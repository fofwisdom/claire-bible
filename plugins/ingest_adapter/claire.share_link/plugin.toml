# Manifest: docs/implementation/INGESTION.md section 2.2
manifest = 1
id = "claire.share_link"
type = "ingest_adapter"
revision = 2
core_commit = "9b28e063c7cc7dd98706d8112466695015ce8b5d"
api = 1
entry = "adapter:register"
license = "MIT"
maturity = "stable"
maintainers = []

[text.en]
name = "Share links"
description = "Finds the destination of a share link (share.google and other hosts that start with share.) and routes the destination again. Google share pages use a JavaScript redirect; the adapter reads the destination from the page."

[text.ko]
name = "공유 링크"
description = "공유 링크(share.google 등 share.로 시작하는 호스트)의 목적지를 찾아 다시 라우팅한다. 구글 공유 페이지는 자바스크립트 리다이렉트를 쓰므로 페이지에서 목적지를 읽는다."

[[provides]]
kind = "fetcher"
name = "share_link"
priority = 100
hosts = ["*"]
source_types = []

[permissions]
