name = "HoYoLAB · HoYoWiki"
description = "HoYoLAB 커뮤니티 글과 HoYoWiki 항목을 공개 API로 가져온다. 글의 이미지는 비전 프로바이더로 설명하고, wiki-crawl 명령이 있다."

