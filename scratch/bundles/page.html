/* --- Claire Bible: Document Reader, Content & STT Modal CSS --- */

/* 2단 보기 및 데스크톱: 크게 읽기가 기본 노출, 그래프는 호출 시에만 노출 */
  body:not([data-center-view="graph"]) #netwrap{display:none!important}
  body:not([data-center-view="graph"]) #reader{display:flex!important}
  body[data-center-view="graph"] #reader{display:none!important}
  body[data-center-view="graph"] #netwrap{display:flex!important}

  /* 중앙 화면 모드에 따른 고유 표시 */
  body[data-center-view="graph"] #pathbtn{display:inline-flex!important}
  body:not([data-center-view="graph"]) #pathbtn{display:none!important}

  /* 데스크톱/노트북 (중간 폭): 1100px 이하에서는 우측 패널을 drawer 로 (2단 보기 지원, 하단 바 비사용) */

/* --- 포맷 중립 문서 본문(Markdown/AsciiDoc, 읽기 팝업 + 패널 detail) --- */
  .doc-content{line-height:1.75;font-size:14px;word-break:keep-all;overflow-wrap:break-word}
  #reader .rbody .doc-content{font-size:var(--read-fs,16px)}
  .doc-content h1{font-size:1.5em} .doc-content h2{font-size:1.3em;margin:1.1em 0 .4em;border-bottom:1px solid var(--border);padding-bottom:.2em}
  .doc-content h3{font-size:1.12em;margin:1em 0 .35em;color:var(--fg);border:0}
  .doc-content p{margin:.6em 0} .doc-content > p{text-align:justify;text-align-last:start;text-justify:auto;text-indent:1em} .doc-content > p:has(> img:only-child),.doc-content > p:has(> a:only-child > img:only-child){text-indent:0}
  .doc-content ul,.doc-content ol{margin:.5em 0;padding-left:1.5em} .doc-content li{margin:.3em 0}
  .doc-content strong{color:var(--fg)} .doc-content a{color:var(--accent)}
  .doc-content img{max-width:100%;height:auto;display:block;margin:.8em auto;border-radius:6px;border:1px solid var(--border)}
  .doc-content em{color:var(--muted)} .doc-content blockquote{margin:.6em 0;padding:.2em .9em;border-left:3px solid var(--border);color:var(--muted);font-family:'Noto Serif KR','Noto Serif Korean',Georgia,'Times New Roman',serif}
  .doc-content code{background:var(--chip-bg);padding:.1em .35em;border-radius:3px;font-size:.9em;font-family:'D2Coding','D2 Coding','SFMono-Regular',Menlo,Monaco,Consolas,'Liberation Mono',monospace}
  .doc-content pre{background:var(--card-bg);border:1px solid var(--border);border-radius:6px;padding:.8em;overflow-x:auto;max-width:100%;box-sizing:border-box}
  .doc-content pre code{background:transparent;padding:0;border-radius:0;font-size:inherit;font-family:'D2Coding','D2 Coding','SFMono-Regular',Menlo,Monaco,Consolas,'Liberation Mono',monospace}
  .doc-content table{border-collapse:collapse;margin:.6em 0;width:100%;max-width:100%;display:block;overflow-x:auto;box-sizing:border-box} .doc-content th,.doc-content td{border:1px solid var(--border);padding:.35em .65em}
  .doc-content th{background:var(--chip-bg);font-weight:600}
  .doc-content table td ul,.doc-content table td ol{padding-left:1.2em;margin:.2em 0}
  .doc-content table td li{margin:.15em 0}
  .doc-content li > p{margin:.3em 0}
  .doc-content li > p:first-child{margin-top:0}
  .doc-content li > p:last-child{margin-bottom:0}
  /* --- AsciiDoc & Markdown 확장 스타일 --- */
  .doc-content .admonitionblock{margin:1em 0;border-left:4px solid var(--accent);background:var(--card-bg);border-radius:6px;padding:.6em 1em}
  .doc-content .admonitionblock.note{border-left-color:var(--accent)}
  .doc-content .admonitionblock.important{border-left-color:#8250df}
  [data-theme="dark"] .doc-content .admonitionblock.important{border-left-color:#a371f7}
  .doc-content .admonitionblock.tip{border-left-color:var(--accent2)}
  .doc-content .admonitionblock.warning{border-left-color:#cf222e}
  [data-theme="dark"] .doc-content .admonitionblock.warning{border-left-color:#f85149}
  .doc-content .admonitionblock.caution{border-left-color:var(--rel)}
  .doc-content .admonitionblock .title,.doc-content .admonitionblock td.icon{font-weight:700;margin-bottom:.3em;text-transform:uppercase;font-size:.85em;letter-spacing:.03em;color:var(--muted)}
  .doc-content .quoteblock{margin:1.1em 0;padding:.6em 1.1em;border-left:3px solid var(--accent);background:var(--card-bg);border-radius:0 6px 6px 0}
  .doc-content .quoteblock blockquote{margin:0;padding:0;border:none;color:var(--fg);font-family:'Noto Serif KR','Noto Serif Korean',Georgia,'Times New Roman',serif}
  .doc-content .quoteblock .attribution{margin-top:.4em;font-size:.85em;color:var(--muted);text-align:right}
  .doc-content .colist{margin:.5em 0;padding-left:1.2em;font-size:.9em;font-family:'D2Coding','D2 Coding','SFMono-Regular',Menlo,Monaco,Consolas,'Liberation Mono',monospace}
  .doc-content .conum{display:inline-block;background:var(--accent);color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;font-size:11px;font-weight:bold;margin-right:4px;vertical-align:middle;font-family:'D2Coding','D2 Coding',monospace}
  .doc-content .imageblock{margin:1em auto;text-align:center}
  .doc-content .imageblock img{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:6px;border:1px solid var(--border)}

  .doc-content .lead{font-size:1.1em;line-height:1.6;font-weight:500;color:var(--fg)}

  /* --- 중앙 크게 읽기 (2단 보기 및 기본 중앙 패널 / 모바일 읽기) --- */
  #reader{width:100%;height:100%;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--bg);--read-fs:16px}
  #reader .sheet{background:var(--bg);color:var(--fg);width:100%;height:100%;min-width:0;min-height:0;border-radius:0;border:0;box-shadow:none;padding:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
  #reader .head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 18px;border-bottom:1px solid var(--border);background:var(--bar-bg);position:sticky;top:0;z-index:1;min-height:48px}
  #reader .head h1{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #reader .head .rmeta{color:var(--muted);font-size:11.5px;margin-left:6px;font-weight:normal}
  #reader .rtools{display:flex;align-items:center;gap:6px;flex-shrink:0}
  #reader .rzoom{display:flex;align-items:center;gap:2px}
  #reader .rzoom button{background:var(--sec-bg);color:var(--sec-fg);border:1px solid var(--border);border-radius:4px;font-size:13px;line-height:1;padding:4px 8px;cursor:pointer}
  #reader .rzoom .fsv{color:var(--muted);font-size:11.5px;min-width:24px;text-align:center}
  #reader .rclose{background:var(--sec-bg);color:var(--sec-fg);border:1px solid var(--border);border-radius:4px;font-size:15px;line-height:1;padding:4px 8px;cursor:pointer;display:none}
  #reader .sharebox{display:none;margin:10px 24px 0;padding:8px 12px;background:var(--active);border:1px solid var(--accent);border-radius:6px;font-size:12px;gap:8px;align-items:center}
  #reader .sharebox.on{display:flex} #reader .sharebox input{flex:1;min-width:0}
  #reader .sharebox button{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:3px 9px;font-size:12px;cursor:pointer}
  #reader .head .redit,#reader .head .rshare{background:var(--sec-bg);color:var(--sec-fg);border:1px solid var(--border);border-radius:4px;font-size:13px;line-height:1;padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;height:28px;box-sizing:border-box}

  #reader .head #opengraphbtn{

    line-height:1;cursor:pointer;flex-shrink:0;white-space:nowrap;user-select:none;
    transition:background .15s ease,border-color .15s ease
  }
  #barsearch #openreaderbtn:hover,#reader .head #opengraphbtn:hover{background:var(--hover);border-color:var(--accent)}
  #reader .rbody-wrap{position:relative;flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  #reader .rbody{padding:16px 42px max(28px,env(safe-area-inset-bottom)) 28px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;flex:1;min-height:0;min-width:0;max-width:100%;box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
  #reader .rbody::-webkit-scrollbar{display:none}
  #reader .rbody:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
  #reader .rbody:focus:not(:focus-visible){outline:none}
  .doc-content table:focus-visible,.doc-content pre:focus-visible,.doc-content .mathblock:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
  #reader .rsection{color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin:1.2em 0 .2em}

  /* --- 우측 슬림 마름모 바 & 탄성 확장 헤딩 내비게이션 레일 --- */
  .cb-heading-rail{
    position:absolute;right:8px;top:14px;bottom:max(16px,env(safe-area-inset-bottom));
    width:28px;height:auto;
    display:none;align-items:center;justify-content:center;
    z-index:15;touch-action:none;user-select:none;
    opacity:1;transition:opacity .2s ease;
  }
  .cb-heading-rail.visible{display:flex}
  #srail{position:fixed}
  .cb-heading-rail.is-expanding .cb-rail-track{width:6px;background:rgba(128,128,128,0.5)}
  .cb-rail-track{
    position:relative;width:3.5px;height:100%;
    background:rgba(128,128,128,0.22);border-radius:9999px;
    cursor:pointer;transition:width .2s,background .2s;
  }
  .cb-heading-rail:hover .cb-rail-track,
  .cb-heading-rail.is-expanding .cb-rail-track{
    width:5px;background:rgba(128,128,128,0.4);
  }
  .cb-rail-fill{
    position:absolute;top:0;left:0;right:0;height:0%;
    background:var(--accent);border-radius:9999px;
    pointer-events:none;box-shadow:0 0 6px var(--accent);
  }
  .cb-diamond-layer{
    position:absolute;top:0;bottom:0;left:0;right:0;pointer-events:none;
  }
  .cb-diamond-marker{
    position:absolute;left:50%;transform:translate(-50%,-50%);
    pointer-events:auto;cursor:pointer;z-index:20;
    display:flex;align-items:center;justify-content:center;
    transition:top .25s cubic-bezier(0.16,1,0.3,1),transform .15s ease;
  }
  .cb-diamond-shape{
    transform:rotate(45deg);border-radius:1.5px;
    background:var(--bg,#0e1116);border:1.5px solid var(--muted,#8b949e);
    transition:all .2s cubic-bezier(0.16,1,0.3,1);
  }
  .cb-marker-h1 .cb-diamond-shape, .cb-marker-rsec .cb-diamond-shape{
    width:9px;height:9px;border:1.8px solid var(--accent);background:var(--card-bg,#161b22);
  }
  .cb-marker-h2 .cb-diamond-shape{
    width:7.5px;height:7.5px;border:1.5px solid var(--muted);
  }
  .cb-marker-h3 .cb-diamond-shape, .cb-marker-h4 .cb-diamond-shape{
    width:5.5px;height:5.5px;border:1.2px solid var(--muted);opacity:0.75;
  }
  .cb-diamond-marker:hover .cb-diamond-shape{
    transform:rotate(45deg) scale(1.35);
    background:var(--accent);border-color:#ffffff;box-shadow:0 0 8px var(--accent);
  }
  .cb-diamond-marker.active .cb-diamond-shape{
    transform:rotate(45deg) scale(1.4);
    background:var(--accent);border-color:#ffffff;box-shadow:0 0 10px var(--accent);
  }
  .cb-diamond-marker.scrub-focus .cb-diamond-shape{
    transform:rotate(45deg) scale(1.8);
    background:var(--accent2,#3fb950)!important;border-color:#ffffff!important;
    box-shadow:0 0 12px var(--accent2,#3fb950)!important;
  }
  .cb-diamond-tooltip{
    position:absolute;right:18px;
    background:var(--card-bg,#161b22);border:1px solid var(--border,#30363d);
    border-left:3px solid var(--accent);color:var(--fg,#e6edf3);
    font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;
    white-space:nowrap;pointer-events:none;opacity:0;
    transform:translateX(6px);transition:all .15s ease;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
    max-width:240px;overflow:hidden;text-overflow:ellipsis;
  }
  .cb-diamond-marker:hover .cb-diamond-tooltip,
  .cb-diamond-marker.scrub-focus .cb-diamond-tooltip{
    opacity:1;transform:translateX(0);
  }

/* STT 전사 열기 모달 */
  #sttmodal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:70;background:rgba(0,0,0,0.65);display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));backdrop-filter:blur(4px);box-sizing:border-box}

/* --- Shared Page & General Reader Elements --- */
html.shared-page, body.shared-page,
html:has(#srail), body:has(#srail){
  height:auto;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  overflow-y:auto;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
html.shared-page::-webkit-scrollbar, body.shared-page::-webkit-scrollbar,
html:has(#srail)::-webkit-scrollbar, body:has(#srail)::-webkit-scrollbar{
  display:none;
}
body.shared-page, body:has(#srail){
  display:block;
}
body.shared-page.stt-modal-open, body:has(#srail).stt-modal-open{
  overflow:hidden;
}

<script id="docdata" type="application/json">{"id": "doc_75a9fbc16321", "title": "생성형 AI의 노동시장 영향 2026. 9. 국회예산정책처Ⅰ경제현안분석Ⅰ제110호", "url": "https://www.nabo.go.kr/board/file/down.do?fid=33319528", "source_type": "pdf", "summary": "국회예산정책처는 국내 화이트칼라 재직자 설문조사를 바탕으로 직업별 생성형 AI 노출도를 산출하고 2018년부터 2026년까지의 행정데이터 및 마이크로데이터를 통해 노동시장 영향을 실증 분석하였다. 분석 결과 생성형 AI가 핵심연령대 및 20대 청년층의 고용, 채용, 월평균 임금에 통계적으로 유의미한 부정적 영향을 미쳤다는 일관된 증거는 발견되지 않았다. 최근 관측된 IT 및 전문직 청년 고용 둔화는 생성형 AI의 직접적 대체 효과라기보다 팬데믹 이후의 산업경기 둔화, 통화 긴축, 원격근무 확산 등 경기순환적 및 외부 요인이 복합 작용한 결과로 해석된다.", "detail": "", "detail_format": "md", "detail_html": "", "hidden": false, "extra_sources": [], "fetched_at": 1790214821.813676, "nodes": [{"id": "ent_de18a6e1c25d", "label": "생성형 AI의 노동시장 영향 (2026. 9.)", "group": "Paper", "observations": ["국회예산정책처 경제분석국에서 2026년 9월 발간한 경제현안분석 제110호 연구보고서이다.", "재직자 설문조사를 통해 소분류 직업별 생성형 AI 노출도를 산출하고, 2018년부터 2026년까지의 고용행정통계 및 지역별고용조사 마이크로데이터를 이벤트 스터디와 합성 이중차분법(SDID)으로 실증 분석하였다.", "생성형 AI의 확산이 핵심연령대 및 20대 청년층의 고용, 채용, 월평균 임금에 일관된 부정적 영향을 미쳤다는 유의미한 통계적 증거를 발견하지 못했다고 결론지었다."]}, {"id": "ent_474dd5960e54", "label": "국회예산정책처", "group": "Org", "observations": ["대한민국 국회의 의정활동 및 예산·법안 심사를 객관적 분석정보로 지원하는 국회 소속 분석기관이다.", "국내 화이트칼라 재직자 1,512명 대상 설문조사와 고용·임금 행정데이터 분석을 총괄 기획하여 '생성형 AI의 노동시장 영향' 보고서를 발간하였다."]}, {"id": "ent_bce2a16f15df", "label": "천경록", "group": "Person", "observations": ["국회예산정책처 경제분석국 경제분석관으로 본 보고서의 제1 작성자이다.", "2026년 ILO의 생성형 AI 노출도 지수를 한국 직업분류에 적용해 고노출 직업군 취업자 및 인력수요 변화를 분석한 단독 연구를 발표한 바 있다."]}, {"id": "ent_33183178a189", "label": "메트릭스R\u0026C", "group": "Org", "observations": ["국회예산정책처의 의뢰로 2026년 5월 6일부터 5월 19일까지 화이트칼라 재직자 1,512명을 대상으로 직업별 생성형 AI 업무 활용 실태 온라인 설문조사를 수행한 리서치 전문 회사이다."]}, {"id": "ent_0c2fe3b33a03", "label": "생성형 AI 노출도", "group": "Concept", "observations": ["생성형 AI 사용으로 인한 소분류 직업별 평균 노동생산성(주간 업무 처리량) 향상 정도(%)로 정의된 지표이다.", "조사 대상 48개 직업 층위에서 최저 4.0%에서 최고 64.7%에 분포하며, 4분위 구분에 따라 고노출(평균 30.2%), 중고노출(15.4%), 중저노출(10.0%), 저노출(7.0%), 비노출로 분류되었다.", "네트워크 시스템 개발자 및 정보보안·데이터 전문가(64.7%), 문화·예술 기획자(60.7%), 소프트웨어 개발자(42.9%), 자연과학 연구원(25.9%) 등이 최상위 4/4분위 고노출 직업군에 속한다."]}, {"id": "ent_613a525933dd", "label": "합성 이중차분법", "group": "Concept", "observations": ["전통적 이중차분법(DID)과 합성통제법(SCM)의 장점을 결합하여 개체 가중치와 시점 가중치를 부여함으로써 평행추세 가정 위반 문제를 해결하는 계량경제학적 인과추론 방법론이다.", "Arkhangelsky et al.(2021)에 의해 제안되었으며, 본 보고서에서 산업경기의 영향을 통제한 후 생성형 AI 고노출 직업의 고용, 채용, 임금 효과를 추정하는 핵심 방법론으로 사용되었다."]}, {"id": "ent_56c6e642fba2", "label": "고용행정통계", "group": "Concept", "observations": ["고용노동부 한국고용정보원에서 제공하는 고용보험 가입 임금근로자 기반 월별 행정통계 데이터이다.", "상용 및 임시 근로자의 80% 이상을 포괄하는 전수자료에 가까워 표본오차 없이 소분류 직업별·연령별 고용(피보험자 수) 및 신규 채용(취득자 수)의 동태적 추이를 파악하는 데 활용되었다."]}, {"id": "ent_2281057e5930", "label": "지역별고용조사", "group": "Concept", "observations": ["국가데이터처에서 반기별로 실시하는 가계 설문조사 마이크로데이터이다.", "소분류 직업 수준까지 월평균 임금, 연령, 교육수준 등의 정보를 제공하여 생성형 AI 노출도와 연계한 임금 효과 분석에 활용되었다."]}, {"id": "ent_d19f12608a51", "label": "The 2026 AI Index Report", "group": "Paper", "observations": ["Stanford University Human-Centered Artificial Intelligence(HAI)에서 2026년 4월 발간한 글로벌 인공지능 지표 보고서이다.", "인간 대비 AI 성능 지표(GPQA Diamond, AIME, SWE-bench Verified 등)의 급격한 향상 추이를 제시하였다."]}, {"id": "ent_88ed32954911", "label": "Stanford University Human-Centered Artificial Intelligence", "group": "Org", "observations": ["스탠퍼드 대학교 산하의 인간 중심 인공지능 연구소로, 매년 AI Index Report를 발간하고 있다."]}, {"id": "ent_5134dc618092", "label": "SWE-bench Verified", "group": "Concept", "observations": ["소프트웨어 엔지니어링 문제 해결 능력을 평가하는 벤치마크 지표이다.", "인간 능력 대비 인공지능 성능이 2024년 60% 수준에서 2025년 100%에 근접하게 상승하였다."]}, {"id": "ent_2e2b83cc1613", "label": "GPQA Diamond", "group": "Concept", "observations": ["박사급 과학 문제 풀이 능력을 측정하는 고난도 벤치마크 지표이다.", "2024년에 인공지능 모델이 인간 전문가의 성능을 추월한 것으로 보고되었다."]}, {"id": "ent_21db09ee785f", "label": "AIME", "group": "Concept", "observations": ["고난도 수학적 추론 능력을 측정하는 미국 초청 수학 경시대회 기반 벤치마크 지표이다.", "2024년에 인공지능 모델이 인간 수준을 추월하였다."]}, {"id": "ent_b84fe31da5f2", "label": "ChatGPT", "group": "Tool", "observations": ["MCP를 지원하는 AI 어시스턴트이다.", "OpenAI의 대화형 AI 서비스로 설문조사 응답자들이 금융 자문 목적으로 가장 널리 사용하는 LLM 도구로 조사되었다.", "OpenAI가 개발한 대화형 생성형 AI 도구이다.", "챗 로그 기반 업무 분석 연구(Chatterji et al., 2025)에서 직업 정보 부재로 인해 15% 이상의 챗이 '문서 편집'이라는 포괄적 활동으로 과대 분류되는 왜곡 현상이 관찰되었다.", "OpenAI가 개발한 대규모 언어 모델 기반 생성형 AI 챗봇이다.", "RPS 설문에서 생성형 AI의 대표 사례로 제시되었으며, 선행 챗로그 분석 연구(Chatterji et al., 2025)의 데이터 소스로 활용되었다.", "OpenAI가 개발한 생성형 AI 대화형 서비스 및 모델이다.", "Chatterji et al.(2025) 등의 챗로그 기반 업무 분류 분석 대상이자 RPS 설문의 대표 생성형 AI 예시로 언급되었다.", "OpenAI가 개발한 대화형 생성형 AI 서비스로 설문 예시 및 챗로그 비교 분석 대상이다.", "질문 응답 기능은 우수하지만 학습자의 맥락을 고려해 호기심과 영감을 불어넣는 상호작용에는 한계가 있는 AI 챗봇의 예시로 언급되었다.", "OpenAI가 Transformer 기반 LLM으로 개발한 생성형 AI 대화형 서비스로, 2022년 11월 출시되어 생성형 AI 대중화와 업무 현장 확산의 기점이 되었다.", "본 보고서에서 노동시장 충격 식별을 위한 주요 처치 기준 시점(2022년 11월)으로 설정되었다."]}, {"id": "ent_8096fd544454", "label": "Claude", "group": "Tool", "observations": ["MCP를 지원하여 외부 데이터 및 도구와 연동할 수 있는 AI 애플리케이션 및 어시스턴트이다.", "MCP 클라이언트를 내장하여 외부 MCP 서버와 연동할 수 있는 대표적인 Host LLM 애플리케이션이다.", "Anthropic이 개발한 AI 어시스턴트 플랫폼 및 웹/데스크톱/모바일 애플리케이션이다.", "Team 플랜 및 Enterprise 플랜을 통해 조직 단위의 멤버 관리, 역할 기반 권한 제어, 시트 할당 기능을 지원한다.", "JIT 프로비저닝은 Team 및 Enterprise 플랜에서 지원되며, SCIM 디렉터리 동기화는 Enterprise 플랜에서 지원된다.", "플랜별로 Owner, Admin, User, Custom 등의 역할을 설정할 수 있으며 Premium, Standard, Chat, Chat + Claude Code, Enterprise 시트 티어를 제공한다.", "Anthropic에서 개발한 AI 어시스턴트 플랫폼이다.", "Team 플랜 및 Enterprise 플랜 조직 환경을 지원하며 조직 관리 및 SSO/프로비저닝 기능을 제공한다.", "Team 플랜에서는 Owner, Admin, User 역할과 Premium, Standard 좌석 유형을 지원한다.", "Seat-based Enterprise 플랜에서는 Owner, Admin, User, Custom 역할과 Premium, Standard 좌석을 제공한다.", "Usage-based Enterprise 플랜에서는 Chat, Chat + Claude Code 좌석 또는 단일 Enterprise 좌석 유형을 지원한다.", "Anthropic이 개발한 대규모 언어 모델 제품군으로, Handa et al. (2025)의 챗 로그 기반 직무 분석 연구 대상으로 언급되었다.", "Anthropic이 개발한 생성형 AI 챗봇 모델이다.", "Handa et al. (2025) 연구에서 챗로그 기반 과업 분류 및 활용도 분석 대상이 되었다.", "Anthropic이 개발한 생성형 AI 모델이다.", "Handa et al.(2025) 등의 연구에서 챗로그를 통한 업무 분류 분석에 활용되었다.", "Anthropic이 개발한 대화형 생성형 AI 서비스로 챗로그 기반 과업 분류 연구에 활용되었다.", "논문에서 비교 평가를 위해 언급된 대형 언어 모델이다.", "본 연구의 초기 테스트에서 ChatGPT-4o 대비 성능이 다소 떨어지는 것으로 관찰되었다.", "학습자가 스스로 사고하는 노력을 생략하고 전적으로 사고를 외주화해서는 안 되는 대상 AI 모델의 예시로 언급되었다.", "Anthropic이 개발한 대규모 언어모델 기반 인공지능 도구이다.", "Handa et al.(2025) 연구에서 사용자 대화 로그 기반 직업별 과업 AI 실사용 데이터 분석에 활용되었다."]}, {"id": "ent_d43a3f67c18c", "label": "Gemini", "group": "Model", "observations": ["Google의 대규모 언어 모델(LLM)이다.", "OKF 번들을 작성하고 관리하는 공식 레퍼런스 툴의 구동 엔진으로 사용된다.", "Google이 개발한 생성형 AI 도구이자 멀티모달 모델이다.", "RPS 설문에서 생성형 AI 기술의 대표 제품 예시로 명시되었다.", "VMware Intelligent Assist에서 기본 지원하는 Google의 대형 언어 모델 제품군이다", "Google이 개발한 대규모 언어 모델(LLM)이다.", "Security Services Platform의 AI Assist 기능에서 침해 사고 메커니즘 분석, 인시던트 시각화 및 대응 룰 자동 생성을 위한 외부 추론 엔진으로 활용된다.", "Google의 대규모 멀티모달 언어 모델이다.", "NaverMadCat의 컨설팅 부서가 문제 해결이 교착 상태에 빠졌을 때 MCP 프로토콜을 통해 외부 자문을 구하는 용도로 활용된다.", "Google이 개발한 멀티모달 생성형 AI 모델이다.", "재직자 대상 설문조사에서 ChatGPT, Claude와 함께 주요 업무용 생성형 AI 도구로 조사되었다."]}, {"id": "ent_9f7069f0e93d", "label": "GPT-4", "group": "Model", "observations": ["OpenAI의 대규모 멀티모달 언어모델이다.", "Eloundou et al.(2024) 연구에서 직업별 과업 수행시간 50% 단축 가능성을 평가하는 자동화 평가자로 활용되었다."]}, {"id": "ent_3fa92739a3fb", "label": "GPT-3", "group": "Model", "observations": ["OpenAI가 2020년 출시한 거대언어모델로, 자연스러운 텍스트 생성을 입증하며 생성형 AI의 기반을 마련하였다."]}, {"id": "ent_e2994070b443", "label": "DALL-E 2", "group": "Model", "observations": ["OpenAI가 개발한 텍스트-이미지 생성 인공지능 모델이다.", "Hui et al.(2024) 연구에서 온라인 프리랜서 시장에 미친 생성 AI 충격으로 분석되었다."]}, {"id": "ent_50694b193ab9", "label": "Midjourney", "group": "Tool", "observations": ["텍스트 프롬프트를 통해 고품질 이미지를 생성하는 AI 도구이다.", "Hui et al.(2024) 연구에서 온라인 프리랜서 고용 충격의 분석 대상 기술로 포함되었다."]}, {"id": "ent_389db51701c6", "label": "Hui et al. (2024)", "group": "Paper", "observations": ["온라인 프리랜서 약 8만 명의 데이터를 이중차분법으로 분석하여 ChatGPT 및 이미지 생성 AI 도입 후 일감(약 2%)과 소득(5.2%)이 감소했음을 실증한 연구이다.", "고품질·고숙련 프리랜서일수록 타격이 더 컸음을 제시하였다."]}, {"id": "ent_8da6ae9d9fc7", "label": "Brynjolfsson et al. (2025b)", "group": "Paper", "observations": ["미국 대규모 급여행정자료를 분석하여 고노출 직업의 22~25세 청년 고용이 동일 기업 내 타 직군 대비 약 16% 감소한 반면 경력자 고용과 임금에는 뚜렷한 변화가 없었음을 밝힌 연구이다."]}, {"id": "ent_aac318cbf22f", "label": "Hosseini \u0026 Lichtinger (2025)", "group": "Paper", "observations": ["미국 이력서 및 구인공고 자료를 분석하여 생성형 AI 도입 기업에서 주니어 고용이 시니어 대비 약 9% 감소하였으며, 이는 기존 인력 해고보다 신규 채용 축소에서 비롯되었음을 실증한 연구이다."]}, {"id": "ent_3f61baeb46a8", "label": "한진수·오삼일 (2025)", "group": "Paper", "observations": ["국민연금 가입자 자료를 통해 국내 청년층(15~29세) 일자리가 AI 고노출 업종에서 20.8만 개 감소한 반면 50대 일자리는 14.6만 개 증가하는 연공편향적 기술변화가 나타났음을 보고한 연구이다."]}, {"id": "ent_997861ec11ef", "label": "오삼일·오영식 (2026)", "group": "Paper", "observations": ["국민연금 가입자 자료와 경제활동인구조사를 분석하여 AI를 자동화 방식으로 활용하는 업종에서만 청년 고용 감소가 뚜렷했고 증강 방식 업종에서는 청년 고용 감소가 나타나지 않았음을 규명한 연구이다."]}, {"id": "ent_df7d5a81f96c", "label": "장지연 (2026)", "group": "Paper", "observations": ["한국숙련사전과 고용보험 자료를 연계하여 AI 고노출 직종 및 도입 기업에서 청년 취업자의 증가세가 둔화·정체된 반면 중년·고령층 고용은 변화가 없었음을 밝힌 연구이다."]}, {"id": "ent_29bd474967bd", "label": "Eckhardt \u0026 Goldschlag (2026)", "group": "Paper", "observations": ["Economic Innovation Group 연구로, 5개 AI 노출도 지표를 미국 노동시장 지표에 교차 적용한 결과 고노출 근로자의 실업률 상승폭이 저노출보다 작았고 기업의 95%가 AI로 인한 순고용 영향이 없다고 응답하여 고용 위축 증거가 없음을 보고하였다."]}, {"id": "ent_201e232d5370", "label": "노세리 외 (2025)", "group": "Paper", "observations": ["2019~2024년 고용보험 전수자료를 분석하여 직업 수준에서 고노출 직업의 고용 감소가 없었고 개인 수준에서도 근무기간과 임금의 감소가 미미함을 보인 연구이다."]}, {"id": "ent_0352a278a55d", "label": "천경록 (2026)", "group": "Paper", "observations": ["ILO 생성형 AI 노출도 지수를 한국 직업분류체계에 적용하여 ChatGPT 출시 이후 고노출 직업 취업자 수가 전 연령대에서 증가하였으며 구인 및 채용 규모에서도 유의한 감소가 없었음을 밝힌 연구이다."]}, {"id": "ent_b58823aa78d4", "label": "Lambert \u0026 Schindler (2026)", "group": "Paper", "observations": ["AI 고노출 직업이 원격근무 가능 직업과 중첩되어 나타난 착시 현상임을 규명하고, 원격근무를 통제하면 AI 노출에 따른 청년 채용 감소 효과가 통계적 유의성을 상실함을 밝힌 연구이다."]}, {"id": "ent_4465b2d9d501", "label": "Audoly et al. (2026)", "group": "Paper", "observations": ["뉴욕 연방준비은행 연구로, Lightcast 구인공고 분석 결과 고노출 직종 구인공고 하락 시점이 ChatGPT 출시 이전부터 이미 진행되었으며 주니어와 시니어 공고가 함께 감소하여 AI가 채용 둔화의 주된 동인이 아니라고 해석하였다."]}, {"id": "ent_e3d132fda930", "label": "Iscenko \u0026 Millet (2026)", "group": "Paper", "observations": ["AI 고노출 직종의 구인공고 하락 시점(2022년 3~4월)이 연방준비제도의 금리 인상 개시 시점과 일치함을 보이며, 청년 채용 위축은 AI 대체가 아닌 통화 긴축과 경기순환에 따른 직업 사다리 붕괴 착시일 가능성을 제시한 연구이다."]}, {"id": "ent_efdde7608a0d", "label": "Felten et al. (2021)", "group": "Paper", "observations": ["AI 시스템 능력과 직업별 능력 요구도를 연결하여 직업별 AI 노출도를 측정한 선행 연구이다.", "본 연구의 실제 직업별 생성형 AI 도입률과 상관계수 ρ=0.727, R²=0.529를 기록하여 비교된 노출 지표 중 가장 높은 예측력을 기록하였다.", "AI 기술 역량과 직업별 능력 요구사항을 매핑하여 AI 직업 노출도(AIOE)를 측정한 선행 연구이다.", "실제 직업별 생성형 AI 도입률과 상관계수 ρ=0.727, R^2=0.529를 기록하여 비교 대상 노출도 지수 중 가장 높은 상관성을 보였다.", "AI 시스템의 실증 역량을 직업별 필요 능력에 연결하여 직종별 AI 노출도를 산출한 연구이다.", "RPS 직종별 생성형 AI 도입률에 대해 R2=0.529의 설명력을 나타냈다.", "10개 AI 응용 분야 성능지표와 O*NET 52개 직업능력 간 관련성을 바탕으로 직업별 AI 노출지수를 산출한 선행연구이다."]}, {"id": "ent_897c49378c5f", "label": "Eloundou et al. (2024)", "group": "Paper", "observations": ["GPT-4 기반 역량을 전제로 직무 및 업무 수준의 LLM 노출도 지표(α, β, ζ)를 제시한 선행 연구이다.", "본 연구에서 ζ 노출 지표 기준 직업 수준 R²=0.496, 업무 수준 R²=0.439로 실측 도입률과 중간 정도의 양의 상관관계를 보였으나, 규제 및 보안 장벽에 따른 사무직 과대 예측 편향이 드러났다.", "GPT-4 역량을 기준으로 직무 및 과업별 AI 노출도를 α, β, ζ 수준으로 추정한 선행 연구이다.", "해당 연구의 ζ 노출도 지수는 실제 직업 도입률 변량의 49.6%(R^2=0.496), 과업 도입률 변량의 43.9%(R^2=0.439)를 설명하는 데 그쳤다.", "접수원, 의료 비서, 은행 텔러 등 행정·사무직 과업을 과대 예측하고, 건설장비 운전원, 수리원, 특수교사, 경영자 등 자율성이 높은 직무를 과소 예측하는 한계를 보였다.", "GPT-4 역량을 기준으로 과업 생산성을 최소 2배 향상시킬 수 있는지를 평가하여 과업 및 직종별 AI 노출도를 측정한 연구이다.", "zeta 노출도 지표 기준 직종 수준 도입 분산의 49.6%(R2=0.496), 과업 수준 도입 분산의 43.9%(R2=0.439)를 설명하였다.", "전문가와 GPT-4 평가를 결합하여 LLM을 통해 업무 수행 시간을 50% 이상 단축할 수 있는 과업 비중을 기준으로 직업별 LLM 노출도를 산출한 연구이다."]}, {"id": "ent_d6a25bd4a2c7", "label": "Handa et al. (2025)", "group": "Paper", "observations": ["Anthropic Claude의 대화 로그를 분석하여 AI 과업 사용을 분류한 연구이다.", "Anthropic의 Claude 이용자 대화 데이터를 O*NET 과업과 연결하여 실제 사용 패턴을 분석하고, 이용의 57%가 보완적 활용이며 43%가 자동화적 활용임을 밝힌 연구이다."]}, {"id": "ent_6d3c765a5ad7", "label": "Brynjolfsson et al. (2025a)", "group": "Paper", "observations": ["Fortune 500 기업 고객 지원 상담원을 대상으로 생성형 AI 도구 단계적 도입의 준실험을 분석하여, 문제해결 건수가 평균 15% 증가했고 신입 및 저숙련일수록 생산성 개선 효과가 두드러졌음을 입증한 연구이다."]}, {"id": "ent_5130bab96fe9", "label": "Hartley et al. (2026)", "group": "Paper", "observations": ["미국과 캐나다 근로자 대상 반복 설문조사를 통해 직장 내 생성형 AI 사용률과 과업당 약 1시간의 시간 절감 효과를 분석한 연구이다."]}, {"id": "ent_ca6326eb1800", "label": "서동현 외 (2025)", "group": "Paper", "observations": ["국내 가계조사를 통해 업무 목적 생성형 AI 활용률이 51.8%에 달하나 업무시간 감소 효과는 3.8%, 잠재적 생산성 향상 효과는 1.0% 수준이며 저숙련자의 역량을 평준화하는 효과가 있음을 보고한 연구이다."]}, {"id": "ent_f3e09580a2a9", "label": "Arkhangelsky et al. (2021)", "group": "Paper", "observations": ["합성 이중차분법(Synthetic Difference-in-Differences)을 제안하여 패널자료에서 평행추세 가정이 위반되었을 때 단위 가중치와 시점 가중치를 결합해 정책효과를 추정하는 방법론을 확립한 논문이다."]}], "raw_truncated": true, "appendix_truncated": false, "references_truncated": true, "pdf_parser_requested": "pypdfium2", "pdf_parser_used": "pypdfium2", "pdf_parser_fallback": false, "pdf_parser_fallback_reason": null, "pdf_encoding_flaw_detected": false, "pdf_encoding_flaws": [], "pdf_is_scanned": false, "presentation_pdf": {}, "presentation_pdfs": [], "author": "천경록, 김상용, 홍지은, 한승룡, 백기홍", "published_at": null, "orig_chars": 105486, "raw_chars": 99552, "focus": null, "has_transcript": false, "transcript_source": null, "caption_status": null, "caption_language": null, "is_stt": false, "stt_transcript": "", "transcript_segments": [], "stt_truncated": false, "stt_orig_chars": 105486, "stt_raw_chars": 99552, "meta": {"links": ["http://www.nabo.go.kr", "https://hai.stanford.edu/ai-index/2026-ai-index-report", "https://www.oxfordeconomics.com/resource/evidence-of-an-ai-driven-shakeup-of-job-markets-is-patchy/", "https://www.theregister.com/software/2025/10/29/ai-layoffs-to-backfire-half-quietly-rehired", "https://careerminds.com/blog/cost-of-ai-layoffs", "https://doi"], "link_anchors": [{"url": "http://www.nabo.go.kr", "anchor": ""}, {"url": "https://hai.stanford.edu/ai-index/2026-ai-index-report", "anchor": ""}, {"url": "https://www.oxfordeconomics.com/resource/evidence-of-an-ai-driven-shakeup-of-job-markets-is-patchy/", "anchor": ""}, {"url": "https://www.theregister.com/software/2025/10/29/ai-layoffs-to-backfire-half-quiet   if(!src) return '';

  const fallback=()=>esc(raw).replace(/\\r?\\n/g,'<br>');
  const parser=window.marked, purifier=window.DOMPurify;
  if(!parser||!purifier||typeof purifier.sanitize!=='function'||

    const html=typeof parser.parse==='function'?parser.parse(s):parser(s);
    return purifier.sanitize(html, DOMPURIFY_OPTS);
  }catch(e){ return fallback(); }

function splitTableCells(line){
  var raw=(line||'').trim();
  if(!raw.startsWith('|')) return [raw];
  raw=raw.substring(1);
  if(raw.endsWith('|') && !raw.endsWith('\\|')){
    raw=raw.substring(0, raw.length - 1);
  }
  var placeholder='';
  var parts=raw.replace(/\\\|/g, placeholder).split('|');
  return parts.map(function(p){
    return p.replace(new RegExp(placeholder, 'g'), '|').trim();
  });
}
function parseColsAttr(text){
  if(!text) return null;
  var m=text.match(/cols=["']?([^"'\]]+)["']?/i);
  var colsVal=m ? m[1].trim() : text.replace(/[\[\]]/g, '').trim();
  var starM=colsVal.match(/^(\d+)\*/);
  if(starM) return parseInt(starM[1], 10);
  if(colsVal.indexOf(',') !== -1){
    var parts=colsVal.split(',').filter(function(p){ return p.trim().length > 0; });
    var total=0;
    for(var i=0; i<parts.length; i++){
      var sm=parts[i].trim().match(/^(\d+)\*/);
      if(sm) total += parseInt(sm[1], 10);
      else total += 1;
    }
    return total > 0 ? total : null;
  }
  if(/^\d+$/.test(colsVal)) return parseInt(colsVal, 10);
  return null;
}
function parseCellSpec(specStr){
  var res={colspan:1, rowspan:1, align:null, style:null};
  if(!specStr) return res;
  var spec=specStr.trim();
  var mSpan=spec.match(/(\\d+)?\\.(\\d+)\\+/);
  if(mSpan){
    if(mSpan[1]) res.colspan=parseInt(mSpan[1], 10);
    if(mSpan[2]) res.rowspan=parseInt(mSpan[2], 10);
  }else{
    var mCol=spec.match(/(?<!\\.)(\\d+)\\+/);
    if(mCol) res.colspan=parseInt(mCol[1], 10);
    var mRow=spec.match(/\\.(\\d+)\\+/);
    if(mRow) res.rowspan=parseInt(mRow[1], 10);
    var mDup=spec.match(/^(\\d+)\\*$/);
    if(mDup) res.colspan=parseInt(mDup[1], 10);
  }
  if(spec.indexOf('^') !== -1) res.align='center';
  else if(spec.indexOf('>') !== -1) res.align='right';
  else if(spec.indexOf('<') !== -1) res.align='left';
  var mStyle=spec.match(/([a-z])(?=\\|$)/i);
  if(mStyle) res.style=mStyle[1].toLowerCase();

}
function extractCellsAndCols(tableLines, explicitCols){
  var placeholder='';
  var cellTokenRe=/(?:^|(?<=\s))((?:\d*\.?\d+\+|\d+\*)?[\^<>]?[a-z]?|[\^<>]?[a-z]?)\|/g;
  var cells=[];
  var firstLineCols=null;
  var firstBlockCols=0;
  var inFirstBlock=true;

  for(var i=0; i<tableLines.length; i++){
    var raw=tableLines[i].trim();
    if(!raw){
      if(inFirstBlock && cells.length > 0) inFirstBlock=false;
      continue;
    }
    var safe=raw.replace(/\\\|/g, placeholder);
    var matches=[];
    var m;
    cellTokenRe.lastIndex=0;
    while((m=cellTokenRe.exec(safe)) !== null){
      matches.push({index: m.index, spec: m[1] || '', length: m[0].length});
    }

    if(matches.length === 0 || matches[0].index > 0){
      if(cells.length > 0 && matches.length === 0){
        cells[cells.length - 1].text += '\n' + raw.replace(/\\\|/g, '|');
        continue;
      }else if(matches.length === 0){
        var specObj=parseCellSpec('');
        cells.push({text: raw.replace(/\\\|/g, '|'), spec: '', colspan: specObj.colspan, rowspan: specObj.rowspan, align: specObj.align, style: specObj.style});
        if(inFirstBlock) firstBlockCols += specObj.colspan;
        continue;
      }
    }

    var lineCellsCount=0;
    for(var j=0; j<matches.length; j++){
      var cur=matches[j];
      var spec=(cur.spec || '').trim();
      var specObj=parseCellSpec(spec);
      var startPos=cur.index + cur.length;
      var endPos=(j + 1 < matches.length) ? matches[j + 1].index : safe.length;
      var cellText=safe.substring(startPos, endPos).trim().replace(new RegExp(placeholder, 'g'), '|');
      cells.push({text: cellText, spec: spec, colspan: specObj.colspan, rowspan: specObj.rowspan, align: specObj.align, style: specObj.style});
      lineCellsCount += specObj.colspan;
      if(inFirstBlock) firstBlockCols += specObj.colspan;
    }
    if(firstLineCols === null && lineCellsCount > 0){
      firstLineCols=lineCellsCount;
    }
  }

  var numCols=explicitCols;
  if(!numCols || numCols <= 0){
    if(firstLineCols && firstLineCols > 1) numCols=firstLineCols;
    else if(firstBlockCols > 1) numCols=firstBlockCols;
    else numCols=1;

}
function parseAdocTableRows(tableLines, explicitCols){
  var res=extractCellsAndCols(tableLines, explicitCols);
  var cells=res.cells;
  var numCols=res.numCols;
  if(!cells || cells.length === 0) return [];
  if(numCols <= 0) numCols=1;

  var rows=[];
  var cellIdx=0;
  var occupied=[];
  for(var c=0; c<numCols; c++) occupied.push(0);

  while(cellIdx < cells.length){
    var rowCells=[];
    var col=0;
    while(col < numCols && cellIdx < cells.length){
      if(occupied[col] > 0){
        occupied[col]--;
        col++;
        continue;
      }
      var cell=cells[cellIdx++];
      rowCells.push(cell);
      if(cell.rowspan > 1){
        for(var spanC=0; spanC<cell.colspan; spanC++){
          if(col + spanC < numCols){
            occupied[col + spanC]=cell.rowspan - 1;
          }
        }
      }
      col += cell.colspan;
    }
    while(col < numCols){
      if(occupied[col] > 0) occupied[col]--;
      col++;
    }
    if(rowCells.length > 0) rows.push(rowCells);
  }
  return rows;
}
function renderTableHtml(tableLines, blockMeta, anchorId){
  var explicitCols=parseColsAttr(blockMeta.cols || '');
  var rows=parseAdocTableRows(tableLines, explicitCols);
  if(!rows || rows.length === 0) return '';
  var idAttr=anchorId ? ' id="' + esc(anchorId) + '"' : '';
  var tHtml='<table' + idAttr + '>';
  if(blockMeta.title) tHtml += '<caption>' + esc(blockMeta.title) + '</caption>';

  function renderCell(cell, tag){
    var attrs=[];
    if(cell.rowspan > 1) attrs.push('rowspan="' + cell.rowspan + '"');
    if(cell.colspan > 1) attrs.push('colspan="' + cell.colspan + '"');
    if(cell.align) attrs.push('style="text-align:' + cell.align + '"');
    var attrStr=attrs.length > 0 ? ' ' + attrs.join(' ') : '';
    var text=(cell.text || '').trim();
    var innerHtml='';
    if(cell.style==='a' || (text.indexOf('\n')!==-1 && /(?:^|\n)\s*[\*\-\.]\s+/.test(text))){
      innerHtml=convertAsciidocToHtml(text);
      if(innerHtml.startsWith('<p>') && innerHtml.endsWith('</p>') && (innerHtml.match(/<p>/g)||[]).length===1 && innerHtml.indexOf('\n')===-1){
        innerHtml=innerHtml.substring(3, innerHtml.length-4);
      }
    }else if(text.indexOf('\n\n')!==-1){
      innerHtml=convertAsciidocToHtml(text);
    }else{
      var rawLines=text.split('\n');
      var parts=rawLines.map(function(l){ return inlineAdocFormat(l); });
      innerHtml=parts.join(' ');
    }
    return '<' + tag + attrStr + '>' + innerHtml + '</' + tag + '>';
  }

  tHtml += '<thead><tr>' + rows[0].map(function(c){ return renderCell(c, 'th'); }).join('') + '</tr></thead>';
  if(rows.length > 1){
    tHtml += '<tbody>';
    for(var r=1; r<rows.length; r++){
      tHtml += '<tr>' + rows[r].map(function(c){ return renderCell(c, 'td'); }).join('') + '</tr>';
    }
    tHtml += '</tbody>';
  }
  tHtml += '</table>';
  return tHtml;
}

function inlineAdocFormat(text){
  if(!text) return '';
  var s=esc(text);
  var codeSpans=[];
  s=s.replace(/`(?![\s])([^`\n]+?)(?<![\s])`/g, function(_, m1){
    codeSpans.push('<code>'+m1+'</code>');
    return '\x00ADOCCODE'+(codeSpans.length-1)+'\x00';
  });
  s=s.replace(/\+\+(?![\s])([^\+\n]+?)(?<![\s])\+\+/g, function(_, m1){
    codeSpans.push('<code>'+m1+'</code>');
    return '\x00ADOCCODE'+(codeSpans.length-1)+'\x00';
  });
  var varSpans=[];
  s=s.replace(/(?<![\w\\\$])\$[A-Z_][A-Za-z0-9_]*\b/g, function(m){
    varSpans.push(m);
    return '\x00ADOCVAR'+(varSpans.length-1)+'\x00';
  });
  s=s.replace(/(?<![\w\\\$])\$\{[A-Za-z0-9_]+\}/g, function(m){
    varSpans.push(m);
    return '\x00ADOCVAR'+(varSpans.length-1)+'\x00';
  });
  s=s.replace(/(?<![\w\\\$])\$\d+(?:,\d{3})*(?:\.\d+)?\b/g, function(m){
    varSpans.push(m);
    return '\x00ADOCVAR'+(varSpans.length-1)+'\x00';
  });
  var mathSpans=[];
  s=s.replace(/(stem|latexmath|asciimath):\\[(.*?)\\]/gi, function(_, kind, content){
    mathSpans.push('<span class="math inline" data-math="'+kind.toLowerCase()+'"><code>'+content+'</code></span>');
    return '\x00ADOCMATH'+(mathSpans.length-1)+'\x00';
  });
  s=s.replace(/\\\((.*?)\\\)/g, function(_, content){
    mathSpans.push('<span class="math inline" data-math="latex"><code>'+content+'</code></span>');
    return '\x00ADOCMATH'+(mathSpans.length-1)+'\x00';
  });
  s=s.replace(/\$\$([^\$]+?)\$\$/g, function(_, content){
    mathSpans.push('<span class="math inline" data-math="latex"><code>'+content+'</code></span>');
    return '\x00ADOCMATH'+(mathSpans.length-1)+'\x00';
  });
  s=s.replace(/(?<![\w\\\$])\$([^\$\n]+?)\$(?![\w\$])/g, function(_, content){
    mathSpans.push('<span class="math inline" data-math="latex"><code>'+content+'</code></span>');
    return '\x00ADOCMATH'+(mathSpans.length-1)+'\x00';
  });
  var linkSpans=[];
  s=s.replace(/(https?:\/\/[^\s\[\]]+)\[(.*?)\]/g, function(_, u, l){
    linkSpans.push('<a href="'+u+'" target="_blank" rel="noopener">'+l+'</a>');
    return '\x00ADOCLINK'+(linkSpans.length-1)+'\x00';
  });
  s=s.replace(/(?<!href=")(https?:\/\/[^\s<>"\'\)]+)/g, function(_, u){
    linkSpans.push('<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
    return '\x00ADOCLINK'+(linkSpans.length-1)+'\x00';
  });
  s=s.replace(/&lt;&lt;([^\s\[\],>&]+)(?:,\s*([^&]+?))?&gt;&gt;/g, function(_, a, l){
    var anc=a.trim().replace(/^#/, '');
    var label=(l||a).trim();
    linkSpans.push('<a href="#'+anc+'" class="xref">'+label+'</a>');
    return '\x00ADOCLINK'+(linkSpans.length-1)+'\x00';
  });
  s=s.replace(/xref:([^\s\[\],]+)\[(.*?)\]/gi, function(_, a, l){
    var anc=a.trim().replace(/^#/, '');
    var label=(l||a).trim();
    linkSpans.push('<a href="#'+anc+'" class="xref">'+label+'</a>');
    return '\x00ADOCLINK'+(linkSpans.length-1)+'\x00';
  });
  s=s.replace(/\[\[([^\s\[\],]+)\]\]/g, '<a id="$1" class="anchor"></a>');
  s=s.replace(/\s+\+\s*$/g, '<br>');
  s=s.replace(/(?<!#)#(?![\s#])([^#\n]+?)(?<![\s#])#(?!#)/g, '<mark>$1</mark>');
  s=s.replace(/\*\*(?![\s\*])([^*\n]+?)(?<![\s\*])\*\*/g, '<strong>$1</strong>');
  s=s.replace(/(?<!\*)\*(?![\s\*])([^*\n]+?)(?<![\s\*])\*(?!\*)/g, '<strong>$1</strong>');
  s=s.replace(/__(?![\s_])([^_\n]+?)(?<![\s_])__/g, '<em>$1</em>');
  s=s.replace(/(?<!_)_(?![\s_])([^_\n]+?)(?<![\s_])_(?!_)/g, '<em>$1</em>');
  s=s.replace(/\^(?![\s\^])([^\^\n]+?)(?<![\s\^])\^/g, '<sup>$1</sup>');
  s=s.replace(/~(?![\s~])([^~\n]+?)(?<![\s~])~/g, '<sub>$1</sub>');
  for(var i=0; i<linkSpans.length; i++) s=s.replace('\x00ADOCLINK'+i+'\x00', linkSpans[i]);
  for(var j=0; j<codeSpans.length; j++) s=s.replace('\x00ADOCCODE'+j+'\x00', codeSpans[j]);
  for(var k=0; k<mathSpans.length; k++) s=s.replace('\x00ADOCMATH'+k+'\x00', mathSpans[k]);
  for(var v=0; v<varSpans.length; v++) s=s.replace('\x00ADOCVAR'+v+'\x00', varSpans[v]);
  return s;
}

// 자체 완결형 경량 AsciiDoc 렌더러 (외부 CDN/루비런타임 의존성 제로, 번개같은 로딩 속도)
function convertAsciidocToHtml(raw){
  if(!raw) return '';
  const NL=String.fromCharCode(10);
  const lines=String(raw).split(NL);
  const out=[];
  let inBlock=null;
  let blockMeta={};
  let blockLines=[];

  var listStack=[];
  var inItem=false;
  var inContinuation=false;
  var pendingContinuation=false;
  var continuationLines=[];
  var pendingMeta=null;
  var pendingBlockLines=[];
  var normalPLines=[];
  var pendingAnchor=null;

  function closeItem(){
    if(inItem){ inItem=false; return ['</li>']; }
    return [];
  }
  function flushList(){
    if(listStack.length===0) return;
    out.push.apply(out, closeItem());
    while(listStack.length>0){
      var entry=listStack.pop();
      out.push('</'+entry.tag+'>');
      if(listStack.length>0) out.push('</li>');
    }
  }
  function adjustListLevel(tag, level){
    if(listStack.length===0){
      out.push('<'+tag+'>');
      listStack.push({tag:tag, level:level});
      return;
    }
    var top=listStack[listStack.length-1];
    if(level > top.level){
      out.push('<'+tag+'>');
      listStack.push({tag:tag, level:level});
    }else if(level < top.level){
      out.push.apply(out, closeItem());
      while(listStack.length>0 && listStack[listStack.length-1].level > level){
        var e=listStack.pop();
        out.push('</'+e.tag+'>');
        if(listStack.length>0) out.push('</li>');
      }
      if(listStack.length>0 && listStack[listStack.length-1].tag !== tag){
        var old=listStack.pop();
        out.push('</'+old.tag+'>');
        out.push('<'+tag+'>');
        listStack.push({tag:tag, level:level});
      }
    }else{
      if(top.tag !== tag){
        out.push.apply(out, closeItem());
        listStack.pop();
        out.push('</'+top.tag+'>');
        out.push('<'+tag+'>');
        listStack.push({tag:tag, level:level});
      }else{
        out.push.apply(out, closeItem());
      }
    }
  }

  function formatParagraphLines(pLines){
    if(!pLines || pLines.length===0) return '';
    var formattedParts=pLines.map(function(l){ return inlineAdocFormat(l); });
    var res='';
    for(var i=0; i<formattedParts.length; i++){
      var p=formattedParts[i];
      if(i===0){ res=p; }
      else{
        if(res.endsWith('<br>')) res += p;
        else res += ' ' + p;
      }
    }
    return res;
  }

  function flushPendingSingleBlock(){
    if(!pendingMeta || (pendingMeta.kind!=='quote' && pendingMeta.kind!=='admonition')) return;
    if(pendingBlockLines.length===0){ pendingMeta=null; return; }
    var anchorAttr=pendingAnchor ? ' id="'+esc(pendingAnchor)+'"' : '';
    pendingAnchor=null;
    var pContent=formatParagraphLines(pendingBlockLines);
    if(pendingMeta.kind==='quote'){
      var attrText=pendingMeta.author?esc(pendingMeta.author)+(pendingMeta.source?' — '+esc(pendingMeta.source):''):'';
      out.push('<div class="quoteblock"' + anchorAttr + '><blockquote><p>'+pContent+'</p></blockquote>'+(attrText?'<div class="attribution">'+attrText+'</div>':'')+'</div>');
    }else if(pendingMeta.kind==='admonition'){
      var admType=(pendingMeta.type||'NOTE').toLowerCase();
      var admTitle=esc(pendingMeta.type||'NOTE');
      out.push('<div class="admonitionblock '+admType+'"' + anchorAttr + '><div class="title">'+admTitle+'</div><div class="content"><p>'+pContent+'</p></div></div>');
    }
    pendingMeta=null;
    pendingBlockLines=[];
  }

  function flushContinuation(){
    if(inContinuation && continuationLines.length>0){
      var anchorAttr=pendingAnchor ? ' id="'+esc(pendingAnchor)+'"' : '';
      pendingAnchor=null;
      out.push('<p' + anchorAttr + '>'+formatParagraphLines(continuationLines)+'</p>');
    }
    inContinuation=false;
    pendingContinuation=false;
    continuationLines=[];
  }

    if(normalPLines.length>0){
      flushList();
      var anchorAttr=pendingAnchor ? ' id="'+esc(pendingAnchor)+'"' : '';
      pendingAnchor=null;
      out.push('<p' + anchorAttr + '>'+formatParagraphLines(normalPLines)+'</p>');
      normalPLines=[];

  function flushBlock(){
    if(!inBlock) return;

      if(blockMeta.author||blockMeta.source){

             (blockMeta.source?' — '+esc(blockMeta.source):'')+'</div>';
      }
      out.push('<div class="quoteblock"' + anchorAttr + '><blockquote>'+qContent+'</blockquote>'+attr+'</div>');
    }else if(inBlock==='admonition'){
      var admParagraphs=[];
      var currP=[];
      for(var b=0; b<blockLines.length; b++){
        var bl=blockLines[b];
        if(!bl.trim()){
          if(currP.length>0){ admParagraphs.push(formatParagraphLines(currP)); currP=[]; }
        }else{ currP.push(bl); }
      }
      if(currP.length>0) admParagraphs.push(formatParagraphLines(currP));
      var admContent=admParagraphs.map(function(p){ return '<p>'+p+'</p>'; }).join('');
      var type=(blockMeta.type||'NOTE').toLowerCase();
      out.push('<div class="admonitionblock '+esc(type)+'"' + anchorAttr + '><div class="title">'+

    }else if(inBlock==='code'){
      var codeText=esc(blockLines.join(NL)).replace(/&lt;(\d+)&gt;/g,'<span class="conum">&lt;$1&gt;</span>');
      out.push('<div class="listingblock"' + anchorAttr + '><div class="content"><pre><code class="language-'+esc(blockMeta.lang||'')+'">'+codeText+'</code></pre></div></div>');
    }else if(inBlock==='math'){
      var mathText=esc(blockLines.join(NL));
      var mType=esc(blockMeta.type||'latex');
      out.push('<div class="mathblock display"' + anchorAttr + ' data-math="'+mType+'"><div class="content"><pre class="math"><code>'+mathText+'</code></pre></div></div>');

      var tblHtml=renderTableHtml(blockLines, blockMeta, anchorAttr.replace(' id="', '').replace('"', ''));

  function matchList(trimmed){
    var mStar=trimmed.match(/^(\*{1,5})\s+(.+)$/);
    if(mStar) return {tag:'ul', level:mStar[1].length, text:mStar[2]};
    var mHyphen=trimmed.match(/^-\s+(.+)$/);
    if(mHyphen) return {tag:'ul', level:1, text:mHyphen[1]};
    var mDot=trimmed.match(/^(\.{1,5})\s+(.+)$/);
    if(mDot) return {tag:'ol', level:mDot[1].length, text:mDot[2]};
    var mNum=trimmed.match(/^\d+[\.\)]\s+(.+)$/);
    if(mNum) return {tag:'ol', level:1, text:mNum[1]};
    return null;
  }

  function extractHeadingAnchor(hText){
    var m=hText.match(/\[#([^\s\[\],]+)\]|\[\[([^\s\[\],]+)\]\]/);
    if(m){
      var anc=m[1]||m[2];
      var clean=(hText.substring(0, m.index)+hText.substring(m.index+m[0].length)).trim();
      return {text:clean, anchor:anc};
    }
    var anc2=pendingAnchor;
    pendingAnchor=null;
    return {text:hText, anchor:anc2};
  }

  for(var i=0; i<lines.length; i++){
    var line=lines[i];
    var trimmed=line.trim();

    if(!inBlock){
      var anchorM=trimmed.match(/^\[#([^\s\[\],]+)\]$/) || trimmed.match(/^\[\[([^\s\[\],]+)\]\]$/);
      if(anchorM){
        flushNormalP(); flushContinuation(); flushPendingSingleBlock();
        pendingAnchor=anchorM[1].trim();
        continue;
      }

      var qm=trimmed.match(/^\[quote(?:,\s*([^,\]]+))?(?:,\s*([^\]]+))?\]/i);
      if(qm){
        flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList();
        pendingMeta={kind:'quote', author:qm[1]?qm[1].trim():'', source:qm[2]?qm[2].trim():''};
        pendingBlockLines=[];
        continue;
      }
      var am=trimmed.match(/^\[(NOTE|IMPORTANT|TIP|WARNING|CAUTION)\]/i);
      if(am){
        flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList();
        pendingMeta={kind:'admonition', type:am[1].toUpperCase()};
        pendingBlockLines=[];
        continue;
      }
      var sm=trimmed.match(/^\[source(?:,\s*([a-zA-Z0-9_-]+))?\]/i);
      if(sm){
        flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList();
        pendingMeta={kind:'code', lang:sm[1]?sm[1].trim():''};
        continue;
      }
      var mathM=trimmed.match(/^\[(latexmath|stem|asciimath)\]$/i);
      if(mathM){
        flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList();
        pendingMeta={kind:'math', type:mathM[1].toLowerCase()};
        continue;
      }
      var tm=trimmed.match(/^\[(.*cols.*|.*header.*|\d+\*|[0-9,]+)\]$/i);
      if(tm){
        flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList();
        if(pendingMeta && pendingMeta.kind==='table'){
          pendingMeta.cols=tm[1];
        }else{
          pendingMeta={kind:'table', cols:tm[1]};
        }
        continue;
      }
      var titleM=trimmed.match(/^\.([^\.\s].*)$/);
      if(titleM){
        flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList();
        if(pendingMeta && pendingMeta.kind==='table'){
          pendingMeta.title=titleM[1].trim();
        }else{
          pendingMeta={kind:'table', title:titleM[1].trim()};
        }
        continue;
      }

      if(trimmed==='____'){
        flushNormalP(); flushContinuation(); flushList();
        inBlock='quote';
        blockMeta=(pendingMeta&&pendingMeta.kind==='quote')?pendingMeta:{};
        pendingMeta=null; pendingBlockLines=[]; blockLines=[];
        continue;
      }
      if(trimmed==='===='){
        flushNormalP(); flushContinuation(); flushList();
        inBlock='admonition';
        blockMeta=(pendingMeta&&pendingMeta.kind==='admonition')?pendingMeta:{type:'NOTE'};
        pendingMeta=null; pendingBlockLines=[]; blockLines=[];
        continue;
      }
      if(trimmed==='----'){
        flushNormalP(); flushContinuation(); flushList();
        if(pendingMeta && pendingMeta.kind==='math'){
          inBlock='math';
          blockMeta=pendingMeta;
        }else{
          inBlock='code';
          blockMeta=(pendingMeta&&pendingMeta.kind==='code')?pendingMeta:{};
        }
        pendingMeta=null; pendingBlockLines=[]; blockLines=[];
        continue;
      }
      if(trimmed==='++++'){
        flushNormalP(); flushContinuation(); flushList();
        inBlock='math';
        blockMeta=(pendingMeta&&pendingMeta.kind==='math')?pendingMeta:{kind:'math', type:'latex'};
        pendingMeta=null; pendingBlockLines=[]; blockLines=[];
        continue;
      }
      if(trimmed==='|==='){
        flushNormalP(); flushContinuation(); flushList();
        inBlock='table';
        blockMeta=(pendingMeta&&pendingMeta.kind==='table')?pendingMeta:{};
        pendingMeta=null; pendingBlockLines=[]; blockLines=[];
        continue;
      }

      var imgMatch=trimmed.match(/^image::([^\[]+)\[([^,\]]*)(?:,\s*title=(?:"([^"]*)"|'([^']*)'|([^\]]*)))?\]/);
      if(imgMatch){
        flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList();
        var src=imgMatch[1].trim();
        var alt=imgMatch[2]?imgMatch[2].trim():'';
        var cap=imgMatch[3]||imgMatch[4]||imgMatch[5]||'';
        var anchorAttr=pendingAnchor ? ' id="'+esc(pendingAnchor)+'"' : '';
        pendingAnchor=null;
        out.push('<div class="imageblock"' + anchorAttr + '><img src="'+esc(src)+'" alt="'+esc(alt)+'">'+
                 (cap?'<div class="title">'+esc(cap)+'</div>':'')+'</div>');
        continue;
      }
      var colMatch=trimmed.match(/^<(\d+)>\s*(.+)/);
      if(colMatch){
        flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList();
        out.push('<div class="colist"><span class="conum">&lt;'+colMatch[1]+'&gt;</span> '+inlineAdocFormat(colMatch[2])+'</div>');
        continue;
      }
      if(/^'{3,}$/.test(trimmed)){
        flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList();
        var anchorAttr=pendingAnchor ? ' id="'+esc(pendingAnchor)+'"' : '';
        pendingAnchor=null;
        out.push('<hr' + anchorAttr + '>');
        continue;
      }
      var h1Match=trimmed.match(/^=\s+(.+)$/);
      if(h1Match){ flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList(); var hInfo=extractHeadingAnchor(h1Match[1]); var idAttr=hInfo.anchor?' id="'+esc(hInfo.anchor)+'"':''; out.push('<h1'+idAttr+'>'+inlineAdocFormat(hInfo.text)+'</h1>'); continue; }
      var h2Match=trimmed.match(/^==\s+(.+)$/);
      if(h2Match){ flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList(); var hInfo=extractHeadingAnchor(h2Match[1]); var idAttr=hInfo.anchor?' id="'+esc(hInfo.anchor)+'"':''; out.push('<h2'+idAttr+'>'+inlineAdocFormat(hInfo.text)+'</h2>'); continue; }
      var h3Match=trimmed.match(/^===\s+(.+)$/);
      if(h3Match){ flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList(); var hInfo=extractHeadingAnchor(h3Match[1]); var idAttr=hInfo.anchor?' id="'+esc(hInfo.anchor)+'"':''; out.push('<h3'+idAttr+'>'+inlineAdocFormat(hInfo.text)+'</h3>'); continue; }
      var h4Match=trimmed.match(/^====\s+(.+)$/);
      if(h4Match){ flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList(); var hInfo=extractHeadingAnchor(h4Match[1]); var idAttr=hInfo.anchor?' id="'+esc(hInfo.anchor)+'"':''; out.push('<h4'+idAttr+'>'+inlineAdocFormat(hInfo.text)+'</h4>'); continue; }

      var attrMatch=trimmed.match(/^:[a-zA-Z0-9_-]+:\s*(.*)$/);
      if(attrMatch){ continue; }

      var singleAdm=trimmed.match(/^(NOTE|TIP|IMPORTANT|WARNING|CAUTION):\s*(.+)$/i);
      if(singleAdm){
        flushNormalP(); flushContinuation(); flushPendingSingleBlock(); flushList();
        var admType=singleAdm[1].toUpperCase();
        var anchorAttr=pendingAnchor ? ' id="'+esc(pendingAnchor)+'"' : '';
        pendingAnchor=null;
        out.push('<div class="admonitionblock '+admType.toLowerCase()+'"' + anchorAttr + '><div class="title">'+esc(admType)+'</div><div class="content"><p>'+inlineAdocFormat(singleAdm[2])+'</p></div></div>');
        continue;
      }

      if(trimmed==='+'){
        if(inItem){
          flushContinuation();
          pendingContinuation=true;
        }
        continue;
      }

      var listM=matchList(trimmed);
      if(listM){
        flushNormalP(); flushContinuation(); pendingContinuation=false; flushPendingSingleBlock();
        var itemText=inlineAdocFormat(listM.text);
        adjustListLevel(listM.tag, listM.level);
        out.push('<li>'+itemText);
        inItem=true;
        inContinuation=false;
        continue;
      }

      if(!trimmed){
        if(inContinuation){
          flushContinuation();
        }
        flushNormalP(); flushPendingSingleBlock();
        continue;
      }

      if(pendingMeta && (pendingMeta.kind==='quote' || pendingMeta.kind==='admonition')){
        pendingBlockLines.push(trimmed);
        continue;
      }

      if((pendingContinuation || inContinuation) && inItem){
        pendingContinuation=false;
        inContinuation=true;
        continuationLines.push(trimmed);
        continue;
      }

      normalPLines.push(trimmed);
    }else{
      if(inBlock==='quote'&&trimmed==='____') flushBlock();
      else if(inBlock==='admonition'&&trimmed==='====') flushBlock();
      else if(inBlock==='code'&&trimmed==='----') flushBlock();
      else if(inBlock==='math'&&(trimmed==='++++'||trimmed==='----')) flushBlock();
      else if(inBlock==='table'&&trimmed==='|===') flushBlock();
      else{
        blockLines.push(line);
      }
    }
  }
  flushBlock();
  flushNormalP();
  flushContinuation();
  flushPendingSingleBlock();
  flushList();
  return out.join(NL);
}

function renderAsciidoc(src){
  if(!src) return '';
  const raw=String(src);
  const purifier=window.DOMPurify;
  try{
    const html = convertAsciidocToHtml(raw);
    if(purifier && typeof purifier.sanitize==='function'){
      return purifier.sanitize(html, DOMPURIFY_OPTS);
    }
    return html;
  }catch(_){
    return renderMarkdown(raw);
  }
}

function applyMathRendering(container){
  if(!container) return;
  if(typeof renderMathInElement === 'function'){
    try{
      renderMathInElement(container, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option'],
        throwOnError: false
      });
    }catch(_){}
  }
  if(typeof katex !== 'undefined'){
    try{
      container.querySelectorAll('.mathblock').forEach(function(mb){
        var codeEl = mb.querySelector('pre.math code, pre.math');
        if(codeEl && !mb.getAttribute('data-katex-rendered')){
          var text = (codeEl.textContent || '').trim();
          if(text){
            try{
              mb.innerHTML = '';
              katex.render(text, mb, { displayMode: true, throwOnError: false });
              mb.setAttribute('data-katex-rendered', 'true');
            }catch(_){}
          }
        }
      });
      container.querySelectorAll('.math.inline').forEach(function(mi){
        var codeEl = mi.querySelector('code') || mi;
        if(codeEl && !mi.getAttribute('data-katex-rendered')){
          var text = (codeEl.textContent || '').trim();
          if(text){
            try{
              var span = document.createElement('span');
              katex.render(text, span, { displayMode: false, throwOnError: false });
              mi.parentNode.replaceChild(span, mi);
            }catch(_){}
          }
        }
      });
    }catch(_){}
  }
}

function isAsciidoc(src, format){
  if(format){
    const fmt=String(format).toLowerCase().trim();
    if(fmt==='adoc'||fmt==='asciidoc') return true;
    if(fmt==='md'||fmt==='markdown') return false;
  }
  if(!src) return false;
  const s=String(src);
  return /(?:^|\n)\[(NOTE|TIP|IMPORTANT|WARNING|CAUTION|quote|source)[^\]]*\]|(?:^|\n)\|===|(?:^|\n)image::/m.test(s);
}

function renderContent(src, format){
  if(!src) return '';
  if(isAsciidoc(src, format)){
    return renderAsciidoc(src);
  }
  return renderMarkdown(src);
}

    tags.push('<span class="'+tagClass+'" title="'+esc(tip)+'">'+esc(label)+'</span>');
  }
  if(tags.length){
    h+='<span class="docmeta-tags">'+tags.join(' ')+'</span>';
  }
  h+='</p>';
  return h;

  h+='<div class="stt-trunc-banner">⚠️ <strong>음성 전사(STT) 일부 절단 안내</strong>: 전체 전사 내용 중 일부만 반영된 상태에서 본문(상세)이 작성되었습니다. 전체 재전사 명령: <code>claire video-reprocess --doc-id '+esc(dc.id||'')+' --apply --full-content</code></div>';
}
if((dc.extra_sources||[]).length){
  h+='<div class=sec>병합된 출처 ('+dc.extra_sources.length+')</div><ul class=srclist>'+
    dc.extra_sources.map(s=>'<li><a href="'+esc(s.url||'')+'" target=_blank rel=noopener>'+
      esc(s.title||s.url||'')+'</a></li>').join('')+'</ul>';
}
const focus = (dc.focus || (dc.meta && dc.meta.focus) || '').trim();
if(focus){
  h+='<div class=sec>초점</div><div class="doc-content" style="margin-bottom:.8em">🎯 <strong>'+esc(focus)+'</strong></div>';
}
if(dc.summary){ h+='<div class=sec>요약</div><div class="doc-content">'+renderContent(dc.summary, dc.detail_format)+'</div>'; }
if(dc.detail_html){
  const purifier=window.DOMPurify;
  const cleanHtml=(purifier && typeof purifier.sanitize==='function')?purifier.sanitize(dc.detail_html, DOMPURIFY_OPTS):dc.detail_html;
  h+='<div class=sec>상세</div><div class="doc-content">'+cleanHtml+'</div>';
}else if(dc.detail){
  h+='<div class=sec>상세</div><div class="doc-content">'+renderContent(dc.detail, dc.detail_format)+'</div>';
}
if(!dc.summary && !dc.detail && !dc.detail_html){ h+='<p class=meta>문서에 요약/상세 내용이 없습니다.</p>'; }
h+='<div class=foot>이 링크는 이 문서 하나만 읽기 전용으로 공유합니다.</div>';
document.getElementById('wrap').innerHTML=h;
applyMathRendering(document.getElementById('wrap'));
updateSharedRail();

// --- 슬림 마름모 바 & 탄성 확장 헤딩 내비게이션 레일 제어 (공유 페이지) ---
function _sClsAdd(el, c){ if(el && el.classList && el.classList.add) el.classList.add(c); else if(el && el.className!==undefined && !el.className.includes(c)) el.className = (el.className+' '+c).trim(); }
function _sClsRem(el, c){ if(el && el.classList && el.classList.remove) el.classList.remove(c); else if(el && el.className) el.className = el.className.replace(new RegExp('\\b'+c+'\\b','g'),'').trim(); }

function _getScrollTop(){
  return (typeof window !== 'undefined' && (window.scrollY || window.pageYOffset)) ||
    (document.documentElement ? document.documentElement.scrollTop : 0) ||
    (document.body ? document.body.scrollTop : 0) || 0;
}

function _getDocTotalScroll(){
  const d = document.documentElement;
  const b = document.body;
  const sH = Math.max(
    d ? d.scrollHeight : 0,
    d ? d.offsetHeight : 0,
    b ? b.scrollHeight : 0,
    b ? b.offsetHeight : 0
  );
  return Math.max(0, sH - (window.innerHeight || 0));
}

function _getElDocTop(el){
  if(!el || !el.getBoundingClientRect) return 0;
  return el.getBoundingClientRect().top + _getScrollTop();
}

function updateSharedRail(){
  const wrap = document.getElementById('wrap');
  const rail = document.getElementById('srail');
  const track = document.getElementById('srail-track');
  const fill = document.getElementById('srail-fill');
  const diamonds = document.getElementById('srail-diamonds');
  if(!wrap || !rail || !track || !fill || !diamonds) return;

  const docEl = (typeof document !== 'undefined' && document.documentElement) || null;
  const headingEls = wrap.querySelectorAll ? wrap.querySelectorAll('.sec, .doc-content h1, .doc-content h2, .doc-content h3, .doc-content h4') : [];
  const totalScroll = _getDocTotalScroll();

  if(!docEl || headingEls.length <= 1 || totalScroll <= 80){
    _sClsRem(rail, 'visible');
    diamonds.innerHTML = '';
    return;
  }

  _sClsAdd(rail, 'visible');
  const railHeadings = Array.from(headingEls).map((el, idx) => {
    let tag = 'h2';
    const isSec = (el.classList && el.classList.contains) ? el.classList.contains('sec') : ((el.className || '').indexOf('sec') !== -1);
    if(isSec) tag = 'rsec';
    else if(el.tagName === 'H1') tag = 'h1';
    else if(el.tagName === 'H2') tag = 'h2';
    else if(el.tagName === 'H3') tag = 'h3';
    else if(el.tagName === 'H4') tag = 'h4';

    return {
      el: el,
      tag: tag,
      title: el.innerText ? el.innerText.trim() : '',
      percent: 0,
      expandedPercent: 0
    };
  });

  function computePositions(){
    const tScroll = _getDocTotalScroll();
    const count = railHeadings.length;
    railHeadings.forEach((item, idx) => {
      let ratio = 0;
      if(tScroll > 0){
        const topOffset = _getElDocTop(item.el);
        ratio = Math.max(0, Math.min(1, topOffset / tScroll));
      } else {
        ratio = count > 1 ? (idx / (count - 1)) : 0.5;
      }
      item.percent = ratio * 100;
      const uniform = count > 1 ? (idx / (count - 1)) * 96 + 2 : 50;
      item.expandedPercent = item.percent * 0.2 + uniform * 0.8;
    });

    const markers = diamonds.querySelectorAll ? diamonds.querySelectorAll('.cb-diamond-marker') : [];
    markers.forEach((m, idx) => {
      if(railHeadings[idx] && !isPressing){
        m.style.top = railHeadings[idx].percent + '%';
      }
    });
  }

  computePositions();

  diamonds.innerHTML = '';
  railHeadings.forEach((item, idx) => {
    const marker = document.createElement('div');
    marker.className = 'cb-diamond-marker cb-marker-' + item.tag;
    marker.style.top = item.percent + '%';
    marker.dataset.index = idx;
    marker.innerHTML = '<div class="cb-diamond-tooltip">' + esc(item.title) + '</div><div class="cb-diamond-shape"></div>';

    marker.addEventListener('click', (e) => {
      e.stopPropagation();
      const topOffset = _getElDocTop(item.el);
      window.scrollTo({ top: Math.max(0, topOffset - 16), behavior: 'smooth' });
    });

    diamonds.appendChild(marker);
  });

  function onWindowScroll(){
    const top = _getScrollTop();
    const tScroll = _getDocTotalScroll();
    const ratio = tScroll > 0 ? top / tScroll : 0;
    const pct = Math.min(100, Math.max(0, Math.round(ratio * 100)));
    fill.style.height = pct + '%';

    let activeIdx = 0;
    const threshold = top + 90;
    for(let i = 0; i < railHeadings.length; i++){
      const itemTop = _getElDocTop(railHeadings[i].el);
      if(itemTop <= threshold){
        activeIdx = i;
      } else {
        break;
      }
    }

    const markers = diamonds.querySelectorAll ? diamonds.querySelectorAll('.cb-diamond-marker') : [];
    markers.forEach((m, i) => {
      if(i === activeIdx){
        _sClsAdd(m, 'active');
      } else {
        _sClsRem(m, 'active');
      }
    });
  }

  if(typeof window !== 'undefined' && window.addEventListener){
    window.addEventListener('scroll', onWindowScroll, { passive: true });
    onWindowScroll();
  }

  let isPressing = false;
  let scrubIdx = -1;

  function startExpand(clientY){
    isPressing = true;
    _sClsAdd(rail, 'is-expanding');
    const markers = diamonds.querySelectorAll ? diamonds.querySelectorAll('.cb-diamond-marker') : [];
    markers.forEach((m, idx) => {
      if(railHeadings[idx]){
        m.style.top = railHeadings[idx].expandedPercent + '%';
      }
    });
    updateScrubFocus(clientY);
  }

  function updateScrubFocus(clientY){
    if(!isPressing) return;
    const rect = track.getBoundingClientRect ? track.getBoundingClientRect() : { top: 0, height: 100 };
    const relY = clientY - rect.top;
    const ratio = Math.max(0, Math.min(1, relY / rect.height));
    const curPct = ratio * 100;

    let closestIdx = 0;
    let minDiff = 999;
    railHeadings.forEach((item, idx) => {
      const diff = Math.abs(item.expandedPercent - curPct);
      if(diff < minDiff){
        minDiff = diff;
        closestIdx = idx;
      }
    });
    scrubIdx = closestIdx;

    const markers = diamonds.querySelectorAll ? diamonds.querySelectorAll('.cb-diamond-marker') : [];
    markers.forEach((m, idx) => {
      if(idx === scrubIdx){
        _sClsAdd(m, 'scrub-focus');
      } else {
        _sClsRem(m, 'scrub-focus');
      }
    });
  }

  function endExpand(){
    if(!isPressing) return;
    isPressing = false;
    _sClsRem(rail, 'is-expanding');

    if(scrubIdx >= 0 && railHeadings[scrubIdx]){
      const topOffset = _getElDocTop(railHeadings[scrubIdx].el);
      window.scrollTo({ top: Math.max(0, topOffset - 16), behavior: 'smooth' });
    }

    const markers = diamonds.querySelectorAll ? diamonds.querySelectorAll('.cb-diamond-marker') : [];
    markers.forEach((m, idx) => {
      _sClsRem(m, 'scrub-focus');
      if(railHeadings[idx]){
        m.style.top = railHeadings[idx].percent + '%';
      }
    });
    scrubIdx = -1;
  }

  if(!rail._boundEvents){
    rail._boundEvents = true;
    rail.addEventListener('mousedown', (e) => {
      e.preventDefault();
      startExpand(e.clientY);
    });
    window.addEventListener('mousemove', (e) => {
      if(isPressing) updateScrubFocus(e.clientY);
    });
    window.addEventListener('mouseup', () => {
      endExpand();
    });

    rail.addEventListener('touchstart', (e) => {
      if(e.touches.length > 0) startExpand(e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if(isPressing && e.touches.length > 0) updateScrubFocus(e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener('touchend', () => {
      endExpand();
    });

    window.addEventListener('resize', () => {
      computePositions();
      onWindowScroll();
    });
    window.addEventListener('load', () => {
      computePositions();
      onWindowScroll();
    });
  }
}

// --- 공유 페이지 STT 전사 열기 모달 뷰어 제어 ---
let curSttData = dc;
let curSttFilter = '';

function openSttReader(docId){
  const modal = document.getElementById('sttmodal');
  if(!modal) return;
  curSttData = dc;

  if(!dc.is_stt && !(dc.meta && (dc.meta.is_stt || dc.meta.transcript_segments))){
    alert('음성 전사(STT) 데이터가 없는 문서입니다.');
    return;
  }

  const docTitleEl = document.getElementById('sttdoctitle');
  if(docTitleEl) docTitleEl.textContent = dc.title || '(제목 없음)';

  const metaEl = document.getElementById('sttmeta');
  let metaTxt = '';
  const dur = (dc.meta && dc.meta.duration_sec) || dc.duration_sec || 0;
  if(dur > 0){
    const m = Math.floor(dur / 60);
    const s = Math.floor(dur % 60);
    metaTxt += '재생 시간: ' + m + '분 ' + s + '초';
  }
  const segs = dc.transcript_segments || (dc.meta && dc.meta.transcript_segments) || [];
  if(segs.length > 0){
    metaTxt += (metaTxt ? ' · ' : '') + '총 ' + segs.length.toLocaleString() + '개 발화 구간';
  }
  if(metaEl) metaEl.textContent = metaTxt;

  const input = document.getElementById('sttq');
  if(input) input.value = '';
  curSttFilter = '';

  renderSttLines();
  modal.classList.add('open');
  modal.style.display = 'flex';
  document.body.classList.add('stt-modal-open');
  if(input) requestAnimationFrame(()=>input.focus());
}

function closeSttReader(){
  const modal = document.getElementById('sttmodal');
  if(!modal) return;
  modal.classList.remove('open');
  modal.style.display = 'none';
  document.body.classList.remove('stt-modal-open');
}

function renderSttLines(){
  const body = document.getElementById('sttbody');
  const countEl = document.getElementById('sttcount');
  if(!body || !curSttData) return;

  let segs = dc.transcript_segments || (dc.meta && dc.meta.transcript_segments) || [];
  let rawText = dc.stt_transcript || '';

  let h = '';
  const isTrunc = !!(dc.stt_truncated || (dc.meta && dc.meta.stt_truncated));
  if(isTrunc){
    h += '<div class="stt-trunc-banner">⚠️ <strong>전사 일부 절단 상태</strong>: 글자 수 상한 또는 오디오 구간 누락으로 인해 음성 전사의 일부만 반영되었습니다. 전체 내용을 복원하려면 <code>claire video-reprocess --doc-id ' + esc(dc.id||'') + ' --apply --full-content</code>를 실행하십시오.</div>';
  }

  const q = (curSttFilter || '').toLowerCase().trim();
  let matchCount = 0;
  let totalCount = 0;

  if(segs && segs.length > 0){
    totalCount = segs.length;
    segs.forEach(s => {
      const startF = s.start_sec != null ? s.start_sec : (s.start != null ? s.start : 0.0);
      const totalSec = Math.floor(startF);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const ts = hrs > 0 ? (String(hrs).padStart(2,'0')+':'+String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0')) : (String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0'));
      const txt = String(s.text || '');

      const isMatch = !q || txt.toLowerCase().includes(q) || ts.includes(q);
      if(isMatch){
        matchCount++;
        let dispTxt = esc(txt);
        if(q){
          let ltxt = txt.toLowerCase(), lq = q.toLowerCase();
          let idx = 0, out = '';
          while(true){
            let next = ltxt.indexOf(lq, idx);
            if(next === -1){ out += esc(txt.slice(idx)); break; }
            out += esc(txt.slice(idx, next)) + '<mark>' + esc(txt.slice(next, next + q.length)) + '</mark>';
            idx = next + q.length;
          }
          dispTxt = out;
        }
        h += '<div class="stt-line' + (q ? ' highlight' : '') + '">';
        h += '<span class="stt-ts" title="클릭하여 타임스탬프 복사" data-ts="' + esc(ts) + '" onclick="copyTimestamp(this.dataset.ts)">[' + esc(ts) + ']</span>';
        h += '<span class="stt-text">' + dispTxt + '</span>';
        h += '</div>';
      }
    });
  } else if(rawText) {
    const lines = rawText.split('\n');
    totalCount = lines.length;
    lines.forEach(line => {
      const trimmed = line.trim();
      if(!trimmed) return;
      const isMatch = !q || trimmed.toLowerCase().includes(q);
      if(isMatch){
        matchCount++;
        let dispTxt = esc(trimmed);
        if(q){
          let ltxt = trimmed.toLowerCase(), lq = q.toLowerCase();
          let idx = 0, out = '';
          while(true){
            let next = ltxt.indexOf(lq, idx);
            if(next === -1){ out += esc(trimmed.slice(idx)); break; }
            out += esc(trimmed.slice(idx, next)) + '<mark>' + esc(trimmed.slice(next, next + q.length)) + '</mark>';
            idx = next + q.length;
          }
          dispTxt = out;
        }
        h += '<div class="stt-line' + (q ? ' highlight' : '') + '"><span class="stt-text">' + dispTxt + '</span></div>';
      }
    });
  } else {
    h = '<p class="hint">저장된 전사 내용이 없습니다.</p>';
  }

  body.innerHTML = h;
  if(countEl){
    if(q){
      countEl.textContent = matchCount.toLocaleString() + ' / ' + totalCount.toLocaleString() + '개 일치';
    } else {
      countEl.textContent = totalCount > 0 ? totalCount.toLocaleString() + '개 항목' : '';
    }
  }
}

function filterSttLines(val){
  curSttFilter = val;
  renderSttLines();
}

function copyTimestamp(ts){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText('[' + ts + ']').catch(()=>{});
  }
}

function copySttText(withTs){
  let segs = dc.transcript_segments || (dc.meta && dc.meta.transcript_segments) || [];
  let out = '';
  if(segs && segs.length > 0){
    const lines = segs.map(s => {
      const startF = s.start_sec != null ? s.start_sec : (s.start != null ? s.start : 0.0);
      const totalSec = Math.floor(startF);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const ts = hrs > 0 ? (String(hrs).padStart(2,'0')+':'+String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0')) : (String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0'));
      const txt = String(s.text || '').trim();
      return withTs ? ('[' + ts + '] ' + txt) : txt;
    });
    out = lines.join('\n');
  } else if(dc.stt_transcript) {
    out = dc.stt_transcript;
    if(!withTs){
      out = out.replace(/^\[\d{1,2}:\d{2}(?::\d{2})?\]\s*/gm, '');
    }
  }
  if(out){
    navigator.clipboard.writeText(out).then(()=>{
      alert('클립보드에 전사 내용이 복사되었습니다.');
    }).catch(()=>{
      alert('복사에 실패했습니다.');
    });
  }
}

if(typeof window !== 'undefined' && typeof window.addEventListener === 'function'){
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      const m = document.getElementById('sttmodal');
      if(m && m.classList.contains('open')){
        e.stopPropagation();
        closeSttReader();
      }
    }
  });
}
if(typeof window.gtag === 'function' && dc && dc.id){
  try{
    window.gtag('event', 'select_content', {
      content_type: 'shared_document',
      item_id: dc.id
    });
  }catch(_){}
}
